<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6f5137">

<link rel="manifest" href="./manifest.json">

<title>My Personal Diary v11</title>

<style>

:root{
 --paper:#fffdf5;
 --ink:#34281f;
 --line:#d8c8ad;
 --accent:#705034;
 --lh:34px;
 --font:Georgia,serif;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#e9dcc6;
 color:var(--ink);
 font-family:var(--font);
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* TOP BAR */

.top{
 position:sticky;
 top:0;
 z-index:20;
 background:#f4e7d4ee;
 backdrop-filter:blur(8px);
 padding:8px;
 display:flex;
 gap:6px;
 align-items:center;
 flex-wrap:wrap;
 border-bottom:1px solid #cbb896;
}

.brand{
 font-weight:700;
 margin-right:auto;
}

.btn{
 border:1px solid #c7b593;
 background:#fff8ec;
 border-radius:8px;
 padding:8px 10px;
}

.primary{
 background:var(--accent);
 color:#fff;
 border:0;
}

.status{
 font-size:12px;
 color:#776653;
}

/* LOGIN */

.auth{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:linear-gradient(135deg,#d8c09b,#f4ead8);
}

.card{
 background:#fffaf0;
 border:1px solid #d0bb98;
 border-radius:16px;
 padding:22px;
 box-shadow:0 10px 35px #0002;
 width:min(430px,95vw);
}

.card input,
.panel input,
.panel select{
 width:100%;
 padding:10px;
 border:1px solid #cdbb9d;
 border-radius:8px;
 margin:5px 0;
}

.actions{
 display:grid;
 gap:8px;
 margin-top:8px;
}

/* NOTEBOOK */

.book{
 max-width:1000px;
 margin:15px auto;
 display:grid;
 grid-template-columns:34px 1fr;
 filter:drop-shadow(0 10px 18px #0002);
}

.spine{
 background:#6e5035;
 border-radius:12px 0 0 12px;
 min-height:700px;
 position:relative;
}

.ring{
 position:absolute;
 left:2px;
 width:29px;
 height:18px;
 border:4px solid #cbbda7;
 border-left:0;
 border-radius:0 15px 15px 0;
}

.page{
 position:relative;
 background:var(--paper);
 min-height:700px;
 padding:16px 25px;
 border-radius:0 12px 12px 0;
 overflow:hidden;
}

.page:before{
 content:"";
 position:absolute;
 inset:0;
 background:
 repeating-linear-gradient(
  to bottom,
  transparent 0 calc(var(--lh) - 1px),
  var(--line) calc(var(--lh) - 1px) var(--lh)
 );
 pointer-events:none;
 opacity:.7;
}

.page>*{
 position:relative;
}

/* DATE */

.head{
 display:flex;
 gap:10px;
 align-items:center;
 border-bottom:1px solid #cbb896;
 background:#fffdf5ee;
}

.date{
 font-weight:700;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.moods{
 margin-left:auto;
}

.moods button{
 border:1px solid transparent;
 background:transparent;
 border-radius:7px;
 padding:3px;
}

.moods .sel{
 border-color:#9d7b54;
 background:#f0dec2;
}

/* QUOTE */

.quote{
 font-size:13px;
 font-style:italic;
 color:#796955;
 padding:5px 0;
}

/* EDITOR TOOLBAR */

.tools{
 display:flex;
 gap:4px;
 flex-wrap:wrap;
 background:#fffdf5ee;
}

.tools button{
 border:1px solid #cbb896;
 background:#f4e7d4;
 border-radius:7px;
 padding:6px 9px;
}

/* EDITOR */

.editor{
 min-height:470px;
 outline:0;
 line-height:var(--lh);
 font-size:17px;
 white-space:pre-wrap;
 word-break:break-word;
 padding:0 3px;
}

.editor:empty:before{
 content:'Write your thoughts here…';
 color:#ad9d89;
}

/* PAGE NAVIGATION */

.nav{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 margin-top:10px;
 background:#fffdf5ee;
 padding:7px;
 border-radius:8px;
}

.navright{
 display:flex;
 gap:7px;
}

/* PANELS */

.panel{
 max-width:1000px;
 margin:10px auto;
 background:#fffaf0;
 border:1px solid #d1bd9e;
 border-radius:12px;
 padding:13px;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(190px,1fr));
 gap:8px;
}

.list{
 display:grid;
 gap:7px;
 margin-top:9px;
}

.item{
 display:flex;
 gap:8px;
 align-items:center;
 background:#f5ead7;
 padding:8px;
 border-radius:8px;
}

.grow{
 flex:1;
}

/* MEMORIES */

.memorygrid{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(145px,1fr));
 gap:8px;
}

.memory{
 background:#f3e5d0;
 padding:6px;
 border-radius:8px;
}

.memory img{
 width:100%;
 height:120px;
 object-fit:cover;
 border-radius:6px;
}

/* MODALS */

.modal{
 position:fixed;
 inset:0;
 background:#0007;
 display:grid;
 place-items:center;
 padding:15px;
 z-index:100;
}

.modalbox{
 background:#fffaf0;
 border-radius:14px;
 padding:15px;
 width:min(650px,96vw);
 max-height:90vh;
 overflow:auto;
}

.modalhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

/* DRAWING */

canvas{
 width:100%;
 height:350px;
 border:1px solid #cdbb9d;
 background:#fffdf5;
 touch-action:none;
}

/* MOBILE */

@media(max-width:650px){

 .book{
  grid-template-columns:24px 1fr;
  margin:5px;
 }

 .page{
  padding:11px 9px;
 }

 .editor{
  min-height:490px;
  font-size:16px;
 }

 .nav button{
  padding:9px 8px;
 }

}

</style>
</head>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIGURATION

   REPLACE THESE TWO VALUES.

   DO NOT PUT A SECRET / SERVICE-ROLE KEY HERE.
===================================================== */

const SUPABASE_URL =
'https://dmkmlftloybapekshzza.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_GxF-SiNTxFCXTUBOIsxBBQ_XgtOW_m7';


/* SUPABASE CLIENT */

const sb =
 SUPABASE_URL.includes('YOUR_PROJECT')
 ?
 null
 :
 supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
   auth:{
    autoRefreshToken:true,
    persistSession:true,
    detectSessionInUrl:true
   }
  }
 );


/* =====================================================
   LOCAL DATABASE
===================================================== */

const DB='myPersonalDiaryDB';
const VER=11;

let db;
let user;

let dateNow=new Date();

let pageNo=1;
let pageRow;

let saveTimer;


/* HELPERS */

const $=id =>
 document.getElementById(id);


function today(){

 let d=new Date();

 return new Date(
  d-d.getTimezoneOffset()*60000
 )
 .toISOString()
 .slice(0,10);

}


function uid(){

 return crypto.randomUUID();

}


/* =====================================================
   INDEXED DB
===================================================== */

function openDB(){

 return new Promise((ok,no)=>{

  let r=indexedDB.open(DB,VER);

  r.onupgradeneeded=e=>{

   for(
    let s of
    [
     'pages',
     'events',
     'todos',
     'memories',
     'settings',
     'queue'
    ]
   ){

    if(
     !e.target.result.objectStoreNames
      .contains(s)
    ){

     e.target.result
      .createObjectStore(
       s,
       {keyPath:'id'}
      );

    }

   }

  };


  r.onsuccess=()=>{

   db=r.result;
   ok();

  };


  r.onerror=()=>no(r.error);

 });

}


function all(s){

 return new Promise((ok,no)=>{

  let r=
   db
    .transaction(s)
    .objectStore(s)
    .getAll();

  r.onsuccess=() =>
   ok(r.result);

  r.onerror=() =>
   no(r.error);

 });

}


function get(s,id){

 return new Promise((ok,no)=>{

  let r=
   db
    .transaction(s)
    .objectStore(s)
    .get(id);

  r.onsuccess=() =>
   ok(r.result);

  r.onerror=() =>
   no(r.error);

 });

}


function put(s,x){

 return new Promise((ok,no)=>{

  let r=
   db
    .transaction(s,'readwrite')
    .objectStore(s)
    .put(x);

  r.onsuccess=()=>ok();

  r.onerror=()=>no(r.error);

 });

}


function del(s,id){

 return new Promise((ok,no)=>{

  let r=
   db
    .transaction(s,'readwrite')
    .objectStore(s)
    .delete(id);

  r.onsuccess=()=>ok();

  r.onerror=()=>no(r.error);

 });

}


/* =====================================================
   SYNC QUEUE
===================================================== */

async function q(
 table,
 action,
 row
){

 await put(
  'queue',
  {
   id:uid(),
   table,
   action,
   row
  }
 );

 syncSoon();

}


async function save(
 store,
 row
){

 await put(
  store,
  row
 );

 await q(
  store,
  'upsert',
  row
 );

}


/* =====================================================
   QUOTE
===================================================== */

function qquote(d){

 let a=[
  'Write it down. Small moments become a life.',
  'Today is a page you will never get back.',
  'A quiet mind notices more.',
  'Gratitude turns ordinary days into memories.',
  'Begin where you are.'
 ];

 let n=0;

 for(
  let c of d
 ){

  n=
   (
    n*31+
    c.charCodeAt(0)
   )
   %
   a.length;

 }

 return a[n];

}


/* =====================================================
   PAGE FUNCTIONS
===================================================== */

async function getPage(
 d,
 n
){

 return(
  await all('pages')
 ).find(
  x =>
   x.diary_date===d &&
   x.page_number===n
 );

}


async function datePages(d){

 return(
  await all('pages')
 )
 .filter(
  x=>x.diary_date===d
 )
 .sort(
  (a,b)=>
   a.page_number-b.page_number
 );

}


async function ensurePage(
 d,
 n
){

 let p=
  await getPage(d,n);


 if(!p){

  p={
   id:uid(),
   user_id:user.id,
   diary_date:d,
   page_number:n,
   content:'',
   mood:'',
   drawing_data:'',
   quote:qquote(d),
   created_at:
    new Date().toISOString(),
   updated_at:
    new Date().toISOString()
  };

  await save(
   'pages',
   p
  );

 }

 return p;

}


/* DATE LABEL */

function label(d){

 return new Date(
  d+'T12:00:00'
 )
 .toLocaleDateString(
  undefined,
  {
   weekday:'short',
   day:'2-digit',
   month:'short',
   year:'numeric'
  }
 );

}


/* =====================================================
   RENDER PAGE
===================================================== */

async function render(){

 pageRow=
  await ensurePage(
   dateNow
    .toISOString()
    .slice(0,10),
   pageNo
  );


 let d=
  pageRow.diary_date;


 $('date').textContent=
  label(d)+
  ' · Page '+
  pageNo;


 $('quote').textContent=
  pageNo===1
  ?
  pageRow.quote
  :
  '';


 $('editor').innerHTML=
  pageRow.content||'';


 let ps=
  await datePages(d);


 $('pageinfo').textContent=
  'Page '+
  pageNo+
  ' of '+
  Math.max(
   1,
   ps.length
  );


 $('edate').value=d;

 $('caldate').value=d;

 renderSpine();

 renderTodos();

 renderEvents();

 renderMemories();

}


/* =====================================================
   SPIRAL
===================================================== */

function renderSpine(){

 let s=$('spine');

 s.innerHTML='';

 for(
  let i=0;
  i<16;
  i++
 ){

  let r=
   document.createElement(
    'div'
   );

  r.className='ring';

  r.style.top=
   (15+i*43)+'px';

  s.appendChild(r);

 }

}


/* =====================================================
   EDITOR
===================================================== */

$('editor')
 .addEventListener(
  'input',
  ()=>{

   clearTimeout(
    saveTimer
   );

   saveTimer=
    setTimeout(
     saveCurrent,
     450
    );

  }
 );


async function saveCurrent(){

 if(!pageRow)return;

 pageRow.content=
  $('editor').innerHTML;

 pageRow.updated_at=
  new Date().toISOString();

 await save(
  'pages',
  pageRow
 );

 status('Saved ✓');

}


function cmd(c){

 document.execCommand(
  c,
  false,
  null
 );

 $('editor').focus();

 saveCurrent();

}


/* =====================================================
   NEXT PAGE
===================================================== */

async function nextPage(){

 await saveCurrent();

 pageNo++;

 await render();

}


/* =====================================================
   NEW PAGE
===================================================== */

async function newPage(){

 await nextPage();

}


/* =====================================================
   PREVIOUS PAGE

   PAGE 2 -> PAGE 1

   PAGE 1 -> LAST PAGE OF PREVIOUS DATE
===================================================== */

async function previousPage(){

 await saveCurrent();


 if(pageNo>1){

  pageNo--;

  await render();

  return;

 }


 let d=
  new Date(
   pageRow.diary_date+
   'T12:00:00'
  );


 d.setDate(
  d.getDate()-1
 );


 let prev=
  new Date(
   d-
   d.getTimezoneOffset()*60000
  )
  .toISOString()
  .slice(0,10);


 let ps=
  await datePages(prev);


 dateNow=d;


 pageNo=
  ps.length
  ?
  ps[ps.length-1]
   .page_number
  :
  1;


 await render();

}


/* =====================================================
   PANELS
===================================================== */

function toggle(id){

 [
  'calendar',
  'events',
  'todos',
  'memories'
 ]
 .forEach(
  x=>
   $(x)
   .classList
   .toggle(
    'hidden',
    x!==id
   )
 );


 if(id==='calendar')
  calendar();

 if(id==='events')
  renderEvents();

 if(id==='todos')
  renderTodos();

 if(id==='memories')
  renderMemories();

}


/* =====================================================
   TODO
===================================================== */

async function addTodo(){

 let t=
  $('todoText')
   .value
   .trim();

 if(!t)return;

 await save(
  'todos',
  {
   id:uid(),
   user_id:user.id,
   diary_date:
    pageRow.diary_date,
   text:t,
   completed:false,
   created_at:
    new Date().toISOString(),
   updated_at:
    new Date().toISOString()
  }
 );

 $('todoText').value='';

 renderTodos();

}


async function renderTodos(){

 let a=
  (
   await all('todos')
  )
  .filter(
   x=>
    x.diary_date===
    pageRow?.diary_date
  );


 $('todoout').innerHTML=

  a.map(
   x=>

   `<div class="item">

    <input
     type="checkbox"
     ${x.completed?'checked':''}
     onchange=

/* =====================================================
   HTML ESCAPE
===================================================== */

function esc(s){

 return String(s??'')
  .replace(
   /[&<>"']/g,
   c=>
    ({
     '&':'&amp;',
     '<':'&lt;',
     '>':'&gt;',
     '"':'&quot;',
     "'":'&#39;'
    }[c])
  );

}


/* =====================================================
   MEMORY DUPLICATE CLEANUP

   This is specifically included to address the
   duplicate memories problem.
===================================================== */

async function dedupeMemories(){

 let a=
  await all('memories');

 let seen=
  new Set();


 a.sort(
  (u,v)=>
   (u.created_at||'')
    .localeCompare(
     v.created_at||''
    )
 );


 for(
  let x of a
 ){

  /*
   Use the actual stored image URL/data
   or cloud path.

   This prevents identical memory records
   from appearing multiple times.
  */

  let k=
   x.local_url ||
   x.storage_path ||
   (
    (x.diary_date||'')+
    '|' +
    (x.original_name||'')
   );


  if(
   seen.has(k)
  ){

   /*
    Delete duplicate local record.
   */

   await del(
    'memories',
    x.id
   );


   /*
    If already authenticated/cloud storage
    is available, remove the duplicate cloud file.
   */

   if(
    x.storage_path &&
    sb &&
    user
   ){

    try{

     await sb
      .storage
      .from('diary-media')
      .remove([
       x.storage_path
      ]);

    }
    catch(e){}

   }

  }
  else{

   seen.add(k);

  }

 }

}

     f.type,

    /*
     LOCAL COPY
     */

    local_url:
     r.result,

    /*
     UNIQUE CLOUD PATH
     */

    storage_path:
     user.id+
     '/' +
     uniqueId+
     '-' +
     f.name.replace(
      /[^a-zA-Z0-9._-]/g,
      '_'
     ),

     new Date().toISOString(),

    updated_at:
     new Date().toISOString()

   };


   await save(
    'memories',
    x
   );


   $('mfile').value='';

   $('mtitle').value='';

   renderMemories();

 r.readAsDataURL(f);

}

/* =====================================================

let ctx;
let down=false;
let lx=0;
let ly=0;


async function openDraw(){

 $('drawModal')
  .classList
  .remove('hidden');


 let c=
  $('canvas');


 let r=
  c.getBoundingClientRect();


 let z=
  devicePixelRatio||1;


 c.width=
  r.width*z;

 c.height=
  r.height*z;


 ctx=
  c.getContext('2d');


 ctx.scale(
  z,
  z
 );


 ctx.lineWidth=2;

 ctx.lineCap='round';


 if(
  pageRow.drawing_data
 ){

  let i=
   new Image();


  i.onload=
   ()=>
    ctx.drawImage(
     i,
     0,
     0,
     r.width,
     r.height
    );


  i.src=
   pageRow.drawing_data;

 }

}


$('canvas')
 .onpointerdown=
 e=>{

  down=true;

  let r=
   e.currentTarget
    .getBoundingClientRect();

  lx=
   e.clientX-r.left;

  ly=
   e.clientY-r.top;

 };


$('canvas')
 .onpointermove=
 e=>{

  if(!down)return;

  let r=
   e.currentTarget
    .getBoundingClientRect();

  let x=
   e.clientX-r.left;

  let y=
   e.clientY-r.top;


  ctx.beginPath();

  ctx.moveTo(
   lx,
   ly
  );

  ctx.lineTo(
   x,
   y
  );

  ctx.stroke();


  lx=x;
  ly=y;

 };


$('canvas')
 .onpointerup=
 ()=>{
  down=false;
 };


$('canvas')
 .onpointerleave=
 ()=>{
  down=false;
 };


function clearCanvas(){

 ctx.clearRect(
  0,
  0,
  $('canvas').width,
  $('canvas').height
 );

}

/* =====================================================
   CLOUD SYNC
===================================================== */

async function sync(){

 if(
  !sb ||
  !user ||
  !navigator.onLine
 ){

  return;

 }


 let qs=
  await all('queue');


 for(
  let qx of qs
 ){

  let table=
   {
    pages:
     'diary_pages',

    events:
     'diary_events',

    todos:
     'diary_todos',

    memories:
     'diary_memories',

    settings:
     'diary_settings'

   }[qx.table];


  let row={
   ...qx.row
  };


  delete row.local_url;


  /*
   SETTINGS ARE STORED IN JSONB
  */

  if(
   qx.table==='settings'
  ){

   row.data={
    lineh:row.lineh,
    font:row.font
   };

   delete row.lineh;

   delete row.font;

  }


  /*
   UPLOAD MEMORY IMAGE
  */

  if(
   qx.table==='memories' &&
   qx.row.local_url
  ){

   try{

    let blob=
     await(
      await fetch(
       qx.row.local_url
      )
     ).blob();


    await sb
     .storage
     .from('diary-media')
     .upload(
      row.storage_path,
      blob,
      {
       upsert:true,
       contentType:
        row.mime_type
      }
     );

   }
   catch(e){

    console.warn(
     'Memory upload:',
     e
    );

   }

  }


  /*
   DELETE
  */

  if(
   qx.action==='delete'
  ){

   await sb
    .from(table)
    .delete()
    .eq(
     'id',
     row.id
    );

  }

  else{

   await sb
    .from(table)
    .upsert(
     row,
     {
      onConflict:
       qx.table==='pages'
       ?
       'user_id,diary_date,page_number'
       :
       qx.table==='settings'
       ?
       'user_id'
       :
       'id'
     }
    );

  }


  await del(
   'queue',
   qx.id
  );

 }


 status(
  'Synced ✓'
 );

}

/* =====================================================
   CLOUD DOWNLOAD
===================================================== */

async function cloudPull(){

 if(
  !sb ||
  !user
 )return;


 let maps={

  pages:
   'diary_pages',

  events:
   'diary_events',

  todos:
   'diary_todos',

  memories:
   'diary_memories'

 };


 for(
  let [
   s,
   t
  ]
  of Object.entries(maps)
 ){

  let {
   data,
   error
  }=
   await sb
    .from(t)
    .select('*');


  if(error)
   continue;


  for(
   let x of data||[]
  ){

   let l=
    await get(
     s,
     x.id
    );


   /*
    CLOUD VERSION IS NEWER
   */

   if(
    !l ||
    new Date(
     x.updated_at
    )
    >
    new Date(
     l.updated_at||0
    )
   ){

    if(
     s==='memories'
    ){

     x.local_url=
      l?.local_url||'';


     /*
      If image is not cached locally,
      get a temporary signed URL.
     */

     if(
      !x.local_url &&
      x.storage_path
     ){

      try{

       let z=
        await sb
         .storage
         .from(
          'diary-media'
         )
         .createSignedUrl(
          x.storage_path,
          3600
         );


       x.local_url=
        z.data?.signedUrl||'';

      }
      catch(e){}

     }

    }


    await put(
     s,
     x
    );

   }

  }

 }


 /*
  SETTINGS
 */

 let {
  data:settings
 }=
  await sb
   .from(
    'diary_settings'
   )
   .select('*')
   .eq(
    'user_id',
    user.id
   )
   .maybeSingle();


 if(settings){

  await put(
   'settings',
   {
    id:'settings',
    user_id:user.id,
    ...settings.data,
    updated_at:
     settings.updated_at
   }
  );

 }


 await render();

}


/* =====================================================
   REALTIME
===================================================== */

async function realtime(){

 if(
  !sb ||
  !user
 )return;


 for(
  let [
   t,
   s
  ]
  of Object.entries(
   {
    diary_pages:'pages',
    diary_events:'events',
    diary_todos:'todos',
    diary_memories:'memories'
   }
  )
 ){

  sb
   .channel(
    'diary-'+t
   )
   .on(
    'postgres_changes',
    {
     event:'*',
     schema:'public',
     table:t,
     filter:
      'user_id=eq.'+
      user.id
    },
    async p=>{

     /*
      DELETE
     */

     if(
      p.eventType==='DELETE'
     ){

      await del(
       s,
       p.old.id
      );

     }

     else{

      let x=p.new;


      if(
       s==='memories' &&
       x.storage_path
      ){

       let z=
        await sb
         .storage
         .from(
          'diary-media'
         )
         .createSignedUrl(
          x.storage_path,
          3600
         );


       x.local_url=
        z.data?.signedUrl||'';

      }


      await put(
       s,
       x
      );

     }


     if(
      s==='pages'
     )
      render();


     if(
      s==='memories'
     )
      renderMemories();


     if(
      s==='events'
     )
      renderEvents();


     if(
      s==='todos'
     )
      renderTodos();

    }
   )
   .subscribe();

 }

}

 );

}

/* =====================================================
   START
===================================================== */

(async()=>{

 await openDB();

 /*
  Remove duplicate local memory
  records before application starts.
 */

 await dedupeMemories();


 if(
  'serviceWorker'
  in navigator
 ){

  navigator.serviceWorker
   .register(
    './service-worker.js'
   );

 }


 if(sb){

  sb.auth
   .onAuthStateChange(
    (e,s)=>{

     if(
      e==='SIGNED_IN' &&
      s &&
      !user
     ){

      start(
       s.user
      );

     }

    }
   );


  let {
   data
  }=
   await sb.auth
    .getSession();


  if(
   data.session
  ){

   start(
    data.session.user
   );

  }

 }

})();
