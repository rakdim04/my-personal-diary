<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5b3a24">
<link rel="manifest" href="manifest.json">
<title>My Personal Diary</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:#3c2a1d;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(120,75,30,.15),transparent 35%),
    linear-gradient(135deg,#d9bf96,#b99364,#d8bd91);
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:1px solid #b9976d;
  background:#fffdf7;
  color:#493322;
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.13);
}

button:hover{
  background:#f4e8d3;
}

button:active{
  transform:translateY(1px);
}

[hidden]{
  display:none!important;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  width:96%;
  margin:16px auto 10px;
  padding:10px 13px;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  background:linear-gradient(#634027,#432817);
  color:#fff8ec;
  box-shadow:0 8px 20px rgba(60,35,15,.28);
}

.brand{
  font-size:24px;
  font-weight:bold;
  margin-right:auto;
  white-space:nowrap;
}

.topbar button{
  font-size:15px;
}

/* =========================================================
   DATE BAR
========================================================= */

.datebar{
  width:96%;
  margin:0 auto 18px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.datebar input{
  width:210px;
  padding:10px;
  border:1px solid #b9976d;
  border-radius:9px;
  background:#fffdf8;
}

/* =========================================================
   DIARY BOOK
========================================================= */

.diary{
  width:94%;
  max-width:1500px;
  margin:0 auto 40px;
  position:relative;
  padding-left:82px;
}

/* Natural binding area */
.binding{
  position:absolute;
  left:5px;
  top:18px;
  bottom:18px;
  width:72px;
  z-index:20;
  pointer-events:none;
}

.binding-hole{
  position:absolute;
  left:3px;
  width:47px;
  height:29px;
  border-radius:50%;
  background:
    radial-gradient(
      ellipse at 42% 30%,
      #f3f3f3 0,
      #b8b8b8 25%,
      #555 52%,
      #252525 65%,
      #aaa 78%,
      #444 100%
    );
  box-shadow:
    inset 2px 2px 4px rgba(0,0,0,.65),
    3px 4px 5px rgba(0,0,0,.25);
}

.binding-hole:before{
  content:"";
  position:absolute;
  left:7px;
  top:10px;
  width:33px;
  height:7px;
  border-radius:50%;
  background:rgba(30,20,10,.55);
}

.binding-hole:nth-child(1){top:0}
.binding-hole:nth-child(2){top:9%}
.binding-hole:nth-child(3){top:18%}
.binding-hole:nth-child(4){top:27%}
.binding-hole:nth-child(5){top:36%}
.binding-hole:nth-child(6){top:45%}
.binding-hole:nth-child(7){top:54%}
.binding-hole:nth-child(8){top:63%}
.binding-hole:nth-child(9){top:72%}
.binding-hole:nth-child(10){top:81%}
.binding-hole:nth-child(11){top:90%}

.page{
  position:relative;
  min-height:1250px;
  padding:70px 75px 100px 95px;
  overflow:hidden;

  border:1px solid #b49367;
  border-radius:5px 20px 20px 5px;

  background-color:#fff8dd;

  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(93,133,143,.22) 40px,
      transparent 41px
    ),
    radial-gradient(
      circle at 20% 20%,
      rgba(120,80,35,.06),
      transparent 38%
    );

  box-shadow:
    0 18px 32px rgba(62,39,20,.32),
    inset 0 0 35px rgba(115,75,30,.13);
}

/* page designs */

.page.classic{
  background-color:#fff8dd;
}

.page.vintage{
  background-color:#f0dfba;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(115,88,55,.22) 40px,
      transparent 41px
    ),
    radial-gradient(
      circle at 80% 20%,
      rgba(110,70,25,.09),
      transparent 35%
    );
}

.page.natural{
  background-color:#fff7e5;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(105,135,105,.21) 40px,
      transparent 41px
    );
}

.page.blue{
  background-color:#edf5f3;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(70,115,125,.22) 40px,
      transparent 41px
    );
}

.page.night{
  background-color:#29251f;
  color:#eee1c7;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(220,190,130,.13) 40px,
      transparent 41px
    );
}

/* =========================================================
   PAGE HEADER
========================================================= */

.pageHeader{
  position:relative;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
}

.pageHeader h1{
  margin:0 0 2px;
  font-size:34px;
}

.pageNumber{
  font-size:15px;
  opacity:.7;
}

/* Mood and quote directly on diary */

.pageTopRight{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.moodDisplay{
  min-width:58px;
  min-height:45px;
  padding:4px 9px;
  border:1px solid #c7aa7d;
  border-radius:12px;
  background:rgba(255,252,240,.78);
  text-align:center;
  font-size:30px;
  box-shadow:0 2px 5px rgba(80,50,20,.12);
}

.quoteDisplay{
  max-width:330px;
  padding:9px 13px;
  border-left:3px solid #a67b45;
  border-radius:6px;
  background:rgba(255,252,239,.55);
  font-style:italic;
  font-size:14px;
  line-height:20px;
}

/* =========================================================
   FORMATTING BAR - SEPARATE FROM DIARY
========================================================= */

.formatBar{
  position:relative;
  z-index:15;
  display:flex;
  align-items:center;
  gap:6px;
  margin:17px 0 8px;
  padding:7px 9px;
  border:1px solid #cdb185;
  border-radius:10px;
  background:rgba(255,252,239,.88);
  box-shadow:0 2px 6px rgba(80,50,20,.08);
}

.formatBar button{
  min-width:38px;
  padding:6px 9px;
}

.formatBar .separator{
  width:1px;
  height:25px;
  background:#cbb28c;
}

/* =========================================================
   WRITING AREA
========================================================= */

.editorArea{
  position:relative;
  min-height:900px;
}

/*
   The editor is deliberately above the canvas.
   In normal mode it receives typing.
   In draw mode the canvas receives touch/stylus input.
*/

.editor{
  position:relative;
  z-index:2;
  min-height:900px;
  outline:none;
  font-size:20px;
  line-height:40px;
  padding:0 5px;
  word-wrap:break-word;
}

.editor:empty:before{
  content:"Start writing here...";
  color:rgba(90,60,30,.34);
  pointer-events:none;
}

/* =========================================================
   DRAWING LAYER
========================================================= */

#drawCanvas{
  position:absolute;
  z-index:30;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:none;
  background:transparent;
  touch-action:none;
}

.page.drawMode #drawCanvas{
  display:block;
  cursor:crosshair;
}

.page.drawMode .editor{
  pointer-events:none;
}

.page.drawMode .formatBar{
  opacity:.45;
}

/* Draw controls are NOT a modal */

.drawBar{
  position:fixed;
  z-index:3000;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:max-content;
  max-width:96vw;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  padding:9px;
  border-radius:14px;
  background:rgba(61,39,23,.97);
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.drawBar button{
  padding:7px 10px;
  font-size:14px;
}

.drawBar button.active{
  background:#dfbd7c;
  color:#2f1c0e;
  font-weight:bold;
}

.drawBar input[type=color]{
  width:38px;
  height:34px;
  padding:2px;
}

/* =========================================================
   NEW PAGE TAB
========================================================= */

.newPageTab{
  position:absolute;
  right:-1px;
  bottom:25px;
  z-index:50;
  border-radius:13px 0 0 13px;
  background:#e7ce9d;
  font-weight:bold;
  box-shadow:-2px 3px 7px rgba(60,40,20,.18);
}

/* =========================================================
   FOOTER
========================================================= */

.pageFooter{
  position:absolute;
  z-index:5;
  left:95px;
  right:75px;
  bottom:30px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.62;
}

/* =========================================================
   MODALS
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:rgba(25,15,8,.58);
}

.modalBox{
  width:min(760px,96vw);
  max-height:92vh;
  overflow:auto;
  padding:22px;
  border-radius:18px;
  background:#fffaf0;
  box-shadow:0 20px 65px rgba(0,0,0,.42);
}

.modalBox h2{
  margin-top:0;
  color:#5a3921;
}

.formRow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:10px 0;
}

.formRow>*{
  flex:1;
  min-width:150px;
}

.modal input,
.modal select,
.modal textarea{
  width:100%;
  padding:10px;
  margin:5px 0 10px;
  border:1px solid #c6aa7d;
  border-radius:8px;
  background:#fff;
}

.modal textarea{
  min-height:100px;
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:15px;
}

/* =========================================================
   CALENDAR
========================================================= */

.calendarHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.calendarGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.calendarWeek{
  text-align:center;
  font-weight:bold;
  padding:8px 2px;
}

.calendarDay{
  min-height:78px;
  padding:5px;
  border:1px solid #dcc39d;
  border-radius:7px;
  background:#fff;
  cursor:pointer;
}

.calendarDay:hover{
  background:#f5ead8;
}

.calendarDay.today{
  border:2px solid #8a5a30;
}

.calendarDay.selected{
  background:#ead5ac;
}

.calendarNumber{
  font-weight:bold;
}

.calendarEvent{
  margin-top:4px;
  padding:2px 4px;
  border-radius:4px;
  background:#e7d0a5;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   EVENT / TODO
========================================================= */

.eventItem,
.todoItem,
.memoryItem{
  padding:9px;
  margin:7px 0;
  border:1px solid #ddc29a;
  border-radius:8px;
  background:#fff;
}

.eventItem strong{
  display:block;
  font-size:17px;
  margin-bottom:4px;
}

.todoItem{
  display:flex;
  align-items:center;
  gap:8px;
}

.todoItem span{
  flex:1;
}

.todoItem.done span{
  text-decoration:line-through;
  opacity:.55;
}

/* =========================================================
   MEMORY
========================================================= */

.memoryGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;
}

.memoryCard img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

/* =========================================================
   STATUS
========================================================= */

#status{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:6000;
  display:none;
  padding:10px 15px;
  border-radius:9px;
  background:#3d291b;
  color:white;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

  .topbar{
    width:98%;
    justify-content:center;
  }

  .brand{
    width:100%;
    text-align:center;
    margin-bottom:4px;
  }

  .topbar button{
    font-size:13px;
    padding:7px 8px;
  }

  .diary{
    width:98%;
    padding-left:43px;
  }

  .binding{
    left:2px;
    width:39px;
  }

  .binding-hole{
    width:32px;
    height:22px;
  }

  .page{
    min-height:1150px;
    padding:55px 25px 90px 50px;
  }

  .pageHeader h1{
    font-size:24px;
  }

  .pageTopRight{
    gap:5px;
  }

  .quoteDisplay{
    max-width:170px;
    font-size:12px;
    line-height:17px;
  }

  .editorArea,
  .editor{
    min-height:850px;
  }

  .editor{
    font-size:18px;
    line-height:40px;
  }

  .pageFooter{
    left:50px;
    right:25px;
  }

  .newPageTab{
    font-size:13px;
    padding:7px 10px;
  }

  .drawBar{
    bottom:7px;
  }

  .drawBar button{
    font-size:12px;
    padding:6px 8px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">

  <div class="brand">📖 My Personal Diary</div>

  <button id="calendarBtn">📅 Calendar</button>
  <button id="eventBtn">🗓️ Events</button>
  <button id="memoryBtn">🖼️ Memories</button>
  <button id="todoBtn">☑️ To-do</button>
  <button id="drawBtn">✏️ Draw</button>
  <button id="settingsBtn">⚙️ Settings</button>
  <button id="printBtn">🖨️ Print</button>
  <button id="backupBtn">💾 Backup</button>
  <button id="restoreBtn">↩️ Restore</button>

  <input id="restoreInput" type="file" accept=".json,application/json" hidden>

</header>

<!-- DATE -->

<div class="datebar">
  <button id="prevBtn">‹ Previous</button>
  <input id="datePicker" type="date">
  <button id="nextBtn">Next ›</button>
</div>

<!-- =======================================================
     DIARY
======================================================= -->

<main class="diary">

  <div class="binding">
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
    <div class="binding-hole"></div>
  </div>

  <section class="page classic" id="page">

    <div class="pageHeader">

      <div>
        <h1 id="pageTitle"></h1>
        <div class="pageNumber" id="pageNumber">Page 1</div>
      </div>

      <div class="pageTopRight">

        <!-- Mood selector -->
        <select id="moodSelect" title="Select mood">
          <option value="">Mood</option>
          <option value="😊">😊 Happy</option>
          <option value="😌">😌 Peaceful</option>
          <option value="😍">😍 Excited</option>
          <option value="🙏">🙏 Grateful</option>
          <option value="😐">😐 Normal</option>
          <option value="😔">😔 Sad</option>
          <option value="😡">😡 Angry</option>
          <option value="😴">😴 Tired</option>
        </select>

        <!-- Selected mood appears here -->
        <div class="moodDisplay" id="moodDisplay">🙂</div>

        <!-- Quote appears directly on paper -->
        <div class="quoteDisplay" id="quoteDisplay"></div>

      </div>

    </div>

    <!-- SEPARATE FORMATTING TOOLBAR -->
    <div class="formatBar">

      <button id="boldBtn" title="Bold"><b>B</b></button>
      <button id="italicBtn" title="Italic"><i>I</i></button>
      <button id="underlineBtn" title="Underline"><u>U</u></button>

      <div class="separator"></div>

      <button id="bulletBtn" title="Bullet list">• List</button>
      <button id="leftBtn" title="Align left">≡</button>
      <button id="centerBtn" title="Center">≡</button>

    </div>

    <!-- WRITING + DRAWING -->
    <div class="editorArea" id="editorArea">

      <div
        id="editor"
        class="editor"
        contenteditable="true"
        spellcheck="true">
      </div>

      <!-- transparent drawing canvas -->
      <canvas id="drawCanvas"></canvas>

    </div>

    <!-- NEW PAGE AT RIGHT -->
    <button class="newPageTab" id="newPageBtn">
      ＋ New Page
    </button>

    <div class="pageFooter">
      <span id="saveStatus">Ready</span>
      <span>My Personal Diary</span>
    </div>

  </section>

</main>

<!-- =======================================================
     DRAW TOOLBAR
======================================================= -->

<div class="drawBar" id="drawBar" hidden>

  <button id="penBtn" class="active">✏️ Pen</button>
  <button id="lineBtn">╱ Line</button>
  <button id="circleBtn">◯ Circle</button>
  <button id="eraserBtn">⌫ Eraser</button>

  <input id="drawColor" type="color" value="#222222">

  <button id="undoBtn">↶ Undo</button>
  <button id="redoBtn">↷ Redo</button>
  <button id="clearDrawingBtn">🗑 Clear</button>

  <button id="closeDrawBtn">✕ Close Draw</button>

</div>

<!-- =======================================================
     CALENDAR
======================================================= -->

<div class="modal" id="calendarModal" hidden>

  <div class="modalBox">

    <div class="calendarHeader">
      <button id="calendarPrevious">‹</button>
      <h2 id="calendarTitle">Calendar</h2>
      <button id="calendarNext">›</button>
    </div>

    <div class="calendarGrid" id="calendarGrid"></div>

    <div class="modalActions">
      <button id="calendarClose">Close</button>
    </div>

  </div>

</div>

<!-- =======================================================
     EVENTS
======================================================= -->

<div class="modal" id="eventModal" hidden>

  <div class="modalBox">

    <h2>🗓️ Diary Events</h2>

    <label>Date</label>
    <input type="date" id="eventDate">

    <label>Time</label>
    <input type="time" id="eventTime">

    <label>Event title</label>
    <input
      type="text"
      id="eventTitle"
      placeholder="Example: Doctor appointment">

    <label>Notes</label>
    <textarea
      id="eventNotes"
      placeholder="Event details..."></textarea>

    <div class="modalActions">
      <button id="eventClose">Close</button>
      <button id="eventSave">💾 Save Event</button>
    </div>

    <hr>

    <h3>Saved Events</h3>
    <div id="eventList"></div>

  </div>

</div>

<!-- =======================================================
     TODO
======================================================= -->

<div class="modal" id="todoModal" hidden>

  <div class="modalBox">

    <h2>☑️ To-do List</h2>

    <div class="formRow">
      <input
        type="text"
        id="todoInput"
        placeholder="Write a task...">

      <button id="todoAdd">＋ Add</button>
    </div>

    <div id="todoList"></div>

    <div class="modalActions">
      <button id="todoClose">Close</button>
    </div>

  </div>

</div>

<!-- =======================================================
     MEMORIES
======================================================= -->

<div class="modal" id="memoryModal" hidden>

  <div class="modalBox">

    <h2>🖼️ Memories</h2>

    <label>📷 Camera / Photo</label>
    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment">

    <label>📄 Document / Image</label>
    <input
      id="memoryInput"
      type="file"
      accept="image/*,.pdf">

    <div class="memoryGrid" id="memoryGrid"></div>

    <div class="modalActions">
      <button id="memoryClose">Close</button>
    </div>

  </div>

</div>

<!-- =======================================================
     SETTINGS
======================================================= -->

<div class="modal" id="settingsModal" hidden>

  <div class="modalBox">

    <h2>⚙️ Diary Settings</h2>

    <label>Diary design</label>

    <select id="designSelect">
      <option value="classic">Classic Cream</option>
      <option value="vintage">Vintage Paper</option>
      <option value="natural">Natural Paper</option>
      <option value="blue">Soft Blue</option>
      <option value="night">Night Diary</option>
    </select>

    <label>Writing size</label>

    <select id="fontSizeSelect">
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="22">22</option>
      <option value="24">24</option>
      <option value="26">26</option>
    </select>

    <hr>

    <button id="clearPageBtn">
      🗑 Clear Current Page
    </button>

    <div class="modalActions">
      <button id="settingsClose">Close</button>
      <button id="settingsSave">💾 Save Settings</button>
    </div>

  </div>

</div>

<div id="status"></div>

<script>
"use strict";

/* =========================================================
   STORAGE
   ---------------------------------------------------------
   Core diary data is kept in localStorage because it is
   extremely reliable for a GitHub Pages PWA and avoids the
   tablet IndexedDB refresh problem of the previous version.
========================================================= */

const PAGE_KEY="myPersonalDiary.pages.v84";
const EVENT_KEY="myPersonalDiary.events.v84";
const TODO_KEY="myPersonalDiary.todos.v84";
const SETTINGS_KEY="myPersonalDiary.settings.v84";
const MEMORY_DB="myPersonalDiaryMemoriesV84";

let pages={};
let events=[];
let todos=[];
let settings={
  design:"classic",
  fontSize:"20"
};

let currentDate="";
let currentPage=1;
let currentPageData=null;

/* =========================================================
   BASIC STORAGE
========================================================= */

function loadJSON(key,fallback){
  try{
    const x=localStorage.getItem(key);
    return x ? JSON.parse(x) : fallback;
  }catch(e){
    console.error(e);
    return fallback;
  }
}

function saveJSON(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  }catch(e){
    console.error(e);
    showStatus("Storage error");
    return false;
  }
}

function loadStorage(){

  pages=loadJSON(PAGE_KEY,{});
  events=loadJSON(EVENT_KEY,[]);
  todos=loadJSON(TODO_KEY,[]);
  settings=loadJSON(
    SETTINGS_KEY,
    {
      design:"classic",
      fontSize:"20"
    }
  );

}

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function localISO(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+d;
}

function todayISO(){
  return localISO(new Date());
}

function displayDate(iso){
  const d=new Date(iso+"T00:00:00");

  return d.toLocaleDateString(
    "en-IN",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );
}

function changeDate(iso,days){
  const d=new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+days);
  return localISO(d);
}

function pageID(date,page){
  return date+"-page-"+page;
}

function showStatus(message){

  const s=$("status");

  s.textContent=message;
  s.style.display="block";

  clearTimeout(showStatus.timer);

  showStatus.timer=setTimeout(()=>{
    s.style.display="none";
  },1800);
}

function escapeHTML(text){

  return String(text||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   QUOTES
========================================================= */

const quotes=[
  "Every day is a new page in the story of life.",
  "Small moments become beautiful memories.",
  "Be grateful for today.",
  "Peace begins with a calm mind.",
  "Enjoy the simple things.",
  "A beautiful life is made of meaningful moments.",
  "Write today. Remember tomorrow.",
  "Every sunrise brings a fresh beginning.",
  "Keep faith and keep moving forward.",
  "Life is better when we notice the little things."
];

function quoteForDate(date){

  let n=0;

  for(let i=0;i<date.length;i++){
    n+=date.charCodeAt(i);
  }

  return quotes[n%quotes.length];
}

/* =========================================================
   PAGE
========================================================= */

function createEmptyPage(){

  return {
    id:pageID(currentDate,currentPage),
    date:currentDate,
    page:currentPage,
    content:"",
    drawing:"",
    mood:"",
    quote:quoteForDate(currentDate),
    updated:Date.now()
  };

}

function loadPage(){

  const id=pageID(currentDate,currentPage);

  currentPageData=pages[id] || createEmptyPage();

  $("pageTitle").textContent=displayDate(currentDate);

  $("pageNumber").textContent="Page "+currentPage;

  $("datePicker").value=currentDate;

  $("editor").innerHTML=currentPageData.content || "";

  $("moodSelect").value=currentPageData.mood || "";

  updateMoodDisplay();

  $("quoteDisplay").textContent=
    "“"+(currentPageData.quote || quoteForDate(currentDate))+"”";

  applySettings();

  loadDrawing(currentPageData.drawing || "");

  $("saveStatus").textContent="Saved";
}

function savePage(){

  if(!currentPageData)return;

  currentPageData.id=pageID(currentDate,currentPage);
  currentPageData.date=currentDate;
  currentPageData.page=currentPage;

  currentPageData.content=$("editor").innerHTML;
  currentPageData.mood=$("moodSelect").value;

  currentPageData.updated=Date.now();

  pages[currentPageData.id]=currentPageData;

  saveJSON(PAGE_KEY,pages);

  $("saveStatus").textContent="Saved";
}

/* Autosave */
let saveTimer=null;

function scheduleSave(){

  $("saveStatus").textContent="Saving...";

  clearTimeout(saveTimer);

  saveTimer=setTimeout(()=>{
    savePage();
  },300);
}

/* =========================================================
   DATE NAVIGATION
========================================================= */

async function goToDate(date){

  savePage();

  closeDraw();

  currentDate=date;
  currentPage=1;

  loadPage();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

$("prevBtn").onclick=()=>{
  goToDate(changeDate(currentDate,-1));
};

$("nextBtn").onclick=()=>{
  goToDate(changeDate(currentDate,1));
};

$("datePicker").onchange=()=>{
  if($("datePicker").value){
    goToDate($("datePicker").value);
  }
};

/* =========================================================

========================================================= */

$("newPageBtn").onclick=()=>{

  savePage();

  closeDraw();

  currentPage++;

  loadPage();

/* =========================================================
   DRAWING
========================================================= */

const canvas=$("drawCanvas");
const ctx=canvas.getContext("2d");

let drawMode=false;
let drawTool="pen";
let isDrawing=false;

let startX=0;
let startY=0;
let lastX=0;
let lastY=0;

let undoStack=[];
let redoStack=[];

function canvasSize(){

  const area=$("editorArea");

  return {
    width:area.clientWidth,
    height:area.clientHeight
  };
}

function resizeCanvas(preserve=true){

  const old=
    preserve && canvas.width>0
      ? canvas.toDataURL("image/png")
      : "";

  const size=canvasSize();

  const ratio=Math.max(1,window.devicePixelRatio||1);

  canvas.width=Math.floor(size.width*ratio);
  canvas.height=Math.floor(size.height*ratio);

  canvas.style.width=size.width+"px";
  canvas.style.height=size.height+"px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  if(old){

    const img=new Image();

    img.onload=()=>{
      ctx.drawImage(
        img,
        0,
        0,
        size.width,
        size.height
      );
    };

    img.src=old;
  }
}

function clearCanvas(){

  const size=canvasSize();

  ctx.clearRect(
    0,
    0,
    size.width,
    size.height
  );
}

function loadDrawing(data){

  resizeCanvas(false);

  clearCanvas();

  undoStack=[];
  redoStack=[];

  if(!data)return;

  const img=new Image();

  img.onload=()=>{
    const size=canvasSize();

    ctx.drawImage(
      img,
      0,
      0,
      size.width,
      size.height
    );
  };

  img.src=data;
}

function snapshot(){

  undoStack.push(
    canvas.toDataURL("image/png")
  );

  if(undoStack.length>40){
    undoStack.shift();
  }

  redoStack=[];
}

function restoreImage(data){

  clearCanvas();

  if(!data)return;

  const img=new Image();

  img.onload=()=>{
    const size=canvasSize();

    ctx.drawImage(
      img,
      0,
      0,
      size.width,
      size.height
    );
  };

  img.src=data;
}

function pointerPosition(e){

  const r=canvas.getBoundingClientRect();

  return {
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };
}

function prepareBrush(){

  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.lineWidth=3;

  if(drawTool==="eraser"){

    ctx.globalCompositeOperation="destination-out";
    ctx.strokeStyle="rgba(0,0,0,1)";

  }else{

    ctx.globalCompositeOperation="source-over";
    ctx.strokeStyle=$("drawColor").value;
  }
}

function beginDrawing(e){

  if(!drawMode)return;

  e.preventDefault();

  if(e.pointerId!==undefined){
    try{
      canvas.setPointerCapture(e.pointerId);
    }catch(err){}
  }

  const p=pointerPosition(e);

  isDrawing=true;

  startX=p.x;
  startY=p.y;

  lastX=p.x;
  lastY=p.y;

  snapshot();

  prepareBrush();

  if(
    drawTool==="pen" ||
    drawTool==="eraser"
  ){

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x+.01,p.y+.01);
    ctx.stroke();
  }
}

function moveDrawing(e){

  if(!isDrawing)return;

  e.preventDefault();

  const p=pointerPosition(e);

  if(
    drawTool==="pen" ||
    drawTool==="eraser"
  ){

    prepareBrush();

    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();

    lastX=p.x;
    lastY=p.y;

    return;
  }

  /* restore previous image for shape preview */
  restoreImage(
    undoStack[undoStack.length-1]
  );

  prepareBrush();

  if(drawTool==="line"){

    ctx.beginPath();

    ctx.moveTo(startX,startY);
    ctx.lineTo(p.x,p.y);

    ctx.stroke();
  }

  if(drawTool==="circle"){

    const rx=Math.abs(p.x-startX)/2;
    const ry=Math.abs(p.y-startY)/2;

    const cx=(p.x+startX)/2;
    const cy=(p.y+startY)/2;

    ctx.beginPath();

    ctx.ellipse(
      cx,
      cy,
      Math.max(rx,2),
      Math.max(ry,2),
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }
}

function endDrawing(e){

  if(!isDrawing)return;

  isDrawing=false;

  if(
    drawTool==="line" ||
    drawTool==="circle"
  ){

    const p=pointerPosition(e);

    restoreImage(
      undoStack[undoStack.length-1]
    );

    prepareBrush();

    if(drawTool==="line"){

      ctx.beginPath();
      ctx.moveTo(startX,startY);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();

    }else{

      const rx=Math.abs(p.x-startX)/2;
      const ry=Math.abs(p.y-startY)/2;

      const cx=(p.x+startX)/2;
      const cy=(p.y+startY)/2;

      ctx.beginPath();

      ctx.ellipse(
        cx,
        cy,
        Math.max(rx,2),
        Math.max(ry,2),
        0,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }
  }

  ctx.globalCompositeOperation="source-over";

  if(currentPageData){

    currentPageData.drawing=
      canvas.toDataURL("image/png");

    scheduleSave();
  }
}

canvas.addEventListener(
  "pointerdown",
  beginDrawing,
  {passive:false}
);

canvas.addEventListener(
  "pointermove",
  moveDrawing,
  {passive:false}
);

canvas.addEventListener(
  "pointerup",
  endDrawing,
  {passive:false}
);

canvas.addEventListener(
  "pointercancel",
  endDrawing,
  {passive:false}
);

/* Select drawing tool */

function selectTool(tool){

  drawTool=tool;

  ["penBtn","lineBtn","circleBtn","eraserBtn"]
    .forEach(id=>{
      $(id).classList.remove("active");
    });

  const ids={
    pen:"penBtn",
    line:"lineBtn",
    circle:"circleBtn",
    eraser:"eraserBtn"
  };

  $(ids[tool]).classList.add("active");
}

$("penBtn").onclick=()=>{
  selectTool("pen");
};

$("lineBtn").onclick=()=>{
  selectTool("line");
};

$("circleBtn").onclick=()=>{
  selectTool("circle");
};

$("eraserBtn").onclick=()=>{
  selectTool("eraser");
};

$("drawColor").onchange=()=>{
  if(drawTool==="eraser"){
    selectTool("pen");
  }
};

/* Undo */

$("undoBtn").onclick=()=>{

  if(!undoStack.length){
    showStatus("Nothing to undo");
    return;
  }

  const current=canvas.toDataURL("image/png");

  redoStack.push(current);

  const previous=undoStack.pop();

  restoreImage(previous);

  if(currentPageData){

    currentPageData.drawing=
      previous || "";

    scheduleSave();
  }
};

/* Redo */

$("redoBtn").onclick=()=>{

  if(!redoStack.length){
    showStatus("Nothing to redo");
    return;
  }

  const current=canvas.toDataURL("image/png");

  undoStack.push(current);

  const next=redoStack.pop();

  restoreImage(next);

  if(currentPageData){

    currentPageData.drawing=next;

    scheduleSave();
  }
};

/* Clear */

$("clearDrawingBtn").onclick=()=>{

  if(!confirm("Clear all drawings from this page?")){
    return;
  }

  snapshot();

  clearCanvas();

  if(currentPageData){

    currentPageData.drawing="";

    scheduleSave();
  }

  showStatus("Drawing cleared");
};

/* OPEN DRAW */

function openDraw(){

  if(drawMode)return;

  savePage();

  resizeCanvas(true);

  drawMode=true;

  $("page").classList.add("drawMode");

  $("drawBar").hidden=false;

  $("drawBtn").textContent="✕ Close Draw";

  selectTool("pen");

  showStatus("Draw directly on your diary page");
}

/* CLOSE DRAW */

function closeDraw(){

  if(!drawMode)return;

  drawMode=false;

  isDrawing=false;

  ctx.globalCompositeOperation="source-over";

  $("page").classList.remove("drawMode");

  $("drawBar").hidden=true;

  $("drawBtn").textContent="✏️ Draw";

  if(currentPageData){

    currentPageData.drawing=
      canvas.toDataURL("image/png");

    savePage();
  }
}

$("drawBtn").onclick=()=>{

  if(drawMode){
    closeDraw();
  }else{
    openDraw();
  }
};

$("closeDrawBtn").onclick=closeDraw;

window.addEventListener("resize",()=>{

  if(drawMode){
    resizeCanvas(true);
  }

});

/* =========================================================
   CALENDAR
========================================================= */

let calendarDate=new Date();

$("calendarBtn").onclick=()=>{

  calendarDate=
    new Date(currentDate+"T00:00:00");

  renderCalendar();

  $("calendarModal").hidden=false;
};

$("calendarClose").onclick=()=>{
  $("calendarModal").hidden=true;
};

$("calendarPrevious").onclick=()=>{

  calendarDate.setMonth(
    calendarDate.getMonth()-1
  );

  renderCalendar();
};

$("calendarNext").onclick=()=>{

  calendarDate.setMonth(
    calendarDate.getMonth()+1
  );

  renderCalendar();
};

function renderCalendar(){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  $("calendarTitle").textContent=
    calendarDate.toLocaleDateString(
      "en-IN",
      {
        month:"long",
        year:"numeric"
      }
    );

  const grid=$("calendarGrid");

  grid.innerHTML="";

  [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ].forEach(day=>{

    const div=document.createElement("div");

    div.className="calendarWeek";

    div.textContent=day;

    grid.appendChild(div);
  });

  const first=new Date(year,month,1);

  const last=new Date(
    year,
    month+1,
    0
  );

  for(
    let i=0;
    i<first.getDay();
    i++
  ){

    grid.appendChild(
      document.createElement("div")
    );
  }

  for(
    let day=1;
    day<=last.getDate();
    day++
  ){

    const d=new Date(
      year,
      month,
      day
    );

    const iso=localISO(d);

    const cell=document.createElement("div");

    cell.className="calendarDay";

    if(iso===todayISO()){
      cell.classList.add("today");
    }

    if(iso===currentDate){
      cell.classList.add("selected");
    }

    cell.innerHTML=
      `<div class="calendarNumber">${day}</div>`;

    events
      .filter(e=>e.date===iso)
      .slice(0,3)
      .forEach(e=>{

        const ev=document.createElement("div");

        ev.className="calendarEvent";

        ev.textContent=
          (e.time ? e.time+" " : "")+
          e.title;

        cell.appendChild(ev);
      });

    cell.onclick=()=>{

      $("calendarModal").hidden=true;

      goToDate(iso);
    };

    grid.appendChild(cell);
  }
}

/* =========================================================
   EVENTS
========================================================= */

$("eventBtn").onclick=()=>{

  $("eventDate").value=currentDate;

  $("eventTime").value="";

  $("eventTitle").value="";

  $("eventNotes").value="";

  renderEvents();

  $("eventModal").hidden=false;
};

$("eventClose").onclick=()=>{
  $("eventModal").hidden=true;
};

$("eventSave").onclick=()=>{

  const date=$("eventDate").value;
  const time=$("eventTime").value;
  const title=$("eventTitle").value.trim();
  const notes=$("eventNotes").value.trim();

  if(!date){

    alert("Please select an event date.");

    return;
  }

  if(!title){

    alert("Please enter the event title.");

    return;
  }

  const event={
    id:
      Date.now().toString()+
      Math.random().toString(36).slice(2),

    date,
    time,
    title,
    notes,
    created:Date.now()
  };

  events.push(event);

  saveJSON(EVENT_KEY,events);

  /* Immediately refresh event list */
  renderEvents();

  /* Immediately refresh calendar if open */
  renderCalendar();

  $("eventTitle").value="";
  $("eventNotes").value="";
  $("eventTime").value="";

  showStatus("Event added successfully");
};

function renderEvents(){

  const box=$("eventList");

  box.innerHTML="";

  const sorted=[...events].sort((a,b)=>{

    const x=(a.date||"")+" "+(a.time||"");
    const y=(b.date||"")+" "+(b.time||"");

    return x.localeCompare(y);
  });

  if(!sorted.length){

    box.innerHTML=
      "<p>No events added yet.</p>";

    return;
  }

  sorted.forEach(event=>{

    const div=document.createElement("div");

    div.className="eventItem";

    div.innerHTML=`
      <strong>${escapeHTML(event.title)}</strong>
      <div>
        ${escapeHTML(event.date)}
        ${event.time ? " • "+escapeHTML(event.time) : ""}
      </div>
      ${
        event.notes
        ? `<div>${escapeHTML(event.notes)}</div>`
        : ""
      }
      <button style="margin-top:7px">
        🗑 Delete
      </button>
    `;

    div.querySelector("button").onclick=()=>{

      if(!confirm("Delete this event?")){
        return;
      }

      events=events.filter(
        x=>x.id!==event.id
      );

      saveJSON(EVENT_KEY,events);

      renderEvents();
      renderCalendar();

      showStatus("Event deleted");
    };

    box.appendChild(div);
  });
}

/* =========================================================
   TODO
========================================================= */

$("todoBtn").onclick=()=>{

  carryForwardTodos();

  renderTodos();

  $("todoModal").hidden=false;
};

$("todoClose").onclick=()=>{
  $("todoModal").hidden=true;
};

$("todoAdd").onclick=addTodo;

$("todoInput").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      addTodo();
    }
  }
);

function addTodo(){

  const text=$("todoInput").value.trim();

  if(!text)return;

  todos.push({

    id:
      Date.now().toString()+
      Math.random().toString(36).slice(2),

    date:currentDate,
    text,
    done:false,
    created:Date.now()
  });

  saveJSON(TODO_KEY,todos);

  $("todoInput").value="";

  renderTodos();

  showStatus("Task added");
}

function renderTodos(){

  const box=$("todoList");

  box.innerHTML="";

  const list=todos
    .filter(t=>t.date===currentDate)
    .sort((a,b)=>a.created-b.created);

  if(!list.length){

    box.innerHTML=
      "<p>No tasks for this date.</p>";

    return;
  }

  list.forEach(task=>{

    const row=document.createElement("div");

    row.className=
      "todoItem"+
      (task.done ? " done":"");

    row.innerHTML=`
      <input type="checkbox"
        ${task.done ? "checked":""}>

      <span>${escapeHTML(task.text)}</span>

      <button>🗑</button>
    `;

    row.querySelector("input").onchange=e=>{

      task.done=e.target.checked;

      saveJSON(TODO_KEY,todos);

      renderTodos();
    };

    row.querySelector("button").onclick=()=>{

      if(!confirm("Delete this task?")){
        return;
      }

      todos=todos.filter(
        x=>x.id!==task.id
      );

      saveJSON(TODO_KEY,todos);

      renderTodos();

      showStatus("Task deleted");
    };

    box.appendChild(row);
  });
}

/* Carry unfinished tasks forward */

function carryForwardTodos(){

  const previous=changeDate(
    currentDate,
    -1
  );

  const previousTasks=todos.filter(
    t=>
      t.date===previous &&
      !t.done
  );

  const todayTasks=todos.filter(
    t=>t.date===currentDate
  );

  previousTasks.forEach(task=>{

    const exists=todayTasks.some(
      t=>
        !t.done &&
        t.text===task.text
    );

    if(!exists){

      todos.push({

        id:
          Date.now().toString()+
          Math.random().toString(36).slice(2),

        date:currentDate,
        text:task.text,
        done:false,
        carriedFrom:previous,
        created:Date.now()
      });
    }
  });

  saveJSON(TODO_KEY,todos);
}

/* =========================================================
   MEMORIES
========================================================= */

let memoryDB=null;

function openMemoryDB(){

  return new Promise((resolve,reject)=>{

    const request=
      indexedDB.open(MEMORY_DB,1);

    request.onupgradeneeded=e=>{

      const d=e.target.result;

      if(!d.objectStoreNames.contains("memories")){

        const store=
          d.createObjectStore(
            "memories",
            {
              keyPath:"id",
              autoIncrement:true
            }
          );

        store.createIndex(
          "date",
          "date",
          {unique:false}
        );
      }
    };

    request.onsuccess=()=>{

      memoryDB=request.result;

      resolve(memoryDB);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

function memoryAdd(record){

  return new Promise((resolve,reject)=>{

    const store=
      memoryDB
        .transaction(
          "memories",
          "readwrite"
        )
        .objectStore("memories");

    const request=store.add(record);

    request.onsuccess=()=>{
      resolve(request.result);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

function memoryAll(){

  return new Promise((resolve,reject)=>{

    const store=
      memoryDB
        .transaction("memories")
        .objectStore("memories");

    const request=store.getAll();

    request.onsuccess=()=>{
      resolve(request.result||[]);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

function memoryDelete(id){

  return new Promise((resolve,reject)=>{

    const store=
      memoryDB
        .transaction(
          "memories",
          "readwrite"
        )
        .objectStore("memories");

    const request=store.delete(id);

    request.onsuccess=()=>{
      resolve();
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

async function handleMemory(file){

  if(!file)return;

  const reader=new FileReader();

  reader.onload=async()=>{

    try{

      await memoryAdd({

        date:currentDate,
        name:file.name,
        type:file.type,
        data:reader.result,
        created:Date.now()
      });

      $("cameraInput").value="";
      $("memoryInput").value="";

      await renderMemories();

      showStatus("Memory saved");

    }catch(e){

      console.error(e);

      alert("Memory could not be saved.");
    }
  };

  reader.readAsDataURL(file);
}

$("cameraInput").onchange=e=>{
  handleMemory(e.target.files[0]);
};

$("memoryInput").onchange=e=>{
  handleMemory(e.target.files[0]);
};

$("memoryBtn").onclick=async()=>{

  await renderMemories();

  $("memoryModal").hidden=false;
};

$("memoryClose").onclick=()=>{
  $("memoryModal").hidden=true;
};

async function renderMemories(){

  const box=$("memoryGrid");

  box.innerHTML="";

  const all=await memoryAll();

  const list=all.filter(
    x=>x.date===currentDate
  );

  if(!list.length){

    box.innerHTML=
      "<p>No memories attached to this date.</p>";

    return;
  }

  list.forEach(memory=>{

    const div=document.createElement("div");

    div.className="memoryItem";

    if(
      (memory.type||"")
        .startsWith("image/")
    ){

      div.innerHTML=`
        <div class="memoryCard">
          <img src="${memory.data}" alt="">
          <div>${escapeHTML(memory.name)}</div>
          <button>🗑 Delete</button>
        </div>
      `;

    }else{

      div.innerHTML=`
        <div>
          📄 ${escapeHTML(memory.name)}
        </div>
        <button>🗑 Delete</button>
      `;
    }

    div.querySelector("button").onclick=async()=>{

      if(!confirm("Delete this memory?")){
        return;
      }

      await memoryDelete(memory.id);

      await renderMemories();

      showStatus("Memory deleted");
    };

    box.appendChild(div);
  });
}

/* =========================================================
   BACKUP
========================================================= */

$("backupBtn").onclick=async()=>{

  savePage();

  const memories=await memoryAll();

  const backup={

    version:"8.4",

    created:new Date().toISOString(),

    pages,

    events,

    todos,

    settings,

    memories
  };

  const blob=new Blob(
    [JSON.stringify(backup)],
    {
      type:"application/json"
    }
  );

  const url=
    URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download=
    "my-personal-diary-backup-"+
    todayISO()+
    ".json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);

  showStatus("Backup created");
};

/* =========================================================
   RESTORE
========================================================= */

$("restoreBtn").onclick=()=>{
  $("restoreInput").click();
};

$("restoreInput").onchange=async e=>{

  const file=e.target.files[0];

  if(!file)return;

  try{

    const text=await file.text();

    const data=JSON.parse(text);

    if(!data || typeof data!=="object"){
      throw new Error("Invalid backup");
    }

    if(!confirm(
      "Restore this diary backup?"
    )){
      e.target.value="";
      return;
    }

    if(data.pages){

      pages={
        ...pages,
        ...data.pages
      };

      saveJSON(PAGE_KEY,pages);
    }

    if(Array.isArray(data.events)){

      events=data.events;

      saveJSON(EVENT_KEY,events);
    }

    if(Array.isArray(data.todos)){

      todos=data.todos;

      saveJSON(TODO_KEY,todos);
    }

    if(data.settings){

      settings={
        ...settings,
        ...data.settings
      };

      saveJSON(
        SETTINGS_KEY,
        settings
      );
    }

    if(Array.isArray(data.memories)){

      for(
        const memory of data.memories
      ){

        const copy={...memory};

        delete copy.id;

        await memoryAdd(copy);
      }
    }

    applySettings();

    loadPage();

    showStatus("Diary restored");

  }catch(error){

    console.error(error);

    alert(
      "The backup file could not be restored."
    );
  }

  e.target.value="";
};

/* =========================================================
   MIGRATE OLD v8 INDEXEDDB PAGES
   ---------------------------------------------------------
   This tries to recover pages created by the previous
   versions. It does not delete the old database.
========================================================= */

async function migrateOldPages(){

  try{

    const request=
      indexedDB.open(
        "myPersonalDiaryDB"
      );

    request.onsuccess=()=>{

      const oldDB=request.result;

      if(
        !oldDB.objectStoreNames.contains("pages")
      ){

        oldDB.close();

        return;
      }

      try{

        const transaction=
          oldDB.transaction(
            "pages",
            "readonly"
          );

        const store=
          transaction.objectStore("pages");

        const getAll=
          store.getAll();

        getAll.onsuccess=()=>{

          const oldPages=
            getAll.result||[];

          let imported=0;

          oldPages.forEach(old=>{

            if(
              !old ||
              !old.date
            ){
              return;
            }

            const p=
              Number(old.page||1);

            const id=
              pageID(old.date,p);

            if(!pages[id]){

              pages[id]={

                id,

                date:old.date,

                page:p,

                content:
                  old.content||"",

                drawing:
                  old.drawing||"",

                mood:
                  old.mood||"",

                quote:
                  old.quote||
                  quoteForDate(old.date),

                updated:
                  old.updated||
                  Date.now()
              };

              imported++;
            }
          });

          if(imported){

            saveJSON(
              PAGE_KEY,
              pages
            );

            if(
              currentDate &&
              currentPage
            ){
              loadPage();
            }

            showStatus(
              imported+
              " old diary page(s) recovered"
            );
          }

          oldDB.close();
        };

      }catch(err){

        console.log(
          "Old page migration skipped",
          err
        );

        oldDB.close();
      }
    };

    request.onerror=()=>{
      console.log(
        "No previous diary database"
      );
    };

  }catch(e){

    console.log(
      "Migration unavailable",
      e
    );
  }
}

/* =========================================================
   START APPLICATION
========================================================= */

async function start(){

  loadStorage();

  try{
    await openMemoryDB();
  }catch(e){
    console.error(
      "Memory database unavailable",
      e
    );
  }

  currentDate=todayISO();

  currentPage=1;

  applySettings();

  loadPage();

  await migrateOldPages();

  if(
    "serviceWorker" in navigator
  ){

    try{

      await navigator.serviceWorker.register(
        "./service-worker.js"
      );

    }catch(e){

      console.log(
        "Service worker registration failed",
        e
      );
    }
  }

  checkEvents();
}

start();
