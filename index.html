<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#5b3825">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>My Personal Diary</title>

<style>

:root{
  --paper:#fbf8ea;
  --paper2:#f5efd9;
  --ink:#3d2b20;
  --line:#d8cfb7;
  --brown:#5b3825;
  --brown2:#74482e;
  --gold:#b68a55;
  --shadow:rgba(50,30,15,.28);
  --fontSize:20px;
  --lineHeight:36px;
}

/* ---------- BASIC ---------- */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;

  background:
    radial-gradient(circle at 20% 10%,#ffffff22,transparent 30%),
    linear-gradient(135deg,#b78d60,#dfc69b 50%,#b98e60);

  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* ---------- TOP BAR ---------- */

.app{
  min-height:100vh;
  padding:10px;
}

.topbar{
  position:sticky;
  top:8px;
  z-index:100;

  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;

  padding:10px 13px;

  border-radius:17px;

  background:
    linear-gradient(
      180deg,
      #70472d,
      #4b2d1d
    );

  box-shadow:
    0 8px 22px rgba(40,20,10,.35);

  color:white;
}

.brand{
  font-size:23px;
  font-weight:bold;
  margin-right:auto;
  white-space:nowrap;
}

.topbar button{
  border:0;
  border-radius:11px;

  background:#fffaf0;
  color:#4b3020;

  padding:8px 11px;

  box-shadow:
    0 2px 5px rgba(0,0,0,.18);
}

/* ---------- DATE NAVIGATION ---------- */

.nav{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:9px;

  margin:11px auto;

  max-width:1150px;
}

.nav button,
.nav select{
  border:1px solid #c8b38d;
  background:#fff9ec;
  color:#4d3323;

  border-radius:10px;

  padding:9px 13px;
}

/* ---------- NOTEBOOK ---------- */

.notebook{
  position:relative;

  width:100%;
  max-width:1280px;

  margin:0 auto 30px;

  padding-left:0;
}

/*
  Open notebook appearance.
  The binding is deliberately visible at the left edge,
  while the paper extends almost full width.
*/

.bookPage{
  position:relative;

  height:calc(100vh - 175px);
  min-height:720px;

  overflow-y:auto;
  overflow-x:hidden;

  border-radius:
    17px
    28px
    28px
    17px;

  padding:
    0
    48px
    90px
    78px;

  background-color:var(--paper);

  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--lineHeight) - 1px),
      var(--line) var(--lineHeight)
    ),
    radial-gradient(
      rgba(80,50,20,.035) .7px,
      transparent .8px
    );

  background-size:
    100% var(--lineHeight),
    7px 7px;

  box-shadow:
    0 12px 30px var(--shadow),
    inset 0 0 45px rgba(120,90,40,.08);

  scroll-behavior:smooth;
}

/* central paper crease gives open-notebook appearance */

.bookPage:after{
  content:"";

  position:absolute;

  top:0;
  bottom:0;

  left:50%;

  width:2px;

  background:
    linear-gradient(
      transparent,
      rgba(80,50,30,.08),
      transparent
    );

  pointer-events:none;
}

/* ---------- NATURAL SPIRAL ---------- */

.spine{
  position:absolute;

  left:12px;
  top:0;
  bottom:0;

  width:48px;

  z-index:20;

  pointer-events:none;
}

.spine:before{
  content:"";

  position:absolute;

  left:19px;
  top:0;
  bottom:0;

  width:5px;

  background:
    linear-gradient(
      90deg,
      #5c402e,
      #a68b6e,
      #4b3426
    );

  border-radius:5px;

  box-shadow:
    1px 0 2px #0005;
}

/*
  Natural notebook rings
*/

.spine:after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:14px;
  bottom:14px;

  background:

    radial-gradient(
      ellipse 18px 8px at 50% 0,
      #777 0 45%,
      #282828 48% 57%,
      transparent 60%
    );

  background-size:
    40px 58px;

  background-repeat:repeat-y;

  filter:
    drop-shadow(
      1px 2px 1px rgba(0,0,0,.45)
    );
}

/* ---------- STICKY PAGE HEADER ---------- */

.pageHeader{
  position:sticky;

  top:0;

  z-index:15;

  padding:
    15px
    5px
    7px;

  background:
    linear-gradient(
      rgba(251,248,234,.98),
      rgba(251,248,234,.93) 75%,
      rgba(251,248,234,0)
    );

  backdrop-filter:blur(3px);
}

.headrow{
  display:flex;
  align-items:center;

  min-width:0;

  gap:8px;
}

.dateTitle{
  min-width:0;

  flex:1;

  font-size:
    clamp(
      25px,
      3vw,
      39px
    );

  line-height:1.08;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.pageNo{
  font-size:14px;

  color:#766555;

  white-space:nowrap;
}

/* ---------- MOOD ---------- */

.moodWrap{
  position:relative;
}

.moodButton{
  border:0;

  background:transparent;

  font-size:25px;

  padding:2px 4px;

  border-radius:8px;
}

.moodMenu{
  position:absolute;

  right:0;
  top:100%;

  display:none;

  z-index:100;

  padding:6px;

  background:#fffaf0;

  border:
    1px solid
    #c8b38e;

  border-radius:11px;

  box-shadow:
    0 8px 20px #0004;
}

.moodMenu.open{
  display:flex;

  gap:3px;
}

.moodMenu button{
  border:0;
  background:transparent;

  font-size:25px;

  padding:5px;

  border-radius:7px;
}

/* ---------- QUOTE ---------- */

.quoteRow{
  display:flex;

  align-items:center;

  gap:8px;

  height:31px;

  margin-top:3px;
}

.quote{
  flex:1;

  min-width:0;

  height:27px;

  line-height:27px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:16px;

  font-style:italic;

  padding-left:9px;

  border-left:
    4px solid
    #ad8355;
}

.quoteBtn{
  flex:none;

  border:
    1px solid
    #c2ad86;

  background:#fff9ee;

  border-radius:9px;

  padding:4px 9px;
}

/* ---------- TOOLBAR ---------- */

.toolbar{
  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:5px;

  padding:6px;

  margin:
    2px
    0
    7px;

  border:
    1px solid
    #cbb78f;

  border-radius:11px;

  background:
    rgba(247,239,217,.92);
}

.toolbar button{
  min-width:36px;

  height:35px;

  border:
    1px solid
    #c4ae86;

  border-radius:8px;

  background:#fffaf0;

  color:#493124;
}

.toolbar button:active{
  transform:scale(.97);
}

.drawTools{
  display:none;

  align-items:center;

  flex-wrap:wrap;

  gap:4px;
}

.drawTools.open{
  display:flex;
}

.drawTools button.active{
  background:#d8b477;
}

.drawClose{
  background:#9b4d32!important;
  color:#fff!important;
}

/* ---------- EDITOR ---------- */

.editorWrap{
  position:relative;

  min-height:
    calc(
      var(--lineHeight) * 22
    );
}

.editor{
  position:relative;

  z-index:2;

  min-height:
    calc(
      var(--lineHeight) * 22
    );

  outline:none;

  font-size:var(--fontSize);

  line-height:var(--lineHeight);

  white-space:pre-wrap;

  word-break:normal;

  overflow-wrap:break-word;

  padding:
    0
    5px
    100px
    4px;

  background:transparent;
}

/*
  This alignment is important:
  text baseline now sits on the ruled paper line.
*/

.editor p,
.editor div{
  margin:0;
  padding:0;
  line-height:var(--lineHeight);
}

.editor ul,
.editor ol{
  margin:0;
  padding-left:30px;
}

.editor li{
  line-height:var(--lineHeight);
  margin:0;
}

/* ---------- DRAWING ---------- */

.drawCanvas{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  z-index:5;

  background:transparent;

  touch-action:none;

  pointer-events:none;
}

.drawCanvas.enabled{
  pointer-events:auto;
}

.drawHint{
  position:absolute;

  right:10px;
  top:8px;

  z-index:7;

  display:none;

  padding:4px 8px;

  font-size:12px;

  background:#fff8e9dd;

  border:1px solid #c4ae86;

  border-radius:7px;
}

.drawHint.show{
  display:block;
}

/* ---------- NEW PAGE ---------- */

.newPage{
  position:absolute;

  right:-1px;
  top:45%;

  z-index:20;

  border:
    1px solid
    #a47a4d;

  border-right:0;

  background:
    linear-gradient(
      #f0d5a7,
      #dfbd88
    );

  color:#4d3020;

  padding:
    15px
    8px;

  border-radius:
    10px
    0
    0
    10px;

  box-shadow:
    -3px 4px 8px #0002;

  writing-mode:vertical-rl;
}

/* ---------- MODALS ---------- */

.modalBack{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  padding:14px;

  background:#0008;
}

.modalBack.open{
  display:flex;
}

.modal{
  width:min(650px,96vw);

  max-height:90vh;

  overflow:auto;

  padding:18px;

  border-radius:17px;

  background:#fffaf0;

  box-shadow:
    0 20px 50px #0007;
}

.modal h2{
  margin-top:0;
}

.form{
  display:grid;
  gap:9px;
}

.form input,
.form textarea,
.form select{
  width:100%;

  padding:9px;

  border:
    1px solid
    #c8b58e;

  border-radius:8px;

  background:white;
}

.actions{
  display:flex;

  justify-content:flex-end;

  flex-wrap:wrap;

  gap:7px;

  margin-top:13px;
}

.actions button{
  border:0;

  border-radius:9px;

  padding:9px 13px;

  background:#e4cea5;
}

.actions .primary{
  background:#654029;
  color:#fff;
}

/* ---------- CALENDAR ---------- */

.calendarHead{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;
}

.calendarGrid{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;
}

.calCell{
  min-height:55px;

  padding:5px;

  border:
    1px solid
    #d8c9aa;

  border-radius:8px;

  background:#fffdf7;

  cursor:pointer;
}

.calCell.today{
  outline:
    2px solid
    #a96f32;
}

.calCell.event{
  background:#efdfbd;
}

.eventDot{
  display:inline-block;

  width:7px;
  height:7px;

  border-radius:50%;

  margin-left:4px;

  background:#9b4b31;
}

/* ---------- TODO ---------- */

.todoAdd{
  display:flex;

  gap:6px;
}

.todoAdd input{
  flex:1;

  padding:9px;

  border:
    1px solid
    #c8b58e;

  border-radius:8px;
}

.todoList{
  max-height:45vh;

  overflow:auto;

  margin-top:10px;
}

.todoItem{
  display:flex;

  align-items:center;

  gap:8px;

  padding:8px 2px;

  border-bottom:
    1px solid
    #d8ccb5;

  line-height:1.4;
}

.todoItem span{
  flex:1;

  min-width:0;

  word-break:break-word;
}

.todoItem.done span{
  text-decoration:line-through;
  opacity:.5;
}

/* ---------- SETTINGS ---------- */

.designs{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

.design{
  height:65px;

  border:
    2px solid
    #c9b48e;

  border-radius:10px;

  cursor:pointer;
}

.design.selected{
  outline:
    3px solid
    #a96f32;
}

.design.classic{
  background:
    repeating-linear-gradient(
      #fbf8ea 0 35px,
      #d8cfb7 36px
    );
}

.design.vintage{
  background:
    repeating-linear-gradient(
      #ead8b5 0 35px,
      #c7ae86 36px
    );
}

.design.blue{
  background:
    repeating-linear-gradient(
      #edf5f4 0 35px,
      #b9d3d2 36px
    );
}

.design.green{
  background:
    repeating-linear-gradient(
      #eef1df 0 35px,
      #c7d0ae 36px
    );
}

.design.rose{
  background:
    repeating-linear-gradient(
      #f5e9e6 0 35px,
      #d9bfc0 36px
    );
}

.design.night{
  background:
    repeating-linear-gradient(
      #363d43 0 35px,
      #5d6870 36px
    );
}

/* ---------- UTILITY ---------- */

.hidden{
  display:none!important;
}

/* ---------- MOBILE ---------- */

@media(max-width:700px){

  .app{
    padding:4px;
  }

  .topbar{
    position:relative;

    border-radius:11px;

    padding:6px;
  }

  .brand{
    width:100%;

    font-size:18px;
  }

  .topbar button{
    padding:6px 8px;

    font-size:12px;
  }

  .nav{
    gap:5px;
    margin:6px auto;
  }

  .nav button,
  .nav select{
    padding:7px 8px;
    font-size:13px;
  }

  .bookPage{
    height:calc(100vh - 145px);

    min-height:600px;

    padding:
      0
      16px
      75px
      48px;

    border-radius:
      11px
      17px
      17px
      11px;
  }

  .spine{
    left:3px;
    width:38px;
  }

  .spine:before{
    left:16px;
  }

  .dateTitle{
    font-size:25px;
  }

  .pageNo{
    font-size:11px;
  }

  .quote{
    font-size:13px;
  }

  .quoteBtn{
    padding:3px 6px;
    font-size:12px;
  }

  .toolbar{
    gap:3px;
  }

  .toolbar button{
    min-width:32px;
    height:32px;
  }

  .editor{
    font-size:
      clamp(
        17px,
        4.7vw,
        19px
      );

    line-height:
      var(--lineHeight);

    min-height:
      calc(
        var(--lineHeight) * 20
      );
  }

  .newPage{
    right:-1px;
    padding:12px 7px;
  }

  .designs{
    grid-template-columns:
      repeat(2,1fr);
  }

  .calendarGrid .calCell{
    min-height:43px;
    font-size:12px;
  }

}

</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="brand">
📖 My Personal Diary
</div>

<button id="calendarBtn">📅 Calendar</button>
<button id="eventBtn">🗓️ Event</button>
<button id="memoryBtn">🖼️ Memories</button>
<button id="todoBtn">☑️ To-do</button>
<button id="drawBtn">✏️ Draw</button>
<button id="settingsBtn">⚙️ Settings</button>
<button id="printBtn">🖨️ Print</button>
<button id="backupBtn">💾 Backup</button>
<button id="restoreBtn">↩️ Restore</button>

<input
  id="restoreInput"
  type="file"
  accept=".json,application/json"
  hidden
>

</header>


<div class="nav">

<button id="prevBtn">
‹ Previous
</button>

<select id="dateSelect"></select>

<button id="nextBtn">
Next ›
</button>

</div>


<main class="notebook">

<div class="spine"></div>

<section
  class="bookPage"
  id="bookPage"
>

<header class="pageHeader">

<div class="headrow">

<div
  class="dateTitle"
  id="dateTitle"
></div>

<div class="moodWrap">

<button
  class="moodButton"
  id="moodButton"
>
🙂
</button>

<div
  class="moodMenu"
  id="moodMenu"
></div>

</div>

<div
  class="pageNo"
  id="pageNo"
>
Page 1
</div>

</div>


<div class="quoteRow">

<div
  class="quote"
  id="quoteText"
></div>

<button
  class="quoteBtn"
  id="quoteBtn"
>
💬 Quote
</button>

</div>

</header>


<div class="toolbar">

<button data-command="bold">
<b>B</b>
</button>

<button data-command="italic">
<i>I</i>
</button>

<button data-command="underline">
<u>U</u>
</button>

<button data-command="insertUnorderedList">
•
</button>

<button data-command="insertOrderedList">
1.
</button>

<button data-command="justifyLeft">
≡
</button>

<button data-command="justifyCenter">
≡
</button>

<button data-command="removeFormat">
Tx
</button>

<button id="drawToolbarButton">
✏️
</button>


<div
  class="drawTools"
  id="drawTools"
>

<button data-tool="pen">
✎ Pen
</button>

<button data-tool="line">
╱ Line
</button>

<button data-tool="circle">
◯ Circle
</button>

<button data-tool="eraser">
⌫ Eraser
</button>

<button id="drawUndo">
↶
</button>

<button id="drawRedo">
↷
</button>

<button id="drawClear">
Clear
</button>

<button
  id="drawClose"
  class="drawClose"
>
Close
</button>

</div>

</div>


<div
  class="editorWrap"
  id="editorWrap"
>

<div
  class="drawHint"
  id="drawHint"
>
Draw mode
</div>

<div
  id="editor"
  class="editor"
  contenteditable="true"
  spellcheck="true"
></div>

<canvas
  id="drawCanvas"
  class="drawCanvas"
></canvas>

</div>


<button
  id="newPageBtn"
  class="newPage"
>
＋ New Page
</button>

</section>

</main>

</div>


<!-- CALENDAR -->

<div
  class="modalBack"
  id="calendarModal"
>

<div class="modal">

<div class="calendarHead">

<h2>📅 Diary Calendar</h2>

<button data-close="calendarModal">
Close
</button>

</div>

<div class="calendarHead">

<button id="calPrev">
‹
</button>

<h3 id="calTitle"></h3>

<button id="calNext">
›
</button>

</div>

<div
  class="calendarGrid"
  id="calendarGrid"
></div>

<div id="calendarEvents"></div>

</div>

</div>


<!-- EVENT -->

<div
  class="modalBack"
  id="eventModal"
>

<div class="modal">

<h2>
🗓️ Diary Event
</h2>

<p
  id="eventPastMessage"
  class="hidden"
>
Events cannot be added to a previous date.
</p>

<div class="form">

<input
  id="eventTitle"
  placeholder="Event title"
>

<input
  id="eventDate"
  type="date"
>

<input
  id="eventTime"
  type="time"
>

<textarea
  id="eventNotes"
  rows="3"
  placeholder="Notes"
></textarea>

</div>

<div id="eventList"></div>

<div class="actions">

<button data-close="eventModal">
Close
</button>

<button
  id="saveEvent"
  class="primary"
>
Save Event
</button>

</div>

</div>

</div>


<!-- TODO -->

<div
  class="modalBack"
  id="todoModal"
>

<div class="modal">

<h2>
☑️ To-do List
</h2>

<p
  id="todoPastMessage"
  class="hidden"
>
Previous-date To-do items cannot be changed.
</p>

<div class="todoAdd">

<input
  id="todoText"
  placeholder="New task"
>

<button
  id="addTodo"
  class="primary"
>
Add
</button>

</div>

<div
  id="todoList"
  class="todoList"
></div>

<div class="actions">

<button data-close="todoModal">
Close
</button>

</div>

</div>

</div>


<!-- MEMORIES -->

<div
  class="modalBack"
  id="memoryModal"
>

<div class="modal">

<h2>
🖼️ Memories
</h2>

<input
  id="memoryInput"
  type="file"
  accept="image/*,application/pdf,.doc,.docx,.txt"
  multiple
>

<div id="memoryList"></div>

<div class="actions">

<button data-close="memoryModal">
Close
</button>

</div>

</div>

</div>


<!-- SETTINGS -->

<div
  class="modalBack"
  id="settingsModal"
>

<div class="modal">

<h2>
⚙️ Diary Settings
</h2>

<h3>
Page Design
</h3>

<div class="designs">

<div
  class="design classic"
  data-design="classic"
></div>

<div
  class="design vintage"
  data-design="vintage"
></div>

<div
  class="design blue"
  data-design="blue"
></div>

<div
  class="design green"
  data-design="green"
></div>

const DB_NAME = "myPersonalDiaryDB";
const DB_VERSION = 8;

let saveTimer = null;


/* =========================================================
   DATE
========================================================= */

function localISO(date = new Date()){

  const d =
    new Date(
      date.getTime() -
      date.getTimezoneOffset()*60000
    );

  return d.toISOString().slice(0,10);
}

function today(){

  return localISO();

}

function isPastDate(){

  return currentDate < today();

}

function formatDate(iso){

  return new Date(
    iso+"T12:00:00"
  ).toLocaleDateString(
    undefined,
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


/* =========================================================
   DATABASE
========================================================= */

function openDB(){

 return new Promise(
  (resolve,reject)=>{

   const request =
     indexedDB.open(
       DB_NAME,
       DB_VERSION
     );

   request.onupgradeneeded =
     event => {

       const database =
         event.target.result;

       if(
         !database.objectStoreNames.contains(
           "pages"
         )
       ){

         const store =
           database.createObjectStore(
             "pages",
             {keyPath:"id"}
           );

         store.createIndex(
           "date",
           "date"
         );

       }

       if(
         !database.objectStoreNames.contains(
           "events"
         )
       ){

         const store =
           database.createObjectStore(
             "events",
             {
               keyPath:"id",
               autoIncrement:true
             }
           );

         store.createIndex(
           "date",
           "date"
         );

       }

       if(
         !database.objectStoreNames.contains(
           "todos"
         )
       ){

         const store =
           database.createObjectStore(
             "todos",
             {
               keyPath:"id",
               autoIncrement:true
             }
           );

         store.createIndex(
           "date",
           "date"
         );

       }

       if(
         !database.objectStoreNames.contains(
           "attachments"
         )
       ){

         const store =
           database.createObjectStore(
             "attachments",
             {
               keyPath:"id",
               autoIncrement:true
             }
           );

         store.createIndex(
           "date",
           "date"
         );

       }

     };

   request.onsuccess =
     () => {

       db =
         request.result;

       resolve(db);

     };

   request.onerror =
     () => reject(request.error);

  }
 );

}


function store(name,mode="readonly"){

 return db
   .transaction(
     name,
     mode
   )
   .objectStore(name);

}


function getRecord(name,key){

 return new Promise(
  (resolve,reject)=>{

   const r =
     store(name).get(key);

   r.onsuccess =
     () => resolve(r.result);

   r.onerror =
     () => reject(r.error);

  }
 );

}


function saveRecord(name,data){

 return new Promise(
  (resolve,reject)=>{

   const r =
     store(
       name,
       "readwrite"
     ).put(data);

   r.onsuccess =
     () => resolve(r.result);

   r.onerror =
     () => reject(r.error);

  }
 );

}


function getAll(name){

 return new Promise(
  (resolve,reject)=>{

   const r =
     store(name).getAll();

   r.onsuccess =
     () => resolve(r.result);

   r.onerror =
     () => reject(r.error);

  }
 );

}


function deleteRecord(name,key){

 return new Promise(
  (resolve,reject)=>{

   const r =
     store(
       name,
       "readwrite"
     ).delete(key);

   r.onsuccess =
     () => resolve();

   r.onerror =
     () => reject(r.error);

  }
 );

}

/* =========================================================
   DRAWING
========================================================= */

const canvas =
  document.getElementById(
    "drawCanvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

const editorWrap =
  document.getElementById(
    "editorWrap"
  );

let drawing=false;
let drawTool="pen";
let startX=0;
let startY=0;
let baseImage=null;


/*
  Canvas is transparent and lives
  directly over the writing page.
*/

function resizeCanvas(){

 const rect =
   editorWrap
     .getBoundingClientRect();

 const old =
   document.createElement(
     "canvas"
   );

 old.width =
   canvas.width;

 old.height =
   canvas.height;

 if(
   old.width &&
   old.height
 ){

   old
     .getContext("2d")
     .drawImage(
       canvas,
       0,
       0
     );

 }

 const ratio =
   window.devicePixelRatio || 1;

 canvas.width =
   rect.width*
   ratio;

 canvas.height =
   rect.height*
   ratio;

 canvas.style.width =
   rect.width+"px";

 canvas.style.height =
   rect.height+"px";

 ctx.setTransform(
   ratio,
   0,
   0,
   ratio,
   0,
   0
 );

 if(
   old.width
 ){

   ctx.drawImage(
     old,
     0,
     0,
     old.width/ratio,
     old.height/ratio
   );

 }

}


function clearCanvas(){

 ctx.clearRect(
   0,
   0,
   canvas.clientWidth,
   canvas.clientHeight
 );

}


async function loadDrawing(){

 resizeCanvas();

 clearCanvas();

 if(
   pageRecord &&
   pageRecord.drawing
 ){

   const image =
     new Image();

   image.onload =
     () => {

       ctx.drawImage(
         image,
         0,
         0,
         canvas.clientWidth,
         canvas.clientHeight
       );

     };

   image.src =
     pageRecord.drawing;

 }

}


function saveDrawing(){

 pageRecord.drawing =
   canvas.toDataURL(
     "image/png"
   );

 return saveRecord(
   "pages",
   pageRecord
 );

}


function getPoint(event){

 const r =
   canvas.getBoundingClientRect();

 return {

   x:
     event.clientX-r.left,

   y:
     event.clientY-r.top

 };

}


function startDrawing(event){

 if(!drawing)
   return;

 const p =
   getPoint(event);

 startX=p.x;
 startY=p.y;

 canvas.setPointerCapture(
   event.pointerId
 );

 if(
   drawTool==="pen" ||
   drawTool==="eraser"
 ){

   ctx.beginPath();

   ctx.moveTo(
     p.x,
     p.y
   );

 }

}


function moveDrawing(event){

 if(
   !drawing ||
   drawTool==="line" ||
   drawTool==="circle"
 )
   return;

 const p =
   getPoint(event);

 ctx.lineCap="round";
 ctx.lineJoin="round";

 if(
   drawTool==="eraser"
 ){

   ctx.globalCompositeOperation =
     "destination-out";

   ctx.lineWidth=38;

 }else{

   ctx.globalCompositeOperation =
     "source-over";

   ctx.lineWidth=3;

   ctx.strokeStyle="#21170f";

 }

 ctx.lineTo(
   p.x,
   p.y
 );

 ctx.stroke();

 event.preventDefault();

}


function finishDrawing(event){

 if(!drawing)
   return;

 const p =
   getPoint(event);

 /*
   Line and circle are drawn once,
   avoiding the previous disappearing/race problem.
 */

 if(
   drawTool==="line"
 ){

   ctx.globalCompositeOperation =
     "source-over";

   ctx.strokeStyle="#21170f";

   ctx.lineWidth=3;

   ctx.lineCap="round";

   ctx.beginPath();

   ctx.moveTo(
     startX,
     startY
   );

   ctx.lineTo(
     p.x,
     p.y
   );

   ctx.stroke();

 }


 if(
   drawTool==="circle"
 ){

   ctx.globalCompositeOperation =
     "source-over";

   ctx.strokeStyle="#21170f";

   ctx.lineWidth=3;

   const cx =
     (startX+p.x)/2;

   const cy =
     (startY+p.y)/2;

   const rx =
     Math.abs(
       p.x-startX
     )/2;

   const ry =
     Math.abs(
       p.y-startY
     )/2;

   ctx.beginPath();

   ctx.ellipse(
     cx,
     cy,
     Math.max(rx,3),
     Math.max(ry,3),
     0,
     0,
     Math.PI*2
   );

   ctx.stroke();

 }

 drawing=false;

 ctx.globalCompositeOperation =
   "source-over";

 saveDrawing();

 event.preventDefault();

}


canvas.addEventListener(
  "pointerdown",
  event => {

    if(!drawing)
      return;

    startDrawing(event);

  }
);


canvas.addEventListener(
  "pointermove",
  moveDrawing
);


canvas.addEventListener(
  "pointerup",
  finishDrawing
);


canvas.addEventListener(
  "pointercancel",
  finishDrawing
);


/*
  Open Draw.
  The canvas stays on the page.
*/

function openDraw(){

 drawing=true;

 canvas.classList.add(
   "enabled"
 );

   .getElementById(
     "drawHint"

/*
  Close Draw only disables drawing.
  It NEVER clears the canvas.
*/

function closeDraw(){

 drawing=false;

 canvas.classList.remove(
   "enabled"
 );

 document
   .getElementById(
     "drawHint"
   )
   .classList
   .remove(
     "show"
   );

 document
   .getElementById(
     "drawTools"
   )
   .classList
   .remove(
     "open"
   );

 saveDrawing();

}


/*
  Selecting a drawing tool:
  - activates the tool
  - keeps drawing active
  - immediately hides the toolbar
*/

document

            .add("enabled");

          document
            .getElementById(
              "drawTools"
            )
            .classList
            .remove(
              "open"
            );

        };

    }
  );


document

  )
  .onclick =
    openDraw;


document

  )
  .onclick =
    () => {

document

document

async function renderEvents(){

   await getAll(
     "events"
   );

 const events =
   all
     .filter(
       e =>
         e.date===
         currentDate
     )
     .sort(
       (a,b) =>
         (a.time||"")
         .localeCompare(
           b.time||""
         )
     );

 const list =
   document
     .getElementById(
       "eventList"
     );

 list.innerHTML =
   events.length
   ?
   events.map(
     e => `

       <div class="todoItem">

         <span>
           🗓️
           <b>${escapeHTML(e.title)}</b>
           ${e.time||""}
           ${e.notes
             ? " — "+escapeHTML(e.notes)
             : ""}
         </span>

         ${
           !isPastDate()
           ?
           `<button
              onclick="deleteEvent(${e.id})"
            >
             Delete
            </button>`
           :
           ""
         }

       </div>

     `
   ).join("")
   :
   "<p>No events for this date.</p>";

}


async function deleteEvent(id){

 if(isPastDate())
   return;

 await deleteRecord(
   "events",
   id
 );

 await renderEvents();
 await renderCalendar();

}


document
  .getElementById(
    "eventDate"
  )
  .value =
    currentDate;


document
  .getElementById(
    "saveEvent"
  )
  .onclick =
    async () => {

      if(isPastDate())
        return;

      const title =
        document
          .getElementById(
            "eventTitle"
          )
          .value
          .trim();

      if(!title){

        alert(
          "Please enter an event title."
        );

        return;

      }

      const eventDate =
        document
          .getElementById(
            "eventDate"
          )
          .value ||
        currentDate;

      if(
        eventDate <
        today()
      ){

        alert(
          "Events cannot be added to a previous date."
        );

        return;

      }

      await saveRecord(
        "events",
        {
          date:eventDate,

          time:
            document
              .getElementById(
                "eventTime"
              )
              .value,

          title:title,

          notes:
            document
              .getElementById(
                "eventNotes"
              )
              .value

        }
      );

      document
        .getElementById(
          "eventTitle"
        )
        .value="";

      document
        .getElementById(
          "eventNotes"
        )
        .value="";

      await renderEvents();

      await renderCalendar();

    };


/* =========================================================
   CALENDAR
========================================================= */

let calendarDate =
  new Date();


async function renderCalendar(){

 const year =
   calendarDate
     .getFullYear();

 const month =
   calendarDate
     .getMonth();

 document
   .getElementById(
     "calTitle"
   )
   .textContent =
     calendarDate.toLocaleDateString(
       undefined,
       {
         month:"long",
         year:"numeric"
       }
     );

 const events =
   await getAll(
     "events"
   );

 const grid =
   document
     .getElementById(
       "calendarGrid"
     );

 grid.innerHTML="";

 [
   "Sun",
   "Mon",
   "Tue",
   "Wed",
   "Thu",
   "Fri",
   "Sat"
 ].forEach(
   day => {

     const h =
       document.createElement(
         "div"
       );

     h.textContent=day;

     h.style.fontWeight="bold";

     grid.appendChild(h);

   }
 );

 const firstDay =
   new Date(
     year,
     month,
     1
   ).getDay();

 const days =
   new Date(
     year,
     month+1,
     0
   ).getDate();

 for(
   let i=0;
   i<firstDay;
   i++
 ){

   const blank =
     document.createElement(
       "div"
     );

   grid.appendChild(
     blank
   );

 }

 for(
   let day=1;
   day<=days;
   day++
 ){

   const iso =
     localISO(
       new Date(
         year,
         month,
         day
       )
     );

   const hasEvent =
     events.some(
       e =>
         e.date===iso
     );

   const cell =
     document.createElement(
       "div"
     );

   cell.className =
     "calCell";

   if(
     iso===today()
   )
     cell.classList.add(
       "today"
     );

   if(hasEvent)
     cell.classList.add(
       "event"
     );

   cell.innerHTML =
     "<b>"+
     day+
     "</b>"+
     (
       hasEvent
       ?
       '<span class="eventDot"></span>'
       :
       ""
     );

   cell.onclick =
     async () => {

       await goDate(
         iso
       );

       closeModal(
         "calendarModal"
       );

     };

   grid.appendChild(
     cell
   );

 }

 const monthEvents =
   events.filter(
     e =>
       e.date.startsWith(
         year+
         "-"+
         String(
           month+1
         ).padStart(
           2,
           "0"
         )
       )
   );

 document
   .getElementById(
     "calendarEvents"
   )
   .innerHTML =
     monthEvents.length
     ?
     monthEvents
       .sort(
         (a,b) =>
           a.date.localeCompare(
             b.date
           )
       )
       .map(
         e =>
           `<p>
             🗓️
             <b>${e.date}</b>
             ${e.time||""}
             —
             ${escapeHTML(e.title)}
           </p>`
       )
       .join("")
     :
     "<p>No diary events this month.</p>";

}


document
  .getElementById(
    "calPrev"
  )
  .onclick =
    () => {

      calendarDate.setMonth(
        calendarDate.getMonth()-1
      );

      renderCalendar();

    };


document
  .getElementById(
    "calNext"
  )
  .onclick =
    () => {

      calendarDate.setMonth(
        calendarDate.getMonth()+1
      );

      renderCalendar();

    };


/* =========================================================
   TODO
========================================================= */

async function renderTodos(){

 const todos =
   (
     await getAll(
       "todos"
     )
   )
   .filter(
     x =>
       x.date===
       currentDate
   );

 const list =
   document
     .getElementById(
       "todoList"
     );

 if(!todos.length){

   list.innerHTML =
     "<p>No tasks for this date.</p>";

   return;

 }

 list.innerHTML =
   todos
     .map(
       item => `

       <div
         class="todoItem
         ${item.done?"done":""}"
       >

         <input
           type="checkbox"
           ${item.done?"checked":""}
           ${isPastDate()?"disabled":""}
           onchange="
             toggleTodo(
               ${item.id},
               this.checked
             )
           "
         >

         <span>
           ${escapeHTML(item.text)}
         </span>

         ${
           !isPastDate()
           ?
           `<button
              onclick="
                deleteTodo(
                  ${item.id}
                )
              "
            >
              ×
            </button>`
           :
           ""
         }

       </div>

     `
     )
     .join("");

}


document
  .getElementById(
    "addTodo"
  )
  .onclick =
    async () => {

      if(isPastDate())
        return;

      const input =
        document
          .getElementById(
            "todoText"
          );

      const text =
        input.value.trim();

      if(!text)
        return;

      await saveRecord(
        "todos",
        {
          date:currentDate,

          text:text,

          done:false
        }
      );

      input.value="";

      await renderTodos();

    };


async function toggleTodo(
  id,
  done
){

 if(isPastDate())
   return;

 const item =
   await getRecord(
     "todos",
     id
   );

 if(!item)
   return;

 item.done =
   done;

 await saveRecord(
   "todos",
   item
 );

 await renderTodos();

}


async function deleteTodo(id){

 if(isPastDate())
   return;

 await deleteRecord(
   "todos",
   id
 );

 await renderTodos();

}

========================================================= */

async function renderMemories(){

 const memories =
   (
     await getAll(
       "attachments"
     )
   )
   .filter(
     x =>
       x.date===
       currentDate
   );

 document
   .getElementById(
     "memoryList"
   )
   .innerHTML =
     memories.length
     ?
     memories
       .map(
         m =>
           `<div class="todoItem">
             <span>
               ${escapeHTML(m.name)}
             </span>

             <button
               onclick="
                 deleteMemory(
                   ${m.id}
                 )
               "
             >
               Delete
             </button>

           </div>`
       )
       .join("")
     :
     "<p>No memories attached.</p>";

}


document
  .getElementById(
    "memoryInput"
  )
  .onchange =
    event => {

      [...event.target.files]
        .forEach(
          file => {

            const reader =
              new FileReader();

            reader.onload =
              async () => {

                await saveRecord(
                  "attachments",
                  {
                    date:currentDate,

                    name:file.name,

                    type:file.type,

                    data:
                      reader.result
                  }
                );

                renderMemories();

              };

            reader.readAsDataURL(
              file
            );

          }
        );

      event.target.value="";

    };


async function deleteMemory(id){

 await deleteRecord(
   "attachments",
   id
 );

 renderMemories();

}

/* =========================================================
   BACKUP
========================================================= */

document
  .getElementById(
    "backupBtn"
  )
  .onclick =
    async () => {

      await savePage();

      const data = {

        version:8,

        pages:
          await getAll(
            "pages"
          ),

        events:
          await getAll(
            "events"
          ),

        todos:
          await getAll(
            "todos"
          ),

        attachments:
          await getAll(
            "attachments"
          ),

        settings:{

          fontSize:
            localStorage.getItem(
              "fontSize"
            ),

          lineHeight:
            localStorage.getItem(
              "lineHeight"
            ),

          pageWidth:
            localStorage.getItem(
              "pageWidth"
            )

        }

      };

      const blob =
        new Blob(
          [
            JSON.stringify(
              data
            )
          ],
          {
            type:
              "application/json"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const a =
        document.createElement(
          "a"
        );

      a.href=url;

      a.download =
        "my-personal-diary-backup.json";

      a.click();

      URL.revokeObjectURL(
        url
      );

    };


/* =========================================================
   RESTORE
========================================================= */

document
  .getElementById(
    "restoreBtn"
  )
  .onclick =
    () =>
      document
        .getElementById(
          "restoreInput"
        )
        .click();


document
  .getElementById(
    "restoreInput"
  )
  .onchange =
    async event => {

      const file =
        event.target.files[0];

      if(!file)
        return;

      try{

        const data =
          JSON.parse(
            await file.text()
          );

        for(
          const item
          of
          data.pages || []
        )
          await saveRecord(
            "pages",
            item
          );

        for(
          const item
          of
          data.events || []
        )
          await saveRecord(
            "events",
            item
          );

        for(
          const item
          of
          data.todos || []
        )
          await saveRecord(
            "todos",
            item
          );

        for(
          const item
          of
          data.attachments || []
        )
          await saveRecord(
            "attachments",
            item
          );

        if(data.settings){

          Object.entries(
            data.settings
          ).forEach(
            ([key,value]) => {

              if(value!==null)
                localStorage.setItem(
                  key,
                  value
                );

            }
          );

        }

        await renderPage();

        alert(
          "Diary restored successfully."
        );

      }catch(error){

        alert(
          "Invalid diary backup."
        );

      }

      event.target.value="";

    };


/* =========================================================
   EVENT ALERT
========================================================= */

setInterval(
  async () => {

    const events =
      await getAll(
        "events"
      );

    const now =
      new Date();

    const currentTime =
      now.toTimeString()
        .slice(0,5);

    events
      .filter(
        e =>
          e.date===
          today() &&
          e.time===
          currentTime
      )
      .forEach(
        e => {

          const key =
            "diaryAlert-"+
            e.id+
            "-"+
            today();

          if(
            !sessionStorage.getItem(
              key
            )
          ){

            sessionStorage.setItem(
              key,
              "1"
            );

            alert(
              "🗓️ Diary Event\n\n"+
              e.title+
              (
                e.notes
                ?
                "\n\n"+
                e.notes
                :
                ""
              )
            );

          }

        }
      );

  },
  30000
);


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

 return String(
   value ?? ""
 )
 .replace(
   /[&<>"']/g,
   character => ({
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#039;"
   })[character]
 );

}
