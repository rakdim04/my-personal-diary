<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b402b">
<link rel="manifest" href="manifest.json">
<title>My Personal Diary v8.5</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 background:#d8d0c4;
 color:#33281f;
 font-family:Georgia,"Times New Roman",serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

.app{min-height:100vh}

/* TOP BAR */
.topbar{
 position:sticky;
 top:0;
 z-index:1000;
 background:#5b402b;
 color:white;
 padding:8px 10px;
 box-shadow:0 3px 12px #0005;
}

.toprow{
 display:flex;
 align-items:center;
 gap:6px;
 max-width:1250px;
 margin:auto;
 overflow-x:auto;
 scrollbar-width:none;
}

.toprow::-webkit-scrollbar{display:none}

.toprow button{
 border:1px solid #ffffff55;
 background:#76573c;
 color:white;
 border-radius:7px;
 padding:8px 10px;
 white-space:nowrap;
}

.brand{
 font-weight:bold;
 font-size:18px;
 margin-right:auto;
 white-space:nowrap;
}

/* BOOK */
.workspace{
 max-width:1280px;
 margin:auto;
 padding:14px 10px 40px;
}

.book{
 position:relative;
 display:flex;
 min-height:calc(100vh - 90px);
 filter:drop-shadow(0 10px 18px #0002);
}

/* SPIRAL / SPINE */
.spine{
 width:54px;
 flex:0 0 54px;
 background:linear-gradient(
   90deg,
   #493221,
   #76543a 35%,
   #3f2b1e 70%,
   #6e4c34
 );
 border-radius:18px 0 0 18px;
 position:relative;
 overflow:hidden;
}

.spine:after{
 content:"";
 position:absolute;
 inset:0;
 background:
 repeating-radial-gradient(
   ellipse at 35% 18px,
   transparent 0 8px,
   #1e130c 9px 11px,
   transparent 12px 24px
 );
 opacity:.9;
}

/* PAGE */
.page{
 position:relative;
 flex:1;
 min-width:0;
 min-height:calc(100vh - 90px);
 border-radius:0 12px 12px 0;
 padding:0 22px 50px;
 background-color:#fffdf4;
 background-image:
   repeating-linear-gradient(
     to bottom,
     transparent 0,
     transparent 31px,
     #b8d2e4 32px,
     #b8d2e4 33px
   );
 overflow:hidden;
}

.page.classic{background-color:#fffdf4}
.page.vintage{background-color:#f5e6c8}
.page.blue{background-color:#eef7ff}
.page.green{background-color:#eff8ee}
.page.rose{background-color:#fff1f4}
.page.night{
 background-color:#292726;
 color:#eee;
 background-image:
 repeating-linear-gradient(
   to bottom,
   transparent 0,
   transparent 31px,
   #555 32px,
   #555 33px
 );
}

/* STICKY HEADER */
.pageHeader{
 position:sticky;
 top:0;
 z-index:50;
 margin:0 -22px 6px;
 padding:9px 14px 5px;
 background:#fffdf4ee;
 backdrop-filter:blur(7px);
 border-bottom:1px solid #8c765c55;
}

.night .pageHeader{
 background:#292726ee;
}

.headerLine{
 display:flex;
 align-items:center;
 gap:8px;
 min-height:30px;
}

.dateTitle{
 font-weight:bold;
 font-size:18px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.moodMark{
 font-size:19px;
 min-width:20px;
}

.quote{
 font-size:13px;
 font-style:italic;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 max-width:75%;
}

.headerActions{
 margin-left:auto;
 display:flex;
 gap:4px;
}

.headerActions button{
 border:0;
 background:#ffffff88;
 border-radius:6px;
 padding:5px 7px;
}

/* FORMATTING TOOLBAR */
.toolbar{
 position:sticky;
 top:62px;
 z-index:49;
 display:flex;
 align-items:center;
 gap:4px;
 flex-wrap:wrap;
 background:#f7f0e4ee;
 border:1px solid #9d836566;
 border-radius:8px;
 padding:5px;
 margin:0 0 9px;
}

.night .toolbar{
 background:#393635ee;
}

.toolbar button{
 min-width:34px;
 border:1px solid #987d64;
 background:#fffaf1;
 border-radius:6px;
 padding:6px 8px;
}

.night .toolbar button{
 background:#444;
 color:white;
 border-color:#777;
}

.toolbar .sep{
 width:1px;
 height:25px;
 background:#987d64;
 margin:0 2px;
}

.drawtools{
 display:flex;
 gap:4px;
 flex-wrap:wrap;
}

.drawtools button.active{
 outline:2px solid #b24d2b;
}

/* EDITOR */
.pagesBar{
 display:flex;
 gap:5px;
 overflow:auto;
 margin:8px 0;
}

.pagesBar button{
 border:1px solid #92765c;
 background:#fff7e9;
 border-radius:5px;
 padding:5px 9px;
}

.pagesBar button.active{
 background:#6b4f36;
 color:white;
}

.editorWrap{
 position:relative;
 min-height:720px;
}

.editor{
 min-height:720px;
 outline:0;
 padding:1px 8px 40px 4px;
 font-family:"Segoe Print","Comic Sans MS",cursive;
 font-size:18px;
 line-height:32px;
 white-space:pre-wrap;
 word-break:break-word;
 caret-color:#492e20;
}

.editor:empty:before{
 content:"Write your diary here...";
 color:#8e7d6b;
 pointer-events:none;
}

.night .editor{color:#eee}

.editor ul,
.editor ol{
 margin-top:0;
 margin-bottom:0;
 padding-left:30px;
}

.editor li{
 line-height:32px;
}

/* DRAWING */
.drawCanvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 z-index:20;
 pointer-events:none;
}

.drawing .drawCanvas{
 pointer-events:auto;
}

.newPageTab{
 position:absolute;
 right:8px;
 bottom:12px;
 z-index:40;
 border:1px solid #8b6b4e;
 background:#ead5b9;
 border-radius:7px;
 padding:8px 12px;
}

/* MODALS */
.modal{
 position:fixed;
 inset:0;
 z-index:2000;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:14px;
}

.modalBox{
 background:#fffaf0;
 color:#34271e;
 width:min(720px,96vw);
 max-height:90vh;
 overflow:auto;
 border-radius:12px;
 padding:16px;
 box-shadow:0 15px 45px #0006;
}

.modalBox h2{margin-top:0}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:4px;
 margin:7px 0;
}

.field input,
.field textarea,
.field select{
 border:1px solid #b29b82;
 border-radius:6px;
 padding:8px;
 background:#fff;
}

.field textarea{min-height:80px}

.modalActions{
 display:flex;
 justify-content:flex-end;
 gap:7px;
 margin-top:12px;
}

.modalActions button{
 padding:8px 12px;
 border-radius:7px;
 border:1px solid #94765b;
 background:#f0e0ca;
}

/* CALENDAR */
.calendarHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.calGrid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
 margin-top:8px;
}

.calCell{
 min-height:70px;
 border:1px solid #cdbba5;
 border-radius:6px;
 background:#fff;
 padding:5px;
 position:relative;
 text-align:left;
}

.calCell.today{
 outline:2px solid #7c5436;
}

.calEvent{
 display:block;
 font-size:11px;
 background:#ead2b5;
 border-radius:3px;
 padding:2px;
 margin-top:2px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

/* MEMORY */
.memoryGrid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
 gap:10px;
}

.memory{
 border:1px solid #c7b299;
 border-radius:8px;
 padding:6px;
 background:#fff;
}

.memory img{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:5px;
}

/* TODO */
.todoRow{
 display:flex;
 gap:8px;
 align-items:center;
 padding:7px;
 border-bottom:1px solid #ddcdb9;
}

.todoRow span{flex:1}

.done{
 text-decoration:line-through;
 opacity:.55;
}

/* SETTINGS */
.designs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.design{
 border:2px solid transparent;
 border-radius:8px;
 padding:18px;
 text-align:center;
}

.design.sel{
 border-color:#7b4d2d;
}

.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 z-index:3000;
 background:#4d3524;
 color:white;
 padding:10px 16px;
 border-radius:20px;
 box-shadow:0 5px 20px #0005;
}

/* MOBILE */
@media(max-width:700px){

 .workspace{
  padding:5px 3px 25px;
 }

 .spine{
  width:30px;
  flex-basis:30px;
 }

 .page{
  padding:0 10px 45px;
 }

 .pageHeader{
  margin:0 -10px 5px;
  padding-left:8px;
  padding-right:8px;
 }

 .toolbar{
  top:57px;
 }

 .editor{
  font-size:17px;
 }

 .grid2{
  grid-template-columns:1fr;
 }

 .calCell{
  min-height:58px;
  font-size:12px;
 }

 .calEvent{
  font-size:9px;
 }

 .brand{
  font-size:15px;
 }

 .toprow button{
  padding:7px 8px;
 }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
<div class="toprow">

<div class="brand">📖 My Diary</div>

<button id="calendarBtn">📅 Calendar</button>
<button id="eventsBtn">📌 Events</button>
<button id="todoBtn">☑ To-Do</button>
<button id="memoryBtn">🖼 Memories</button>
<button id="settingsBtn">⚙ Settings</button>
<button id="backupBtn">💾 Backup</button>
<button id="restoreBtn">↩ Restore</button>

<input id="restoreInput" type="file" accept=".json" hidden>

<button id="printBtn">🖨 Print</button>

</div>
</header>

<main class="workspace">

<div class="book">

<div class="spine"></div>

<section id="page" class="page classic">

<div class="pageHeader">

<div class="headerLine">

<div id="dateTitle" class="dateTitle"></div>

<span id="moodMark" class="moodMark"></span>

<div class="headerActions">

<button id="prevDay">‹</button>
<button id="todayBtn">Today</button>
<button id="nextDay">›</button>

</div>

</div>

<div class="headerLine">

<div id="quote" class="quote"></div>

<button id="changeQuote">↻</button>

</div>

</div>


<!-- FIXED B/I/U/DRAW TOOLBAR -->

<div class="toolbar" id="toolbar">

<button data-cmd="bold"><b>B</b></button>

<button data-cmd="italic"><i>I</i></button>

<button data-cmd="underline"><u>U</u></button>

<button data-cmd="insertUnorderedList">• List</button>

<button data-cmd="insertOrderedList">1. List</button>

<button data-cmd="justifyLeft">≡</button>

<button data-cmd="justifyCenter">≡</button>

<button data-cmd="removeFormat">Clear</button>

<span class="sep"></span>

<button data-draw="pen">Pen</button>
<button data-draw="line">Line</button>

<button data-draw="redo">↷</button>

</div>

</div>


<div class="pagesBar" id="pagesBar"></div>


<div class="editorWrap" id="editorWrap">

<div
 id="editor"
 class="editor"
 contenteditable="true"
 spellcheck="true">
</div>

<canvas id="drawCanvas" class="drawCanvas"></canvas>

</div>


<button class="newPageTab" id="newPageBtn">
＋ New Page
</button>

</section>

</div>

</main>

</div>


<div id="modal" class="modal" hidden>

<div class="modalBox" id="modalBox"></div>

</div>


<div id="toast" class="toast" hidden></div>


<script>

const DB="myPersonalDiaryDB";
const VER=6;

let db;
let currentDate=isoToday();
let currentPage=1;
let currentPageId="";
let currentRec=null;

let drawMode=false;
let drawTool="pen";
let drawing=false;

let sx=0;
let sy=0;
let ox=0;
let oy=0;

let history=[];
let future=[];

const $=id=>document.getElementById(id);


const quotes=[
 "Write it down. Remember it forever.",
 "Small moments become great memories.",
 "A day worth living is a day worth remembering.",
 "Your story deserves a page.",
 "Gratitude turns ordinary days into memories.",
 "Begin where you are."
];


function isoToday(){

 return new Date().toISOString().slice(0,10);

}


function esc(s){

 return String(s??"").replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m])
 );

}


function fmtDate(d){

 return new Date(d+"T12:00:00").toLocaleDateString(
  undefined,
  {
   weekday:"short",
   day:"2-digit",
   month:"short",
   year:"numeric"
  }
 );

}


function addDays(d,n){

 let x=new Date(d+"T12:00:00");

 x.setDate(x.getDate()+n);

 return x.toISOString().slice(0,10);

}


function toast(t){

 const el=$("toast");

 el.textContent=t;

 el.hidden=false;

 clearTimeout(toast.timer);

 toast.timer=setTimeout(
  ()=>el.hidden=true,
  2200
 );

}


/* DATABASE */

function openDB(){

 return new Promise((resolve,reject)=>{

  const request=indexedDB.open(DB,VER);

  request.onupgradeneeded=e=>{

   const database=e.target.result;

   const stores=[
    ["pages","id"],
    ["events","id"],
    ["todos","id"],
    ["attachments","id"],
    ["settings","key"]
   ];

   stores.forEach(([name,key])=>{

    if(!database.objectStoreNames.contains(name)){

     database.createObjectStore(
      name,
      {
       keyPath:key,
       autoIncrement:name!=="settings"
      }
     );

    }

   });

  };

  request.onsuccess=()=>{

   db=request.result;

   resolve(db);

  };

  request.onerror=()=>reject(request.error);

 });

}


function req(store,mode="readonly"){

 return db
  .transaction(store,mode)
  .objectStore(store);

}


function put(store,value){

 return new Promise((resolve,reject)=>{

  const r=req(store,"readwrite").put(value);

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}


function get(store,key){

 return new Promise((resolve,reject)=>{

  const r=req(store).get(key);

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}


function all(store){

 return new Promise((resolve,reject)=>{

  const r=req(store).getAll();

  r.onsuccess=()=>resolve(r.result);

  r.onerror=()=>reject(r.error);

 });

}


function del(store,key){

 return new Promise((resolve,reject)=>{

  const r=req(store,"readwrite").delete(key);

  r.onsuccess=()=>resolve();

  r.onerror=()=>reject(r.error);

 });

}


/* OLD VERSION MIGRATION */

async function migrateOld(){

 const old=localStorage.getItem("myPersonalDiaryEntries");

 if(!old)return;

 try{

  const obj=JSON.parse(old);

  for(const [date,value] of Object.entries(obj)){

   const id=date+"-1";

   if(!await get("pages",id)){

    await put(
     "pages",
     {
      id:id,
      date:date,
      page:1,
      content:
       typeof value==="string"
        ?value
        :(value.content||""),
      drawing:null,
      mood:value.mood||""
     }
    );

   }

  }

 }catch(e){

  console.log("Old diary migration:",e);

 }

}


/* SETTINGS */

async function loadSettings(){

 const settings=
  await get("settings","prefs")||{};

 applyDesign(settings.design||"classic");

 if(settings.font){

  $("editor").style.fontSize=
   settings.font+"px";

 }

 if(settings.line){

  $("editor").style.lineHeight=
   settings.line+"px";

 }

}


async function saveSettings(values){

 await put(
  "settings",
  Object.assign(
   {key:"prefs"},
   values
  )
 );

}


function applyDesign(design){

 $("page").className=
  "page "+design;

}


/* PAGE */

function pageId(){

 return currentDate+"-"+currentPage;

}


async function loadPage(){

 currentPageId=pageId();

 let record=
  await get(
   "pages",
   currentPageId
  );

 if(!record){

  record={
   id:currentPageId,
   date:currentDate,
   page:currentPage,
   content:"",
   drawing:null,
   mood:""
  };

 }

 currentRec=record;

 $("editor").innerHTML=
  record.content||"";

 $("moodMark").textContent=
  record.mood||"";

 $("dateTitle").textContent=
  fmtDate(currentDate);

 const index=
  Math.abs(
   [...currentDate].reduce(
    (a,c)=>a+c.charCodeAt(0),
    0
   )
  )%quotes.length;

 $("quote").textContent=
  record.quote||quotes[index];

 await put("pages",record);

 history=[];
 future=[];

 loadDrawing(record.drawing);

 await renderPages();

}


let saveTimer;

function scheduleSave(){

 clearTimeout(saveTimer);

 saveTimer=
  setTimeout(
   savePage,
   500
  );

}


async function savePage(){

 if(!currentRec)return;

 currentRec.content=
  $("editor").innerHTML;

 currentRec.date=
  currentDate;

 currentRec.page=
  currentPage;

 currentRec.mood=
  $("moodMark").textContent;

 currentRec.quote=
  $("quote").textContent;

 currentRec.drawing=
  $("drawCanvas").toDataURL("image/png");

 await put(
  "pages",
  currentRec
 );

}


async function renderPages(){

 const pages=
  (await all("pages"))
  .filter(x=>x.date===currentDate)
  .sort((a,b)=>a.page-b.page);

 if(!pages.some(x=>x.page===currentPage)){

  currentPage=1;

 }

 $("pagesBar").innerHTML=
  pages.map(
   x=>
   `<button class="${
    x.page===currentPage?"active":""
   }"
   data-page="${x.page}">
   Page ${x.page}
   </button>`
  ).join("");

 $("pagesBar")
  .querySelectorAll("button")
  .forEach(button=>{

   button.onclick=async()=>{

    await savePage();

    currentPage=
     Number(button.dataset.page);

    await loadPage();

   };

  });

}


/* WRITING */

$("editor").addEventListener(
 "input",
 scheduleSave
);

$("editor").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Tab"){

   e.preventDefault();

   document.execCommand(
    "insertText",
    false,
    "    "
   );

  }

 }
);


document
 .querySelectorAll("[data-cmd]")
 .forEach(button=>{

  button.onclick=()=>{

   $("editor").focus();

   document.execCommand(
    button.dataset.cmd,
    false,
    null
   );

   scheduleSave();

  };

 });


/* DATE */

$("prevDay").onclick=async()=>{

 await savePage();

 currentDate=
  addDays(currentDate,-1);

 currentPage=1;

 await loadPage();

};


$("nextDay").onclick=async()=>{

 await savePage();

 currentDate=
  addDays(currentDate,1);

 currentPage=1;

 await loadPage();

};


$("todayBtn").onclick=async()=>{

 await savePage();

 currentDate=
  isoToday();

 currentPage=1;

 await loadPage();

};


$("newPageBtn").onclick=async()=>{

 await savePage();

 const pages=
  (await all("pages"))
  .filter(x=>x.date===currentDate);

 currentPage=
  Math.max(
   0,
   ...pages.map(x=>x.page||1)
  )+1;

 await loadPage();

};


$("changeQuote").onclick=()=>{

 const current=
  quotes.indexOf(
   $("quote").textContent
  );

 $("quote").textContent=
  quotes[
   (current+1)%quotes.length
  ];

 scheduleSave();

};


/* DRAWING */

let inkSnapshot=null;


function setupCanvas(){

 const canvas=$("drawCanvas");

 const wrapper=$("editorWrap");


 function resize(){

  const old=
   canvas.width
    ?canvas.toDataURL()
    :null;

  const width=
   wrapper.clientWidth;

  const height=
   wrapper.clientHeight;

  canvas.width=
   width*devicePixelRatio;

  canvas.height=
   height*devicePixelRatio;

  canvas.style.width="100%";

  canvas.style.height="100%";

  const ctx=
   canvas.getContext("2d");

  ctx.setTransform(
   devicePixelRatio,
   0,
   0,
   devicePixelRatio,
   0,
   0
  );

  if(old){

   const image=new Image();

   image.onload=()=>{

    ctx.drawImage(
     image,
     0,
     0,
     width,
     height
    );

   };

   image.src=old;

  }

 }

 window.addEventListener(
  "resize",
  resize
 );

 resize();


 canvas.onpointerdown=e=>{

  if(!drawMode)return;

  drawing=true;

  canvas.setPointerCapture(
   e.pointerId
  );

  const rect=
   canvas.getBoundingClientRect();

  sx=
   e.clientX-rect.left;

  sy=
   e.clientY-rect.top;

  ox=sx;
  oy=sy;

  saveInk();

 };


 canvas.onpointermove=e=>{

  if(!drawing||!drawMode)return;

  const rect=
   canvas.getBoundingClientRect();

  const x=
   e.clientX-rect.left;

  const y=
   e.clientY-rect.top;

  const ctx=
   canvas.getContext("2d");

  ctx.lineWidth=
   drawTool==="eraser"
    ?34
    :2.6;

  ctx.lineCap="round";

  ctx.lineJoin="round";

  if(drawTool==="eraser"){

   ctx.globalCompositeOperation=
    "destination-out";

   ctx.beginPath();

   ctx.moveTo(ox,oy);

   ctx.lineTo(x,y);

   ctx.stroke();

   ctx.globalCompositeOperation=
    "source-over";

  }

  else if(drawTool==="pen"){

   ctx.beginPath();

   ctx.moveTo(ox,oy);

   ctx.lineTo(x,y);

   ctx.stroke();

  }

  else{

   loadSnapshot();

   ctx.beginPath();

   if(drawTool==="line"){

    ctx.moveTo(sx,sy);

    ctx.lineTo(x,y);

   }

   else{

    ctx.ellipse(
     (sx+x)/2,
     (sy+y)/2,
     Math.abs(x-sx)/2,
     Math.abs(y-sy)/2,
     0,
     0,
     Math.PI*2
    );

   }

   ctx.stroke();

  }

  ox=x;
  oy=y;

 };


 canvas.onpointerup=e=>{

  if(!drawing)return;

  drawing=false;

  if(
   drawTool==="line"||
   drawTool==="circle"
  ){

   const rect=
    canvas.getBoundingClientRect();

   const x=
    e.clientX-rect.left;

   const y=
    e.clientY-rect.top;

   const ctx=
    canvas.getContext("2d");

   loadSnapshot();

   ctx.lineWidth=2.6;

   ctx.lineCap="round";

   ctx.beginPath();

   if(drawTool==="line"){

    ctx.moveTo(sx,sy);

    ctx.lineTo(x,y);

   }
   else{

    ctx.ellipse(
     (sx+x)/2,
     (sy+y)/2,
     Math.abs(x-sx)/2,
     Math.abs(y-sy)/2,
     0,
     0,
     Math.PI*2
    );

   }

   ctx.stroke();

  }

  saveInk();

  scheduleSave();

 };

}


function saveInk(){

 inkSnapshot=
  $("drawCanvas").toDataURL();

}


function loadSnapshot(){

 if(!inkSnapshot)return;

 const canvas=
  $("drawCanvas");

 const ctx=
  canvas.getContext("2d");

 const image=
  new Image();

 image.onload=()=>{

  ctx.drawImage(
   image,
   0,
   0,
   canvas.clientWidth,
   canvas.clientHeight
  );

 };

 image.src=inkSnapshot;

}


function loadDrawing(data){

 const canvas=
  $("drawCanvas");

 const ctx=
  canvas.getContext("2d");

 ctx.clearRect(
  0,
  0,
  canvas.clientWidth,
  canvas.clientHeight
 );

 inkSnapshot=null;

 if(data){

  const image=
   new Image();

  image.onload=()=>{

   ctx.drawImage(
    image,
    0,
    0,
    canvas.clientWidth,
    canvas.clientHeight
   );

   saveInk();

  };

  image.src=data;

 }

}

/*
 Selecting Pen / Line / Circle / Eraser
 closes the small draw menu BUT
 drawing mode remains active.
*/

$("drawtools").addEventListener(
 "click",
 async e=>{

  const button=
   e.target.closest("button");

  if(!button)return;

  const tool=
   button.dataset.draw;

  if(tool==="undo"){

   const previous=
    history.pop();

   if(previous){

    future.push(
     $("drawCanvas").toDataURL()
    );

    loadDrawing(previous);

   }

   return;

  }


  if(tool==="redo"){

   const next=
    future.pop();

   if(next){

    history.push(
     $("drawCanvas").toDataURL()
    );

    loadDrawing(next);

   }

   return;

  }


  if(tool==="clear"){

   history.push(
    $("drawCanvas").toDataURL()
   );

   const canvas=
    $("drawCanvas");

   const ctx=
    canvas.getContext("2d");

   ctx.clearRect(
    0,
    0,
    canvas.clientWidth,
    canvas.clientHeight
   );

   saveInk();

   scheduleSave();

   $("drawtools").hidden=true;

   return;

  }


  drawTool=tool;

  $("drawtools").hidden=true;

  toast(
   tool.charAt(0).toUpperCase()+
   tool.slice(1)+
   " selected"
  );

 });

/* CALENDAR */

async function showCalendar(){

 const selected=
  new Date(
   currentDate+"T12:00:00"
  );

 const year=
  selected.getFullYear();

 const month=
  selected.getMonth();

 const events=
  await all("events");

 const byDate={};

 events.forEach(event=>{

  if(!byDate[event.date]){

   byDate[event.date]=[];

  }

  byDate[event.date].push(event);

 });


 const first=
  new Date(
   year,
   month,
   1
  );

 const start=
  (first.getDay()+6)%7;

 const days=
  new Date(
   year,
   month+1,
   0
  ).getDate();


 let cells="";


 for(let i=0;i<start;i++){

  cells+="<div></div>";

 }


 for(
  let day=1;
  day<=days;
  day++
 ){

  const date=
   `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

  const dayEvents=
   byDate[date]||[];


  cells+=`

  <button
   class="calCell ${
    date===isoToday()
     ?"today"
     :""
   }"
   data-caldate="${date}"
  >

  <b>${day}</b>

  ${
   dayEvents.map(
    event=>`

    <span class="calEvent">
    📌 ${esc(event.title)}
    </span>

    `
   ).join("")
  }

  </button>

  `;

 }


 openModal(`

 <div class="calendarHead">

 <button id="prevM">‹</button>

 <h2>
 📅 ${selected.toLocaleDateString(
  undefined,
  {
   month:"long",
   year:"numeric"
  }
 )}
 </h2>

 <button id="nextM">›</button>

 </div>


 <div class="calGrid">

 ${[
  "Mon",
  "Tue",
  "Wed",
  "Thu",
  "Fri",
  "Sat",
  "Sun"
 ].map(
  x=>`<b>${x}</b>`
 ).join("")}

 ${cells}

 </div>


 <div id="calDetails"></div>


 <div class="modalActions">

 <button id="closeCal">
 Close
 </button>

 </div>

 `);


 $("closeCal").onclick=
  closeModal;


 $("prevM").onclick=()=>{

  const x=
   new Date(
    year,
    month-1,
    1
   );

  currentDate=
   x.toISOString()
    .slice(0,7)+"-01";

  showCalendar();

 };


 $("nextM").onclick=()=>{

  const x=
   new Date(
    year,
    month+1,
    1
   );

  currentDate=
   x.toISOString()
    .slice(0,7)+"-01";

  showCalendar();

 };


 $("modalBox")
  .querySelectorAll(
   "[data-caldate]"
  )
  .forEach(button=>{

   button.onclick=()=>{

    calendarDateDetails(
     button.dataset.caldate
    );

   };

  });

}

    ${past?"disabled":""}
   >

/* TODO CARRY FORWARD */

async function carryTodos(){

 const tomorrow=
  addDays(
   isoToday(),
   1
  );

 const todayTodos=
  await all("todos");

 const unfinished=
  todayTodos.filter(
   x=>
    x.date===isoToday() &&
    !x.done
  );


 for(const todo of unfinished){

  const exists=
   todayTodos.some(
    x=>
     x.date===tomorrow &&
     x.text===todo.text &&
     !x.done
   );

  if(!exists){

   await put(
    "todos",
    {
     text:todo.text,
     date:tomorrow,
     done:false,
     carriedFrom:todo.id
    }
   );

  }

 }

}

  );


 openModal(`

 🖼 Memories
 </h2>

 <input
  id="memoryInput"
  type="file"
  accept="image/*"
  capture="environment"
 >


 <div
  class="memoryGrid"
  id="memoryGrid"
 >

 ${
  memories.map(
   memory=>`

    src="${memory.data}"
    alt="Memory"
   >

 }

      );

     reader.readAsDataURL(
      file
     );

    });


   await put(
    "attachments",
    {
     kind:"memory",
     name:file.name,
     data:data,
     date:currentDate
    }
   );


   showMemories();

  };

  )
  .forEach(button=>{

   button.onclick=

     await del(
      "attachments",
      Number(button.dataset.md)
     );

     showMemories();

    };

  });

}

/* RESTORE */

$("restoreBtn").onclick=
 ()=>$("restoreInput").click();


$("restoreInput").onchange=
 async e=>{

  const file=
   e.target.files[0];

  if(!file)return;

  try{

   const backup=
    JSON.parse(
     await file.text()
    );


   for(
    const store of [
     "pages",
     "events",
     "todos",
     "attachments",
     "settings"
    ]
   ){

    for(
     const record of
      backup[store]||[]
    ){

     await put(
      store,
      record
     );

    }

   }


   toast(
    "Backup restored"
   );

   await loadPage();

  }
  catch(error){

   console.error(error);

   toast(
    "Invalid backup file"
   );

  }

 };
