<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<meta
  name="theme-color"
  content="#5b3a29"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<title>My Personal Diary v10</title>

<link
  rel="manifest"
  href="./manifest.json"
>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#d8d0c4;
  color:#332923;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

[hidden]{
  display:none !important;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  position:sticky;
  top:0;
  z-index:1000;

  min-height:62px;

  display:flex;
  align-items:center;

  gap:7px;

  padding:7px 10px;

  background:#5b3a29;
  color:white;

  box-shadow:
    0 3px 10px rgba(0,0,0,.3);

  overflow-x:auto;
}

.brand{

  flex:0 0 auto;

  font-size:20px;
  font-weight:bold;

  margin-right:5px;

  white-space:nowrap;
}

.topbar button{

  flex:0 0 auto;

  padding:8px 12px;

  border:1px solid #b99b7c;

  border-radius:8px;

  background:#6b4831;

  color:white;
}

.topbar button:active{
  transform:scale(.97);
}


/* =========================================================
   BOOK
========================================================= */

.workspace{

  width:100%;

  padding:10px;
}

.book{

  width:100%;

  max-width:1600px;

  margin:auto;

  display:flex;

  position:relative;

  background:#3c2418;

  border-radius:12px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.32);

  overflow:visible;
}


/* =========================================================
   SPIRAL
========================================================= */

.spine{

  width:65px;

  flex:0 0 65px;

  position:relative;

  background:
    linear-gradient(
      90deg,
      #24130d,
      #70452d 25%,
      #a16d48 48%,
      #57311e 75%,
      #25130d
    );

  border-radius:12px 0 0 12px;

  overflow:hidden;
}

.spine:before{

  content:"";

  position:absolute;

  inset:0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 26px,
      rgba(255,255,255,.15) 27px 30px,
      transparent 31px 46px
    );
}

.ring{

  position:absolute;

  left:18px;

  width:40px;
  height:22px;

  border:4px solid #201915;

  border-left-color:#9b8067;

  border-radius:50%;

  box-shadow:
    0 2px 3px rgba(0,0,0,.5);
}


/* =========================================================
   PAPER
========================================================= */

.page{

  flex:1;

  min-width:0;

  min-height:
    calc(100vh - 82px);

  position:relative;

  background:#fffdf5;

  border-radius:
    0 12px 12px 0;

  box-shadow:
    inset 0 0 35px
    rgba(80,55,35,.13);

  overflow:visible;
}


/* DESIGNS */

.page.design-classic{
  background:#fffdf5;
}

.page.design-vintage{

  background:#f7edd9;

  background-image:
    radial-gradient(
      circle at 20% 20%,
      rgba(130,90,45,.07),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(130,90,45,.06),
      transparent 30%
    );
}

.page.design-blue{
  background:#f4f9ff;
}

.page.design-green{
  background:#f4faf3;
}

.page.design-rose{
  background:#fff7f7;
}

.page.design-night{

  background:#25272a;

  color:#eee;
}


/* =========================================================
   HEADER
========================================================= */

.page-header{

  position:sticky;

  top:62px;

  z-index:500;

  background:
    rgba(255,253,245,.97);

  backdrop-filter:
    blur(5px);

  border-bottom:
    1px solid #d1c1aa;

  padding:
    8px 16px 6px;
}

.design-night .page-header{

  background:
    rgba(37,39,42,.97);

  border-color:#555;
}

.date-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;
}

.date-title{

  min-width:0;

  font-size:23px;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.date-actions{

  flex:0 0 auto;

  display:flex;

  align-items:center;

  gap:4px;
}

.small-btn{

  border:1px solid #bba990;

  background:#fffaf0;

  color:#342a23;

  border-radius:6px;

  padding:5px 8px;
}

.mood-display{

  min-width:25px;

  text-align:center;

  font-size:20px;
}

.quote-row{

  height:26px;

  line-height:26px;

  font-size:14px;

  font-style:italic;

  color:#756252;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  cursor:pointer;
}


/* =========================================================
   FORMATTING TOOLBAR
========================================================= */

.toolbar{

  position:sticky;

  top:120px;

  z-index:490;

  margin:
    7px 15px;

  padding:6px;

  display:flex;

  align-items:center;

  gap:5px;

  background:
    rgba(248,242,231,.98);

  border:
    1px solid #c8b79f;

  border-radius:9px;

  box-shadow:
    0 2px 5px rgba(0,0,0,.1);

  overflow-x:auto;
}

.toolbar button{

  flex:0 0 auto;

  height:38px;

  min-width:40px;

  padding:4px 9px;

  border:
    1px solid #aa9a85;

  background:#fffaf1;

  border-radius:7px;

  color:#342a23;
}

.toolbar button.active{

  background:#5b3a29;

  color:white;
}

.separator{

  width:1px;

  height:28px;

  background:#c7b69e;

  flex:0 0 1px;
}

.draw-tools{

  display:none;

  align-items:center;

  gap:4px;
}

.draw-tools.open{
  display:flex;
}


/* =========================================================
   EDITOR
========================================================= */

.editor-wrap{

  position:relative;

  margin:
    0 17px;

  min-height:
    calc(100vh - 245px);
}

.editor{

  position:relative;

  z-index:10;

  min-height:
    calc(100vh - 245px);

  outline:none;

  padding:
    0 20px 100px 20px;

  font-size:20px;

  line-height:38px;

  word-break:break-word;

  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 37px,
      #b8cfdf 38px,
      transparent 39px
    );
}

.editor:empty:before{

  content:
    "Start writing your diary...";

  color:#b8aaa0;

  font-style:italic;
}


/* =========================================================
   DRAWING
========================================================= */

#drawCanvas{

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:30;

  pointer-events:none;

  touch-action:none;
}

#drawCanvas.active{

  pointer-events:auto;

  cursor:crosshair;
}


/* =========================================================
   NEW PAGE
========================================================= */

.new-page-tab{

  position:absolute;

  right:-1px;

  top:230px;

  z-index:60;

  padding:
    12px 8px;

  writing-mode:
    vertical-rl;

  border:
    1px solid #b69b80;

  border-right:none;

  border-radius:
    8px 0 0 8px;

  background:#68452f;

  color:white;

  box-shadow:
    0 3px 7px rgba(0,0,0,.25);
}

.page-number{

  text-align:center;

  font-size:13px;

  color:#806f60;

  padding:10px;
}


/* =========================================================
   MODALS
========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:3000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:14px;

  background:
    rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modal-card{

  width:
    min(720px,96vw);

  max-height:90vh;

  overflow:auto;

  background:#fffaf0;

  color:#332923;

  border-radius:12px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.45);

  padding:18px;
}

.modal-title{

  font-size:22px;

  font-weight:bold;

  margin-bottom:13px;
}

.form-row{
  margin-bottom:12px;
}

.form-row label{

  display:block;

  font-weight:bold;

  margin-bottom:5px;
}

.form-row input,
.form-row textarea,
.form-row select{

  width:100%;

  padding:9px;

  border:
    1px solid #baa991;

  border-radius:7px;

  background:white;
}

.form-row textarea{
  min-height:80px;
}

.modal-actions{

  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:15px;

  flex-wrap:wrap;
}

.primary,
.secondary{

  padding:
    9px 14px;

  border-radius:7px;
}

.primary{

  border:
    1px solid #9b8065;

  background:#65442f;

  color:white;
}

.secondary{

  border:
    1px solid #aaa;

  background:#eee;

  color:#333;
}


/* =========================================================
   CALENDAR
========================================================= */

.calendar-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;
}

.calendar-grid{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;
}

.cal-day-name{

  text-align:center;

  font-size:13px;

  font-weight:bold;

  padding:5px;
}

.cal-cell{

  min-height:68px;

  padding:5px;

  border:
    1px solid #d3c3ac;

  border-radius:7px;

  background:#fffdf7;

  cursor:pointer;
}

.cal-cell.empty{

  border:none;

  background:transparent;

  cursor:default;
}

.cal-cell.today{

  outline:
    2px solid #765238;
}

.cal-cell.has-event{

  background:#f3e5d4;
}

.event-mini{

  margin-top:4px;

  font-size:11px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.event-dot{

  display:inline-block;

  width:7px;

  height:7px;

  margin-left:3px;

  border-radius:50%;

  background:#a33d32;
}


/* =========================================================
   LISTS
========================================================= */

.list-item{

  display:flex;

  align-items:flex-start;

  gap:8px;

  padding:9px 2px;

  border-bottom:
    1px solid #ded1bf;
}

.list-content{
  flex:1;
}

.done{

  text-decoration:
    line-through;

  opacity:.55;
}


/* =========================================================
   MEMORIES
========================================================= */

.memory-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(150px,1fr));

  gap:12px;
}

.memory-card{

  overflow:hidden;

  border:
    1px solid #cdbca5;

  border-radius:8px;

  background:white;
}

.memory-card img{

  display:block;

  width:100%;

  height:145px;

  object-fit:cover;
}

.memory-info{

  padding:7px;

  font-size:12px;
}


/* =========================================================
   SETTINGS
========================================================= */

.design-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

.design-choice{

  min-height:70px;

  border:
    2px solid #c7b69f;

  border-radius:8px;

  background:#fffaf0;
}

.design-choice.selected{

  border-color:#65442f;

  box-shadow:
    0 0 0 2px #dcc6aa inset;
}


/* =========================================================
   TOAST
========================================================= */

#toast{

  position:fixed;

  left:50%;

  bottom:25px;

  z-index:5000;

  transform:
    translate(-50%,80px);

  padding:
    10px 18px;

  border-radius:20px;

  background:#34251d;

  color:white;

  opacity:0;

  transition:.25s;

  pointer-events:none;
}

#toast.show{

  opacity:1;

  transform:
    translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .topbar{

    min-height:54px;

    padding:5px;
  }

  .brand{

    font-size:17px;
  }

  .topbar button{

    padding:
      7px 9px;

    font-size:13px;
  }

  .workspace{
    padding:4px;
  }

  .spine{

    width:42px;

    flex-basis:42px;
  }

  .ring{

    left:9px;

    width:30px;

    height:20px;
  }

  .page-header{

    top:54px;

    padding:
      7px 9px 5px;
  }

  .date-title{
    font-size:18px;
  }

  .quote-row{
    font-size:12px;
  }

  .toolbar{

    top:108px;

    margin:
      5px 7px;
  }

  .editor-wrap{
    margin:0 7px;
  }

  .editor{

    font-size:18px;

    line-height:34px;

    padding-left:12px;

    background-image:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 33px,
        #b8cfdf 34px,
        transparent 35px
      );
  }

  .new-page-tab{

    top:185px;

    padding:
      10px 7px;
  }

  .design-grid{

    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>

</head>

<body>


<!-- =======================================================
     TOP BAR
======================================================== -->

<div class="topbar">

  <div class="brand">
    📖 My Diary
  </div>

  <button id="calendarBtn">
    📅 Calendar
  </button>

  <button id="eventsBtn">
    📌 Events
  </button>

  <button id="todoBtn">
    ☑ To-Do
  </button>

  <button id="memoriesBtn">
    🖼 Memories
  </button>

  <button id="settingsBtn">
    ⚙ Settings
  </button>

  <button id="backupBtn">
    💾 Backup
  </button>

  <button id="restoreBtn">
    ↩ Restore
  </button>

  <button id="printBtn">
    🖨 Print
  </button>

  <input
    id="restoreInput"
    type="file"
    accept=".json"
    hidden
  >

</div>


<!-- =======================================================
     BOOK
======================================================== -->

<div class="workspace">

<div class="book">

<div class="spine" id="spine"></div>

<main
  class="page design-classic"
  id="page"
>

<div class="page-header">

  <div class="date-row">

    <div
      class="date-title"
      id="dateTitle"
    >
      Opening Diary...
    </div>

    <div class="date-actions">

      <button
        class="small-btn"
        id="prevDayBtn"
      >
        ‹
      </button>

      <button
        class="small-btn"
        id="todayBtn"
      >
        Today
      </button>

      <button
        class="small-btn"
        id="nextDayBtn"
      >
        ›
      </button>

      <span
        class="mood-display"
        id="moodDisplay"
      ></span>

      <button
        class="small-btn"
        id="moodBtn"
      >
        Mood
      </button>

    </div>

  </div>

  <div
    class="quote-row"
    id="quoteRow"
  >
    Loading quote...
  </div>

</div>


<!-- =======================================================
     TOOLBAR
======================================================== -->

<div
  class="toolbar"
  id="toolbar"
>

<button
  type="button"
  data-command="bold"
>
  <b>B</b>
</button>

<button
  type="button"
  data-command="italic"
>
  <i>I</i>
</button>

<button
  type="button"
  data-command="underline"
>
  <u>U</u>
</button>

<button
  type="button"
  data-command="insertUnorderedList"
>
  • List
</button>

<button
  type="button"
  data-command="insertOrderedList"
>
  1. List
</button>

<button
  type="button"
  data-command="justifyLeft"
>
  ≡
</button>

<button
  type="button"
  data-command="justifyCenter"
>
  ≡
</button>

<button
  type="button"
  id="clearFormatBtn"
>
  Clear
</button>

<span class="separator"></span>

<button
  type="button"
  id="drawBtn"
>
  ✎ Draw
</button>


<div
  class="draw-tools"
  id="drawTools"
>

<button data-draw="pen">
  Pen
</button>

<button data-draw="line">
  Line
</button>

<button data-draw="circle">
  Circle
</button>

<button data-draw="eraser">
  Eraser
</button>

<button id="undoDrawBtn">
  ↶
</button>

<button id="redoDrawBtn">
  ↷
</button>

<button id="clearDrawBtn">
  Clear
</button>

<button id="closeDrawBtn">
  Done
</button>

</div>

</div>


<!-- =======================================================
     WRITING AREA
======================================================== -->

<div
  class="editor-wrap"
  id="editorWrap"
>

<div
  id="editor"
  class="editor"
  contenteditable="true"
  spellcheck="true"
></div>

<canvas
  id="drawCanvas"
></canvas>

</div>


<div
  class="page-number"
  id="pageNumber"
>
  Page 1
</div>


<button
  class="new-page-tab"
  id="newPageBtn"
>
  + New Page
</button>


</main>

</div>

</div>


<!-- =======================================================
     CALENDAR
======================================================== -->

<div
  class="modal"
  id="calendarModal"
>

<div class="modal-card">

<div class="modal-title">
  📅 Diary Calendar
</div>

<div class="calendar-head">

<button
  class="secondary"
  id="calPrevBtn"
>
  ‹
</button>

<strong
  id="calendarMonth"
>
  Month
</strong>

<button
  class="secondary"
  id="calNextBtn"
>
  ›
</button>

</div>

<div
  class="calendar-grid"
  id="calendarGrid"
></div>

<div
  id="calendarEvents"
  style="margin-top:15px"
></div>

<div class="modal-actions">

<button
  class="secondary"
  data-close="calendarModal"
>
  Close
</button>

</div>

</div>

</div>


<!-- =======================================================
     EVENTS
======================================================== -->

<div
  class="modal"
  id="eventsModal"
>

<div class="modal-card">

<div class="modal-title">
  📌 Diary Events
</div>

<div class="form-row">

<label>
  Date
</label>

<input
  id="eventDate"
  type="date"
>

</div>

<div class="form-row">

<label>
  Time
</label>

<input
  id="eventTime"
  type="time"
>

</div>

<div class="form-row">

<label>
  Event
</label>

<input
  id="eventTitle"
  type="text"
  placeholder="Enter event"
>

</div>

<div class="form-row">

<label>
  Notes
</label>

<textarea
  id="eventNotes"
  placeholder="Optional notes"
></textarea>

</div>

<div id="eventList"></div>

<div class="modal-actions">

<button
  class="secondary"
  data-close="eventsModal"
>
  Close
</button>

<button
  class="primary"
  id="saveEventBtn"
>
  Save Event
</button>

</div>

</div>

</div>


<!-- =======================================================
     TODO
======================================================== -->

<div
  class="modal"
  id="todoModal"
>

<div class="modal-card">

<div class="modal-title">
  ☑ To-Do
</div>

<div
  id="todoDateLabel"
  style="margin-bottom:10px"
></div>

<div class="form-row">

<label>
  New task
</label>

<input
  id="todoInput"
  type="text"
  placeholder="Enter task"
>

</div>

<button
  class="primary"
  id="addTodoBtn"
>
  Add Task
</button>

<div
  id="todoList"
  style="margin-top:15px"
></div>

<div class="modal-actions">

<button
  class="secondary"
  data-close="todoModal"
>
  Close
</button>

</div>

</div>

</div>


<!-- =======================================================
     MEMORIES
======================================================== -->

<div
  class="modal"
  id="memoriesModal"
>

<div class="modal-card">

<div class="modal-title">
  🖼 Memories
</div>

<div class="form-row">

<label>
  Add photograph
</label>

<input
  id="memoryInput"
  type="file"
  accept="image/*"
  capture="environment"
>

</div>

<div
  class="memory-grid"
  id="memoryGrid"
></div>

<div class="modal-actions">

<button
  class="secondary"
  data-close="memoriesModal"
>
  Close
</button>

</div>

</div>

</div>


<!-- =======================================================
     SETTINGS
======================================================== -->

<div
  class="modal"
  id="settingsModal"
>

<div class="modal-card">

<div class="modal-title">
  ⚙ Diary Settings
</div>

<div class="form-row">

<label>
  Page design
</label>

<div class="design-grid">

<button
  class="design-choice"
  data-design="classic"
>
  📖<br>
  Classic
</button>

<button
  class="design-choice"
  data-design="vintage"
>
  🕰<br>
  Vintage
</button>

<button
  class="design-choice"
  data-design="blue"
>
  💙<br>
  Blue
</button>

<button
  class="design-choice"
  data-design="green"
>
  🌿<br>
  Green
</button>

<button
  class="design-choice"
  data-design="rose"
>
  🌸<br>
  Rose
</button>

<button
  class="design-choice"
  data-design="night"
>
  🌙<br>
  Night
</button>

</div>

</div>


<div class="form-row">

<label>
  Font size:
  <span id="fontSizeValue">

/* =========================================================

function todayISO(){

  const d =
    new Date();

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0")
  );
}


function dateObject(iso){

  const parts =
    iso.split("-")
      .map(Number);

  return new Date(
    parts[0],
    parts[1]-1,
    parts[2]
  );
}


function isoDate(d){

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0")
  );
}


function addDays(
  iso,
  amount
){

  const d =
    dateObject(iso);

  d.setDate(
    d.getDate()+amount
  );

  return isoDate(d);
}


function formatDate(iso){

  return dateObject(
    iso
  ).toLocaleDateString(
    undefined,
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );
}


function isPastDate(iso){

  return (
    iso <
    todayISO()
  );
}

  .replace(/"/g,"&quot;")

}

/* =========================================================
   SAFE DATABASE OPEN
========================================================= */

function openDatabase(){

  return new Promise(
    (resolve,reject)=>{

      let completed =
        false;

      let request;

      try{

        request =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

      }catch(error){

        reject(error);

        return;
      }


      function fail(error){

        if(completed){
          return;
        }

        completed =
          true;

        reject(
          error ||
          new Error(
            "Database error"
          )
        );
      }


      request.onblocked =
        function(){

          console.warn(
            "Diary database is blocked."
          );

          /*
            Do not leave user forever
            on Loading.
          */

          setTimeout(
            ()=>{
              fail(
                new Error(
                  "Database upgrade blocked."
                )
              );
            },
            5000
          );
        };


      request.onerror =
        function(){

          fail(
            request.error
          );

        };


      request.onupgradeneeded =
        function(event){

          const database =
            event.target.result;

          const transaction =
            event.target.transaction;


          /* ======================
             PAGES
          ====================== */

          let pages;

          if(
            !database.objectStoreNames
              .contains("pages")
          ){

            pages =
              database.createObjectStore(
                "pages",
                {
                  keyPath:"id"
                }
              );

          }else{

            pages =
              transaction
                .objectStore(
                  "pages"
                );

          }


          if(
            !pages.indexNames
              .contains("date")
          ){

            pages.createIndex(
              "date",
              "date",
              {
                unique:false
              }
            );

          }


          /* ======================
             EVENTS
          ====================== */

          let events;

          if(
            !database.objectStoreNames
              .contains("events")
          ){

            events =
              database.createObjectStore(
                "events",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

          }else{

            events =
              transaction
                .objectStore(
                  "events"
                );

          }


          if(
            !events.indexNames
              .contains("date")
          ){

            events.createIndex(
              "date",
              "date",
              {
                unique:false
              }
            );

          }


          /* ======================
             TODOS
          ====================== */

          let todos;

          if(
            !database.objectStoreNames
              .contains("todos")
          ){

            todos =
              database.createObjectStore(
                "todos",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

          }else{

            todos =
              transaction
                .objectStore(
                  "todos"
                );

          }


          if(
            !todos.indexNames
              .contains("date")
          ){

            todos.createIndex(
              "date",
              "date",
              {
                unique:false
              }
            );

          }


          /* ======================
             ATTACHMENTS
          ====================== */

          if(
            !database.objectStoreNames
              .contains("attachments")
          ){

            database.createObjectStore(
              "attachments",
              {
                keyPath:"id",
                autoIncrement:true
              }
            );

          }


          /* ======================
             MEMORIES
          ====================== */

          if(
            !database.objectStoreNames
              .contains("memories")
          ){

            database.createObjectStore(
              "memories",
              {
                keyPath:"id",
                autoIncrement:true
              }
            );

          }


          /* ======================
             SETTINGS
          ====================== */

          if(
            !database.objectStoreNames
              .contains("settings")
          ){

            database.createObjectStore(
              "settings",
              {
                keyPath:"key"
              }
            );

          }

        };


      request.onsuccess =
        function(){

          if(completed){
            return;
          }

          completed =
            true;

          db =
            request.result;

          db.onversionchange =
            function(){

              db.close();

            };

          resolve(db);

        };


      /*
        Absolute safety:
        never stay on Loading forever.
      */

      setTimeout(
        ()=>{
          if(!completed){

            fail(
              new Error(
                "Database startup timeout"
              )
            );

          }
        },
        10000
      );

    }
  );

}

function getStore(
  name,
  mode="readonly"
){

  return db
    .transaction(
      name,
      mode
    )
    .objectStore(
      name
    );
}


function getRecord(
  store,
  key
){

  return new Promise(
    (resolve,reject)=>{

      const request =
        getStore(
          store
        ).get(
          key
        );

      request.onsuccess =
        ()=>{
          resolve(
            request.result
          );
        };

      request.onerror =
        ()=>{
          reject(
            request.error
          );
        };

    }
  );

}


function getAllRecords(
  store
){

  return new Promise(
    (resolve,reject)=>{

      const request =
        getStore(
          store
        ).getAll();

      request.onsuccess =
        ()=>{
          resolve(
            request.result || []
          );
        };

      request.onerror =
        ()=>{
          reject(
            request.error
          );
        };

    }
  );

}


function saveRecord(
  store,
  record
){

  return new Promise(
    (resolve,reject)=>{

      const request =
        getStore(
          store,
          "readwrite"
        ).put(
          record
        );

      request.onsuccess =
        ()=>{
          resolve(
            request.result
          );
        };

      request.onerror =
        ()=>{
          reject(
            request.error
          );
        };

    }
  );

}


function deleteRecord(
  store,
  key
){

  return new Promise(
    (resolve,reject)=>{

      const request =
        getStore(
          store,
          "readwrite"
        ).delete(
          key
        );

      request.onsuccess =
        ()=>{
          resolve();
        };

      request.onerror =
        ()=>{
          reject(
            request.error
          );
        };

    }
  );

}

function quoteForDate(
  date
){

  let hash =
    0;

  for(
    let i=0;
    i<date.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash +
        date.charCodeAt(i)
      ) |
      0;

  }

  return QUOTES[
    Math.abs(hash) %
    QUOTES.length
  ];
}

function updateCanvasSize(){

  const wrap =
    document.getElementById(
      "editorWrap"
    );

  const rect =
    wrap.getBoundingClientRect();

  if(
    rect.width <= 0 ||
    rect.height <= 0
  ){
    return;
  }


  const old =
    document.createElement(
      "canvas"
    );

  old.width =
    canvas.width;

  old.height =
    canvas.height;


  if(
    canvas.width &&
    canvas.height
  ){

    try{

      old
        .getContext("2d")
        .drawImage(
          canvas,
          0,
          0
        );

    }catch(e){}

  }


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    Math.round(
      rect.width * dpr
    );

  canvas.height =
    Math.round(
      rect.height * dpr
    );


  canvas.style.width =
    rect.width +
    "px";

  canvas.style.height =
    rect.height +
    "px";


  context.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  if(
    old.width &&
    old.height
  ){

    try{

      context.drawImage(
        old,
        0,
        0,
        old.width / dpr,
        old.height / dpr
      );

    }catch(e){}

  }

}


function pointFromEvent(
  event
){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


function saveCanvasSnapshot(){

  try{

    return context.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }catch(error){

    return null;

  }

}


function restoreCanvasSnapshot(
  image
){

  if(!image){
    return;
  }

  try{

    context.putImageData(
      image,
      0,
      0
    );

  }catch(error){}

}


function pushUndo(){

  const image =
    saveCanvasSnapshot();

  if(!image){
    return;
  }

  undoStack.push(
    image
  );

  if(
    undoStack.length > 20
  ){

    undoStack.shift();

  }

canvas.addEventListener(
  "pointerdown",
  function(event){

    if(!drawingActive){
      return;
    }

    event.preventDefault();

    canvas.setPointerCapture(
      event.pointerId
    );

    startPoint =
      pointFromEvent(
        event
      );


    if(
      drawingTool === "pen" ||
      drawingTool === "eraser"
    ){

      pushUndo();

    }else{

      baseCanvas =
        saveCanvasSnapshot();

    }


    if(
      drawingTool === "pen"
    ){

      context.globalCompositeOperation =
        "source-over";

      context.strokeStyle =
        "#222";

      context.lineWidth =
        3;

      context.lineCap =
        "round";

      context.beginPath();

      context.moveTo(
        startPoint.x,
        startPoint.y
      );

    }


    if(
      drawingTool === "eraser"
    ){

      context.globalCompositeOperation =
        "destination-out";

      context.lineWidth =
        60;

      context.lineCap =
        "round";

      context.beginPath();

      context.moveTo(
        startPoint.x,
        startPoint.y
      );

    }

  }
);


canvas.addEventListener(
  "pointermove",
  function(event){

    if(
      !drawingActive ||
      !startPoint
    ){
      return;
    }

    event.preventDefault();

    const point =
      pointFromEvent(
        event
      );


    if(
      drawingTool === "pen" ||
      drawingTool === "eraser"
    ){

      context.lineTo(
        point.x,
        point.y
      );

      context.stroke();

      context.beginPath();

      context.moveTo(
        point.x,
        point.y
      );

      return;

    }


    if(baseCanvas){

      restoreCanvasSnapshot(
        baseCanvas
      );

    }


    context.globalCompositeOperation =
      "source-over";

    context.strokeStyle =
      "#222";

    context.lineWidth =
      3;

    context.lineCap =
      "round";

    context.beginPath();


    if(
      drawingTool === "line"
    ){

      context.moveTo(
        startPoint.x,
        startPoint.y
      );

      context.lineTo(
        point.x,
        point.y
      );

    }


    if(
      drawingTool === "circle"
    ){

      const dx =
        point.x -
        startPoint.x;

      const dy =
        point.y -
        startPoint.y;

      const radius =
        Math.sqrt(
          dx*dx +
          dy*dy
        );

      context.arc(
        startPoint.x,
        startPoint.y,
        radius,
        0,
        Math.PI*2
      );

    }


    context.stroke();

  }
);


canvas.addEventListener(
  "pointerup",
  function(event){

    if(
      !drawingActive ||
      !startPoint
    ){
      return;
    }


    const point =
      pointFromEvent(
        event
      );


    if(
      drawingTool === "line" ||
      drawingTool === "circle"
    ){

      if(baseCanvas){

        restoreCanvasSnapshot(
          baseCanvas
        );

      }

      context.globalCompositeOperation =
        "source-over";

      context.strokeStyle =
        "#222";

      context.lineWidth =
        3;

      context.lineCap =
        "round";

      context.beginPath();


      if(
        drawingTool === "line"
      ){

        context.moveTo(
          startPoint.x,
          startPoint.y
        );

        context.lineTo(
          point.x,
          point.y
        );

      }


      if(
        drawingTool === "circle"
      ){

        const dx =
          point.x -
          startPoint.x;

        const dy =
          point.y -
          startPoint.y;

        const radius =
          Math.sqrt(
            dx*dx +
            dy*dy
          );

        context.arc(
          startPoint.x,
          startPoint.y,
          radius,
          0,
          Math.PI*2
        );

      }

      context.stroke();

      pushUndo();

    }


    context.globalCompositeOperation =
      "source-over";


    startPoint =
      null;

    baseCanvas =
      null;


    saveDrawing();

  }
);


canvas.addEventListener(
  "pointercancel",
  function(){

    startPoint =
      null;

    baseCanvas =
      null;

  }
);

function loadDrawing(
  data
){

  drawingDataURL =
    data || "";

  updateCanvasSize();


  context.clearRect(
    0,
    0,
    canvas.clientWidth,
    canvas.clientHeight
  );


  if(!data){
    return;
  }


  const image =
    new Image();


  image.onload =
    function(){

      context.drawImage(
        image,
        0,
        0,
        canvas.clientWidth,
        canvas.clientHeight
      );

    };


  image.src =
    data;

}

async function renderCalendar(){

  const year =
    calendarCursor.getFullYear();

  const month =
    calendarCursor.getMonth();


  document.getElementById(
    "calendarMonth"
  ).textContent =
    calendarCursor.toLocaleDateString(
      undefined,
      {
        month:"long",
        year:"numeric"
      }
    );


  const grid =
    document.getElementById(
      "calendarGrid"
    );

  grid.innerHTML =
    "";


  [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ]
  .forEach(name=>{

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "cal-day-name";

    cell.textContent =
      name;

    grid.appendChild(
      cell
    );

  });


  const first =
    new Date(
      year,
      month,
      1
    );

  const last =
    new Date(
      year,
      month+1,
      0
    );


  for(
    let i=0;
    i<first.getDay();
    i++
  ){

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "cal-cell empty";

    grid.appendChild(
      cell
    );

  }


  const events =
    await getAllRecords(
      "events"
    );

  const pages =
    await getAllRecords(
      "pages"
    );


  for(
    let day=1;
    day<=last.getDate();
    day++
  ){

    const date =
      year +
      "-" +
      String(
        month+1
      ).padStart(2,"0") +
      "-" +
      String(
        day
      ).padStart(2,"0");


    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "cal-cell";


    if(
      date === todayISO()
    ){

      cell.classList.add(
        "today"
      );

    }


    const dayEvents =
      events.filter(
        event =>
          event.date === date
      );


    const diaryExists =
      pages.some(
        page =>
          page.date === date &&
          (
            page.content ||
            page.drawing
          )
      );


    if(
      dayEvents.length
    ){

      cell.classList.add(
        "has-event"
      );

    }


    cell.innerHTML =
      `<b>${day}</b>`;


    if(diaryExists){

      cell.innerHTML +=
        `<div class="event-mini">
          📖 Diary
        </div>`;

    }


    dayEvents
      .slice(0,2)
      .forEach(event=>{

        cell.innerHTML +=
          `<div class="event-mini">
            📌 ${escapeHTML(
              event.title
            )}
          </div>`;

      });


    cell.onclick =
      async function(){

        await goToDate(
          date
        );

        closeModal(
          "calendarModal"
        );

      };


    grid.appendChild(
      cell
    );

  }


  const prefix =
    year +
    "-" +
    String(
      month+1
    ).padStart(2,"0");


  const monthEvents =
    events
      .filter(
        event =>
          event.date &&
          event.date.startsWith(
            prefix
          )
      )
      .sort(
        (a,b)=>
          (
            a.date +
            (a.time || "")
          ).localeCompare(
            b.date +
            (b.time || "")
          )
      );


  const list =
    document.getElementById(
      "calendarEvents"
    );


  if(
    monthEvents.length === 0
  ){

    list.innerHTML =
      "<p>No events this month.</p>";

  }else{

    list.innerHTML =
      "<b>Diary Events</b>";

    monthEvents.forEach(
      event=>{

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "list-item";

        row.innerHTML =
          `<div class="list-content">
            <b>${escapeHTML(
              event.title
            )}</b>
            <br>
            <small>
              ${formatDate(
                event.date
              )}
              ${
                event.time
                  ? " • " +
                    escapeHTML(
                      event.time
                    )
                  : ""
              }
            </small>
          </div>`;

        list.appendChild(
          row
        );

      }
    );

  }

}

async function carryForwardTodos(){

  const previous =
    addDays(
      currentDate,
      -1
    );


  const all =
    await getAllRecords(
      "todos"
    );


  const pending =
    all.filter(
      todo =>
        todo.date === previous &&
        !todo.done
    );


  for(
    const task of pending
  ){

    const exists =
      all.some(
        todo =>
          todo.date ===
            currentDate &&
          todo.carriedFrom ===
            String(
              task.id
            )
      );


    if(!exists){

      await saveRecord(
        "todos",
        {
          date:
            currentDate,

          text:
            task.text,

          done:
            false,

          carriedFrom:
            String(
              task.id
            ),

          createdAt:
            Date.now()
        }
      );

    }

  }

}


async function renderTodos(){

  await carryForwardTodos();


  const all =
    await getAllRecords(
      "todos"
    );


  const todos =
    all
      .filter(
        todo =>
          todo.date ===
          currentDate
      )
      .sort(
        (a,b)=>
          Number(a.id) -
          Number(b.id)
      );


  const list =
    document.getElementById(
      "todoList"
    );

  list.innerHTML =
    "";


  const past =
    isPastDate(
      currentDate
    );


  document.getElementById(
    "todoInput"
  ).disabled =
    past;


  document.getElementById(
    "addTodoBtn"
  ).disabled =
    past;


  if(past){

    list.innerHTML =
      `<p>
        <b>Read-only:</b>
        Previous dates cannot be changed.
      </p>`;

  }


  if(
    todos.length === 0
  ){

    list.innerHTML +=
      "<p>No tasks for this date.</p>";

    return;

  }


  todos.forEach(
    todo=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "list-item";


      const check =
        document.createElement(
          "input"
        );

      check.type =
        "checkbox";

      check.checked =
        !!todo.done;

      check.disabled =
        past;


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "list-content";

      text.textContent =
        todo.text;


      if(todo.done){

        text.classList.add(
          "done"
        );

      }


      const del =
        document.createElement(
          "button"
        );

      del.textContent =
        "Delete";

      del.disabled =
        past;


      check.onchange =
        async function(){

          todo.done =
            check.checked;

          await saveRecord(
            "todos",
            todo
          );

          await renderTodos();

        };


      del.onclick =
        async function(){

          await deleteRecord(
            "todos",
            todo.id
          );

          await renderTodos();

        };


      row.appendChild(
        check
      );

      row.appendChild(
        text
      );

      row.appendChild(
        del
      );

      list.appendChild(
        row
      );

    }
  );

}

    if(

        "image/"
      )
    ){

      toast(
        "Please select an image"
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      async function(){

        await saveRecord(
          "memories",
          {
            date:
              currentDate,

            name:
              file.name,

            type:
              file.type,

            data:
              reader.result,

            createdAt:
              Date.now()
          }
        );


        await renderMemories();

        toast(
          "Memory saved"
        );

      };


    reader.readAsDataURL(
      file
    );


    event.target.value =
      "";

  };


async function renderMemories(){

  const memories =
    await getAllRecords(
      "memories"
    );


  const grid =
    document.getElementById(
      "memoryGrid"
    );

  grid.innerHTML =
    "";


  if(
    memories.length === 0
  ){

    grid.innerHTML =
      "<p>No memories yet.</p>";

    return;

  }


  memories
    .sort(
      (a,b)=>
        Number(
          b.createdAt || 0
        ) -
        Number(
          a.createdAt || 0
        )
    )
    .forEach(
      memory=>{

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "memory-card";


        const image =
          document.createElement(
            "img"
          );

        image.src =
          memory.data;

        image.alt =
          memory.name ||
          "Diary memory";


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "memory-info";

        info.innerHTML =
          `<b>${escapeHTML(
            memory.name ||
            "Memory"
          )}</b>
          <br>
          ${
            memory.date
              ? formatDate(
                  memory.date
                )
              : ""
          }`;


        const del =
          document.createElement(
            "button"
          );

        del.textContent =
          "Delete";

        del.style.margin =
          "6px";


        del.onclick =
          async function(){

            await deleteRecord(
              "memories",
              memory.id
            );

            await renderMemories();

          };


        card.appendChild(
          image
        );

        card.appendChild(
          info
        );

        card.appendChild(
          del
        );

        grid.appendChild(
          card
        );

      }
    );

}

/* =========================================================
   BACKUP
========================================================= */

document.getElementById(
  "backupBtn"
).onclick =
  async function(){

    await savePage();


    const backup = {

      version:
        10,

      exportedAt:
        new Date().toISOString(),

      settings,

      pages:
        await getAllRecords(
          "pages"
        ),

      events:
        await getAllRecords(
          "events"
        ),

      todos:
        await getAllRecords(
          "todos"
        ),

      memories:
        await getAllRecords(
          "memories"
        )

    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            backup,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      "My-Personal-Diary-Backup-" +
      todayISO() +
      ".json";


    document.body.appendChild(
      link
    );

    link.click();

    link.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      1000
    );


    toast(
      "Backup downloaded"
    );

  };


/* =========================================================
   RESTORE
========================================================= */

document.getElementById(
  "restoreBtn"
).onclick =
  function(){

    document.getElementById(
      "restoreInput"
    ).click();

  };


document.getElementById(
  "restoreInput"
).onchange =
  async function(event){

    const file =
      event.target.files[0];

    if(!file){
      return;
    }


    try{

      const text =
        await file.text();

      const backup =
        JSON.parse(
          text
        );


      if(
        !backup ||
        !Array.isArray(
          backup.pages
        )
      ){

        throw new Error(
          "Invalid backup"
        );

      }


      for(
        const page of
        backup.pages
      ){

        await saveRecord(
          "pages",
          page
        );

      }


      for(
        const item of
        (
          backup.events ||
          []
        )
      ){

        await saveRecord(
          "events",
          item
        );

      }


      for(
        const item of
        (
          backup.todos ||
          []
        )
      ){

        await saveRecord(
          "todos",
          item
        );

      }


      for(
        const item of
        (
          backup.memories ||
          []
        )
      ){

        await saveRecord(
          "memories",
          item
        );

      }


      if(
        backup.settings
      ){

        settings =
          {
            ...settings,
            ...backup.settings
          };

        await saveSettings();

        applySettings();

      }


      await loadPage();

      toast(
        "Diary restored"
      );


    }catch(error){

      console.error(
        "Restore:",
        error
      );

      alert(
        "The selected backup could not be restored."
      );

    }


    event.target.value =
      "";

  };

/* =========================================================
   OLD DATA RECOVERY
========================================================= */

async function recoverOldLocalStorage(){

  try{

    const old =
      localStorage.getItem(
        "myPersonalDiaryEntries"
      );


    if(!old){
      return;
    }


    const data =
      JSON.parse(
        old
      );


    if(
      !data ||
      typeof data !==
      "object"
    ){
      return;
    }


    for(
      const date of
      Object.keys(data)
    ){

      const existing =
        await getPagesForDate(
          date
        );


      if(
        existing.length
      ){
        continue;
      }


      const value =
        data[date];


      let content =
        "";

      let mood =
        "";

      let quote =
        "";


      if(
        typeof value ===
        "string"
      ){

        content =
          value;

      }else if(
        value &&
        typeof value ===
        "object"
      ){

        content =
          value.content ||
          value.html ||
          value.text ||
          "";

        mood =
          value.mood ||
          "";

        quote =
          value.quote ||
          "";

      }


      await saveRecord(
        "pages",
        {

          id:
            `${date}|1`,

          date,

          page:1,

          content,

          drawing:"",

          mood,

          quote:
            quote ||
            quoteForDate(
              date
            ),

          updatedAt:
            Date.now()

        }
      );

    }


  }catch(error){

    console.log(
      "Old data recovery:",
      error
    );

  }

}


/* =========================================================
   OLD ATTACHMENTS RECOVERY
========================================================= */

async function recoverOldAttachments(){

  try{

    const old =
      await getAllRecords(
        "attachments"
      );


    if(
      old.length === 0
    ){
      return;
    }


    const memories =
      await getAllRecords(
        "memories"
      );


    for(
      const item of old
    ){

      if(
        !item ||
        !item.data ||
        !item.type
      ){
        continue;
      }


      const exists =
        memories.some(
          memory =>
            memory.legacyId ===
            item.id
        );


      if(exists){
        continue;
      }


      await saveRecord(
        "memories",
        {

          date:
            item.date ||
            currentDate,

          name:
            item.name ||
            "Recovered memory",

          type:
            item.type,

          data:
            item.data,

          legacyId:
            item.id,

          createdAt:
            item.createdAt ||
            Date.now()

        }
      );

    }

  }catch(error){

    console.log(
      "Old attachment recovery:",
      error
    );

  }

}


/* =========================================================
   EVENT REMINDER
========================================================= */

async function checkEventReminder(){

  try{

    const events =
      await getAllRecords(
        "events"
      );


    const now =
      new Date();


    const date =
      todayISO();


    const time =
      now.toTimeString()
        .slice(0,5);


    const due =
      events.filter(
        event =>
          event.date === date &&
          event.time === time
      );


    for(
      const event of due
    ){

      const key =
        "event-alert-" +
        event.id +
        "-" +
        date +
        "-" +
        time;


      if(
        sessionStorage.getItem(
          key
        )
      ){
        continue;
      }


      sessionStorage.setItem(
        key,
        "1"
      );


      alert(
        "📌 Diary Event\n\n" +
        event.title +
        (
          event.notes
            ? "\n\n" +
              event.notes
            : ""
        )
      );

    }

  }catch(error){

    console.log(
      "Reminder:",
      error
    );

  }

}


setInterval(
  checkEventReminder,
  30000
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      savePage();

      toast(
        "Diary saved"
      );

    }


    if(
      event.key ===
      "Escape"
    ){

      document
        .querySelectorAll(
          ".modal.show"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "show"
            )
        );

    }

  }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerSW(){

  if(
    !("serviceWorker" in navigator)
  ){
    return;
  }


  try{

    await navigator.serviceWorker.register(
      "./service-worker.js?v=10"
    );

  }catch(error){

    console.log(
      "Service worker:",
      error
    );

  }

}


/* =========================================================
   STARTUP
========================================================= */

async function startDiary(){

  const title =
    document.getElementById(
      "dateTitle"
    );


  /*
    Immediately show the date.
    This means the user never sees
    an indefinite Loading message.
  */

  title.textContent =
    formatDate(
      currentDate
    );


  try{

    /*
      STEP 1
      Open database.
    */

    await openDatabase();


    /*
      STEP 2
      Load settings.
    */

    await loadSettings();


    /*
      STEP 3
      Open diary immediately.
    */

    await loadPage();


    /*
      STEP 4
      Recover old data AFTER
      the diary is already usable.
    */

    setTimeout(
      async function(){

        await recoverOldLocalStorage();

        await recoverOldAttachments();

      },
      100
    );


    /*
      STEP 5
      Service worker.
    */

    await registerSW();


    toast(
      "Diary ready"
    );


  }catch(error){

    console.error(
      "DIARY STARTUP ERROR",
      error
    );


    title.textContent =
      formatDate(
        currentDate
      );


    document.getElementById(
      "quoteRow"
    ).textContent =
      "Diary startup needs attention";


    /*
      IMPORTANT:
      Do not leave user at Loading.
    */

    alert(
      "The diary could not open its saved database.\n\n" +
      "First close every other My Personal Diary tab, " +
      "then reload this page.\n\n" +
      "Your existing diary data has NOT been intentionally deleted."
    );

  }

}


/* =========================================================
   START
========================================================= */

startDiary();
