<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4226">
<link rel="manifest" href="./manifest.json">

<title>My Personal Diary</title>

<style>
:root{
  --ink:#3d2b1f;
  --paper:#f7edcf;
  --paper2:#f1dfb4;
  --line:rgba(106,86,57,.28);
  --accent:#6b4226;
  --shadow:0 18px 45px rgba(54,35,18,.28);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Georgia,"Times New Roman",serif;
  color:var(--ink);
}

body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.25),transparent 30%),
    linear-gradient(135deg,#b99a70,#d9c29b 48%,#ad8b62);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:1250px;
  margin:auto;
  padding:14px;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  padding:10px 12px;
  background:rgba(64,38,20,.92);
  color:white;
  border-radius:14px;
  box-shadow:0 8px 20px #0003;
  position:sticky;
  top:8px;
  z-index:20;
}

.toolbar button{
  border:1px solid #ffffff44;
  background:#fff;
  color:#4a3020;
  border-radius:9px;
  padding:8px 10px;
}

.toolbar .title{
  font-weight:bold;
  font-size:18px;
  margin-right:auto;
  color:white;
}

/* DATE */

.datebar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:12px 0;
}

.datebar button{
  border:0;
  border-radius:9px;
  padding:8px 12px;
  background:#fff8e8;
  color:var(--accent);
}

.datebar input{
  padding:8px;
  border:1px solid #8e7659;
  border-radius:8px;
  background:#fff8e8;
}

/* CALENDAR */

.calendar{
  display:none;
  background:#fff7e8;
  border-radius:12px;
  padding:12px;
  margin:8px 0;
  border:1px solid #b99a68;
}

.calendar.show{
  display:block;
}

/* DIARY */

.diary-stage{
  display:flex;
  justify-content:center;
  position:relative;
  padding:10px 8px 55px;
}

.page{
  width:min(100%,1040px);

  /* MUCH LONGER PAGE */
  min-height:1100px;

  position:relative;
  overflow:hidden;

  padding:60px 58px 90px 105px;

  border-radius:7px 15px 15px 7px;

  background:
    linear-gradient(
      90deg,
      rgba(126,89,46,.13),
      transparent 5%
    ),
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 31px,
      var(--line) 32px,
      transparent 33px
    ),
    linear-gradient(
      100deg,
      var(--paper),
      #fbf1d5 55%,
      var(--paper2)
    );

  box-shadow:
    var(--shadow),
    inset 10px 0 20px rgba(91,58,26,.09);

  border:1px solid #b89a68;

  transform:rotate(-.12deg);
}

/* Natural paper texture */

.page:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(100,70,35,.08) 0 1px,
      transparent 2px
    );

  background-size:8px 8px;
  opacity:.25;
}

/* Soft paper edge */

.page:after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:12px;

  background:linear-gradient(
    to left,
    rgba(80,50,20,.13),
    transparent
  );

  pointer-events:none;
}

/* HEADER */

.page-header{
  position:relative;
  z-index:6;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  margin-bottom:12px;
}

.day-title{
  font-size:28px;
  font-weight:bold;
}

.small{
  font-size:13px;
  opacity:.75;
}

/* NATURAL SPIRAL */

.spiral{
  position:absolute;

  left:10px;
  top:25px;
  bottom:30px;

  width:58px;

  z-index:10;

  display:flex;
  flex-direction:column;
  justify-content:space-around;

  pointer-events:none;
}

.ring{
  width:48px;
  height:22px;

  border:4px solid #59534b;
  border-left-color:#302d29;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      #c5c1b9,
      #66615a
    );

  box-shadow:
    2px 3px 4px #0005,
    inset 0 2px 2px #fff9;
}

/* SPIRAL HOLES */

.hole{
  position:absolute;

  left:73px;

  width:10px;
  height:10px;

  border-radius:50%;

  background:#60472d66;

  box-shadow:
    inset 1px 2px 2px #0005;
}

/* EMOJI */

.emoji-bar{
  position:relative;
  z-index:7;

  display:flex;
  gap:4px;
  flex-wrap:wrap;

  padding:6px 8px;
  margin-bottom:8px;

  background:rgba(255,248,232,.82);

  border:1px solid #c5a875;
  border-radius:10px;
}

.emoji-bar button{
  border:0;
  background:transparent;

  font-size:23px;

  padding:3px 5px;

  border-radius:6px;
}

.emoji-bar button:hover{
  background:#ead9b8;
}

/* QUOTE */

#quote{
  position:relative;
  z-index:6;

  margin-bottom:12px;

  font-style:italic;
}

/* WRITING AREA */

#content{
  position:relative;
  z-index:6;

  min-height:760px;

  outline:none;

  font-size:20px;
  line-height:32px;

  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

#content:empty:before{
  content:"Write your thoughts here…";
  opacity:.38;
}

/* DRAWING */

#drawingCanvas{
  position:absolute;

  left:80px;
  right:28px;

  top:190px;
  bottom:70px;

  width:auto;
  height:auto;

  z-index:8;

  pointer-events:none;

  touch-action:none;
}

body.draw-active #drawingCanvas{
  pointer-events:auto;
}

body.draw-active #content{
  user-select:none;
}

/* DRAWING TOOLBAR */

.drawing-panel{
  position:fixed;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  z-index:50;

  display:none;

  gap:6px;
  align-items:center;
  flex-wrap:wrap;

  background:#fff9ed;

  padding:9px;

  border-radius:14px;

  box-shadow:0 8px 30px #0005;

  border:1px solid #b99a68;
}

.drawing-panel.show{
  display:flex;
}

.drawing-panel button,
.drawing-panel select{
  padding:7px 9px;

  border:1px solid #b99a68;

  border-radius:8px;

  background:#fff;
}

/* NEW PAGE */

.new-page{
  position:absolute;

  right:24px;
  bottom:18px;

  z-index:12;

  border:1px solid #8f704d;

  background:#ead3a6;

  border-radius:10px;

  padding:11px 17px;

  box-shadow:2px 3px 5px #0002;

  font-weight:bold;
}

/* TODO */

.todo{
  position:relative;
  z-index:9;

  margin:12px 0;

  padding:12px;

  border:1px solid #b99a68;

  background:#fff8e866;

  border-radius:10px;
}

.todo-item{
  display:flex;
  align-items:center;
  gap:8px;
  margin:5px 0;
}

.todo-item.done span{
  text-decoration:line-through;
  opacity:.5;
}

/* MODALS */

.modal[hidden]{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;

  z-index:100;

  background:#0008;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:15px;
}

.modal-card{
  width:min(94vw,520px);

  max-height:90vh;

  overflow:auto;

  background:#fff8e8;

  padding:20px;

  border-radius:15px;

  box-shadow:0 20px 60px #0007;
}

.modal-card h2{
  margin-top:0;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-card input,
.modal-card textarea,
.modal-card select{
  width:100%;

  padding:9px;

  border:1px solid #a98a5d;

  border-radius:8px;

  background:#fffdf6;

  margin:5px 0 10px;
}

.modal-actions{
  display:flex;

  gap:8px;

  justify-content:flex-end;

  margin-top:10px;
}

.modal-actions button{
  padding:9px 13px;

  border-radius:8px;

  border:1px solid #9d8057;
}

/* MEMORIES */

.memory-grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(120px,1fr));

  gap:10px;
}

.memory-grid img{
  width:100%;
  height:120px;

  object-fit:cover;

  border-radius:8px;
}

/* STATUS */

.status{
  text-align:center;

  font-size:12px;

  opacity:.7;

  margin-top:5px;
}

/* MOBILE / TABLET */

@media(max-width:700px){

  .app{
    padding:6px;
  }

  .toolbar{
    position:static;
  }

  .toolbar .title{
    width:100%;
  }

  .page{

    min-height:900px;

    padding:
      45px
      25px
      75px
      78px;
  }

  .day-title{
    font-size:23px;
  }

  #content{
    font-size:18px;
    line-height:30px;

    min-height:650px;
  }

  .spiral{
    left:6px;
    width:43px;
  }

  .ring{
    width:39px;
    height:18px;
  }

  #drawingCanvas{
    left:65px;
    right:15px;
    top:165px;
    bottom:60px;
  }

  .form-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- TOOLBAR -->

<div class="toolbar">

  <div class="title">
    📖 My Personal Diary
  </div>

  <button id="calendarBtn">📅 Calendar</button>

  <button id="eventBtn">🗓️ Event</button>

  <button id="memoryBtn">🖼️ Memories</button>

  <button id="todoBtn">☑️ To-do</button>

  <button id="drawBtn">✏️ Draw</button>

  <button id="printBtn">🖨️ Print</button>

  <button id="backupBtn">💾 Backup</button>

  <button id="restoreBtn">↩️ Restore</button>

  <input
    id="restoreFile"
    type="file"
    accept=".json"
    hidden
  >

</div>

<!-- CALENDAR -->

<div id="calendar" class="calendar">

  <input id="calendarDate" type="date">

  <button id="openDateBtn">
    Open Date
  </button>

  <button id="todayBtn">
    Today
  </button>

  <div id="calendarInfo" class="small"></div>

</div>

<!-- DATE -->

<div class="datebar">

  <button id="prevBtn">
    ‹ Previous
  </button>

  <input
    id="dateInput"
    type="date"
  >

  <button id="nextBtn">
    Next ›
  </button>

</div>

<!-- DIARY -->

<div class="diary-stage">

<article class="page" id="page">

  <!-- SPIRAL -->

  <div
    class="spiral"
    id="spiral">
  </div>

  <!-- HEADER -->

  <div class="page-header">

    <div>

      <div
        class="day-title"
        id="dayTitle">
      </div>

      <div
        class="small"
        id="pageNo">
      </div>

    </div>

    <button
      id="quoteBtn"
      title="Change quote">
      💬 Quote
    </button>

  </div>

  <!-- EMOJIS -->

  <div
    class="emoji-bar"
    id="emojiBar">
  </div>

  <!-- QUOTE -->

  <div
    id="quote"
    class="small">
  </div>

  <!-- WRITING -->

  <div
    id="content"
    contenteditable="true"
    spellcheck="true">
  </div>

  <!-- TODO -->

  <div
    class="todo"
    id="todoBox"
    hidden>

    <strong>☑️ To-do</strong>

    <div id="todoList"></div>

    <div
      style="
      display:flex;
      gap:6px;
      margin-top:8px">

      <input
        id="todoInput"
        placeholder="Add a task…"
        style="
        flex:1;
        padding:8px;
        border:1px solid #b99a68;

      <button id="addTodo">
        Add

  <button

</article>

</div>

  id="status">

</div>

</div>

<!-- DRAWING PANEL -->

<div
  class="drawing-panel"
  id="drawingPanel">

  <strong>Drawing:</strong>

  <button data-tool="pen">
    Pen
  </button>

  <button data-tool="line">
    Line
  </button>

  <button data-tool="circle">
    Circle
  </button>

  <button data-tool="eraser">
    Eraser
  </button>

  <select id="drawColor">

    <option value="#222">
      Black
    </option>

    <option value="#b3261e">
      Red
    </option>

    <option value="#174ea6">
      Blue
    </option>

    <option value="#18794e">
      Green
    </option>

  </select>

  <select id="drawSize">

    <option value="2">
      Fine
    </option>

    <option value="4" selected>
      Medium
    </option>

    <option value="8">
      Thick
    </option>

  </select>

  <button id="undoDraw">
    ↶
  </button>

  <button id="redoDraw">
    ↷
  </button>

  <button id="clearDraw">
    Clear
  </button>

  <button id="closeDraw">
    Close
  </button>

</div>

<!-- EVENT MODAL -->

<div
  class="modal"
  id="eventModal"
  hidden>

  <div class="modal-card">

    <h2>
      🗓️ Add Diary Event
    </h2>

    <label>
      Event title

      <input
        id="eventTitle"
        placeholder="Birthday, appointment, reminder…">
    </label>

    <div class="form-row">

      <label>
        Date

        <input
          id="eventDate"
          type="date">
      </label>

      <label>
        Time

        <input
          id="eventTime"
          type="time">
      </label>

    </div>

      Notes

      <textarea
        id="eventNotes"
        rows="3">
      </textarea>

    </label>

    <div class="modal-actions">

      <!-- CLOSE, NOT CANCEL -->

      <button id="closeEvent">
        Close
      </button>

      <button id="saveEvent">
        Save Event
      </button>

    </div>

  </div>

</div>

<!-- MEMORY MODAL -->

<div
  class="modal"
  id="memoryModal"
  hidden>

  <div class="modal-card">

    <h2>
      🖼️ Memories
    </h2>

    <input
      id="memoryFile"
      type="file"
      accept="image/*,application/pdf"
      capture="environment">

    <div
      id="memoryGrid"
      class="memory-grid">
    </div>

    <div class="modal-actions">

      <button id="closeMemory">
        Close
      </button>

    </div>

  </div>

</div>

<script>

/* DATABASE */

const DB="myPersonalDiaryDB";
const VER=4;

let db;

let currentDate=localDate();

let currentPage=1;

let pageRec=null;

/* QUOTES */

const quotes=[
  "The best time to write about your life is while you are living it.",
  "Small moments become precious memories.",
  "A quiet page can hold a very loud story.",
  "Today is a page that will never come again.",
  "Write what you want to remember.",
  "Every page is a piece of your story.",
  "Life is made beautiful by ordinary moments."
];

/* EMOJIS */

const emojis=[
  "😀","😊","😂","❤️","🙏","🌸","🌿",
  "✨","⭐","🎉","🎂","🎁","☀️","🌙",
  "☕","🍀","📌","💡","👍","👏",
  "🤗","😍","😄","😌","🕉️","🪔"
];

/* DATE */

function localDate(d=new Date()){

  let x=new Date(d);

  return new Date(
    x.getTime() -
    x.getTimezoneOffset()*60000
  ).toISOString().slice(0,10);
}

/* DATABASE OPEN */

function openDB(){

  return new Promise((resolve,reject)=>{

    const r=indexedDB.open(DB,VER);

    r.onupgradeneeded=e=>{

      let d=e.target.result;

      const stores=[
        "pages",
        "events",
        "attachments",
        "settings",
        "todos"
      ];

      stores.forEach(s=>{

        if(!d.objectStoreNames.contains(s)){

          let key=
            s==="pages" ? "id" :
            s==="events" ? "id" :
            s==="attachments" ? "id" :
            s==="settings" ? "key" :
            "id";

          let st=d.createObjectStore(
            s,
            {
              keyPath:key,
              autoIncrement:key==="id"
            }
          );

          if(s==="pages"){
            st.createIndex(
              "date",
              "date"
            );
          }

          if(s==="todos"){
            st.createIndex(
              "date",
              "date"
            );
          }

        }

      });

    };

    r.onsuccess=()=>{
      db=r.result;
      resolve(db);
    };

    r.onerror=()=>{
      reject(r.error);
    };

  });

}

/* DB HELPERS */

function tx(store,mode="readonly"){
  return db.transaction(
    store,
    mode
  ).objectStore(store);
}

function get(store,key){

  return new Promise((res,rej)=>{

    let r=tx(store).get(key);

    r.onsuccess=()=>{
      res(r.result);
    };

    r.onerror=()=>{
      rej(r.error);
    };

  });

}

function put(store,obj){

  return new Promise((res,rej)=>{

    let r=tx(
      store,
      "readwrite"
    ).put(obj);

    r.onsuccess=()=>{
      res(r.result);
    };

    r.onerror=()=>{
      rej(r.error);
    };

  });

}

function all(store){

  return new Promise((res,rej)=>{

    let r=tx(store).getAll();

    r.onsuccess=()=>{
      res(r.result);
    };

    r.onerror=()=>{
      rej(r.error);
    };

  });

}

function del(store,key){

  return new Promise((res,rej)=>{

    let r=tx(
      store,
      "readwrite"
    ).delete(key);

    r.onsuccess=()=>{
      res();
    };

    r.onerror=()=>{
      rej(r.error);
    };

  });

}

/* PAGE ID */

function pageId(){

  return currentDate+"-"+currentPage;

}

/* QUOTE */

function deterministicQuote(date){

  let n=0;

  for(
    const c of date
  ){

    n=
      (n+
       c.charCodeAt(0)*31)
      %quotes.length;

  }

  return quotes[n];

}

/* LOAD PAGE */

async function loadPage(){

  pageRec=
    await get(
      "pages",
      pageId()
    );

  if(!pageRec){

    pageRec={
      id:pageId(),
      date:currentDate,
      page:currentPage,
      html:"",
      drawing:"",
      quote:
        deterministicQuote(
          currentDate
        ),
      design:"natural"
    };

    await put(
      "pages",
      pageRec
    );

  }

  document.getElementById(
    "content"
  ).innerHTML=
    pageRec.html || "";

  document.getElementById(
    "quote"
  ).textContent=
    currentPage===1
      ? "“"+
        (
          pageRec.quote ||
          deterministicQuote(
            currentDate
          )
        )+
        "”"
      : "";

  document.getElementById(
    "dayTitle"
  ).textContent=
    new Date(
      currentDate+"T00:00:00"
    ).toLocaleDateString(
      undefined,
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  document.getElementById(
    "dateInput"
  ).value=currentDate;

  document.getElementById(
    "calendarDate"
  ).value=currentDate;

  document.getElementById(
    "pageNo"
  ).textContent=
    "Page "+currentPage;

  restoreDrawing(
    pageRec.drawing
  );

  await renderTodos();

  await checkEvents();

  document.getElementById(
    "status"
  ).textContent=
    "Saved locally";

}

/* SAVE */

let saveTimer;

function savePage(){

  clearTimeout(saveTimer);

  saveTimer=setTimeout(
    async()=>{

      if(!pageRec)return;

      pageRec.html=
        document.getElementById(
          "content"
        ).innerHTML;

      pageRec.drawing=
        drawCanvas.toDataURL(
          "image/png"
        );

      await put(
        "pages",
        pageRec
      );

      document.getElementById(
        "status"
      ).textContent=
        "Saved ✓";

    },
    250
  );

}

document.getElementById(
  "content"
).addEventListener(
  "input",
  savePage
);

/* SPIRAL */

function buildSpiral(){

  let s=
    document.getElementById(
      "spiral"
    );

  for(
    let i=0;
    i<20;
    i++
  ){

    let r=
      document.createElement(
        "div"
      );

    r.className="ring";

    s.appendChild(r);

    let h=
      document.createElement(
        "i"
      );

    h.className="hole";

    h.style.top=
      (30+i*4.7)+"%";

    document.getElementById(
      "page"
    ).appendChild(h);

  }

}

/* EMOJIS */

function buildEmojis(){

  let b=
    document.getElementById(
      "emojiBar"
    );

  emojis.forEach(e=>{

    let x=
      document.createElement(
        "button"
      );

    x.textContent=e;

    x.title=
      "Insert "+e;

    x.onclick=()=>{

      let editor=
        document.getElementById(
          "content"
        );

      editor.focus();

      document.execCommand(
        "insertText",
        false,
        e
      );

      savePage();

/* DRAWING */

const drawCanvas=
  document.getElementById(
    "drawingCanvas"
  );

const ctx=
  drawCanvas.getContext(
    "2d"
  );

let drawTool="pen";

let drawColor="#222";

let drawSize=4;

let drawing=false;

let startX=0;
let startY=0;

let lastX=0;
let lastY=0;

let history=[];
let redo=[];

/* RESIZE */

function resizeCanvas(
  preserve=true
){

  let old=
    document.createElement(
      "canvas"
    );

  if(
    preserve &&
    drawCanvas.width
  ){

    old.width=
      drawCanvas.width;

    old.height=
      drawCanvas.height;

    old.getContext(
      "2d"
    ).drawImage(
      drawCanvas,
      0,
      0
    );

  }

  let r=
    drawCanvas.getBoundingClientRect();

  let d=
    window.devicePixelRatio || 1;

  drawCanvas.width=
    Math.max(
      1,
      r.width*d
    );

  drawCanvas.height=
    Math.max(
      1,
      r.height*d
    );

  ctx.setTransform(
    d,
    0,
    0,
    d,
    0,
    0
  );

  if(
    preserve &&
    old.width
  ){

    ctx.drawImage(
      old,
      0,
      0,
      old.width,
      old.height,
      0,
      0,
      r.width,
      r.height
    );

  }

}

/* COORDINATES */

function xy(e){

  let r=
    drawCanvas.getBoundingClientRect();

  return{
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };

}

/* SNAPSHOT */

function snapshot(){

  history.push(
    drawCanvas.toDataURL()
  );

  if(
    history.length>30
  ){
    history.shift();
  }

  redo=[];

}

/* RESTORE */

function restoreData(url){

  let im=
    new Image();

  im.onload=()=>{

    ctx.clearRect(
      0,
      0,
      drawCanvas.clientWidth,
      drawCanvas.clientHeight
    );

    ctx.globalCompositeOperation=
      "source-over";

    ctx.drawImage(
      im,
      0,
      0,
      drawCanvas.clientWidth,
      drawCanvas.clientHeight
    );

  };

  im.src=url;

}

/* RESTORE DRAWING */

function restoreDrawing(data){

  resizeCanvas(false);

  if(
    data &&
    data.length>20
  ){

    restoreData(data);

  }

}

/*
DRAWING DOWN
*/

drawCanvas.addEventListener(
  "pointerdown",
  e=>{

    snapshot();

    drawing=true;

    drawCanvas.setPointerCapture(
      e.pointerId
    );

    let p=xy(e);

    startX=
      lastX=p.x;

    startY=
      lastY=p.y;

    /*
    ERASER FIX
    */

    if(
      drawTool==="eraser"
    ){

      ctx.globalCompositeOperation=
        "destination-out";

      ctx.lineWidth=
        Math.max(
          15,
          drawSize*6
        );

    }else{

      ctx.globalCompositeOperation=
        "source-over";

      ctx.strokeStyle=
        drawColor;

      ctx.lineWidth=
        drawSize;

    }

    ctx.lineCap="round";
    ctx.lineJoin="round";

    if(
      drawTool==="pen"
    ){

      ctx.beginPath();

      ctx.moveTo(
        p.x,
        p.y
      );

      ctx.lineTo(
        p.x+.1,
        p.y+.1
      );

      ctx.stroke();

    }

  }
);

/*
DRAWING MOVE
*/

drawCanvas.addEventListener(
  "pointermove",
  e=>{

    if(!drawing)return;

    let p=xy(e);

    if(
      drawTool==="pen" ||
      drawTool==="eraser"
    ){

      ctx.beginPath();

      ctx.moveTo(
        lastX,
        lastY
      );

      ctx.lineTo(
        p.x,
        p.y
      );

      ctx.stroke();

      lastX=p.x;
      lastY=p.y;

    }

  }
);

/*
DRAWING UP
*/

drawCanvas.addEventListener(
  "pointerup",
  e=>{

    drawing=false;

    try{
      drawCanvas.releasePointerCapture(
        e.pointerId
      );
    }catch(err){}

    ctx.globalCompositeOperation=
      "source-over";

    savePage();

  }
);

drawCanvas.addEventListener(
  "pointercancel",
  ()=>{
    drawing=false;

    ctx.globalCompositeOperation=
      "source-over";

    savePage();
  }
);

/* RENDER TODO */

async function renderTodos(){

  let box=
    document.getElementById(
      "todoList"
    );

  box.innerHTML="";

  let ts=
    (
      await all("todos")
    ).filter(
      x=>x.date===currentDate
    );

  ts.forEach(t=>{

    let row=
      document.createElement(
        "div"
      );

    row.className=
      "todo-item"+
      (
        t.done
        ? " done"
        : ""
      );

    let c=
      document.createElement(
        "input"
      );

    c.type="checkbox";

    c.checked=t.done;

    c.onchange=
      async()=>{

        t.done=
          c.checked;

        await put(
          "todos",
          t
        );

        if(!t.done){

          await carryTodos(
            nextDate(
              currentDate
            )
          );

        }

        await renderTodos();

      };

    let s=
      document.createElement(
        "span"
      );

    s.textContent=t.text;

    row.append(
      c,
      s
    );

    box.appendChild(
      row
    );

  });

}

/* NEXT DATE */

function nextDate(s){

  let d=
    new Date(
      s+"T00:00:00"
    );

  d.setDate(
    d.getDate()+1
  );

  return localDate(d);

}

/* PREVIOUS DATE */

function previousDate(s){

  let d=
    new Date(
      s+"T00:00:00"
    );

  d.setDate(
    d.getDate()-1
  );

  return localDate(d);

}

/* CARRY TODO */

async function carryTodos(
  date
){

  let prev=
    previousDate(date);

  let ts=
    (
      await all("todos")
    ).filter(
      x=>
        x.date===prev &&
        !x.done
    );

  let allTodos=
    await all("todos");

  for(
    const t of ts
  ){

    let exists=
      allTodos.some(
        x=>
          x.date===date &&
          x.text===t.text &&
          !x.done
      );

    if(!exists){

      await put(
        "todos",
        {
          date:date,
          text:t.text,
          done:false,
          created:Date.now(),
          carriedFrom:prev
        }
      );

    }

  }

}

async function renderMemories(){

    document.getElementById(
      "memoryGrid"
    );

  g.innerHTML="";

  let as=
    (
      await all(
        "attachments"
      )
    ).filter(
      x=>x.date===currentDate
    );

  as.forEach(a=>{

    let wrap=
      document.createElement(
        "div"
      );

    if(
      a.type &&
      a.type.startsWith(
        "image/"
      )
    ){

      let im=
        document.createElement(
          "img"
        );

      im.src=a.data;

      wrap.appendChild(im);

    }else{

      wrap.textContent=
        "📄 "+a.name;

    }

    let b=
      document.createElement(
        "button"
      );

    b.textContent=
      "Delete";

    b.onclick=
      async()=>{

        await del(
          "attachments",
          a.id
        );

        await renderMemories();

      };

    wrap.appendChild(b);

    g.appendChild(
      wrap
    );

  });

}
