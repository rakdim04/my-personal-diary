<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4226">
<link rel="manifest" href="./manifest.json">

<title>My Personal Diary v8.1</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#d6c3a5;
  color:#3e2a1f;
  font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   APP
========================= */

.app{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

header{
  background:#6b4226;
  color:white;
  border-radius:16px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 5px 15px #0003;
}

header h1{
  margin:0;
  font-size:22px;
}

.headerButtons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

button,
select,
input{
  font-family:inherit;
}

button{
  border:0;
  border-radius:9px;
  padding:8px 12px;
  background:#8a5a35;
  color:white;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  opacity:.9;
}

button.secondary{
  background:#e6d4bb;
  color:#4a3223;
}

button.danger{
  background:#a33a32;
}

button.green{
  background:#53764d;
}

/* =========================
   CALENDAR
========================= */

.calendarBox{
  margin-top:12px;
  background:#f7eedf;
  border-radius:15px;
  padding:12px;
  box-shadow:0 4px 12px #0002;
}

.calendarHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.calendarGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.calWeek{
  text-align:center;
  font-weight:bold;
  font-size:12px;
  padding:5px;
}

.calCell{
  min-height:42px;
  background:#ead9c1;
  color:#4b3426;
  padding:4px;
  border-radius:8px;
  position:relative;
}

.calCell.today{
  outline:2px solid #8a5a35;
}

.calCell.selected{
  background:#b98757;
  color:white;
}

.calCell .mood{
  position:absolute;
  bottom:2px;
  right:3px;
  font-size:13px;
}

/* =========================
   DIARY PAGE
========================= */

.diaryWrap{
  margin-top:14px;
  position:relative;
  display:flex;
  justify-content:center;
}

.page{
  position:relative;
  width:min(900px,100%);
  min-height:760px;
  padding:34px 38px 38px 72px;
  border-radius:5px 18px 18px 5px;

  background:#fffaf0;

  box-shadow:
    0 12px 30px #0003,
    inset 0 0 25px #8b6b4322;

  overflow:hidden;

  transition:
    transform .35s ease,
    opacity .35s ease;
}

/* =========================
   SPIRAL / SPRINKLE BINDING
========================= */

.binding{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:54px;

  background:
    linear-gradient(
      90deg,
      #765238,
      #a9825e 45%,
      #62452f
    );

  border-right:2px solid #503522;
}

.ring{
  position:absolute;
  left:10px;
  width:35px;
  height:16px;

  border:4px solid #5c5c5c;
  border-left-color:#777;
  border-radius:50%;

  background:transparent;
  box-shadow:inset 0 1px 2px #fff6;
}

.ring:nth-child(1){top:3%}
.ring:nth-child(2){top:8%}
.ring:nth-child(3){top:13%}
.ring:nth-child(4){top:18%}
.ring:nth-child(5){top:23%}
.ring:nth-child(6){top:28%}
.ring:nth-child(7){top:33%}
.ring:nth-child(8){top:38%}
.ring:nth-child(9){top:43%}
.ring:nth-child(10){top:48%}
.ring:nth-child(11){top:53%}
.ring:nth-child(12){top:58%}
.ring:nth-child(13){top:63%}
.ring:nth-child(14){top:68%}
.ring:nth-child(15){top:73%}
.ring:nth-child(16){top:78%}
.ring:nth-child(17){top:83%}
.ring:nth-child(18){top:88%}
.ring:nth-child(19){top:93%}

/* =========================
   DECORATIVE PAGE DESIGNS
========================= */

.design-classic{
  background:
    linear-gradient(#fffaf0,#fffaf0);
}

.design-vintage{
  background:
    radial-gradient(circle at 20% 20%,#ead6b4 0 2px,transparent 3px),
    #f4e5c8;
}

.design-floral{
  background:
    radial-gradient(circle at 10% 10%,#f3d6dc 0 20px,transparent 21px),
    radial-gradient(circle at 90% 20%,#d7e7cc 0 18px,transparent 19px),
    #fffaf2;
}

.design-blue{
  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0,
      #fff 30px,
      #c7d9e8 31px,
      #fff 32px
    );
}

.design-dark{
  background:#302923;
  color:#f4e8d5;
}

.design-woodland{
  background:
    radial-gradient(circle at 85% 15%,#dbe6cc 0 25px,transparent 26px),
    radial-gradient(circle at 15% 80%,#c6d8b9 0 30px,transparent 31px),
    #f2eadb;
}

.design-dark .editor{
  color:#f7ead7;
}

.design-dark .todoBox,
.design-dark .quoteBox{
  color:#3e2a1f;
}

/* =========================
   TOP ROW
========================= */

.pageTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.dateTitle{
  font-size:25px;
  font-weight:bold;
}

.pageNumber{
  font-size:13px;
  opacity:.75;
}

.moodRow{
  margin-top:10px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.moodBtn{
  background:#eadbc7;
  color:#3e2a1f;
  font-size:20px;
  padding:5px 9px;
}

.moodBtn.active{
  background:#b98757;
  color:white;
}

/* =========================
   QUOTE
========================= */

.quoteBox{
  margin-top:15px;
  padding:14px 16px;
  border-left:5px solid #8a5a35;
  background:#f2e3cd;
  border-radius:8px;
  font-style:italic;
}

.quoteTitle{
  font-weight:bold;
  font-style:normal;
  margin-bottom:5px;
}

.quoteText{
  line-height:1.5;
}

/* =========================
   EDITOR
========================= */

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:15px;
  padding:8px;
  background:#ead9c1;
  border-radius:9px;
}

.toolbar button{
  padding:7px 10px;
}

.editorWrap{
  position:relative;
  margin-top:8px;
}

.editor{
  min-height:360px;
  padding:15px;
  border:1px dashed #9d8062;
  border-radius:8px;
  background:#ffffff66;

  font-size:18px;
  line-height:1.6;

  outline:none;
}

.editor:focus{
  border-color:#8a5a35;
}

.editor ul{
  padding-left:25px;
}

/* =========================
   DRAWING
========================= */

.drawArea{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  touch-action:none;
}

.drawArea.enabled{
  pointer-events:auto;
}

.drawArea.enabled #drawCanvas{
  pointer-events:auto;
  cursor:crosshair;
}

.drawTools{
  display:none;
  margin-top:8px;
  padding:8px;
  background:#ead9c1;
  border-radius:9px;
  gap:5px;
  flex-wrap:wrap;
}

.drawTools.show{
  display:flex;
}

.drawTools button.active{
  background:#4f6f8f;
}

.drawExit{
  background:#a33a32;
}

/* =========================
   TODO
========================= */

.todoBox{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#f0e1cb;
}

.todoHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.todoList{
  margin-top:8px;
}

.todoItem{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 0;
  border-bottom:1px dotted #aa8c6c;
}

.todoItem.done .todoText{
  text-decoration:line-through;
  opacity:.55;
}

.todoText{
  flex:1;
}

.todoAdd{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.todoAdd input{
  flex:1;
  padding:8px;
  border:1px solid #b59a7b;
  border-radius:7px;
}

/* =========================
   MEMORIES
========================= */

.memoryBox{
  margin-top:15px;
  padding:12px;
  background:#f0e1cb;
  border-radius:9px;
}

.memoryGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:8px;
  margin-top:8px;
}

.memoryCard{
  background:#fff;
  border-radius:8px;
  padding:5px;
  box-shadow:0 2px 6px #0002;
}

.memoryCard img{
  width:100%;
  height:90px;
  object-fit:cover;
  border-radius:5px;
}

.memoryActions{
  display:flex;
  gap:4px;
  margin-top:4px;
}

.memoryActions button{
  flex:1;
  padding:5px;
  font-size:12px;
}

/* =========================
   BOTTOM CONTROLS
========================= */

.bottomBar{
  margin-top:18px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.bottomGroup{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* =========================
   MODALS
========================= */

[hidden]{
  display:none !important;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;
}

.modalCard{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;

  background:#fffaf0;
  color:#3e2a1f;

  border-radius:15px;
  padding:18px;

  box-shadow:0 15px 40px #0005;
}

.modalCard h2{
  margin-top:0;
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:12px;
  flex-wrap:wrap;
}

.formRow{
  margin-top:10px;
}

.formRow label{
  display:block;
  font-weight:bold;
  margin-bottom:4px;
}

.formRow input,
.formRow select,
.formRow textarea{
  width:100%;
  padding:9px;
  border:1px solid #b59a7b;
  border-radius:7px;
}

/* =========================
   PAGE ANIMATION
========================= */

.page.turnNext{
  animation:turnNext .4s ease;
}

.page.turnPrev{
  animation:turnPrev .4s ease;
}

@keyframes turnNext{
  0%{
    transform:translateX(0) rotateY(0);
    opacity:1;
  }
  50%{
    transform:translateX(-40px) rotateY(-8deg);
    opacity:.5;
  }
  100%{
    transform:translateX(0) rotateY(0);
    opacity:1;
  }
}

@keyframes turnPrev{
  0%{
    transform:translateX(0) rotateY(0);
    opacity:1;
  }
  50%{
    transform:translateX(40px) rotateY(8deg);
    opacity:.5;
  }
  100%{
    transform:translateX(0) rotateY(0);
    opacity:1;
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .app{
    padding:7px;
  }

  header{
    flex-direction:column;
    align-items:stretch;
  }

  header h1{
    text-align:center;
  }

  .headerButtons{
    justify-content:center;
  }

  .page{
    min-height:700px;
    padding:
      25px
      18px
      30px
      62px;
  }

  .binding{
    width:45px;
  }

  .ring{
    left:7px;
    width:31px;
  }

  .dateTitle{
    font-size:21px;
  }

  .editor{
    min-height:330px;
    font-size:17px;
  }

  .calendarGrid{
    gap:2px;
  }

  .calCell{
    min-height:38px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>📖 My Personal Diary</h1>

  <div class="headerButtons">
    <button onclick="toggleCalendar()">📅 Calendar</button>
    <button onclick="openEventModal()">🔔 Event</button>
    <button onclick="openGallery()">🖼 Memories</button>
    <button onclick="openSettings()">⚙️ Settings</button>
  </div>
</header>

<!-- CALENDAR -->
<section id="calendarBox" class="calendarBox" hidden>

  <div class="calendarHead">
    <button class="secondary" onclick="previousMonth()">◀</button>

    <strong id="calendarTitle"></strong>

    <button class="secondary" onclick="nextMonth()">▶</button>
  </div>

  <div class="calendarGrid" id="calendarGrid"></div>

</section>

<!-- DIARY -->
<div class="diaryWrap">

<section id="page" class="page design-classic">

  <!-- SPIRAL -->
  <div class="binding">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <div class="pageTop">

    <div>
      <div class="dateTitle" id="dateTitle"></div>
      <div class="pageNumber" id="pageNumber"></div>
    </div>

    <div>
      <button onclick="newPage()">➕ New Page</button>
    </div>

  </div>

  <!-- MOOD -->
  <div class="moodRow">

    <button class="moodBtn" data-mood="😊" onclick="setMood('😊')">😊</button>

    <button class="moodBtn" data-mood="😄" onclick="setMood('😄')">😄</button>

    <button class="moodBtn" data-mood="😍" onclick="setMood('😍')">😍</button>

    <button class="moodBtn" data-mood="😐" onclick="setMood('😐')">😐</button>

    <button class="moodBtn" data-mood="😔" onclick="setMood('😔')">😔</button>

    <button class="moodBtn" data-mood="😡" onclick="setMood('😡')">😡</button>

    <button class="moodBtn" data-mood="🙏" onclick="setMood('🙏')">🙏</button>

  </div>

  <!-- QUOTE -->
  <div id="quoteBox" class="quoteBox" hidden>

    <div class="quoteTitle">
      ✨ Quote of the Day
    </div>

    <div id="quoteText" class="quoteText"></div>

    <button class="secondary" onclick="changeQuote()">
      🔄 Change Quote
    </button>

  </div>

  <!-- EDITOR TOOLBAR -->
  <div class="toolbar">

    <button onclick="formatText('bold')">
      <b>B</b>
    </button>

    <button onclick="formatText('underline')">
      <u>U</u>
    </button>

    <button onclick="formatText('italic')">
      <i>I</i>
    </button>

    <button onclick="formatText('insertUnorderedList')">
      • List
    </button>

    <button onclick="toggleDrawing()">
      ✏️ Draw
    </button>

  </div>

  <!-- DRAWING TOOLBAR -->
  <div id="drawTools" class="drawTools">

    <button onclick="setDrawTool('pen')" id="toolPen">
      ✏️ Pen
    </button>

    <button onclick="setDrawTool('line')" id="toolLine">
      ╱ Line
    </button>

    <button onclick="setDrawTool('circle')" id="toolCircle">
      ◯ Circle
    </button>

    <button onclick="setDrawTool('eraser')" id="toolEraser">
      🧽 Eraser
    </button>

    <button onclick="setDrawColor('#222')">
      ⚫
    </button>

    <button onclick="setDrawColor('#d33')">
      🔴
    </button>

    <button onclick="setDrawColor('#2864a8')">
      🔵
    </button>

    <button onclick="setDrawColor('#3d7a3d')">
      🟢
    </button>

    <button onclick="undoDrawing()">
      ↩ Undo
    </button>

    <button onclick="redoDrawing()">
      ↪ Redo
    </button>

    <button onclick="clearDrawing()" class="danger">
      🗑 Clear
    </button>

    <button onclick="toggleDrawing()" class="drawExit">
      ✖ Done
    </button>

  </div>

  <!-- EDITOR -->
  <div class="editorWrap">

    <div
      id="editor"
      class="editor"
      contenteditable="true"
      spellcheck="true"
      oninput="scheduleAutoSave()">
    </div>

    <!-- DRAWING CANVAS -->
    <div id="drawArea" class="drawArea">
      <canvas id="drawCanvas"></canvas>
    </div>

  </div>

  <!-- TODO -->
  <div class="todoBox">

    <div class="todoHead">
      <strong>☑️ To-Do List</strong>
      <span id="todoCount"></span>
    </div>

    <div id="todoList" class="todoList"></div>

    <div class="todoAdd">
      <input
        id="todoInput"
        type="text"
        placeholder="Add task..."
        onkeydown="if(event.key==='Enter') addTodo()">

      <button onclick="addTodo()">＋</button>
    </div>

  </div>

  <!-- MEMORIES -->
  <div class="memoryBox">

    <strong>📎 Memories</strong>

    <div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap">

      <button onclick="openMemoryInput()">
        📷 Camera / Photo
      </button>

      <button onclick="document.getElementById('documentInput').click()">
        📄 Scan / Document
      </button>

    </div>

    <input
      id="memoryInput"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
      onchange="addMemoryFile(event)">

    <input
      id="documentInput"
      type="file"
      accept="image/*,.pdf,.doc,.docx"
      capture="environment"
      hidden
      onchange="addMemoryFile(event)">

    <div id="memoryGrid" class="memoryGrid"></div>

  </div>

  <!-- BOTTOM -->
  <div class="bottomBar">

    <div class="bottomGroup">

      <button onclick="previousPage()">
        ◀ Previous
      </button>

      <button onclick="nextPage()">
        Next ▶
      </button>

    </div>

    <div class="bottomGroup">

      <button class="green" onclick="savePage(true)">
        💾 Save
      </button>

      <button onclick="printPage()">
        🖨 Print
      </button>

    </div>

  </div>

</section>

</div>

</div>

<!-- EVENT MODAL -->
<div id="eventModal" class="modal" hidden>

  <div class="modalCard">

    <h2>🔔 Diary Event</h2>

    <div class="formRow">
      <label>Event</label>
      <input id="eventTitle" type="text">
    </div>

    <div class="formRow">
      <label>Date</label>
      <input id="eventDate" type="date">
    </div>

    <div class="formRow">
      <label>Time</label>
      <input id="eventTime" type="time">
    </div>

    <div class="formRow">
      <label>Reminder minutes before</label>
      <input id="eventReminder" type="number" value="10">
    </div>

    <div class="modalActions">

      <button
        class="secondary"
        onclick="closeEventModal()">
        Cancel
      </button>

      <button onclick="saveEvent()">
        Save Event
      </button>

    </div>

    <hr>

    <h3>Events for this date</h3>

    <div id="eventList"></div>

  </div>

</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal" hidden>

  <div class="modalCard">

    <h2>⚙️ Diary Settings</h2>

    <div class="formRow">

      <label>Diary Page Design</label>

      <select id="designSelect" onchange="changeDesign(this.value)">

        <option value="classic">Classic Cream</option>
        <option value="vintage">Vintage</option>
        <option value="floral">Floral</option>
        <option value="blue">Blue Lines</option>
        <option value="dark">Dark</option>
        <option value="woodland">Woodland</option>

      </select>

    </div>

    <hr>

    <h3>Google Calendar</h3>

    <div class="formRow">

      <label>Google OAuth Client ID</label>

      <input
        id="googleClientId"
        type="text"
        placeholder="Enter Google OAuth Client ID">

    </div>

    <button onclick="connectGoogleCalendar()">
      🔗 Connect Google Calendar
    </button>

    <hr>

    <div style="display:flex;gap:5px;flex-wrap:wrap">

      <button onclick="backupDiary()">
        💾 Backup
      </button>

      <button onclick="document.getElementById('restoreInput').click()">
        ♻️ Restore
      </button>

      <input
        id="restoreInput"
        type="file"
        accept=".json"
        hidden
        onchange="restoreDiary(event)">

    </div>

    <div class="modalActions">

      <button
        class="secondary"
        onclick="closeSettings()">
        Close
      </button>

    </div>

  </div>

</div>

<!-- GALLERY -->
<div id="galleryModal" class="modal" hidden>

  <div class="modalCard">

    <h2>🖼 Memory Gallery</h2>

    <div id="galleryGrid" class="memoryGrid"></div>

    <div class="modalActions">

      <button
        class="secondary"
        onclick="closeGallery()">
        Close
      </button>

    </div>

  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightboxModal" class="modal" hidden>

  <div class="modalCard">

    <img
      id="lightboxImage"
      style="width:100%;max-height:75vh;object-fit:contain">

    <div class="modalActions">

      <button onclick="closeLightbox()">
        Close
      </button>

    </div>

  </div>

</div>

<script>
/* ================================
   DATABASE
================================ */

const DB_NAME = "myPersonalDiaryDB";
const DB_VERSION = 3;

const PAGE_STORE = "pages";
const EVENT_STORE = "events";
const ATTACH_STORE = "attachments";
const SETTINGS_STORE = "settings";
const TODO_STORE = "todos";

let db;

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = e => {

      const database = e.target.result;

      if(!database.objectStoreNames.contains(PAGE_STORE)){
        database.createObjectStore(
          PAGE_STORE,
          {keyPath:"id"}
        );
      }

      if(!database.objectStoreNames.contains(EVENT_STORE)){
        database.createObjectStore(
          EVENT_STORE,
          {keyPath:"id"}
        );
      }

      if(!database.objectStoreNames.contains(ATTACH_STORE)){
        database.createObjectStore(
          ATTACH_STORE,
          {keyPath:"id"}
        );
      }

      if(!database.objectStoreNames.contains(SETTINGS_STORE)){
        database.createObjectStore(
          SETTINGS_STORE,
          {keyPath:"key"}
        );
      }

      if(!database.objectStoreNames.contains(TODO_STORE)){
        database.createObjectStore(
          TODO_STORE,
          {keyPath:"id"}
        );
      }

    };

    request.onsuccess = e => {

      db = e.target.result;

      resolve(db);

    };

    request.onerror = () => reject(request.error);

  });

}

function dbPut(store,value){

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(store,"readwrite");

    tx.objectStore(store).put(value);

    tx.oncomplete=()=>resolve();

    tx.onerror=()=>reject(tx.error);

  });

}

function dbGet(store,key){

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(store,"readonly");

    const request=
      tx.objectStore(store).get(key);

    request.onsuccess=()=>resolve(request.result);

    request.onerror=()=>reject(request.error);

  });

}

function dbGetAll(store){

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(store,"readonly");

    const request=
      tx.objectStore(store).getAll();

    request.onsuccess=()=>resolve(request.result);

    request.onerror=()=>reject(request.error);

  });

}

function dbDelete(store,key){

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(store,"readwrite");

    tx.objectStore(store).delete(key);

    tx.oncomplete=()=>resolve();

    tx.onerror=()=>reject(tx.error);

  });

}

/* ================================
   DATE
================================ */

let selectedDate =
  new Date().toISOString().slice(0,10);

let currentPage = 1;

let currentPages = [];

let calendarDate = new Date();

/* ================================
   QUOTES
================================ */

const quotes = [

  "Every day is a new page in the story of your life.",

  "Small steps every day create big changes.",

  "The best way to predict your future is to create it.",

  "Write today so tomorrow remembers.",

  "Gratitude turns ordinary days into beautiful memories.",

  "Do something today that your future self will thank you for.",

  "Life is made of moments. Treasure them.",

  "A peaceful mind creates a meaningful life.",

  "Keep going. Your story is still being written.",

  "The simplest memories often become the most precious."

];

function quoteForDate(date){

  let sum=0;

  for(let i=0;i<date.length;i++){
    sum+=date.charCodeAt(i)*(i+1);
  }

  return quotes[sum%quotes.length];

}

async function loadQuote(){

  const quoteBox =
    document.getElementById("quoteBox");

  if(currentPage!==1){

    quoteBox.hidden=true;
    return;

  }

  quoteBox.hidden=false;

  let setting =
    await dbGet(
      SETTINGS_STORE,
      "quote-"+selectedDate
    );

  if(!setting){

    setting={
      key:"quote-"+selectedDate,
      value:quoteForDate(selectedDate)
    };

    await dbPut(
      SETTINGS_STORE,
      setting
    );

  }

  document.getElementById(
    "quoteText"
  ).textContent=setting.value;

}

async function changeQuote(){

  const current =
    document.getElementById(
      "quoteText"
    ).textContent;

  let available =
    quotes.filter(q=>q!==current);

  const quote =
    available[
      Math.floor(
        Math.random()*available.length
      )
    ];

  await dbPut(
    SETTINGS_STORE,
    {
      key:"quote-"+selectedDate,
      value:quote
    }
  );

  document.getElementById(
    "quoteText"
  ).textContent=quote;

}

/* ================================
   PAGE LOADING
================================ */

async function loadDate(date){

  selectedDate=date;

  currentPage=1;

  const all =
    await dbGetAll(PAGE_STORE);

  currentPages =
    all
      .filter(p=>p.date===date)
      .sort((a,b)=>a.page-b.page);

  if(!currentPages.length){

    currentPages=[{
      id:uid(),
      date:date,
      page:1,
      html:"",
      mood:"",
      design:"classic",
      drawing:null,
      updatedAt:Date.now()
    }];

  }

  renderPage();

  await loadQuote();

  await loadTodos();

  await loadMemories();

  renderCalendar();

}

/* ================================
   RENDER PAGE
================================ */

async function renderPage(){

  const page =
    currentPages[currentPage-1];

  if(!page)return;

  document.getElementById(
    "dateTitle"
  ).textContent=
    new Date(
      selectedDate+"T00:00:00"
    ).toLocaleDateString(
      undefined,
      {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  document.getElementById(
    "pageNumber"
  ).textContent=
    "Page "+
    currentPage+
    " of "+
    currentPages.length;

  document.getElementById(
    "editor"
  ).innerHTML=page.html||"";

  document.getElementById(
    "page"
  ).className=
    "page design-"+(page.design||"classic");

  document.getElementById(
    "designSelect"
  ).value=page.design||"classic";

  document.querySelectorAll(
    ".moodBtn"
  ).forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.mood===
      (page.mood||"")
    );

  });

  await loadDrawing();

}

/* ================================
   SAVE PAGE
================================ */

let saveTimer;

function scheduleAutoSave(){

  clearTimeout(saveTimer);

  saveTimer=setTimeout(
    ()=>savePage(false),
    700
  );

}

async function savePage(showMessage=false){

  const page =
    currentPages[currentPage-1];

  if(!page)return;

  page.html=
    document.getElementById(
      "editor"
    ).innerHTML;

  page.updatedAt=Date.now();

  page.drawing=
    savedDrawing||null;

  await dbPut(
    PAGE_STORE,
    page
  );

  if(showMessage){

    alert("Diary page saved.");

  }

}

   MOOD

async function setMood(mood){

  const page =

  if(!page)return;

  );

/* ================================
   NEW PAGE
================================ */

async function newPage(){

  await savePage(false);

  const newPageNumber =
    currentPages.length+1;

  const page={
    id:uid(),
    date:selectedDate,
    page:newPageNumber,
    html:"",
    mood:"",
    design:"classic",
    drawing:null,
    updatedAt:Date.now()
  };

  currentPages.push(page);

  currentPage=
    currentPages.length;

  await dbPut(
    PAGE_STORE,
    page
  );

  renderPage();

  await loadQuote();

}

/* ================================
   PAGE NAVIGATION
================================ */

async function goPage(number,direction){

  if(number<1){
    return;
  }

  if(number>currentPages.length){

    return;

  }

  await savePage(false);

  currentPage=number;

  const page =
    document.getElementById("page");

  page.classList.remove(
    "turnNext",
    "turnPrev"
  );

  void page.offsetWidth;

  page.classList.add(
    direction==="next"
      ?"turnNext"
      :"turnPrev"
  );

  renderPage();

  loadQuote();

  loadTodos();

  loadMemories();

}

function nextPage(){

  if(currentPage<currentPages.length){

    goPage(
      currentPage+1,
      "next"
    );

  }

}

function previousPage(){

  if(currentPage>1){

    goPage(
      currentPage-1,
      "prev"
    );

  }

}

/* ================================
   20 LINE LIMIT
================================ */

function countLines(){

  const editor=
    document.getElementById("editor");

  const style=
    getComputedStyle(editor);

  const lineHeight=
    parseFloat(style.lineHeight);

  return Math.ceil(
    editor.scrollHeight/lineHeight
  );

}

document
  .getElementById("editor")
  .addEventListener(
    "input",
    function(){

      if(countLines()>20){

        alert(
          "This diary page is limited to 20 lines. Turn to the next page to continue."
        );

      }

    }
  );

/* ================================
   TODO
================================ */

async function loadTodos(){

  const all =
    await dbGetAll(TODO_STORE);

  const todos =
    all
      .filter(t=>t.date===selectedDate)
      .sort(
        (a,b)=>
          a.createdAt-b.createdAt
      );

  const list =
    document.getElementById(
      "todoList"
    );

  list.innerHTML="";

  todos.forEach(todo=>{

    const row=
      document.createElement("div");

    row.className=
      "todoItem "+
      (todo.done?"done":"");

    row.innerHTML=`

      <input
        type="checkbox"
        ${todo.done?"checked":""}
        onchange="toggleTodo('${todo.id}',this.checked)">

      <span class="todoText">
        ${escapeHtml(todo.text)}
      </span>

      <button
        class="danger"
        onclick="deleteTodo('${todo.id}')">
        ×
      </button>

    `;

    list.appendChild(row);

  });

  const pending =
    todos.filter(t=>!t.done).length;

  document.getElementById(
    "todoCount"
  ).textContent=
    pending+
    " pending";

}

async function addTodo(){

  const input =
    document.getElementById(
      "todoInput"
    );

  const text=
    input.value.trim();

  if(!text)return;

  const todo={
    id:uid(),
    date:selectedDate,
    text:text,
    done:false,
    createdAt:Date.now()
  };

  await dbPut(
    TODO_STORE,
    todo
  );

  input.value="";

  await loadTodos();

}

async function toggleTodo(id,done){

  const todo=
    await dbGet(
      TODO_STORE,
      id
    );

  if(!todo)return;

  todo.done=done;

  await dbPut(
    TODO_STORE,
    todo
  );

  /*
    If completed, it stays completed.
    If unfinished, carry it forward.
  */

  if(!done){

    const next=
      new Date(
        selectedDate+"T00:00:00"
      );

    next.setDate(
      next.getDate()+1
    );

    const nextDate=
      next.toISOString().slice(0,10);

    const existing=
      await dbGetAll(TODO_STORE);

    const already=
      existing.some(
        t=>
          t.date===nextDate &&
          t.text===todo.text &&
          t.carriedFrom===todo.id &&
          !t.done
      );

    if(!already){

      await dbPut(
        TODO_STORE,
        {
          id:uid(),
          date:nextDate,
          text:todo.text,
          done:false,
          carriedFrom:todo.id,
          createdAt:Date.now()
        }
      );

    }

  }

  await loadTodos();

}

async function deleteTodo(id){

  await dbDelete(
    TODO_STORE,
    id
  );

  await loadTodos();

}

/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* ================================
   CALENDAR
================================ */

function toggleCalendar(){

  const box=
    document.getElementById(
      "calendarBox"
    );

  box.hidden=!box.hidden;

  if(!box.hidden){

    calendarDate=
      new Date(
        selectedDate+"T00:00:00"
      );

    renderCalendar();

  }

}

function previousMonth(){

  calendarDate.setMonth(
    calendarDate.getMonth()-1
  );

  renderCalendar();

}

function nextMonth(){

  calendarDate.setMonth(
    calendarDate.getMonth()+1
  );

  renderCalendar();

}

async function renderCalendar(){

  const year=
    calendarDate.getFullYear();

  const month=
    calendarDate.getMonth();

  document.getElementById(
    "calendarTitle"
  ).textContent=
    calendarDate.toLocaleDateString(
      undefined,
      {
        month:"long",
        year:"numeric"
      }
    );

  const grid=
    document.getElementById(
      "calendarGrid"
    );

  grid.innerHTML="";

  const days=[
    "Sun","Mon","Tue",
    "Wed","Thu","Fri","Sat"
  ];

  days.forEach(day=>{

    const el=
      document.createElement("div");

    el.className="calWeek";

    el.textContent=day;

    grid.appendChild(el);

  });

  const first=
    new Date(year,month,1);

  const start=
    first.getDay();

  const total=
    new Date(
      year,
      month+1,
      0
    ).getDate();

  const allPages=
    await dbGetAll(PAGE_STORE);

  for(let i=0;i<start;i++){

    const blank=
      document.createElement("div");

    grid.appendChild(blank);

  }

  for(let day=1;day<=total;day++){

    const date=
      year+
      "-"+
      String(month+1).padStart(2,"0")+
      "-"+
      String(day).padStart(2,"0");

    const cell=
      document.createElement("button");

    cell.className="calCell";

    if(date===selectedDate){

      cell.classList.add("selected");

    }

    const today=
      new Date()
        .toISOString()
        .slice(0,10);

    if(date===today){

      cell.classList.add("today");

    }

    cell.innerHTML=
      `<span>${day}</span>`;

    const moods=
      allPages
        .filter(
          p=>
            p.date===date &&
            p.mood
        );

    if(moods.length){

      const mood=
        document.createElement("span");

      mood.className="mood";

      mood.textContent=
        moods[0].mood;

      cell.appendChild(mood);

    }

    cell.onclick=()=>{

      loadDate(date);

      document.getElementById(
        "calendarBox"
      ).hidden=true;

    };

    grid.appendChild(cell);

  }

}

function openMemoryInput(){

  const choice=
    confirm(
      "Press OK for camera/photo.\nPress Cancel for document/scan."
    );

  if(choice){

    document
      .getElementById("memoryInput")
      .click();

  }else{

    document
      .getElementById("documentInput")
      .click();

  }

}

async function addMemoryFile(event){

  const file=
    event.target.files[0];

  if(!file)return;

  const reader=
    new FileReader();

  reader.onload=async()=>{

    const attachment={
      id:uid(),
      date:selectedDate,
      page:currentPage,
      name:file.name,
      type:file.type,
      data:reader.result,
      createdAt:Date.now()
    };

    await dbPut(
      ATTACH_STORE,
      attachment
    );

    event.target.value="";

    await loadMemories();

  };

  reader.readAsDataURL(file);

}

async function loadMemories(){

  const all=
    await dbGetAll(
      ATTACH_STORE
    );

  const memories=
    all.filter(
      m=>
        m.date===selectedDate &&
        m.page===currentPage
    );

  const grid=
    document.getElementById(
      "memoryGrid"
    );

  grid.innerHTML="";

  memories.forEach(memory=>{

    const card=
      document.createElement("div");

    card.className="memoryCard";

    if(memory.type.startsWith("image/")){

      card.innerHTML=`

        <img
          src="${memory.data}"
          onclick="openLightbox('${memory.id}')">

        <div style="font-size:11px">
          ${escapeHtml(memory.name)}
        </div>

        <div class="memoryActions">

          <button
            class="danger"
            onclick="deleteMemory('${memory.id}')">
            Delete
          </button>

        </div>

      `;

    }else{

      card.innerHTML=`

        <div style="padding:15px">
          📄 ${escapeHtml(memory.name)}
        </div>

        <div class="memoryActions">

          <button
            onclick="window.open('${memory.data}')">
            Open
          </button>

          <button
            class="danger"
            onclick="deleteMemory('${memory.id}')">
            Delete
          </button>

        </div>

      `;

    }

    grid.appendChild(card);

  });

}

async function deleteMemory(id){

  if(!confirm(
    "Delete this memory?"
  ))return;

  await dbDelete(
    ATTACH_STORE,
    id
  );

  await loadMemories();

}

async function openGallery(){

    "Delete this memory permanently?"
  ))return;

  await dbDelete(
    ATTACH_STORE,
    id
  );

  loadMemories();

}

    "galleryModal"
  ).hidden=true;

}

async function openLightbox(id){

  const memory=
    await dbGet(
      ATTACH_STORE,
      id
    );

  if(!memory.type.startsWith("image/"))
    return;

  document.getElementById(
    "lightboxImage"
  ).src=memory.data;

  document.getElementById(
    "lightboxModal"
  ).hidden=false;

}

function closeLightbox(){

  document.getElementById(
    "lightboxModal"
  ).hidden=true;

}

/* ================================
   DRAWING
================================ */

let drawingEnabled=false;

let drawTool="pen";

let drawColor="#222";

let drawing=false;

let startX=0;

let startY=0;

let savedDrawing=null;

let undoStack=[];

let redoStack=[];

const canvas=
  document.getElementById(
    "drawCanvas"
  );

const ctx=
  canvas.getContext("2d");

function resizeDrawCanvas(){

  const rect=
    document
      .getElementById("editorWrap")
      ?.getBoundingClientRect();

  const editor=
    document.getElementById("editor");

  if(!editor)return;

  const width=
    editor.clientWidth;

  const height=
    editor.clientHeight;

  canvas.width=
    width*devicePixelRatio;

  canvas.height=
    height*devicePixelRatio;

  canvas.style.width=
    width+"px";

  canvas.style.height=
    height+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  if(savedDrawing){

    const img=
      new Image();

    img.onload=()=>{

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

    };

    img.src=savedDrawing;

  }

}

function toggleDrawing(){

  drawingEnabled=
    !drawingEnabled;

  const area=
    document.getElementById(
      "drawArea"
    );

  const tools=
    document.getElementById(
      "drawTools"
    );

  area.classList.toggle(
    "enabled",
    drawingEnabled
  );

  tools.classList.toggle(
    "show",
    drawingEnabled
  );

  if(drawingEnabled){

    resizeDrawCanvas();

  }

}

function setDrawTool(tool){

  drawTool=tool;

  document
    .querySelectorAll(
      ".drawTools button"
    )
    .forEach(b=>
      b.classList.remove("active")
    );

  const id=
    "tool"+
    tool.charAt(0).toUpperCase()+
    tool.slice(1);

  const button=
    document.getElementById(id);

  if(button){

    button.classList.add("active");

  }

}

function setDrawColor(color){

  drawColor=color;

  if(drawTool==="eraser"){

    drawTool="pen";

  }

  setDrawTool(drawTool);

}

function pointerPosition(e){

  const rect=
    canvas.getBoundingClientRect();

  return {

    x:e.clientX-rect.left,

    y:e.clientY-rect.top

  };

}

function saveCanvasState(){

  undoStack.push(
    canvas.toDataURL("image/png")
  );

  if(undoStack.length>30){

    undoStack.shift();

  }

  redoStack=[];

}

canvas.addEventListener(
  "pointerdown",
  e=>{

    if(!drawingEnabled)return;

    drawing=true;

    canvas.setPointerCapture(
      e.pointerId
    );

    const p=
      pointerPosition(e);

    startX=p.x;

    startY=p.y;

    saveCanvasState();

    ctx.beginPath();

    ctx.moveTo(
      startX,
      startY
    );

    ctx.strokeStyle=
      drawTool==="eraser"
        ?"rgba(0,0,0,1)"
        :drawColor;

    ctx.lineWidth=
      drawTool==="eraser"
        ?18
        :2.5;

    ctx.lineCap="round";

  }
);

canvas.addEventListener(
  "pointermove",
  e=>{

    if(!drawing)return;

    const p=
      pointerPosition(e);

    if(drawTool==="pen"||
       drawTool==="eraser"){

      ctx.lineTo(
        p.x,
        p.y
      );

      ctx.stroke();

      return;

    }

    /*
      For line/circle we restore the
      previous snapshot before drawing
      the preview.
    */

    if(
      drawTool==="line"||
      drawTool==="circle"
    ){

      const previous=
        undoStack[
          undoStack.length-1
        ];

      if(previous){

        const img=
          new Image();

        img.onload=()=>{

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          const rect=
            canvas.getBoundingClientRect();

          ctx.drawImage(
            img,
            0,
            0,
            rect.width,
            rect.height
          );

          ctx.strokeStyle=
            drawColor;

          ctx.lineWidth=2.5;

          ctx.beginPath();

          if(drawTool==="line"){

            ctx.moveTo(
              startX,
              startY
            );

            ctx.lineTo(
              p.x,
              p.y
            );

          }else{

            const rx=
              Math.abs(
                p.x-startX
              );

            const ry=
              Math.abs(
                p.y-startY
              );

            const radius=
              Math.sqrt(
                rx*rx+
                ry*ry
              );

            ctx.arc(
              startX,
              startY,
              radius,
              0,
              Math.PI*2
            );

          }

          ctx.stroke();

        };

        img.src=previous;

      }

    }

  }
);

canvas.addEventListener(
  "pointerup",
  e=>{

    if(!drawing)return;

    drawing=false;

    savedDrawing=
      canvas.toDataURL(
        "image/png"
      );

    scheduleAutoSave();

  }
);

canvas.addEventListener(
  "pointercancel",
  ()=>{
    drawing=false;
  }
);

function restoreSnapshot(data){

  if(!data)return;

  const img=
    new Image();

  img.onload=()=>{

    const rect=
      canvas.getBoundingClientRect();

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.drawImage(
      img,
      0,
      0,
      rect.width,
      rect.height
    );

    savedDrawing=
      canvas.toDataURL(
        "image/png"
      );

    scheduleAutoSave();

  };

  img.src=data;

}

function undoDrawing(){

  if(!undoStack.length)return;

  const current=
    canvas.toDataURL("image/png");

  redoStack.push(current);

  const previous=
    undoStack.pop();

  restoreSnapshot(previous);

}

function redoDrawing(){

  if(!redoStack.length)return;

  const current=
    canvas.toDataURL("image/png");

  undoStack.push(current);

  const next=
    redoStack.pop();

  restoreSnapshot(next);

}

function clearDrawing(){

  if(!confirm(
    "Clear all drawings on this page?"
  ))return;

  saveCanvasState();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  savedDrawing=null;

  scheduleAutoSave();

}

async function loadDrawing(){

  const page=
    currentPages[currentPage-1];

  savedDrawing=
    page?.drawing||null;

  undoStack=[];

  redoStack=[];

  setTimeout(
    resizeDrawCanvas,
    50
  );

}

async function openEventModal(){

async function saveEvent(){

  const title=
    document.getElementById(
      "eventTitle"
    ).value.trim();

  const date=
    document.getElementById(
      "eventDate"
    ).value;

  const time=
    document.getElementById(
      "eventTime"
    ).value;

  const reminder=
    Number(
      document.getElementById(
        "eventReminder"
      ).value
    )||0;

  if(!title||!date){

    alert(
      "Please enter event and date."
    );

    return;

  }

  await dbPut(
    EVENT_STORE,
    {
      id:uid(),
      title,
      date,
      time,
      reminder,
      createdAt:Date.now()
    }
  );

  if(date===selectedDate){

    await renderEvents();

  }

  renderCalendar();

  alert("Event saved.");

}

async function renderEvents(){

  const all=
    await dbGetAll(
      EVENT_STORE
    );

  const events=
    all
      .filter(
        e=>e.date===selectedDate
      )
      .sort(
        (a,b)=>
          (a.time||"")
          .localeCompare(
            b.time||""
          )
      );

  const list=
    document.getElementById(
      "eventList"
    );

  list.innerHTML="";

  if(!events.length){

    list.innerHTML=
      "<p>No events for this date.</p>";

    return;

  }

  events.forEach(event=>{

    const row=
      document.createElement("div");

    row.style.padding="8px";

    row.style.borderBottom=
      "1px dotted #aaa";

    row.innerHTML=`

      🔔 <strong>
      ${escapeHtml(event.title)}
      </strong>

      ${event.time
        ?" — "+event.time
        :""}

      <button
        class="danger"
        style="float:right"
        onclick="deleteEvent('${event.id}')">
        Delete
      </button>

    `;

    list.appendChild(row);

  });

}

async function deleteEvent(id){

  await dbDelete(
    EVENT_STORE,
    id
  );

  await renderEvents();

}

/* ================================
   EVENT REMINDER
================================ */

async function checkReminders(){

  const events=
    await dbGetAll(
      EVENT_STORE
    );

  const now=
    new Date();

  events.forEach(event=>{

    if(!event.date||!event.time)
      return;

    const eventDate=
      new Date(
        event.date+
        "T"+
        event.time
      );

    const reminderTime=
      eventDate.getTime()-
      (event.reminder||0)*60000;

    const difference=
      Math.abs(
        now.getTime()-
        reminderTime
      );

    if(
      difference<60000 &&
      now.getTime()<=eventDate.getTime()
    ){

      showEventPopup(
        event
      );

    }

  });

}

function showEventPopup(event){

  alert(
    "🔔 Reminder\n\n"+
    event.title+
    (event.time
      ?"\nTime: "+event.time
      :"")
  );

}

const GOOGLE_CLIENT_KEY=
  "googleCalendarClientId";

async function connectGoogleCalendar(){

  const input=
    document.getElementById(
      "googleClientId"
    ).value.trim();

  if(!input){

    alert(
      "Please enter your Google OAuth Client ID."
    );

    return;

  }

  await dbPut(
    SETTINGS_STORE,
    {
      key:GOOGLE_CLIENT_KEY,
      value:input
    }
  );

  if(
    !window.google||
    !google.accounts||
    !google.accounts.oauth2
  ){

    alert(
      "Google Calendar service is still loading. Please try again."
    );

    return;

  }

  const client=
    google.accounts.oauth2.initTokenClient({

      client_id:input,

      scope:
        "https://www.googleapis.com/auth/calendar.readonly",

      callback:response=>{

        if(response.access_token){

          sessionStorage.setItem(
            "googleCalendarToken",
            response.access_token
          );

          alert(
            "Google Calendar connected."
          );

        }

      }

    });

  client.requestAccessToken();

}

/* ================================
   BACKUP
================================ */

async function backupDiary(){

  const pages=
    await dbGetAll(PAGE_STORE);

  const events=
    await dbGetAll(EVENT_STORE);

  const attachments=
    await dbGetAll(ATTACH_STORE);

  const todos=
    await dbGetAll(TODO_STORE);

  const settings=
    await dbGetAll(SETTINGS_STORE);

  const backup={
    version:"8.1",
    createdAt:new Date().toISOString(),
    pages,
    events,
    attachments,
    todos,
    settings
  };

  const blob=
    new Blob(
      [
        JSON.stringify(
          backup
        )
      ],
      {
        type:"application/json"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "my-personal-diary-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}

async function restoreDiary(event){

  const file=
    event.target.files[0];

  if(!file)return;

  const text=
    await file.text();

  try{

    const backup=
      JSON.parse(text);

    for(
      const page
      of (backup.pages||[])
    ){

      await dbPut(
        PAGE_STORE,
        page
      );

    }

    for(
      const item
      of (backup.events||[])
    ){

      await dbPut(
        EVENT_STORE,
        item
      );

    }

    for(
      const item
      of (backup.attachments||[])
    ){

      await dbPut(
        ATTACH_STORE,
        item
      );

    }

    for(
      const item
      of (backup.todos||[])
    ){

      await dbPut(
        TODO_STORE,
        item
      );

    }

    for(
      const item
      of (backup.settings||[])
    ){

      await dbPut(
        SETTINGS_STORE,
        item
      );

    }

    alert(
      "Diary backup restored successfully."
    );

    await loadDate(
      selectedDate
    );

  }catch(error){

    alert(
      "Invalid diary backup file."
    );

  }

  event.target.value="";

}

/* ================================
   SWIPE
================================ */

let swipeStartX=0;
let swipeStartY=0;

const diaryPage=
  document.getElementById("page");

diaryPage.addEventListener(
  "pointerdown",
  e=>{

    if(
      drawingEnabled
    )return;

    swipeStartX=e.clientX;
    swipeStartY=e.clientY;

  }
);

diaryPage.addEventListener(
  "pointerup",
  e=>{

    if(
      drawingEnabled
    )return;

    const dx=
      e.clientX-swipeStartX;

    const dy=
      e.clientY-swipeStartY;

    if(
      Math.abs(dx)>80 &&
      Math.abs(dx)>Math.abs(dy)
    ){

      if(dx<0){

        nextPage();

      }else{

        previousPage();

      }

    }

  }
);
