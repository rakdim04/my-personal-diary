<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Personal Diary</title>

<meta name="theme-color" content="#6b4226">
<meta name="description" content="My thoughts, memories and journey">

<link rel="manifest" href="manifest.json">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at top left, rgba(255,255,255,.45), transparent 35%),
        #cbb99a;
    color: #3e2a1d;
}

/* APP */

.app {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

/* HEADER */

.header {
    background: #6b4226;
    color: white;
    padding: 18px;
    border-radius: 14px 14px 0 0;
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 5px 0 0;
    font-size: 14px;
    opacity: .9;
}

/* TOOLBAR */

.toolbar {
    background: #f1e5cc;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    border-left: 1px solid #a98d69;
    border-right: 1px solid #a98d69;
}

button,
input,
select {
    font-family: inherit;
}

button {
    border: none;
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    opacity: .9;
}

.nav-btn {
    background: #6b4226;
    color: white;
}

.action-btn {
    background: #8b5e34;
    color: white;
}

.danger-btn {
    background: #9b3030;
    color: white;
}

.print-btn {
    background: #3f5f72;
    color: white;
}

.backup-btn {
    background: #496b43;
    color: white;
}

.restore-btn {
    background: #69518a;
    color: white;
}

.date-box {
    padding: 8px;
    border: 1px solid #9e8768;
    border-radius: 8px;
    background: white;
}

/* DIARY */

.diary {
    position: relative;
    background: #fffdf4;
    min-height: 680px;
    padding: 35px 45px 50px 85px;
    border-left: 1px solid #c2a985;
    border-right: 1px solid #c2a985;
    box-shadow: 0 8px 20px rgba(0,0,0,.18);

    background-image:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 31px,
            #b9c8d4 32px
        );
}

/* RED MARGIN */

.diary::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 68px;
    width: 2px;
    background: #d27b7b;
}

/* DATE */

.diary-date {
    position: relative;
    background: rgba(255,253,244,.92);
    display: inline-block;
    padding: 5px 12px;
    margin-bottom: 20px;
    font-weight: bold;
    font-size: 18px;
}

/* TITLE */

.title-input {
    position: relative;
    width: 100%;
    border: none;
    outline: none;
    background: rgba(255,253,244,.90);
    font-size: 25px;
    font-weight: bold;
    color: #4a2f1e;
    padding: 3px 5px;
    margin-bottom: 10px;
}

/* WRITING */

.entry-text {
    position: relative;
    width: 100%;
    min-height: 430px;
    resize: vertical;
    border: none;
    outline: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 31px,
            #b9c8d4 32px
        );

    font-family: "Segoe Print",
                 "Bradley Hand",
                 "Comic Sans MS",
                 cursive;

    font-size: 18px;
    line-height: 32px;
    color: #2e4050;

    padding: 0 5px;
}

/* MOOD */

.mood-area {
    position: relative;
    margin-top: 18px;
    background: rgba(255,253,244,.94);
    padding: 10px;
    border-radius: 8px;
}

.mood-title {
    font-weight: bold;
    margin-right: 10px;
}

.mood-btn {
    background: #eadbc2;
    margin: 3px;
    font-size: 20px;
}

.mood-btn.selected {
    background: #d09b57;
    transform: scale(1.08);
}

/* SAVE STATUS */

.status {
    position: relative;
    background: rgba(255,253,244,.95);
    margin-top: 12px;
    padding: 8px;
    font-size: 13px;
    color: #625443;
}

/* SAVED PAGES */

.saved-section {
    background: #f1e5cc;
    padding: 20px;
    border: 1px solid #a98d69;
    border-top: none;
}

.saved-section h2 {
    margin-top: 0;
    text-align: center;
}

.saved-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.saved-card {
    background: #fffdf4;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #c4a982;
    cursor: pointer;
}

.saved-card:hover {
    background: #fff8e5;
}

.saved-card-date {
    font-weight: bold;
    color: #6b4226;
}

.saved-card-title {
    margin-top: 5px;
    font-size: 15px;
}

/* FOOTER */

.footer {
    text-align: center;
    padding: 15px;
    background: #6b4226;
    color: white;
    border-radius: 0 0 14px 14px;
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .app {
        padding: 5px;
    }

    .header h1 {
        font-size: 24px;
    }

    .toolbar {
        padding: 8px;
    }

    button {
        font-size: 13px;
        padding: 8px 10px;
    }

    .diary {
        padding:
            25px
            20px
            40px
            55px;

        min-height: 650px;
    }

    .diary::before {
        left: 43px;
    }

    .entry-text {
        font-size: 16px;
        line-height: 30px;

        background:
            repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 29px,
                #b9c8d4 30px
            );
    }

    .title-input {
        font-size: 21px;
    }
}

/* PRINT */

@media print {

    body {
        background: white;
    }

    .app {
        max-width: none;
        padding: 0;
    }

    .header,
    .toolbar,
    .saved-section,
    .footer,
    .status {
        display: none !important;
    }

    .diary {
        box-shadow: none;
        border: none;
        min-height: 100vh;
        page-break-after: always;
    }

    .entry-text {
        resize: none;
        overflow: visible;
    }

    .mood-area {
        background: transparent;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <h1>📖 My Personal Diary</h1>

        <p>
            My thoughts • Memories • Experiences • Journey
        </p>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <button
            class="nav-btn"
            onclick="previousDay()">
            ◀ Previous
        </button>

        <input
            type="date"
            id="datePicker"
            class="date-box"
            onchange="dateChanged()">

        <button
            class="nav-btn"
            onclick="nextDay()">
            Next ▶
        </button>

        <button
            class="action-btn"
            onclick="goToday()">
            📅 Today
        </button>

        <button
            class="action-btn"
            onclick="saveEntry(true)">
            💾 Save
        </button>

        <button
            class="danger-btn"
            onclick="deleteEntry()">
            🗑 Delete
        </button>

        <button
            class="backup-btn"
            onclick="backupDiary()">
            💾 Backup
        </button>

        <button
            class="restore-btn"
            onclick="document.getElementById('restoreFile').click()">
            ♻ Restore
        </button>

        <input
            type="file"
            id="restoreFile"
            accept=".json,application/json"
            style="display:none"
            onchange="restoreDiary(event)">

        <button
            class="print-btn"
            onclick="printCurrentPage()">
            🖨 Print Page / PDF
        </button>

        <button
            class="print-btn"
            onclick="printAllPages()">
            📚 Print All Pages
        </button>

    </div>


    <!-- DIARY PAGE -->

    <div class="diary">

        <div
            class="diary-date"
            id="displayDate">
        </div>

        <input
            id="entryTitle"
            class="title-input"
            type="text"
            placeholder="Today's title...">

        <textarea
            id="entryText"
            class="entry-text"
            placeholder="Dear Diary,

Write your thoughts here..."></textarea>


        <!-- MOOD -->

        <div class="mood-area">

            <span class="mood-title">
                Today's Mood:
            </span>

            <button
                class="mood-btn"
                data-mood="😊"
                onclick="selectMood('😊')">
                😊
            </button>

            <button
                class="mood-btn"
                data-mood="😄"
                onclick="selectMood('😄')">
                😄
            </button>

            <button
                class="mood-btn"
                data-mood="😍"
                onclick="selectMood('😍')">
                😍
            </button>

            <button
                class="mood-btn"
                data-mood="😌"
                onclick="selectMood('😌')">
                😌
            </button>

            <button
                class="mood-btn"
                data-mood="😐"
                onclick="selectMood('😐')">
                😐
            </button>

            <button
                class="mood-btn"
                data-mood="😔"
                onclick="selectMood('😔')">
                😔
            </button>

            <button
                class="mood-btn"
                data-mood="😢"
                onclick="selectMood('😢')">
                😢
            </button>

            <button
                class="mood-btn"
                data-mood="😡"
                onclick="selectMood('😡')">
                😡
            </button>

        </div>


        <div
            class="status"
            id="saveStatus">
            Ready
        </div>

    </div>


    <!-- SAVED ENTRIES -->

    <div class="saved-section">

        <h2>📚 My Saved Diary Pages</h2>

        <div
            id="savedList"
            class="saved-list">
        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        My Personal Diary • Your memories, your journey

    </div>

</div>


<script>

/* =====================================================
   PERSONAL DIARY
   ===================================================== */

const STORAGE_KEY = "myPersonalDiaryEntries";

let selectedDate = getTodayString();

let selectedMood = "";


/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

function getTodayString() {

    const now = new Date();

    const year = now.getFullYear();

    const month =
        String(now.getMonth() + 1).padStart(2, "0");

    const day =
        String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function localDateString(date) {

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatDate(dateString) {

    const parts = dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    const year = Number(parts[0]);
    const month = Number(parts[1]) - 1;
    const day = Number(parts[2]);

    const date =
        new Date(year, month, day);

    return date.toLocaleDateString(
        undefined,
        {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );
}


/* =====================================================
   STORAGE
   ===================================================== */

function getEntries() {

    try {

        const data =
            localStorage.getItem(STORAGE_KEY);

        if (!data) {
            return {};
        }

        const parsed =
            JSON.parse(data);

        if (
            parsed &&
            typeof parsed === "object"
        ) {
            return parsed;
        }

        return {};

    } catch (error) {

        console.error(error);

        return {};
    }
}


function storeEntries(entries) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(entries)
    );
}


/* =====================================================
   LOAD DATE
   ===================================================== */

function loadDate(dateString) {

    selectedDate = dateString;

    document.getElementById(
        "datePicker"
    ).value = selectedDate;

    document.getElementById(
        "displayDate"
    ).textContent = formatDate(selectedDate);

    loadEntry();

    renderEntries();
}


/* =====================================================
   LOAD ENTRY
   ===================================================== */

function loadEntry() {

    const entries = getEntries();

    const entry =
        entries[selectedDate];

    const title =
        document.getElementById("entryTitle");

    const text =
        document.getElementById("entryText");

    if (entry) {

        title.value =
            entry.title || "";

        text.value =
            entry.text || "";

        selectedMood =
            entry.mood || "";

    } else {

        title.value = "";

        text.value = "";

        selectedMood = "";
    }

    updateMoodButtons();

    document.getElementById(
        "saveStatus"
    ).textContent =
        entry
            ? "Saved diary page loaded."
            : "New diary page.";
}


/* =====================================================
   SAVE
   ===================================================== */

function saveEntry(showMessage = true) {

    const title =
        document.getElementById(
            "entryTitle"
        ).value;

    const text =
        document.getElementById(
            "entryText"
        ).value;

    const entries = getEntries();

    if (
        title.trim() === "" &&
        text.trim() === "" &&
        selectedMood === ""
    ) {

        if (entries[selectedDate]) {

            delete entries[selectedDate];

            storeEntries(entries);

        }

        renderEntries();

        if (showMessage) {

            document.getElementById(
                "saveStatus"
            ).textContent =
                "Empty page removed.";
        }

        return;
    }


    entries[selectedDate] = {

        title: title,

        text: text,

        mood: selectedMood,

        updatedAt:
            new Date().toISOString()
    };


    storeEntries(entries);

    renderEntries();


    document.getElementById(
        "saveStatus"
    ).textContent =
        "✓ Saved " +
        new Date().toLocaleTimeString();


    if (showMessage) {

        setTimeout(() => {

            document.getElementById(
                "saveStatus"
            ).textContent =
                "✓ Diary page saved.";

        }, 1500);
    }
}


/* =====================================================
   NAVIGATION
   ===================================================== */

function previousDay() {

    saveEntry(false);

    const parts =
        selectedDate.split("-");

    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

    date.setDate(
        date.getDate() - 1
    );

    loadDate(
        localDateString(date)
    );
}


function nextDay() {

    saveEntry(false);

    const parts =
        selectedDate.split("-");

    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

    date.setDate(
        date.getDate() + 1
    );

    loadDate(
        localDateString(date)
    );
}


function goToday() {

    saveEntry(false);

    loadDate(
        getTodayString()
    );
}


function dateChanged() {

    saveEntry(false);

    const value =
        document.getElementById(
            "datePicker"
        ).value;

    if (value) {

        loadDate(value);
    }
}


/* =====================================================
   MOOD
   ===================================================== */

function selectMood(mood) {

    selectedMood = mood;

    updateMoodButtons();

    autoSave();
}


function updateMoodButtons() {

    const buttons =
        document.querySelectorAll(
            ".mood-btn"
        );

    buttons.forEach(button => {

        if (
            button.dataset.mood ===
            selectedMood
        ) {

            button.classList.add(
                "selected"
            );

        } else {

            button.classList.remove(
                "selected"
            );
        }
    });
}


/* =====================================================
   DELETE
   ===================================================== */

function deleteEntry() {

    const entries = getEntries();

    if (!entries[selectedDate]) {

        alert(
            "There is no saved entry for this date."
        );

        return;
    }


    const confirmed =
        confirm(
            "Delete the diary entry for\n\n" +
            formatDate(selectedDate) +
            "?"
        );


    if (!confirmed) {
        return;
    }


    delete entries[selectedDate];

    storeEntries(entries);

    document.getElementById(
        "entryTitle"
    ).value = "";

    document.getElementById(
        "entryText"
    ).value = "";

    selectedMood = "";

    updateMoodButtons();

    renderEntries();


    document.getElementById(
        "saveStatus"
    ).textContent =
        "Diary entry deleted.";
}


/* =====================================================
   SAVED ENTRY LIST
   ===================================================== */

function renderEntries() {

    const list =
        document.getElementById(
            "savedList"
        );

    const entries =
        getEntries();


    const dates =
        Object.keys(entries)
        .sort()
        .reverse();


    if (dates.length === 0) {

        list.innerHTML =
            "<p>No diary pages saved yet.</p>";

        return;
    }


    list.innerHTML = "";


    dates.forEach(date => {

        const entry =
            entries[date];


        const card =
            document.createElement(
                "div"
            );

        card.className =
            "saved-card";


        const title =
            escapeHtml(
                entry.title ||
                "Untitled diary page"
            );


        const mood =
            entry.mood || "";


        card.innerHTML =

            `<div class="saved-card-date">
                ${escapeHtml(formatDate(date))}
                ${mood}
            </div>

            <div class="saved-card-title">
                ${title}
            </div>`;


        card.onclick =
            function () {

                loadDate(date);

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            };


        list.appendChild(card);

    });
}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   AUTO SAVE
   ===================================================== */

let autoSaveTimer = null;


function autoSave() {

    clearTimeout(
        autoSaveTimer
    );


    autoSaveTimer =
        setTimeout(
            function () {

                saveEntry(false);

            },
            800
        );
}


document
    .getElementById("entryTitle")
    .addEventListener(
        "input",
        autoSave
    );


document
    .getElementById("entryText")
    .addEventListener(
        "input",
        autoSave
    );


/* =====================================================
   BACKUP
   ===================================================== */

function backupDiary() {

    saveEntry(false);

    const entries =
        getEntries();


    const data =
        JSON.stringify(
            entries,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement(
            "a"
        );


    const today =
        getTodayString();


    link.href = url;

    link.download =
        "my-personal-diary-backup-" +
        today +
        ".json";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(url);


    document.getElementById(
        "saveStatus"
    ).textContent =
        "✓ Diary backup created.";
}


/* =====================================================
   RESTORE
   ===================================================== */

function restoreDiary(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function (e) {

            try {

                const restored =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !restored ||
                    typeof restored !==
                    "object" ||
                    Array.isArray(restored)
                ) {

                    throw new Error(
                        "Invalid backup file."
                    );
                }


                const existing =
                    getEntries();


                let count = 0;


                Object.keys(
                    restored
                ).forEach(date => {

                    if (
                        /^\d{4}-\d{2}-\d{2}$/
                        .test(date)
                    ) {

                        existing[date] =
                            restored[date];

                        count++;
                    }
                });


                storeEntries(
                    existing
                );


                loadDate(
                    selectedDate
                );


                alert(
                    "Restore completed.\n\n" +
                    count +
                    " diary page(s) restored."
                );


            } catch (error) {

                alert(
                    "Restore failed.\n\n" +
                    "Please select a valid diary backup JSON file."
                );

                console.error(
                    error
                );
            }


            event.target.value = "";

        };


    reader.readAsText(file);
}


/* =====================================================
   PRINT CURRENT PAGE
   ===================================================== */

function printCurrentPage() {

    saveEntry(false);

    window.print();
}


/* =====================================================
   PRINT ALL PAGES
   ===================================================== */

function printAllPages() {

    saveEntry(false);


    const entries =
        getEntries();


    const dates =
        Object.keys(entries)
        .sort();


    if (dates.length === 0) {

        alert(
            "There are no saved diary pages to print."
        );

        return;
    }


    let pages = "";


    dates.forEach(date => {

        const entry =
            entries[date];


        const title =
            escapeHtml(
                entry.title ||
                "My Diary"
            );


        const text =
            escapeHtml(
                entry.text ||
                ""
            )
            .replace(
                /\n/g,
                "<br>"
            );


        const mood =
            escapeHtml(
                entry.mood ||
                ""
            );


        pages += `

        <section class="print-page">

            <div class="print-date">
                ${escapeHtml(formatDate(date))}
            </div>

            <h1>
                ${title}
            </h1>

            <div class="print-mood">
                ${mood}
            </div>

            <div class="print-text">
                ${text}
            </div>

        </section>

        `;

    });


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if (!printWindow) {

        alert(
            "Please allow pop-ups for this diary app and try again."
        );

        return;
    }


    printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>My Personal Diary - All Pages</title>

<style>

@page {
    size: A4;
    margin: 15mm;
}

body {
    margin: 0;
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #3e2a1d;
}

.print-page {

    min-height: 250mm;

    page-break-after: always;

    padding: 15mm;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
