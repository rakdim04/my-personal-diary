<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>My Personal Diary v10.1</title>

<meta name="theme-color" content="#563925">
<link rel="manifest" href="manifest.json">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.9),transparent 28%),
    linear-gradient(135deg,#d8d0c3,#eee8dd 50%,#d3c9bb);
  color:#33251b;
  font-family:Georgia,"Times New Roman",serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

[hidden]{
  display:none !important;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{

  --paper:#fffdf4;

  --ink:#33251b;

  --rule:#b9ccd5;

  --brown:#563925;

  --brown2:#795438;

  --line-height:34px;

  --font-size:19px;

  --page-lines:24;

  --page-width:1500px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  position:sticky;

  top:0;

  z-index:10000;

  min-height:62px;

  display:flex;

  align-items:center;

  gap:8px;

  padding:7px 10px;

  background:
    linear-gradient(
      135deg,
      #432918,
      #765039
    );

  color:white;

  box-shadow:
    0 4px 15px rgba(0,0,0,.28);
}

.brand{

  font-size:21px;

  font-weight:bold;

  white-space:nowrap;

}

.topbuttons{

  display:flex;

  gap:6px;

  overflow-x:auto;

  flex:1;

  scrollbar-width:none;

}

.topbuttons::-webkit-scrollbar{
  display:none;
}

.topbuttons button{

  flex:none;

  padding:8px 11px;

  border:1px solid rgba(255,255,255,.35);

  border-radius:8px;

  color:white;

  background:rgba(255,255,255,.10);

}

.topbuttons button:active{
  transform:scale(.96);
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

  width:100%;

  padding:18px 12px 50px;

}

.book{

  width:100%;

  max-width:var(--page-width);

  margin:auto;

  position:relative;

  filter:
    drop-shadow(
      0 15px 25px rgba(0,0,0,.25)
    );

}


/* =========================================================
   PAGE
========================================================= */

.page{

  position:relative;

  min-height:
    calc(
      var(--page-lines) *
      var(--line-height) +
      220px
    );

  background-color:var(--paper);

  border:
    1px solid #d3c6b3;

  border-radius:
    5px 17px 17px 5px;

  box-shadow:

    inset 0 0 40px rgba(80,50,20,.08),

    inset -12px 0 20px rgba(80,50,20,.04);

  overflow:visible;

}


/* page edge */

.page:after{

  content:"";

  position:absolute;

  right:-5px;

  top:0;

  bottom:0;

  width:5px;

  background:
    repeating-linear-gradient(
      to bottom,
      #cfc4b3 0px,
      #eee8dd 2px,
      #c5b9a8 4px
    );

  border-radius:0 5px 5px 0;

  pointer-events:none;

}


/* =========================================================
   NATURAL SPIRAL
========================================================= */

.spine{

  position:absolute;

  left:0;

  top:0;

  bottom:0;

  width:72px;

  z-index:50;

  background:

    linear-gradient(
      90deg,
      #2c1b11,
      #624027 22%,
      #936345 42%,
      #573721 64%,
      #2d1b11
    );

  border-radius:
    6px 0 0 6px;

  box-shadow:

    inset -8px 0 10px rgba(0,0,0,.35),

    inset 5px 0 8px rgba(255,255,255,.10);

  overflow:hidden;

}


/* spine stitching */

.spine:before{

  content:"";

  position:absolute;

  top:0;

  bottom:0;

  left:17px;

  width:38px;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 28px,
      rgba(0,0,0,.42) 29px,
      rgba(255,255,255,.12) 31px,
      transparent 35px
    );

}


/* rings */

.rings{

  position:absolute;

  left:15px;

  right:12px;

  top:14px;

  bottom:14px;

  display:flex;

  flex-direction:column;

  justify-content:space-around;

}

.ring{

  width:43px;

  height:26px;

  border-radius:50%;

  border:4px solid #302015;

  border-left-color:#563723;

  border-right-color:#b2845d;

  box-shadow:

    1px 2px 3px rgba(0,0,0,.5),

    inset 1px 1px 1px rgba(255,255,255,.25);

  transform:rotate(-5deg);

}


/* =========================================================
   PAGE CONTENT
========================================================= */

.pagecontent{

  margin-left:72px;

  padding:
    0 24px 50px 20px;

}


/* =========================================================
   HEADER
========================================================= */

.pageheader{

  position:sticky;

  top:62px;

  z-index:200;

  min-height:65px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  padding:7px 5px;

  background:
    rgba(255,253,244,.97);

  border-bottom:
    1px solid #d7cab7;

  backdrop-filter:blur(5px);

}

.datearea{

  min-width:0;

}

.date{

  font-size:21px;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.mood{

  margin-left:5px;

  font-size:20px;

}

.pageactions{

  display:flex;

  gap:5px;

  flex:none;

}

.smallbtn{

  border:
    1px solid #a9967c;

  background:
    #fff9ee;

  border-radius:7px;

  padding:7px 10px;

}


/* =========================================================
   QUOTE
========================================================= */

.quote{

  height:30px;

  margin:
    4px 0 5px;

  padding:4px 7px;

  text-align:center;

  font-size:13px;

  font-style:italic;

  color:#76533b;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  border-bottom:
    1px dotted #bba68e;

}


/* =========================================================
   FORMATTING TOOLBAR
========================================================= */

.toolbar{

  position:sticky;

  top:127px;

  z-index:190;

  display:flex;

  align-items:center;

  gap:5px;

  padding:6px;

  background:
    rgba(247,240,228,.98);

  border:
    1px solid #cbbca7;

  border-radius:9px;

  box-shadow:
    0 3px 8px rgba(0,0,0,.10);

  overflow:visible;

}

.toolbar button{

  min-width:40px;

  height:38px;

  padding:4px 8px;

  border:
    1px solid #a9977e;

  border-radius:7px;

  background:#fffaf1;

  color:#38281c;

}

.toolbar button.active{

  color:white;

  background:#5a3b27;

}


/* =========================================================
   DRAW MENU
========================================================= */

.drawwrap{

  position:relative;

}

.drawmenu{

  position:absolute;

  left:0;

  top:43px;

  z-index:1000;

  display:flex;

  gap:5px;

  padding:6px;

  background:#fffdf7;

  border:
    1px solid #b9a990;

  border-radius:9px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.25);

}

.drawmenu button{
  min-width:42px;
}


/* =========================================================
   WRITING AREA
========================================================= */

.editorwrap{

  position:relative;

  min-height:
    calc(
      var(--page-lines) *
      var(--line-height)
    );

}


/*
  IMPORTANT:
  The ruled background and the text use exactly
  the same line-height.
*/

.editor{

  position:relative;

  z-index:10;

  min-height:
    calc(
      var(--page-lines) *
      var(--line-height)
    );

  padding:
    4px 8px 10px;

  outline:none;

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  font-size:var(--font-size);

  line-height:var(--line-height);

  white-space:pre-wrap;

  overflow-wrap:anywhere;

  background-image:

    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--line-height) - 1px),
      var(--rule) calc(var(--line-height) - 1px),
      var(--rule) var(--line-height)
    );

  background-position:
    0 6px;

  background-size:
    100% var(--line-height);

}


/*
  Prevent browser default margins from
  making text appear above/below lines.
*/

.editor p,
.editor div,
.editor li{

  margin:0;

  padding:0;

  min-height:var(--line-height);

  line-height:var(--line-height);

}


/* placeholder */

.editor:empty:before{

  content:
    "Start writing your diary...";

  color:#b2a494;

  pointer-events:none;

}


/* =========================================================
   DRAWING CANVAS
========================================================= */

#drawCanvas{

  position:absolute;

  z-index:30;

  left:0;

  top:0;

  width:100%;

  height:100%;

  pointer-events:none;

  touch-action:none;

}

.editorwrap.drawing #drawCanvas{

  pointer-events:auto;

  cursor:crosshair;

}

.editorwrap.drawing .editor{

  user-select:none;

}


/* =========================================================
   NEW PAGE
========================================================= */

.newpage{

  position:absolute;

  right:-1px;

  bottom:20px;

  z-index:70;

  padding:10px 14px;

  border:
    1px solid #9d8569;

  border-radius:
    8px 0 0 8px;

  background:#f3e6d1;

  color:#503521;

  box-shadow:
    0 4px 10px rgba(0,0,0,.18);

}


/* =========================================================
   MODALS
========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:20000;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:12px;

  background:
    rgba(25,18,12,.65);

}

.modalbox{

  width:min(720px,97vw);

  max-height:91vh;

  overflow:auto;

  padding:18px;

  border-radius:15px;

  background:#fffdf7;

  border:
    1px solid #bca990;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);

}

.modalbox h2{

  margin:
    0 0 15px;

  color:#583a27;

}

.modalbox h3{
  color:#67462e;
}

.formrow{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

}

.field{
  margin-bottom:10px;
}

.field label{

  display:block;

  margin-bottom:4px;

  font-weight:bold;

}

.field input,
.field textarea,
.field select{

  width:100%;

  padding:9px;

  border:
    1px solid #b9aa96;

  border-radius:7px;

  background:white;

}

.field textarea{
  min-height:80px;
}

.modalbuttons{

  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:12px;

}

.primary{

  background:#593a27 !important;

  color:white !important;

}


/* =========================================================
   CALENDAR
========================================================= */

.calnav{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;

}

.calgrid{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;

}

.calhead{

  padding:5px;

  text-align:center;

  font-weight:bold;

}

.calday{

  min-height:66px;

  padding:4px;

  background:#fffaf1;

  border:
    1px solid #d8cbb8;

  border-radius:6px;

  overflow:hidden;

  cursor:pointer;

}

.calday.today{

  border:
    2px solid #795237;

}

.caldaynum{
  font-weight:bold;
}

.eventdot{

  margin-top:4px;

  padding:2px 3px;

  background:#e8d5b8;

  border-radius:4px;

  font-size:11px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.eventlist{

  margin-top:15px;

  padding-top:10px;

  border-top:
    1px solid #d7c8b5;

}


/* =========================================================
   EVENT
========================================================= */

.eventcard{

  padding:10px;

  margin-bottom:8px;

  background:#fffaf1;

  border:
    1px solid #d5c6b1;

  border-radius:9px;

}

.eventcard strong{
  color:#5b3b28;
}

.eventcard small{

  display:block;

  margin-top:3px;

  color:#75624f;

}


/* =========================================================
   TODO
========================================================= */

.todoitem{

  display:flex;

  align-items:center;

  gap:8px;

  padding:8px 3px;

  border-bottom:
    1px solid #ded1bf;

}

.todoitem span{
  flex:1;
}

.todoitem.done span{

  text-decoration:line-through;

  opacity:.55;

}


/* =========================================================
   MEMORIES
========================================================= */

.memorygrid{

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(145px,1fr));

  gap:10px;

}

.memory{

  overflow:hidden;

  background:white;

  border:
    1px solid #d0c0aa;

  border-radius:9px;

}

.memory img{

  display:block;

  width:100%;

  height:150px;

  object-fit:cover;

}

.memorycaption{

  padding:7px;

  font-size:13px;

}


/* =========================================================
   SETTINGS
========================================================= */

.designs{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

}

.design{

  min-height:65px;

  padding:9px;

  border:
    2px solid #c9b9a2;

  border-radius:8px;

  cursor:pointer;

}

.design.selected{

  border-color:#593a27;

  box-shadow:
    0 0 0 2px #dfc7a5;

}


/* =========================================================
   DESIGNS
========================================================= */

.design-classic{

  --paper:#fffdf4;

  --rule:#b9ccd5;

}

.design-vintage{

  --paper:#f8ecd5;

  --rule:#c8ae82;

}

.design-blue{

  --paper:#f1f8fc;

  --rule:#a7c7dc;

}

.design-green{

  --paper:#f3f8ed;

  --rule:#b5c8a2;

}

.design-rose{

  --paper:#fff4f4;

  --rule:#d8b6bd;

}

.design-night{

  --paper:#282622;

  --rule:#605b52;

  --ink:#f1eadf;

}

.design-night .pageheader,
.design-night .toolbar{

  background:
    rgba(40,38,34,.97);

}

.design-night .toolbar button,
.design-night .smallbtn{

  color:#f2ebdf;

  background:#39352f;

  border-color:#736b60;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .topbar{

    min-height:57px;

    padding:6px;

  }

  .brand{

    font-size:17px;

  }

  .topbuttons button{

    padding:7px 9px;

    font-size:13px;

  }

  .workspace{

    padding:
      7px 3px 30px;

  }

  .spine{

    width:52px;

  }

  .rings{

    left:8px;

    width:37px;

  }

  .ring{

    width:37px;

    height:22px;

  }

  .pagecontent{

    margin-left:52px;

    padding:
      0 7px 35px 7px;

  }

  .pageheader{

    top:57px;

    min-height:56px;

  }

  .date{

    font-size:17px;

  }

  .toolbar{

    top:113px;

    overflow-x:auto;

    scrollbar-width:none;

  }

  .toolbar::-webkit-scrollbar{
    display:none;
  }

  .toolbar button{

    min-width:38px;

    height:36px;

    padding:4px 7px;

  }

  .editor{

    font-size:17px;

  }

  .formrow{

    grid-template-columns:1fr;

  }

  .designs{

    grid-template-columns:
      repeat(2,1fr);

  }

  .calday{

    min-height:54px;

  }

}

</style>
</head>

<body>

<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

  <div class="brand">
    📖 My Diary
  </div>

  <div class="topbuttons">

    <button onclick="openCalendar()">
      📅 Calendar
    </button>

    <button onclick="openEvents()">
      📌 Events
    </button>

    <button onclick="openTodo()">
      ☑ To-Do
    </button>

    <button onclick="openMemories()">
      🖼 Memories
    </button>

    <button onclick="openSettings()">
      ⚙ Settings
    </button>

    <button onclick="backupDiary()">
      💾 Backup
    </button>

    <button onclick="document.getElementById('restoreFile').click()">
      ↩ Restore
    </button>

    <button onclick="window.print()">
      🖨 Print
    </button>

  </div>

</header>

<input
  id="restoreFile"
  type="file"
  accept=".json"
  hidden
  onchange="restoreDiary(event)"
>


<!-- =====================================================
     BOOK
===================================================== -->

<main class="workspace">

<section class="book">

  <div class="spine">

    <div
      class="rings"
      id="rings">
    </div>

  </div>


  <div
    class="page design-classic"
    id="diaryPage"
    data-design="classic"
  >

    <div class="pagecontent">


      <!-- HEADER -->

      <div class="pageheader">

        <div class="datearea">

          <div class="date">

            <span id="dateText"></span>

            <span
              id="moodDisplay"
              class="mood">
            </span>

          </div>

        </div>


        <div class="pageactions">

          <button
            class="smallbtn"
            onclick="previousDate()">
            ‹
          </button>

          <button
            class="smallbtn"
            onclick="goToday()">
            Today
          </button>

          <button
            class="smallbtn"
            onclick="nextDate()">
            ›
          </button>

        </div>

      </div>


      <!-- QUOTE -->

      <div
        id="quote"
        class="quote">
      </div>


      <!-- FORMATTING TOOLBAR -->

      <div class="toolbar">

        <button
          onclick="formatText('bold')">
          <b>B</b>
        </button>

        <button
          onclick="formatText('italic')">
          <i>I</i>
        </button>

        <button
          onclick="formatText('underline')">
          <u>U</u>
        </button>

        <button
          onclick="formatText('insertUnorderedList')">
          •
        </button>

        <button
          onclick="formatText('insertOrderedList')">
          1.
        </button>

        <button
          onclick="formatText('justifyLeft')">
          ≡
        </button>

        <button
          onclick="formatText('justifyCenter')">
          ≡
        </button>

        <button
          onclick="clearFormatting()">
          Clear
        </button>


        <div class="drawwrap">

          <button
            id="drawButton"
            onclick="toggleDrawMenu()">
            ✎ Draw
          </button>


          <div
            id="drawMenu"
            class="drawmenu"
            hidden
          >

            <button
              onclick="selectDrawTool('pen')">
              ✎
            </button>

            <button
              onclick="selectDrawTool('line')">
              ╱
            </button>

            <button
              onclick="selectDrawTool('circle')">
              ○
            </button>

            <button
              onclick="selectDrawTool('eraser')">
              ⌫
            </button>

            <button
              onclick="undoDrawing()">
              ↶
            </button>

            <button
              onclick="redoDrawing()">
              ↷
            </button>

            <button
              onclick="clearDrawing()">
              Clear
            </button>

          </div>

        </div>

      </div>


      <!-- WRITING + DRAWING -->

      <div
        id="editorWrap"
        class="editorwrap"
      >

        <div
          id="editor"
          class="editor"
          contenteditable="true"
          spellcheck="true">
        </div>

        <canvas
          id="drawCanvas">
        </canvas>

      </div>


      <!-- NEW PAGE -->

      <button
        class="newpage"
        onclick="newPage()">
        + New Page
      </button>

    </div>

  </div>

</section>

</main>


<!-- =====================================================
     CALENDAR MODAL
===================================================== -->

<div
  id="calendarModal"
  class="modal"
  hidden
>

  <div class="modalbox">

    <h2>📅 Diary Calendar</h2>

    <div class="calnav">

      <button
        class="smallbtn"
        onclick="changeMonth(-1)">
        ‹
      </button>

      <strong id="calendarTitle"></strong>

      <button
        class="smallbtn"
        onclick="changeMonth(1)">
        ›
      </button>

    </div>

    <div
      id="calendarGrid"
      class="calgrid">
    </div>

    <div class="eventlist">

      <h3>Diary Events</h3>

      <div id="calendarEvents"></div>

    </div>

    <div class="modalbuttons">

      <button
        class="smallbtn"
        onclick="closeModal('calendarModal')">
        Close
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     EVENTS MODAL
===================================================== -->

<div
  id="eventsModal"
  class="modal"
  hidden
>

  <div class="modalbox">

    <h2>📌 Diary Events</h2>

    <div id="eventList"></div>

    <hr>

    <h3>Add Event</h3>

    <div class="formrow">

      <div class="field">

        <label>Date</label>

        <input
          id="eventDate"
          type="date">

      </div>

      <div class="field">

        <label>Time</label>

        <input
          id="eventTime"
          type="time">

      </div>

    </div>

    <div class="field">

      <label>Event</label>

      <input
        id="eventTitle"
        type="text"
        placeholder="Birthday, appointment, meeting...">

    </div>

    <div class="field">

      <label>Notes</label>

      <textarea
        id="eventNotes">
      </textarea>

    </div>

    <div class="modalbuttons">

      <button
        class="smallbtn"
        onclick="closeModal('eventsModal')">
        Close
      </button>

      <button
        class="smallbtn primary"
        onclick="saveEvent()">
        Save Event
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     TODO MODAL
===================================================== -->

<div
  id="todoModal"
  class="modal"

<script>

/* =========================================================
   DATABASE
========================================================= */

const DB_NAME =
  "myPersonalDiaryDB";

const DB_VERSION =
  10;

let db = null;

let currentDate =
  todayISO();

let currentPage =
  1;

let currentPageRecord =
  null;

let calendarDate =
  new Date();


/* =========================================================
   DRAWING VARIABLES
========================================================= */

let drawingMode =
  false;

let drawTool =
  "pen";

let drawColor =
  "#33251b";

let drawSize =
  3;

let drawStart =
  null;

let drawLast =
  null;

let drawHistory =
  [];

let drawRedo =
  [];


/* =========================================================
   QUOTES
========================================================= */

const quotes = [

  "Every day is a new page.",

  "Write today. Remember tomorrow.",

  "Small moments become beautiful memories.",

  "A diary is a conversation with your future self.",

  "Life is made of moments worth remembering.",

  "Today deserves to be remembered.",

  "Your story is written one day at a time.",

  "Keep the memories. They become treasures.",

  "The ordinary days often become the precious memories.",

  "A peaceful mind creates beautiful memories."

];


/* =========================================================
   HELPERS
========================================================= */

function todayISO(){

  const d =
    new Date();

  return toISO(d);

}


function toISO(d){

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );

}


function dateObj(iso){

  const p =
    iso.split("-").map(Number);

  return new Date(
    p[0],
    p[1]-1,
    p[2]
  );

}


function formatDate(iso){

  return dateObj(iso)
    .toLocaleDateString(
      undefined,
      {
        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function closeModal(id){

  document.getElementById(id)
    .hidden = true;

}


function openModal(id){

  document.getElementById(id)
    .hidden = false;

}


/* =========================================================
   OPEN DATABASE
========================================================= */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(e){

          const database =
            e.target.result;


          if(
            !database.objectStoreNames
              .contains("pages")
          ){

            const store =
              database.createObjectStore(
                "pages",
                {keyPath:"id"}
              );

            store.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("events")
          ){

            const store =
              database.createObjectStore(
                "events",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

            store.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("todos")
          ){

            const store =
              database.createObjectStore(
                "todos",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

            store.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("memories")
          ){

            const store =
              database.createObjectStore(
                "memories",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

            store.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("settings")
          ){

            database.createObjectStore(
              "settings",
              {keyPath:"key"}
            );

          }

        };


      request.onsuccess =
        function(e){

          db =
            e.target.result;

          resolve(db);

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   DATABASE FUNCTIONS
========================================================= */

function get(store,key){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            store,
            "readonly"
          )
          .objectStore(store)
          .get(key);

      request.onsuccess =
        ()=>resolve(request.result);

      request.onerror =
        ()=>reject(request.error);

    }
  );

}


function put(store,value){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            store,
            "readwrite"
          )
          .objectStore(store)
          .put(value);

      request.onsuccess =
        ()=>resolve(request.result);

      request.onerror =
        ()=>reject(request.error);

    }
  );

}


function remove(store,key){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            store,
            "readwrite"
          )
          .objectStore(store)
          .delete(key);

      request.onsuccess =
        ()=>resolve();

      request.onerror =
        ()=>reject(request.error);

    }
  );

}


function all(store){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            store,
            "readonly"
          )
          .objectStore(store)
          .getAll();

      request.onsuccess =
        ()=>resolve(request.result || []);

      request.onerror =
        ()=>reject(request.error);

    }
  );

}


/* =========================================================
   OLD DIARY MIGRATION
========================================================= */

async function migrateOldDiary(){

  const old =
    localStorage.getItem(
      "myPersonalDiaryEntries"
    );

  if(!old)
    return;

  try{

    const data =
      JSON.parse(old);

    for(
      const date
      of Object.keys(data)
    ){

      const value =
        data[date];

      let content="";
      let mood="";

      if(
        typeof value ===
        "string"
      ){

        content=value;

      }else if(value){

        content =
          value.content ||
          value.text ||
          "";

        mood =
          value.mood ||
          "";

      }


      if(!content)
        continue;


      const id =
        date + "-1";

      const exists =
        await get(
          "pages",
          id
        );


      if(!exists){

        await put(
          "pages",
          {
            id:id,
            date:date,
            page:1,
            content:content,
            drawing:null,
            mood:mood,
            quote:getQuote(date)
          }
        );

      }

    }

  }catch(error){

    console.log(
      "Old diary migration error",
      error
    );

  }

}


/* =========================================================
   QUOTE
========================================================= */

function getQuote(date){

  let n=0;

  for(
    let i=0;
    i<date.length;
    i++
  ){

    n +=
      date.charCodeAt(i);

  }

  return quotes[
    n % quotes.length
  ];

}


/* =========================================================
   PAGE LOAD
========================================================= */

async function loadPage(){

  const id =
    currentDate +
    "-" +
    currentPage;


  let page =
    await get(
      "pages",
      id
    );


  if(!page){

    page = {

      id:id,

      date:currentDate,

      page:currentPage,

      content:"",

      drawing:null,

      mood:"",

      quote:getQuote(currentDate)

    };

  }


  currentPageRecord =
    page;


  document.getElementById("editor")
    .innerHTML =
      page.content || "";


  document.getElementById("dateText")
    .textContent =
      formatDate(currentDate) +
      " · Page " +
      currentPage;


  document.getElementById("moodDisplay")
    .textContent =
      page.mood || "";


  document.getElementById("quote")
    .textContent =
      "“" +
      (page.quote ||
       getQuote(currentDate)) +
      "”";


  await loadDrawing(
    page.drawing
  );


  updateDesignSelection();

}


/* =========================================================
   SAVE PAGE
========================================================= */

let saveTimer=null;

function savePage(){

  clearTimeout(saveTimer);

  saveTimer =
    setTimeout(
      async function(){

        if(!currentPageRecord)
          return;

        currentPageRecord.content =
          document
            .getElementById("editor")
            .innerHTML;

        currentPageRecord.drawing =
          getDrawingData();

        await put(
          "pages",
          currentPageRecord
        );

      },
      250
    );

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function newPage(){

  savePage();

  currentPage++;

  loadPage();

}


function previousDate(){

  savePage();

  const d =
    dateObj(currentDate);

  d.setDate(
    d.getDate()-1
  );

  currentDate =
    toISO(d);

  currentPage=1;

  loadPage();

}


function nextDate(){

  savePage();

  const d =
    dateObj(currentDate);

  d.setDate(
    d.getDate()+1
  );

  currentDate =
    toISO(d);

  currentPage=1;

  loadPage();

}


function goToday(){

  savePage();

  currentDate =
    todayISO();

  currentPage=1;

  loadPage();

}


/* =========================================================
   TEXT EDITING
========================================================= */

function formatText(command){

  const editor =
    document.getElementById("editor");

  editor.focus();

  document.execCommand(
    command,
    false,
    null
  );

  savePage();

}


function clearFormatting(){

  const editor =
    document.getElementById("editor");

  editor.focus();

  document.execCommand(
    "removeFormat",
    false,
    null
  );

  savePage();

}


document
  .getElementById("editor")
  .addEventListener(
    "input",
    savePage
  );


/* =========================================================
   DRAWING
========================================================= */

const canvas =
  document.getElementById(
    "drawCanvas"
  );

const editorWrap =
  document.getElementById(
    "editorWrap"
  );

const ctx =
  canvas.getContext(
    "2d"
  );


function resizeCanvas(){

  const rect =
    editorWrap.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  const oldCanvas =
    document.createElement(
      "canvas"
    );

  if(canvas.width && canvas.height){

    oldCanvas.width =
      canvas.width;

    oldCanvas.height =
      canvas.height;

    oldCanvas
      .getContext("2d")
      .drawImage(
        canvas,
        0,
        0
      );

  }


  canvas.width =
    Math.max(
      1,
      Math.floor(
        rect.width*dpr
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.floor(
        rect.height*dpr
      )
    );


  canvas.style.width =
    rect.width+"px";

  canvas.style.height =
    rect.height+"px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  if(oldCanvas.width){

    ctx.drawImage(
      oldCanvas,
      0,
      0,
      oldCanvas.width,
      oldCanvas.height,
      0,
      0,
      rect.width,
      rect.height
    );

  }

}


function getDrawingData(){

  if(!canvas.width)
    return null;

  return canvas.toDataURL(
    "image/png"
  );

}


function loadDrawing(data){

  resizeCanvas();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawHistory=[];
  drawRedo=[];

  if(!data)
    return;


  const image =
    new Image();

  image.onload =
    function(){

      const rect =
        editorWrap
          .getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

    };

  image.src=data;

}


function snapshot(){

  return canvas.toDataURL(
    "image/png"
  );

}


function restoreSnapshot(data){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(!data){

    savePage();

    return;

  }


  const image =
    new Image();

  image.onload =
    function(){

      const rect =
        editorWrap
          .getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

      savePage();

    };

  image.src=data;

}


/* draw menu */

function toggleDrawMenu(){

  const menu =
    document.getElementById(
      "drawMenu"
    );

  menu.hidden =
    !menu.hidden;

}


/*
  Selecting a drawing tool closes
  the menu but DOES NOT close drawing mode.
*/

function selectDrawTool(tool){

  drawTool =
    tool;

  drawingMode=true;

  editorWrap
    .classList
    .add("drawing");

  document
    .getElementById("drawButton")
    .classList
    .add("active");

  document
    .getElementById("drawMenu")
    .hidden=true;

}


/* Clicking Draw again exits drawing */

function toggleDrawing(){

  drawingMode =
    !drawingMode;

  editorWrap
    .classList
    .toggle(
      "drawing",
      drawingMode
    );

}


/* position */

function pointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      e.clientX -
      rect.left,

    y:
      e.clientY -
      rect.top

  };

}


/* pointer down */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(!drawingMode)
      return;

    e.preventDefault();

    canvas.setPointerCapture(
      e.pointerId
    );


    drawHistory.push(
      snapshot()
    );

    drawRedo=[];


    const p =
      pointerPosition(e);

    drawStart=p;
    drawLast=p;


    if(drawTool==="pen"){

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        drawColor;

      ctx.lineWidth =
        drawSize;

      ctx.beginPath();

      ctx.moveTo(
        p.x,
        p.y
      );

      ctx.lineTo(
        p.x+.1,
        p.y+.1
      );

      ctx.stroke();

    }


    if(drawTool==="eraser"){

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        24,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  },
  {passive:false}
);


/* pointer move */

canvas.addEventListener(
  "pointermove",
  function(e){

    if(
      !drawingMode ||
      !drawLast
    )
      return;

    e.preventDefault();

    const p =
      pointerPosition(e);


    /* PEN */

    if(drawTool==="pen"){

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        drawColor;

      ctx.lineWidth =
        drawSize;

      ctx.beginPath();

      ctx.moveTo(
        drawLast.x,
        drawLast.y
      );

      ctx.lineTo(
        p.x,
        p.y
      );

      ctx.stroke();

    }


    /* ERASER */

    else if(
      drawTool==="eraser"
    ){

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        25,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    /*
      LINE/CIRCLE:
      preview is drawn directly.
    */

    else{

      redrawHistoryBase();

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        drawColor;

      ctx.lineWidth =
        drawSize;

      ctx.beginPath();


      if(drawTool==="line"){

        ctx.moveTo(
          drawStart.x,
          drawStart.y
        );

        ctx.lineTo(
          p.x,
          p.y
        );

      }


      if(drawTool==="circle"){

        const rx =
          Math.abs(
            p.x -
            drawStart.x
          ) / 2;

        const ry =
          Math.abs(
            p.y -
            drawStart.y
          ) / 2;

        const cx =
          (
            p.x +
            drawStart.x
          ) / 2;

        const cy =
          (
            p.y +
            drawStart.y
          ) / 2;

        ctx.ellipse(
          cx,
          cy,
          Math.max(2,rx),
          Math.max(2,ry),
          0,
          0,
          Math.PI*2
        );

      }

      ctx.stroke();

    }


    drawLast=p;

  },
  {passive:false}
);


/* pointer up */

canvas.addEventListener(
  "pointerup",
  function(e){

    if(!drawingMode)
      return;

    e.preventDefault();


    if(
      drawTool==="line" ||
      drawTool==="circle"
    ){

      const p =
        pointerPosition(e);

      redrawHistoryBase();


      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        drawColor;

      ctx.lineWidth =
        drawSize;

      ctx.beginPath();


      if(drawTool==="line"){

        ctx.moveTo(
          drawStart.x,
          drawStart.y
        );

        ctx.lineTo(
          p.x,
          p.y
        );

      }


      if(drawTool==="circle"){

        const rx =
          Math.abs(
            p.x -
            drawStart.x
          ) / 2;

        const ry =
          Math.abs(
            p.y -
            drawStart.y
          ) / 2;

        const cx =
          (
            p.x +
            drawStart.x
          ) / 2;

        const cy =
          (
            p.y +
            drawStart.y
          ) / 2;

        ctx.ellipse(
          cx,
          cy,
          Math.max(2,rx),
          Math.max(2,ry),
          0,
          0,
          Math.PI*2
        );

      }

      ctx.stroke();

    }


    drawLast=null;
    drawStart=null;

    savePage();

  },
  {passive:false}
);


/* redraw previous drawing */

function redrawHistoryBase(){

  const previous =
    drawHistory[
      drawHistory.length-1
    ];

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(!previous)
    return;


  const image =
    new Image();

  image.onload =
    function(){

      const rect =
        editorWrap
          .getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

    };

  image.src=previous;

}


/* undo */

function undoDrawing(){

  if(!drawHistory.length)
    return;

  drawRedo.push(
    snapshot()
  );

  const old =
    drawHistory.pop();

  restoreSnapshot(old);

}


/* redo */

function redoDrawing(){

  if(!drawRedo.length)
    return;

  drawHistory.push(
    snapshot()
  );

  const next =
    drawRedo.pop();

  restoreSnapshot(next);

}


/* clear */

function clearDrawing(){

  drawHistory.push(
    snapshot()
  );

  drawRedo=[];

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  savePage();

}


window.addEventListener(
  "resize",
  function(){

    const data =
      getDrawingData();

    resizeCanvas();

    if(data)
      loadDrawing(data);

  }
);


/* =========================================================
   CALENDAR
========================================================= */

async function openCalendar(){

  calendarDate =
    dateObj(currentDate);

  openModal(
    "calendarModal"
  );

  await renderCalendar();

}


function changeMonth(amount){

  calendarDate.setMonth(
    calendarDate.getMonth()+amount
  );

  renderCalendar();

}


async function renderCalendar(){

  const year =
    calendarDate.getFullYear();

  const month =
    calendarDate.getMonth();


  document
    .getElementById(
      "calendarTitle"
    )
    .textContent =
      calendarDate.toLocaleDateString(
        undefined,
        {
          month:"long",
          year:"numeric"
        }
      );


  const grid =
    document.getElementById(
      "calendarGrid"
    );

  grid.innerHTML="";


  [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ].forEach(
    function(day){

      const el =
        document.createElement(
          "div"
        );

      el.className=
        "calhead";

      el.textContent=
        day;

      grid.appendChild(el);

    }
  );


  /*
    IMPORTANT:
    Calendar reads directly from
    the same Events database.
  */

  const events =
    await all("events");


  const monthEvents =
    events.filter(
      function(ev){

        const d =
          dateObj(ev.date);

        return (
          d.getFullYear()===year &&
          d.getMonth()===month
        );

      }
    );


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const numberOfDays =
    new Date(
      year,
      month+1,
      0
    ).getDate();


  for(
    let i=0;
    i<firstDay;
    i++
  ){

    grid.appendChild(
      document.createElement("div")
    );

  }


  for(
    let day=1;
    day<=numberOfDays;
    day++
  ){

    const iso =
      year +
      "-" +
      String(month+1).padStart(2,"0") +
      "-" +
      String(day).padStart(2,"0");


    const cell =
      document.createElement(
        "div"
      );

    cell.className=
      "calday";


    if(
      iso===
      todayISO()
    ){

      cell.classList.add(
        "today"
      );

    }


    const number =
      document.createElement(
        "div"
      );

    number.className=
      "caldaynum";

    number.textContent=
      day;

    cell.appendChild(
      number
    );


    monthEvents
      .filter(
        ev =>
          ev.date===iso
      )
      .forEach(
        ev=>{

          const dot =
            document.createElement(
              "div"
            );

          dot.className=
            "eventdot";

          dot.textContent =
            (
              ev.time
              ? ev.time+" "
              : ""
            ) +
            ev.title;

          cell.appendChild(
            dot
          );

        }
      );


    cell.onclick =
      function(){

        currentDate=
          iso;

        currentPage=1;

        closeModal(
          "calendarModal"
        );

        loadPage();

      };


    grid.appendChild(
      cell
    );

  }


  const list =
    document.getElementById(
      "calendarEvents"
    );

  list.innerHTML="";


  if(!monthEvents.length){

    list.innerHTML=
      "<p>No diary events this month.</p>";

  }else{

    monthEvents
      .sort(
        (a,b)=>
          (
            a.date+
            (a.time||"")
          )
          .localeCompare(
            b.date+
            (b.time||"")
          )
      )
      .forEach(
        ev=>{

          const card =
            document.createElement(
              "div"
            );

          card.className=
            "eventcard";

          card.innerHTML =
            "<strong>"+
            escapeHTML(
              ev.title
            )+
            "</strong>"+
            "<small>"+
            formatDate(
              ev.date
            )+
            (
              ev.time
              ? " · "+ev.time
              : ""
            )+
            "</small>"+
            "<small>"+
            escapeHTML(
              ev.notes||""
            )+
            "</small>";

          list.appendChild(
            card
          );

        }
      );

  }

}

async function saveEvent(){

    document.getElementById(
      "eventDate"

    ).value.trim();


  const time =
    document.getElementById(

    ).value.trim();

async function openTodo(){

document
  .getElementById("todoDate")

async function renderTodos(){

  const date =
    document.getElementById(
      "todoDate"
    ).value;


  const list =
    document.getElementById(
      "todoList"
    );


  list.innerHTML="";


  const items =
    (
      await all("todos")
    )
    .filter(
      item =>
        item.date===date
    )
    .sort(
      (a,b)=>
        (a.created||0)-
        (b.created||0)
    );


  const past =
    date<todayISO();


  document.getElementById(
    "todoInfo"
  ).textContent =
    past
    ? "Past-date To-Do is read-only."
    : "Unfinished tasks are carried forward automatically.";


  document.getElementById(
    "todoAddButton"
  ).disabled =
    past;


  document.getElementById(
    "todoText"
  ).disabled =
    past;


  if(!items.length){

    list.innerHTML=
      "<p>No To-Do items.</p>";

    return;

  }


  items.forEach(
    item=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "todoitem"+
        (
          item.done
          ? " done"
          : ""
        );


      row.innerHTML =
        "<input type='checkbox' "+
        (
          item.done
          ? "checked "
          : ""
        )+
        (
          past
          ? "disabled "
          : ""
        )+
        "onchange='toggleTodo("+
        item.id+
        ",this.checked)'>"+

        "<span>"+
        escapeHTML(
          item.text
        )+
        "</span>"+

        (
          past
          ? ""
          :
          "<button class='smallbtn' "+
          "onclick='deleteTodo("+
          item.id+
          ")'>×</button>"
        );


      list.appendChild(
        row
      );

    }
  );

}


async function addTodo(){

  const date =
    document.getElementById(
      "todoDate"
    ).value;


  const text =
    document.getElementById(
      "todoText"
    ).value.trim();


  if(!text)
    return;


  if(date<todayISO()){

    alert(
      "You cannot add a To-Do to a past date."
    );

    return;

  }


  await put(
    "todos",
    {
      date:date,
      text:text,
      done:false,
      created:Date.now()
    }
  );


  document.getElementById(
    "todoText"
  ).value="";


  await renderTodos();

}


async function toggleTodo(
  id,
  done
){

  const item =
    await get(
      "todos",
      id
    );

  if(!item)
    return;


  item.done=
    done;


  await put(
    "todos",
    item
  );


  await renderTodos();

}


async function deleteTodo(id){

  await remove(
    "todos",
    id
  );

  await renderTodos();

}


/*
  Carry unfinished items forward
  when opening a new day.
*/

async function carryForwardTodos(){

  const allTodos =
    await all("todos");


  const pending =
    allTodos.filter(
      item =>
        !item.done &&
        item.date<todayISO()
    );


  for(
    const item
    of pending
  ){

    const d =
      dateObj(
        item.date
      );

    d.setDate(
      d.getDate()+1
    );


    const nextDate =
      toISO(d);


    if(
      nextDate>todayISO()
    )
      continue;


    const exists =
      allTodos.some(
        x =>
          x.date===nextDate &&
          x.text===item.text &&
          !x.done
      );


    if(!exists){

      await put(
        "todos",
        {
          date:nextDate,
          text:item.text,
          done:false,
          carried:true,
          created:Date.now()
        }
      );

    }

  }

}

async function openMemories(){

async function saveMemory(event){

  const file =
    event.target.files[0];

  if(!file)
    return;


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    alert(
      "Please select an image."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function(){

      await put(
        "memories",
        {
          date:currentDate,
          name:file.name,
          image:reader.result,
          created:Date.now()
        }
      );


      event.target.value="";


      await renderMemories();

    };


  reader.readAsDataURL(file);

}


async function renderMemories(){

  const memories =
    await all(
      "memories"
    );


  memories.sort(
    (a,b)=>
      (b.created||0)-
      (a.created||0)
  );


  const grid =
    document.getElementById(
      "memoryGrid"
    );

  grid.innerHTML="";


  if(!memories.length){

    grid.innerHTML=
      "<p>No memories saved yet.</p>";

    return;

  }


  memories.forEach(
    memory=>{

      const card =
        document.createElement(
          "div"
        );

      card.className=
        "memory";


      const image =
        document.createElement(
          "img"
        );

      /*
        Actual stored image is used here.
      */

      image.src =
        memory.image;

      image.alt =
        memory.name ||
        "Diary memory";


      const caption =
        document.createElement(
          "div"
        );

      caption.className=
        "memorycaption";

      caption.textContent =
        formatDate(
          memory.date
        );


      const del =
        document.createElement(
          "button"
        );

      del.className=
        "smallbtn";

      del.textContent=
        "Delete";

      del.onclick =
        ()=>deleteMemory(
          memory.id
        );


      card.appendChild(
        image
      );

      card.appendChild(
        caption
      );

      card.appendChild(
        del
      );


      grid.appendChild(
        card
      );

    }
  );

}


async function deleteMemory(id){

  if(
    !confirm(
      "Delete this memory?"
    )
  )
    return;


  await remove(
    "memories",
    id
  );


  await renderMemories();

}

    key:"preferences",

    design:"classic",

    lines:24,

    "widthRange"
  ).value =

async function saveSettings(){

  const old =
    await getSettings();


  const settings = {

    key:"preferences",

    design:
      document
        .getElementById(
          "diaryPage"
        )
        .dataset.design ||
      old.design,

    lines:
      Number(
        document
          .getElementById(
            "lineRange"
          ).value
      ),

    font:
      Number(
        document
          .getElementById(
            "fontRange"
          ).value
      ),

    spacing:
      Number(
        document
          .getElementById(
            "spacingRange"
          ).value
      ),

    width:
      Number(
        document
          .getElementById(
            "widthRange"
          ).value
      )

  };


  await put(
    "settings",
    settings
  );

}


function applySettings(p){

  document.documentElement
    .style
    .setProperty(
      "--page-lines",
      p.lines
    );


  document.documentElement
    .style
    .setProperty(
      "--font-size",
      p.font+"px"
    );


  document.documentElement
    .style
    .setProperty(
      "--line-height",
      p.spacing+"px"
    );


  document.documentElement
    .style
    .setProperty(
      "--page-width",
      p.width+"px"
    );


  const page =
    document.getElementById(
      "diaryPage"
    );


  page.dataset.design =
    p.design;


  page.className =
    "page design-"+p.design;


  document.getElementById(
    "lineValue"
  ).textContent =
    p.lines;


  document.getElementById(
    "fontValue"
  ).textContent =
    p.font+" px";


  document.getElementById(
    "spacingValue"
  ).textContent =
    p.spacing+" px";


  document.getElementById(
    "widthValue"
  ).textContent =
    p.width+" px";


  updateDesignSelection();

}


function updateDesignSelection(){

  const page =
    document.getElementById(
      "diaryPage"
    );

  const design =
    page.dataset.design ||
    "classic";


  document
    .querySelectorAll(
      ".design"
    )
    .forEach(
      el=>{

        el.classList.remove(
          "selected"
        );

        if(
          el.classList.contains(
            "design-"+design
          )
        ){

          el.classList.add(
            "selected"
          );

        }

      }
    );

}

/* =========================================================
   BACKUP
========================================================= */

async function backupDiary(){

  const data={

    version:"10.1",

    pages:
      await all("pages"),

    events:
      await all("events"),

    todos:
      await all("todos"),

    memories:
      await all("memories"),

    settings:
      await all("settings")

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );

  a.href=url;

  a.download =
    "my-personal-diary-v10.1-backup.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}


/* =========================================================
   RESTORE
========================================================= */

async function restoreDiary(event){

  const file =
    event.target.files[0];

  if(!file)
    return;


  try{

    const text =
      await file.text();


    const data =
      JSON.parse(text);


    if(
      !data.version
    ){

      alert(
        "Invalid diary backup."
      );

      return;

    }


    for(
      const item
      of data.pages || []
    ){

      await put(
        "pages",
        item
      );

    }


    for(
      const item
      of data.events || []
    ){

      await put(
        "events",
        item
      );

    }


    for(
      const item
      of data.todos || []
    ){

      await put(
        "todos",
        item
      );

    }


    for(
      const item
      of data.memories || []
    ){

      await put(
        "memories",
        item
      );

    }


    for(
      const item
      of data.settings || []
    ){

      await put(
        "settings",
        item
      );

    }


    alert(
      "Diary restored successfully."
    );


    location.reload();


  }catch(error){

    alert(
      "Restore failed: "+
      error.message
    );

  }

}
