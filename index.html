<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4226">
<link rel="manifest" href="./manifest.json">
<title>My Personal Diary</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#d6c3a5;color:#3e2a1f;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.app{max-width:1100px;margin:auto;padding:12px}.topbar{background:#6b4226;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 5px 18px #0002}.topbar h1{margin:0;font-size:24px}.topbar small{opacity:.85}.toolbar,.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.btn,.mood{border:0;border-radius:9px;padding:9px 12px;background:#fff4df;color:#4b2e1e;font-weight:700;cursor:pointer}.btn:active,.mood:active{transform:scale(.98)}.btn.primary{background:#8a5a34;color:#fff}.btn.danger{background:#8d3030;color:#fff}.btn input{display:none}
.layout{display:grid;grid-template-columns:270px 1fr;gap:14px;margin-top:14px}.panel{background:#f8eedc;border-radius:14px;padding:13px;box-shadow:0 4px 14px #0002}.panel h3{margin:4px 0 10px}.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-day,.cal-week{min-height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px}.cal-week{font-weight:bold;color:#79563f}.cal-day{cursor:pointer;position:relative}.cal-day:hover{background:#ead8bd}.cal-day.today{outline:2px solid #8a5a34}.cal-day.selected{background:#8a5a34;color:white}.cal-day.has-entry:after{content:'';width:5px;height:5px;background:#8d3030;border-radius:50%;position:absolute;bottom:3px}.cal-day.has-event:before{content:'•';position:absolute;top:0;right:3px;color:#315f45}.list{max-height:310px;overflow:auto}.entry-item{padding:8px;border-bottom:1px solid #d7c2a5;cursor:pointer}.entry-item:hover{background:#ead8bd}.entry-item strong{display:block}.event-form{display:grid;gap:7px;margin-top:8px}.event-form input{width:100%;padding:8px;border:1px solid #c7ad8d;border-radius:7px;background:#fffaf0}
.diary-wrap{perspective:1600px}.page{position:relative;background:#fff8e9;min-height:760px;border-radius:4px 12px 12px 4px;padding:34px 30px 28px 78px;box-shadow:8px 8px 24px #0003;overflow:hidden;transform-origin:left center;transition:transform .55s ease,opacity .35s ease}.page:before{content:'';position:absolute;left:52px;top:0;bottom:0;width:2px;background:#d87575aa}.page:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#89a1b955 32px);pointer-events:none}.page.turn-next{transform:rotateY(-88deg);opacity:.15}.page.turn-prev{transform-origin:right center;transform:rotateY(88deg);opacity:.15}.page-content{position:relative;z-index:1}.date-title{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:2px solid #b98e65;padding-bottom:8px;margin-bottom:8px}.date-title h2{margin:0;font-size:22px}.moods{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.mood{padding:5px 8px;background:#fff;box-shadow:0 1px 3px #0002}.mood.selected{background:#8a5a34;color:#fff}.editor-tools{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.tool{border:1px solid #bda789;border-radius:7px;background:#fff8e9;min-width:38px;padding:6px 9px;font-weight:bold;cursor:pointer}.editor{min-height:430px;outline:none;font-size:18px;line-height:32px;white-space:pre-wrap;word-break:break-word}.editor:empty:before{content:'Write your thoughts, memories and moments here…';color:#987f68}.memory-area{margin-top:14px;border-top:1px dashed #bda789;padding-top:10px}.attachments{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}.attachment{background:#f4e5cc;border-radius:8px;padding:7px;overflow:hidden}.attachment img{width:100%;height:110px;object-fit:cover;border-radius:5px}.attachment a{color:#6b4226;font-weight:bold;word-break:break-word}.attachment button{float:right;border:0;background:transparent;color:#8d3030;cursor:pointer}.event-card{background:#eef3e9;border-left:4px solid #52765d;padding:7px;margin:6px 0;border-radius:5px}.status{font-size:12px;color:#6b5748;min-height:18px}.bottom{margin-top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none}
