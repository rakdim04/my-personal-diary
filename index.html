<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#563925">

<link rel="manifest" href="manifest.json">

<title>My Personal Diary v10.2</title>

<style>

/* =========================================================
   V10.2 — GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  color:#35281e;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.8),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #d5cdc0,
      #eee8df,
      #d1c7b9
    );
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

[hidden]{
  display:none !important;
}

:root{

  --paper:#fffdf5;

  --ink:#35281e;

  --rule:#b8ccd5;

  --accent:#5b3b27;

  --accent2:#7b573b;

  --line-height:34px;

  --font-size:18px;

  --page-lines:24;

  --page-width:1500px;

  --spine-width:42px;

}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.topbar{

  position:sticky;

  top:0;

  z-index:10000;

  min-height:58px;

  display:flex;

  align-items:center;

  gap:7px;

  padding:6px 8px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #432817,
      #755038
    );

  box-shadow:
    0 3px 12px rgba(0,0,0,.28);

}

.brand{

  flex:none;

  font-size:19px;

  font-weight:bold;

  white-space:nowrap;

}

.topbuttons{

  display:flex;

  flex:1;

  min-width:0;

  gap:6px;

  overflow-x:auto;

  scrollbar-width:none;

}

.topbuttons::-webkit-scrollbar{
  display:none;
}

.topbuttons button{

  flex:none;

  padding:7px 10px;

  border:
    1px solid rgba(255,255,255,.32);

  border-radius:8px;

  background:
    rgba(255,255,255,.10);

  color:white;

  white-space:nowrap;

}

.topbuttons button:active{
  transform:scale(.97);
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

  width:100%;

  padding:
    12px 5px 40px;

}

.book{

  position:relative;

  width:100%;

  max-width:var(--page-width);

  margin:auto;

}


/* =========================================================
   SPINE
========================================================= */

.spine{

  position:absolute;

  z-index:100;

  left:0;

  top:0;

  bottom:0;

  width:var(--spine-width);

  background:
    linear-gradient(
      90deg,
      #29180f 0%,
      #684127 32%,
      #8a5d3b 48%,
      #593720 67%,
      #2c1a10 100%
    );

  border-radius:
    6px 0 0 6px;

  box-shadow:
    inset -4px 0 7px rgba(0,0,0,.35),
    inset 3px 0 5px rgba(255,255,255,.10);

  overflow:hidden;

}

.spine-line{

  position:absolute;

  top:0;

  bottom:0;

  left:50%;

  width:2px;

  transform:translateX(-50%);

  background:
    rgba(20,10,5,.45);

}


/* =========================================================
   NATURAL BINDER RINGS
========================================================= */

.rings{

  position:absolute;

  inset:
    8px 4px;

  display:flex;

  flex-direction:column;

  justify-content:space-around;

}

.ring{

  position:relative;

  width:31px;

  height:17px;

  margin:auto;

  border-radius:50%;

  border:
    3px solid #2d1a10;

  border-left-color:#53321f;

  border-right-color:#ad805b;

  box-shadow:
    1px 2px 3px rgba(0,0,0,.55),
    inset 1px 1px 2px rgba(255,255,255,.22);

  transform:rotate(-4deg);

}


/* =========================================================
   PAGE
========================================================= */

.page{

  position:relative;

  min-height:
    calc(
      var(--page-lines) *
      var(--line-height) +
      180px
    );

  margin:0;

  margin-left:var(--spine-width);

  background:var(--paper);

  color:var(--ink);

  border:
    1px solid #d4c7b5;

  border-left:0;

  border-radius:
    0 12px 12px 0;

  box-shadow:
    inset 0 0 35px rgba(80,50,20,.07),
    0 13px 25px rgba(0,0,0,.23);

}

.page:after{

  content:"";

  position:absolute;

  z-index:1;

  top:0;

  right:-3px;

  bottom:0;

  width:3px;

  background:
    repeating-linear-gradient(
      to bottom,
      #c8bdad 0,
      #eee8dd 2px,
      #c0b4a4 4px
    );

}


/* =========================================================
   PAGE CONTENT
========================================================= */

.pagecontent{

  position:relative;

  padding:
    0 13px 45px;

}


/* =========================================================
   PAGE HEADER
========================================================= */

.pageheader{

  position:sticky;

  top:58px;

  z-index:500;

  min-height:54px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:
    4px 2px;

  background:
    rgba(255,253,245,.97);

  border-bottom:
    1px solid #d8cbb9;

  backdrop-filter:blur(5px);

}

.datearea{

  flex:1;

  min-width:0;

}

.date{

  display:flex;

  align-items:center;

  min-width:0;

  font-size:18px;

  font-weight:bold;

  white-space:nowrap;

}

#dateText{

  overflow:hidden;

  text-overflow:ellipsis;

}

.mood{

  flex:none;

  margin-left:5px;

  font-size:20px;

}

.pageactions{

  flex:none;

  display:flex;

  gap:4px;

}

.smallbtn{

  min-height:36px;

  padding:
    5px 9px;

  border:
    1px solid #ae9c84;

  border-radius:8px;

  background:#fffaf0;

  color:#3b2a1d;

}


/* =========================================================
   QUOTE
========================================================= */

.quote{

  height:29px;

  display:flex;

  align-items:center;

  justify-content:center;

  margin:0;

  padding:0 4px;

  border-bottom:
    1px dotted #b9a58d;

  color:#73543d;

  font-size:13px;

  font-style:italic;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  position:sticky;

  top:112px;

  z-index:450;

  display:flex;

  align-items:center;

  gap:4px;

  min-width:0;

  margin:
    7px 0 4px;

  padding:5px;

  border:
    1px solid #c8b9a4;

  border-radius:9px;

  background:
    rgba(247,240,229,.98);

  box-shadow:
    0 2px 7px rgba(0,0,0,.12);

  overflow-x:auto;

  scrollbar-width:none;

}

.toolbar::-webkit-scrollbar{
  display:none;
}

.toolbar button{

  flex:none;

  min-width:38px;

  height:36px;

  padding:4px 8px;

  border:
    1px solid #ae9c84;

  border-radius:7px;

  background:#fffaf1;

  color:#3b2b1e;

}

.toolbar button.active{

  color:white;

  background:#5b3b27;

}


/* =========================================================
   DRAWING MENU
========================================================= */

.drawwrap{

  position:relative;

  flex:none;

}

.drawmenu{

  position:fixed;

  z-index:5000;

  display:flex;

  flex-wrap:wrap;

  gap:5px;

  max-width:calc(100vw - 20px);

  padding:6px;

  border:
    1px solid #a99478;

  border-radius:9px;

  background:#fffdf8;

  box-shadow:
    0 8px 22px rgba(0,0,0,.25);

}

.drawmenu button{
  min-width:42px;
}

.drawhint{

  padding:5px 7px;

  font-size:12px;

  color:#74573e;

}


/* =========================================================
   EDITOR
========================================================= */

.editorwrap{

  position:relative;

  min-height:
    calc(
      var(--page-lines) *
      var(--line-height)
    );

}

.editor{

  position:relative;

  z-index:10;

  min-height:
    calc(
      var(--page-lines) *
      var(--line-height)
    );

  padding:
    0 6px 10px;

  outline:none;

  color:var(--ink);

  /*
    NORMAL DIARY FONT.
    No forced cursive.
  */

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:var(--font-size);

  line-height:var(--line-height);

  white-space:pre-wrap;

  overflow-wrap:anywhere;

  /*
    The rule is deliberately ABOVE the
    bottom of the line box so the glyph
    baseline sits on it.
  */

  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--line-height) - 8px),
      var(--rule) calc(var(--line-height) - 8px),
      var(--rule) calc(var(--line-height) - 7px),
      transparent calc(var(--line-height) - 7px),
      transparent var(--line-height)
    );

  background-size:
    100% var(--line-height);

  background-position:
    0 0;

}

.editor:empty:before{

  content:
    "Start writing here...";

  color:#b5a899;

  pointer-events:none;

}


/*
  Remove browser paragraph/div spacing.
*/

.editor p,
.editor div,
.editor section{

  margin:0 !important;

  padding:0 !important;

  min-height:
    var(--line-height);

  line-height:
    var(--line-height);

}


/*
  Lists stay on the same ruling.
*/

.editor ul,
.editor ol{

  margin:0 !important;

  padding-left:1.45em !important;

}

.editor li{

  margin:0 !important;

  padding:0 !important;

  min-height:
    var(--line-height);

  line-height:
    var(--line-height);

}


/* =========================================================
   DRAWING CANVAS
========================================================= */

#drawCanvas{

  position:absolute;

  z-index:30;

  left:0;

  top:0;

  width:100%;

  height:100%;

  pointer-events:none;

  touch-action:none;

}

.editorwrap.drawing #drawCanvas{

  pointer-events:auto;

}

.editorwrap.drawing .editor{

  pointer-events:none;

  user-select:none;

}


/* =========================================================
   NEW PAGE
========================================================= */

.newpage{

  position:absolute;

  z-index:80;

  right:-1px;

  bottom:17px;

  padding:
    9px 12px;

  border:
    1px solid #a58b6e;

  border-radius:
    8px 0 0 8px;

  background:#f0dfc6;

  color:#533520;

  box-shadow:
    0 3px 8px rgba(0,0,0,.18);

}


/* =========================================================
   READ ONLY
========================================================= */

.readonly{

  opacity:.92;

}

.readonly .editor{

  background-color:
    rgba(230,225,215,.16);

}

.readonlynote{

  display:none;

  margin:
    4px 0;

  padding:4px 7px;

  border-radius:5px;

  color:#754a35;

  background:#f3e1d2;

  font-size:12px;

}

.page.readonly .readonlynote{
  display:block;
}


/* =========================================================
   MODAL
========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:20000;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:10px;

  background:
    rgba(25,18,12,.66);

}

.modalbox{

  width:
    min(720px,97vw);

  max-height:
    92vh;

  overflow:auto;

  padding:16px;

  border:
    1px solid #bca990;

  border-radius:14px;

  background:#fffdf7;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);

}

.modalbox h2{

  margin:
    0 0 14px;

  color:#593a27;

}

.modalbox h3{

  color:#68472f;

}

.formrow{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

}

.field{

  margin-bottom:9px;

}

.field label{

  display:block;

  margin-bottom:4px;

  font-weight:bold;

}

.field input,
.field textarea,
.field select{

  width:100%;

  padding:9px;

  border:
    1px solid #b8a994;

  border-radius:7px;

  background:white;

}

.field textarea{
  min-height:80px;
}

.modalbuttons{

  display:flex;

  justify-content:flex-end;

  gap:7px;

  margin-top:10px;

}

.primary{

  color:white !important;

  background:#593a27 !important;

}


/* =========================================================
   CALENDAR
========================================================= */

.calnav{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;

}

.calgrid{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:3px;

}

.calhead{

  padding:4px;

  text-align:center;

  font-weight:bold;

  font-size:13px;

}

.calday{

  min-height:61px;

  padding:4px;

  border:
    1px solid #d5c7b3;

  border-radius:6px;

  background:#fffaf1;

  overflow:hidden;

  cursor:pointer;

}

.calday.today{

  border:
    2px solid #69462d;

}

.calday.selected{

  box-shadow:
    inset 0 0 0 2px #b4865a;

}

.caldaynum{
  font-weight:bold;
}

.eventdot{

  margin-top:3px;

  padding:2px 3px;

  border-radius:4px;

  background:#e8d4b8;

  color:#513520;

  font-size:10px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.eventlist{

  margin-top:14px;

  padding-top:9px;

  border-top:
    1px solid #d8c9b5;

}


/* =========================================================
   EVENT / TODO
========================================================= */

.eventcard{

  margin-bottom:8px;

  padding:9px;

  border:
    1px solid #d2c2ad;

  border-radius:8px;

  background:#fffaf1;

}

.eventcard strong{
  color:#5b3b27;
}

.eventcard small{

  display:block;

  margin-top:3px;

  color:#75624e;

}

.todoitem{

  display:flex;

  align-items:center;

  gap:8px;

  padding:8px 3px;

  border-bottom:
    1px solid #ded1bf;

}

.todoitem span{
  flex:1;
}

.todoitem.done span{

  text-decoration:line-through;

  opacity:.5;

}


/* =========================================================
   MEMORIES
========================================================= */

.memorygrid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(135px,1fr)
    );

  gap:9px;

}

.memory{

  overflow:hidden;

  border:
    1px solid #cfbfaa;

  border-radius:8px;

  background:white;

}

.memory img{

  display:block;

  width:100%;

  height:140px;

  object-fit:cover;

}

.memorycaption{

  padding:6px;

  font-size:12px;

}


/* =========================================================
   SETTINGS
========================================================= */

.designs{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

}

.design{

  min-height:55px;

  padding:8px;

  border:
    2px solid #c8b9a4;

  border-radius:8px;

  cursor:pointer;

}

.design.selected{

  border-color:#5b3b27;

  box-shadow:
    0 0 0 2px #dfc6a5;

}

.rangevalue{

  font-weight:normal;

  color:#76563e;

}


/* =========================================================
   PAGE DESIGNS
========================================================= */

.design-classic{
  --paper:#fffdf5;
  --rule:#b8ccd5;
}

.design-vintage{
  --paper:#f8ecd6;
  --rule:#c7ad80;
}

.design-blue{
  --paper:#f1f8fc;
  --rule:#a8c6d8;
}

.design-green{
  --paper:#f2f8ed;
  --rule:#b3c7a0;
}

.design-rose{
  --paper:#fff4f4;
  --rule:#d7b5bd;
}

.design-lavender{
  --paper:#f8f5ff;
  --rule:#c2b9d6;
}

.design-night{
  --paper:#292724;
  --rule:#625d54;
  --ink:#eee6da;
}

.design-night .pageheader,
.design-night .toolbar{
  background:rgba(41,39,36,.97);
}

.design-night .toolbar button,
.design-night .smallbtn{
  color:#eee6da;
  background:#393631;
  border-color:#756c60;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .topbar{

    min-height:55px;

    padding:5px;

  }

  .brand{

    font-size:16px;

  }

  .topbuttons button{

    padding:
      6px 8px;

    font-size:13px;

  }

  .workspace{

    padding:
      6px 2px 30px;

  }

  /*
    Small spine on phone.
  */

  :root{

    --spine-width:38px;

  }

  .rings{

    inset:
      6px 2px;

  }

  .ring{

    width:29px;

    height:16px;

    border-width:3px;

  }

  .page{

    min-height:
      calc(
        var(--page-lines) *
        var(--line-height) +
        160px
      );

  }

  .pagecontent{

    padding:
      0 7px 35px;

  }

  .pageheader{

    top:55px;

    min-height:52px;

  }

  .date{

    font-size:16px;

  }

  .pageactions .smallbtn{

    min-width:34px;

    padding:
      4px 7px;

  }

  .toolbar{

    top:107px;

    margin-top:5px;

  }

  .editor{

    font-size:
      var(--font-size);

  }

  .formrow{

    grid-template-columns:
      1fr;

  }

  .designs{

    grid-template-columns:
      repeat(2,1fr);

  }

  .calday{

    min-height:51px;

  }

}


/* =========================================================
   TABLET
========================================================= */

@media(min-width:701px){

  .pagecontent{

    padding-left:20px;

    padding-right:22px;

  }

  .pageheader{

    top:58px;

  }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

  body{

    background:white;

  }

  .topbar,
  .spine,
  .toolbar,
  .newpage,
  .pageactions{

    display:none !important;

  }

  .workspace{

    padding:0;

  }

  .page{

    margin:0;

    border:0;

    box-shadow:none;

  }

  .pagecontent{

    margin:0;

  }

  .pageheader{

    position:static;

  }

}

</style>
</head>


<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">

  <div class="brand">
    📖 My Diary
  </div>

  <div class="topbuttons">

    <button onclick="openCalendar()">
      📅 Calendar
    </button>

    <button onclick="openEvents()">
      📌 Events
    </button>

    <button onclick="openTodo()">
      ☑ To-Do
    </button>

    <button onclick="openMemories()">
      🖼 Memories
    </button>

    <button onclick="openSettings()">
      ⚙ Settings
    </button>

    <button onclick="backupDiary()">
      💾 Backup
    </button>

    <button onclick="document.getElementById('restoreFile').click()">
      ↩ Restore
    </button>

    <button onclick="window.print()">
      🖨 Print
    </button>

  </div>

</header>


<input
  id="restoreFile"
  type="file"
  accept=".json"
  hidden
  onchange="restoreDiary(event)"
>


<!-- =======================================================
     BOOK
======================================================= -->

<main class="workspace">

<section class="book">

  <div class="spine">

    <div class="spine-line"></div>

    <div
      id="rings"
      class="rings">
    </div>

  </div>


  <article
    id="diaryPage"
    class="page design-classic"
  >

    <div class="pagecontent">


      <!-- HEADER -->

      <div class="pageheader">

        <div class="datearea">

          <div class="date">

            <span id="dateText"></span>

            <span
              id="moodDisplay"
              class="mood">
            </span>

          </div>

        </div>

        <div class="pageactions">

          <button
            class="smallbtn"
            id="prevDateBtn"
            onclick="previousDate()">
            ‹
          </button>

          <button
            class="smallbtn"
            onclick="goToday()">
            Today
          </button>

          <button
            class="smallbtn"
            id="nextDateBtn"
            onclick="nextDate()">
            ›
          </button>

        </div>

      </div>


      <div
        id="readonlyNote"
        class="readonlynote">
        🔒 Past diary pages are read-only.
      </div>


      <!-- QUOTE -->

      <div
        id="quote"
        class="quote">
      </div>


      <!-- TOOLBAR -->

      <div
        id="toolbar"
        class="toolbar">

        <button
          onclick="formatText('bold')">
          <b>B</b>
        </button>

        <button
          onclick="formatText('italic')">
          <i>I</i>
        </button>

        <button
          onclick="formatText('underline')">
          <u>U</u>
        </button>

        <button
          onclick="formatText('insertUnorderedList')">
          •
        </button>

        <button
          onclick="formatText('insertOrderedList')">
          1.
        </button>

        <button
          onclick="formatText('justifyLeft')">
          ≡
        </button>

        <button
          onclick="formatText('justifyCenter')">
          ≡
        </button>

        <button
          id="clearFormatButton"
          onclick="clearFormatting()">
          Clear
        </button>

        <div
          id="drawWrap"
          class="drawwrap">

          <button
            id="drawButton"
            onclick="toggleDrawMenu()">
            ✎ Draw
          </button>

        </div>

      </div>


      <!-- DRAW MENU IS PLACED HERE SO IT CAN BE
           POSITIONED ABOVE THE PAGE WITHOUT
           DISTURBING THE WRITING LINES -->

      <div
        id="drawMenu"
        class="drawmenu"
        hidden>

        <button
          onclick="selectDrawTool('pen')">

<script>

/* =========================================================
   DATABASE
========================================================= */

/*
  NEW DATABASE NAME.

  This is deliberate.

  The previous versions could contain incompatible
  object-store schemas. v10.2 does not try to "put"
  records into the old schema.

  Instead:
    old DB -> migration reader -> new DB
*/

const DB_NAME =
  "myPersonalDiaryDB_v102";

const DB_VERSION =
  1;

const OLD_DB_NAME =
  "myPersonalDiaryDB";

let db=null;

let currentDate=
  todayISO();

let currentPage=1;

let currentPageRecord=null;

let calendarDate=
  dateObj(currentDate);

let saveTimer=null;

let migrationDone=false;


/* =========================================================
   DRAWING
========================================================= */

const editor=
  document.getElementById("editor");

const editorWrap=
  document.getElementById("editorWrap");

const canvas=
  document.getElementById("drawCanvas");

const ctx=
  canvas.getContext("2d");

let drawingMode=false;

let drawTool="pen";

let drawSize=3;

let drawColor="#35281e";

let drawStart=null;

let drawLast=null;

let drawHistory=[];

let drawRedo=[];


/* =========================================================
   QUOTES
========================================================= */

const quotes=[

  "Every day is a new page.",

  "Write today. Remember tomorrow.",

  "Small moments become beautiful memories.",

  "A diary is a conversation with your future self.",

  "Life is made of moments worth remembering.",

  "Today deserves to be remembered.",

  "Your story is written one day at a time.",

  "Keep the memories. They become treasures.",

  "The ordinary days often become precious memories.",

  "A peaceful mind creates beautiful memories."

];


/* =========================================================
   BASIC HELPERS
========================================================= */

function todayISO(){

  return toISO(
    new Date()
  );

}


function toISO(d){

  return (
    d.getFullYear()+
    "-"+
    String(d.getMonth()+1)
      .padStart(2,"0")+
    "-"+
    String(d.getDate())
      .padStart(2,"0")
  );

}


function dateObj(iso){

  const p=
    String(iso)
      .split("-")
      .map(Number);

  return new Date(
    p[0],
    p[1]-1,
    p[2]
  );

}


function formatDate(iso){

  return dateObj(iso)
    .toLocaleDateString(
      undefined,
      {
        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );

}


function escapeHTML(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function closeModal(id){

  const el=
    document.getElementById(id);

  if(el)
    el.hidden=true;

}


function openModal(id){

  const el=
    document.getElementById(id);

  if(el)
    el.hidden=false;

}


function isPastDate(date){

  return date<todayISO();

}


/* =========================================================
   QUOTE
========================================================= */

function getQuote(date){

  let n=0;

  for(
    let i=0;
    i<date.length;
    i++
  ){

    n+=
      date.charCodeAt(i);

  }

  return quotes[
    n%quotes.length
  ];

}


/* =========================================================
   NEW DATABASE
========================================================= */

function openNewDB(){

  return new Promise(
    (resolve,reject)=>{

      const request=
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded=
        function(e){

          const database=
            e.target.result;


          if(
            !database.objectStoreNames
              .contains("pages")
          ){

            const s=
              database.createObjectStore(
                "pages",
                {keyPath:"id"}
              );

            s.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("events")
          ){

            const s=
              database.createObjectStore(
                "events",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

            s.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("todos")
          ){

            const s=
              database.createObjectStore(
                "todos",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

            s.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("memories")
          ){

            const s=
              database.createObjectStore(
                "memories",
                {
                  keyPath:"id",
                  autoIncrement:true
                }
              );

            s.createIndex(
              "date",
              "date"
            );

          }


          if(
            !database.objectStoreNames
              .contains("settings")
          ){

            database.createObjectStore(
              "settings",
              {keyPath:"key"}
            );

          }

        };


      request.onsuccess=
        function(e){

          db=e.target.result;

          db.onversionchange=
            function(){

              db.close();

            };

          resolve(db);

        };


      request.onerror=
        function(){

          reject(
            request.error ||
            new Error(
              "Unable to open diary database."
            )
          );

        };


      request.onblocked=
        function(){

          console.warn(
            "Diary database opening is blocked."
          );

        };

    }
  );

}


/* =========================================================
   DATABASE OPERATIONS
========================================================= */

function get(store,key){

  return new Promise(
    (resolve,reject)=>{

      try{

        const tx=
          db.transaction(
            [store],
            "readonly"
          );

        const request=
          tx.objectStore(store)
            .get(key);

        request.onsuccess=
          ()=>resolve(
            request.result
          );

        request.onerror=
          ()=>reject(
            request.error
          );

      }catch(error){

        reject(error);

      }

    }
  );

}


function getAll(store){

  return new Promise(
    (resolve,reject)=>{

      try{

        const tx=
          db.transaction(
            [store],
            "readonly"
          );

        const request=
          tx.objectStore(store)
            .getAll();

        request.onsuccess=
          ()=>resolve(
            request.result||[]
          );

        request.onerror=
          ()=>reject(
            request.error
          );

      }catch(error){

        reject(error);

      }

    }
  );

}


function put(store,value){

  return new Promise(
    (resolve,reject)=>{

      try{

        const tx=
          db.transaction(
            [store],
            "readwrite"
          );

        const request=
          tx.objectStore(store)
            .put(value);

        request.onsuccess=
          ()=>resolve(
            request.result
          );

        request.onerror=
          ()=>reject(
            request.error
          );

      }catch(error){

        reject(error);

      }

    }
  );

}


function deleteRecord(store,key){

  return new Promise(
    (resolve,reject)=>{

      try{

        const tx=
          db.transaction(
            [store],
            "readwrite"
          );

        const request=
          tx.objectStore(store)
            .delete(key);

        request.onsuccess=
          ()=>resolve();

        request.onerror=
          ()=>reject(
            request.error
          );

      }catch(error){

        reject(error);

      }

    }
  );

}


/* =========================================================
   OLD DATABASE MIGRATION
========================================================= */

async function migrateOldDatabase(){

  if(migrationDone)
    return;

  migrationDone=true;


  /*
    First migrate old localStorage diary.
  */

  try{

    const oldDiary=
      localStorage.getItem(
        "myPersonalDiaryEntries"
      );

    if(oldDiary){

      const data=
        JSON.parse(oldDiary);

      for(
        const date of Object.keys(data)
      ){

        const value=data[date];

        let content="";
        let mood="";

        if(
          typeof value==="string"
        ){

          content=value;

        }else if(value){

          content=
            value.content||
            value.text||
            "";

          mood=
            value.mood||
            "";

        }

        if(!content)
          continue;

        await put(
          "pages",
          {
            id:
              date+"-1",

            date:date,

            page:1,

            content:content,

            drawing:null,

            mood:mood,

            quote:getQuote(date)
          }
        );

      }

    }

  }catch(error){

    console.warn(
      "localStorage migration:",
      error
    );

  }


  /*
    Now try to read the old IndexedDB.

    There is deliberately NO version number.
    Therefore we do not trigger an upgrade
    against the old schema.
  */

  let oldDB=null;


  try{

    oldDB=
      await openOldDB();

  }catch(error){

    console.log(
      "No readable old database:",
      error
    );

    return;

  }


  try{

    const stores=
      Array.from(
        oldDB.objectStoreNames
      );


    /*
      Pages
    */

    if(
      stores.includes("pages")
    ){

      const records=
        await readOldStore(
          oldDB,
          "pages"
        );


      for(
        const record of records
      ){

        const page=
          normalizePage(
            record
          );

        if(page){

          const exists=
            await get(
              "pages",
              page.id
            );

          if(!exists){

            await put(
              "pages",
              page
            );

          }

        }

      }

    }


    /*
      Events
    */

    if(
      stores.includes("events")
    ){

      const records=
        await readOldStore(
          oldDB,
          "events"
        );


      for(
        const record of records
      ){

        const event=
          normalizeEvent(
            record
          );

        if(event){

          await put(
            "events",
            event
          );

        }

      }

    }


    /*
      Todos
    */

    if(
      stores.includes("todos")
    ){

      const records=
        await readOldStore(
          oldDB,
          "todos"
        );


      for(
        const record of records
      ){

        const todo=
          normalizeTodo(
            record
          );

        if(todo){

          await put(
            "todos",
            todo
          );

        }

      }

    }


    /*
      Memories
    */

    if(
      stores.includes("memories")
    ){

      const records=
        await readOldStore(
          oldDB,
          "memories"
        );


      for(
        const record of records
      ){

        const memory=
          normalizeMemory(
            record
          );

        if(memory){

          await put(
            "memories",
            memory
          );

        }

      }

    }


    /*
      Old attachments -> memories
    */

    if(
      stores.includes("attachments")
    ){

      const records=
        await readOldStore(
          oldDB,
          "attachments"
        );


      for(
        const record of records
      ){

        const memory=
          normalizeMemory(
            record
          );

        if(memory){

          await put(
            "memories",
            memory
          );

        }

      }

    }


    /*
      Settings
    */

    if(
      stores.includes("settings")
    ){

      const records=
        await readOldStore(
          oldDB,
          "settings"
        );


      for(
        const record of records
      ){

        const setting=
          normalizeSetting(
            record
          );

        if(setting){

          await put(
            "settings",
            setting
          );

        }

      }

    }

  }catch(error){

    console.warn(
      "Old database migration error:",
      error
    );

  }finally{

    try{
      oldDB.close();
    }catch(e){}

  }

}


function openOldDB(){

  return new Promise(
    (resolve,reject)=>{

      const request=
        indexedDB.open(
          OLD_DB_NAME
        );

      request.onsuccess=
        e=>
          resolve(
            e.target.result
          );

      request.onerror=
        e=>
          reject(
            e.target.error
          );

      request.onupgradeneeded=
        function(){

          /*
            If the old database does not exist,
            cancel migration rather than modifying it.
          */

          try{

            request.transaction.abort();

          }catch(e){}

        };

    }
  );

}


function readOldStore(database,name){

  return new Promise(
    (resolve,reject)=>{

      try{

        const tx=
          database.transaction(
            [name],
            "readonly"
          );

        const store=
          tx.objectStore(name);

        const request=
          store.getAll();

        request.onsuccess=
          ()=>resolve(
            request.result||[]
          );

        request.onerror=
          ()=>reject(
            request.error
          );

      }catch(error){

        reject(error);

      }

    }
  );

}


/* =========================================================
   NORMALIZERS
========================================================= */

function normalizePage(r){

  if(!r)
    return null;


  const date=
    r.date||
    r.day||
    (
      r.id
      ? String(r.id).split("-")[0]
      : null
    );


  if(!date)
    return null;


  const page=
    Number(
      r.page||
      r.pageNumber||
      1
    );


  return {

    id:
      date+"-"+page,

    date:date,

    page:page,

    content:
      r.content||
      r.text||
      "",

    drawing:
      r.drawing||
      r.draw||
      null,

    mood:
      r.mood||
      "",

    quote:
      r.quote||
      getQuote(date)

  };

}


function normalizeEvent(r){

  if(!r)
    return null;


  if(!r.date)
    return null;


  return {

    /*
      Do NOT reuse potentially incompatible
      numeric keys from the old store.
    */

    title:
      r.title||
      r.name||
      r.event||
      "",

    date:
      r.date,

    time:
      r.time||
      "",

    notes:
      r.notes||
      r.description||
      "",

    created:
      r.created||
      Date.now(),

    oldId:
      r.id
  };

}


function normalizeTodo(r){

  if(!r)
    return null;

  if(!r.date)
    return null;


  return {

    text:
      r.text||
      r.title||
      r.task||
      "",

    date:
      r.date,

    done:
      !!r.done,

    carried:
      !!r.carried,

    created:
      r.created||
      Date.now(),

    oldId:
      r.id

  };

}


function normalizeMemory(r){

  if(!r)
    return null;


  const image=
    r.image||
    r.data||
    r.dataUrl||
    r.url||
    null;


  if(!image)
    return null;


  return {

    date:
      r.date||
      todayISO(),

    name:

function normalizeSetting(r){

  if(!r)
    return null;


  const key=
    r.key||
    "preferences";


  if(
    key!=="preferences"
  )
    return null;


  return {

    key:"preferences",

    design:
      r.design||
      "classic",

    lines:
      Number(
        r.lines||
        24
      ),

    font:
      Number(
        r.font||
        18
      ),

    spacing:
      Number(
        r.spacing||
        34
      ),

    width:
      Number(
        r.width||
        1500
      )

  };

}

/* =========================================================
   PAGE LOAD / SAVE
========================================================= */

function pageId(){

  return (
    currentDate+
    "-"+
    currentPage
  );

}


async function loadPage(){

  const id=
    pageId();


  let page=
    await get(
      "pages",
      id
    );


  if(!page){

    page={

      id:id,

      date:currentDate,

      page:currentPage,

      content:"",

      drawing:null,

      mood:"",

      quote:
        getQuote(
          currentDate
        )

    };

  }


  currentPageRecord=
    page;


  editor.innerHTML=
    page.content||"";


  document.getElementById(
    "dateText"
  ).textContent=
    formatDate(
      currentDate
    )+
    " • Page "+
    currentPage;


  document.getElementById(
    "moodDisplay"
  ).textContent=
    page.mood||"";


  document.getElementById(
    "quote"
  ).textContent=
    "“"+
    (
      page.quote||
      getQuote(currentDate)
    )+
    "”";


  applyDatePermissions();

  await loadDrawing(
    page.drawing
  );

}


function scheduleSave(){

  clearTimeout(
    saveTimer
  );

  saveTimer=
    setTimeout(
      savePage,
      200
    );

}


async function savePage(){

  if(
    !currentPageRecord ||
    isPastDate(currentDate)
  ){

    return;

  }


  currentPageRecord.content=
    editor.innerHTML;

  currentPageRecord.drawing=
    getDrawingData();


  await put(
    "pages",
    currentPageRecord
  );

}


function applyDatePermissions(){

  const past=
    isPastDate(
      currentDate
    );


  const page=
    document.getElementById(
      "diaryPage"
    );


  page.classList.toggle(
    "readonly",
    past
  );


  editor.contentEditable=
    past
    ? "false"
    : "true";


  document.getElementById(
    "newPageButton"
  ).disabled=
    past;


  document.getElementById(
    "readonlyNote"
  ).hidden=
    !past;


  document
    .querySelectorAll(
      "#toolbar button"
    )
    .forEach(
      button=>{
        button.disabled=past;
      }
    );


  document.getElementById(
    "drawButton"
  ).disabled=
    past;


  if(past){

    exitDrawing();

  }

}

/* =========================================================
   DRAWING
========================================================= */

function resizeCanvas(){

  const rect=
    editorWrap.getBoundingClientRect();

  if(
    rect.width<=0 ||
    rect.height<=0
  )
    return;


  const old=
    document.createElement(
      "canvas"
    );

  old.width=
    canvas.width;

  old.height=
    canvas.height;


  if(
    canvas.width &&
    canvas.height
  ){

    old
      .getContext("2d")
      .drawImage(
        canvas,
        0,
        0
      );

  }


  const dpr=
    Math.max(
      1,
      window.devicePixelRatio||1
    );


  canvas.width=
    Math.floor(
      rect.width*dpr
    );

  canvas.height=
    Math.floor(
      rect.height*dpr
    );


  canvas.style.width=
    rect.width+"px";

  canvas.style.height=
    rect.height+"px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.lineCap="round";

  ctx.lineJoin="round";


  if(
    old.width &&
    old.height
  ){

    ctx.drawImage(
      old,
      0,
      0,
      old.width,
      old.height,
      0,
      0,
      rect.width,
      rect.height
    );

  }

}


function getDrawingData(){

  if(
    !canvas.width ||
    !canvas.height
  )
    return null;


  return canvas.toDataURL(
    "image/png"
  );

}


async function loadDrawing(data){

  resizeCanvas();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  drawHistory=[];
  drawRedo=[];


  if(!data)
    return;


  const image=
    new Image();


  image.onload=
    function(){

      const rect=
        editorWrap.getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

    };


  image.src=data;

}


function snapshot(){

  return getDrawingData();

}


function restoreSnapshot(data){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(!data){

    scheduleSave();

    return;

  }


  const image=
    new Image();


  image.onload=
    function(){

      const rect=
        editorWrap.getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

      scheduleSave();

    };


  image.src=data;

}


/* draw menu positioning */

/*
  Selecting a drawing tool:
  - menu closes
  - drawing mode remains active
*/

function selectDrawTool(tool){

    return;


  drawTool=tool;

  ).classList.remove(
    "active"
  );

    "drawMenu"
  ).hidden=true;

}


/* canvas coordinates */

function pointerPosition(e){

  const rect=
    canvas.getBoundingClientRect();

  return {

    x:
      e.clientX-
      rect.left,

    y:
      e.clientY-
      rect.top

  };

}


/* save base before line/circle */

function redrawBase(data){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(!data)
    return;


  const image=
    new Image();


  image.onload=
    function(){

      const rect=
        editorWrap.getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

    };


  image.src=data;

}


/* pointer down */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(
      !drawingMode ||
      isPastDate(currentDate)
    )
      return;


    e.preventDefault();


    try{
      canvas.setPointerCapture(
        e.pointerId
      );
    }catch(err){}


    drawHistory.push(
      snapshot()
    );

    drawRedo=[];


    const p=
      pointerPosition(e);


    drawStart=p;

    drawLast=p;


    if(drawTool==="pen"){

      ctx.globalCompositeOperation=
        "source-over";

      ctx.strokeStyle=
        drawColor;

      ctx.lineWidth=
        drawSize;

      ctx.beginPath();

      ctx.moveTo(
        p.x,
        p.y
      );

      ctx.lineTo(
        p.x+.1,
        p.y+.1
      );

      ctx.stroke();

    }


    if(drawTool==="eraser"){

      ctx.globalCompositeOperation=
        "destination-out";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        25,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  },
  {passive:false}
);


/* pointer move */

canvas.addEventListener(
  "pointermove",
  function(e){

    if(
      !drawingMode ||
      !drawLast
    )
      return;


    e.preventDefault();


    const p=
      pointerPosition(e);


    if(drawTool==="pen"){

      ctx.globalCompositeOperation=
        "source-over";

      ctx.strokeStyle=
        drawColor;

      ctx.lineWidth=
        drawSize;

      ctx.beginPath();

      ctx.moveTo(
        drawLast.x,
        drawLast.y
      );

      ctx.lineTo(
        p.x,
        p.y
      );

      ctx.stroke();

    }


    else if(
      drawTool==="eraser"
    ){

      ctx.globalCompositeOperation=
        "destination-out";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        25,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    else{

      const base=
        drawHistory[
          drawHistory.length-1
        ];


      redrawBase(base);


      ctx.globalCompositeOperation=
        "source-over";

      ctx.strokeStyle=
        drawColor;

      ctx.lineWidth=
        drawSize;

      ctx.beginPath();


      if(drawTool==="line"){

        ctx.moveTo(
          drawStart.x,
          drawStart.y
        );

        ctx.lineTo(
          p.x,
          p.y
        );

      }


      if(drawTool==="circle"){

        const rx=
          Math.abs(
            p.x-
            drawStart.x
          )/2;

        const ry=
          Math.abs(
            p.y-
            drawStart.y
          )/2;

        const cx=
          (
            p.x+
            drawStart.x
          )/2;

        const cy=
          (
            p.y+
            drawStart.y
          )/2;

        ctx.ellipse(
          cx,
          cy,
          Math.max(2,rx),
          Math.max(2,ry),
          0,
          0,
          Math.PI*2
        );

      }

      ctx.stroke();

    }


    drawLast=p;

  },
  {passive:false}
);


/* pointer up */

canvas.addEventListener(
  "pointerup",
  function(e){

    if(
      !drawingMode ||
      !drawStart
    )
      return;


    e.preventDefault();


    if(
      drawTool==="line" ||
      drawTool==="circle"
    ){

      const p=
        pointerPosition(e);


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      const base=
        drawHistory[
          drawHistory.length-1
        ];


      if(base){

        const image=
          new Image();


        image.onload=
          function(){

            const rect=
              editorWrap
                .getBoundingClientRect();


            ctx.drawImage(
              image,
              0,
              0,
              rect.width,
              rect.height
            );


            drawShape(
              p
            );

            scheduleSave();

          };


        image.src=base;

      }else{

        drawShape(p);

        scheduleSave();

      }

    }else{

      scheduleSave();

    }


    drawStart=null;

    drawLast=null;

  },
  {passive:false}
);


function drawShape(p){

  ctx.globalCompositeOperation=
    "source-over";

  ctx.strokeStyle=
    drawColor;

  ctx.lineWidth=
    drawSize;

  ctx.beginPath();


  if(drawTool==="line"){

    ctx.moveTo(
      drawStart.x,
      drawStart.y
    );

    ctx.lineTo(
      p.x,
      p.y
    );

  }


  if(drawTool==="circle"){

    const rx=
      Math.abs(
        p.x-
        drawStart.x
      )/2;

    const ry=
      Math.abs(
        p.y-
        drawStart.y
      )/2;

    const cx=
      (
        p.x+
        drawStart.x
      )/2;

    const cy=
      (
        p.y+
        drawStart.y
      )/2;

    ctx.ellipse(
      cx,
      cy,
      Math.max(2,rx),
      Math.max(2,ry),
      0,
      0,
      Math.PI*2
    );

  }

  ctx.stroke();

}


/* undo */

function undoDrawing(){

  if(!drawHistory.length)
    return;


  drawRedo.push(
    snapshot()
  );


  const previous=
    drawHistory.pop();


  restoreSnapshot(
    previous
  );

}


/* redo */

function redoDrawing(){

  if(!drawRedo.length)
    return;


  drawHistory.push(
    snapshot()
  );


  const next=
    drawRedo.pop();


  restoreSnapshot(
    next
  );

}


/* clear */

function clearDrawing(){

  if(isPastDate(currentDate))
    return;


  drawHistory.push(
    snapshot()
  );

  drawRedo=[];


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  scheduleSave();

}


window.addEventListener(
  "resize",
  function(){

    resizeCanvas();

  }
);


/* =========================================================
   CALENDAR
========================================================= */

async function openCalendar(){

  calendarDate=
    dateObj(currentDate);

  openModal(
    "calendarModal"
  );

  await renderCalendar();

}


async function changeMonth(amount){

  calendarDate.setMonth(
    calendarDate.getMonth()+
    amount
  );

  await renderCalendar();

}


async function renderCalendar(){

  const year=
    calendarDate.getFullYear();

  const month=
    calendarDate.getMonth();


  document.getElementById(
    "calendarTitle"
  ).textContent=
    calendarDate.toLocaleDateString(
      undefined,
      {
        month:"long",
        year:"numeric"
      }
    );


  const grid=
    document.getElementById(
      "calendarGrid"
    );


  grid.innerHTML="";


  [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ].forEach(
    day=>{

      const h=
        document.createElement(
          "div"
        );

      h.className="calhead";

      h.textContent=day;

      grid.appendChild(h);

    }
  );


  const events=
    await getAll(
      "events"
    );


  const firstDay=
    new Date(
      year,
      month,
      1
    ).getDay();


  const days=
    new Date(
      year,
      month+1,
      0
    ).getDate();


  for(
    let i=0;
    i<firstDay;
    i++
  ){

    grid.appendChild(
      document.createElement(
        "div"
      )
    );

  }


  for(
    let day=1;
    day<=days;
    day++
  ){

    const iso=
      year+
      "-"+
      String(month+1)
        .padStart(2,"0")+
      "-"+
      String(day)
        .padStart(2,"0");


    const cell=
      document.createElement(
        "div"
      );


    cell.className="calday";


    if(
      iso===todayISO()
    ){

      cell.classList.add(
        "today"
      );

    }


    if(
      iso===currentDate
    ){

      cell.classList.add(
        "selected"
      );

    }


    const n=
      document.createElement(
        "div"
      );

    n.className=
      "caldaynum";

    n.textContent=
      day;

    cell.appendChild(n);


    events
      .filter(
        ev=>
          ev.date===iso
      )
      .forEach(
        ev=>{

          const dot=
            document.createElement(
              "div"
            );

          dot.className=
            "eventdot";

          dot.textContent=
            (
              ev.time
              ? ev.time+" "
              : ""
            )+
            ev.title;

          cell.appendChild(
            dot
          );

        }
      );


    cell.onclick=
      async function(){

        await savePage();

        currentDate=iso;

        currentPage=1;

        closeModal(
          "calendarModal"
        );

        await loadPage();

      };


    grid.appendChild(
      cell
    );

  }


  const list=
    document.getElementById(
      "calendarEvents"
    );


  list.innerHTML="";


  const monthEvents=
    events
      .filter(
        ev=>{

          const d=
            dateObj(ev.date);

          return(
            d.getFullYear()===year &&
            d.getMonth()===month
          );

        }
      )
      .sort(
        (a,b)=>
          (
            a.date+
            (a.time||"")
          )
          .localeCompare(
            b.date+
            (b.time||"")
          )
      );


  if(!monthEvents.length){

    list.innerHTML=
      "<p>No events this month.</p>";

  }else{

    monthEvents.forEach(
      ev=>{

        const card=
          document.createElement(
            "div"
          );

        card.className=

async function saveEvent(){

  const date=
    document.getElementById(
      "eventDate"
    ).value;

  const title=
    document.getElementById(
      "eventTitle"
    ).value.trim();

  const time=
    document.getElementById(
      "eventTime"
    ).value;

  const notes=
    document.getElementById(
      "eventNotes"
    ).value.trim();


  if(
    !date ||
    !title
  ){

    alert(
      "Please enter the event date and title."
    );

    return;

  }


  if(
    date<todayISO()
  ){

    alert(
      "Events cannot be added to a past date."
    );

    return;

  }


  await put(
    "events",
    {
      date:date,
      title:title,
      time:time,
      notes:notes,
      created:Date.now()
    }

  document.getElementById(
    "eventTitle"
  ).value="";

  document.getElementById(
    "eventNotes"
  ).value="";

  document.getElementById(
    "eventTime"
  ).value="";


  await renderEvents();

}

async function renderTodos(){

  const date=
    document.getElementById(
      "todoDate"
    ).value;


  const past=
    date<todayISO();


  const list=
    document.getElementById(
      "todoList"
    );


  list.innerHTML="";


  const todos=
    (
      await getAll(
        "todos"
      )
    )
    .filter(
      t=>t.date===date
    )
    .sort(
      (a,b)=>

    );


  document.getElementById(
    "todoInfo"
  ).textContent=
    past
    ? "🔒 Past-date To-Do is read-only."
    : "Unfinished tasks are carried forward automatically.";

  ).disabled=past;


  document.getElementById(
    "todoText"
  ).disabled=past;


  if(!todos.length){

    list.innerHTML=

    return;

  }


  todos.forEach(
    todo=>{

      const row=
        document.createElement(
          "div"
        );


      row.className=
        "todoitem"+
        (
          todo.done
          ? " done"
          : ""
        );


      row.innerHTML=

        (
          todo.done
          ? "checked "
          : ""
        )+

          past

          : ""

        todo.id+

        "<span>"+
        escapeHTML(
          todo.text
        )+
        "</span>"+

          past
          ? ""

async function addTodo(){

  const date=
    document.getElementById(
      "todoDate"
    ).value;

    document.getElementById(
      "todoText"
    ).value.trim();


  if(!text)

    }

async function toggleTodo(
  id,
  done
){

  if(
    isPastDate(
      document.getElementById(
        "todoDate"
      ).value
    )
  )
    return;


  const item=
    await get(
      "todos",
      Number(id)
    );

  item.done=
    !!done;


  await put(
    "todos",

  );

}


/*
  Copy pending tasks into TODAY.

  Duplicates are prevented.
*/

async function carryForwardTodos(){

  const all=
    await getAll(
      "todos"
    );


  const pending=
    all.filter(
      t=>
        !t.done &&
        t.date<todayISO()
    );


  for(
    const task of pending
  ){

    const duplicate=
      all.some(
        t=>
          t.date===todayISO() &&
          !t.done &&
          t.text===task.text
      );


    if(!duplicate){

      await put(
        "todos",
        {
          date:todayISO(),
          text:task.text,
          done:false,
          carried:true,
          created:Date.now()
        }
      );

    }

  }

}

async function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();


      reader.onload=
        function(){

          const image=
            new Image();


          image.onload=
            function(){

              const max=1600;

              let width=
                image.width;

              let height=
                image.height;


              if(width>max){

                height=
                  Math.round(
                    height*
                    max/
                    width
                  );

                width=max;

              }


              const c=
                document.createElement(
                  "canvas"
                );


              c.width=width;

              c.height=height;


              const cctx=
                c.getContext(
                  "2d"
                );


              cctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              resolve(
                c.toDataURL(
                  "image/jpeg",
                  .82
                )
              );

            };


          image.onerror=
            reject;


          image.src=
            reader.result;

        };


      reader.onerror=
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


async function saveMemory(event){

  const file=
    event.target.files[0];


  if(!file)

  try{

        image:image,

    event.target.value="";

}

async function backupDiary(){

  await savePage();


  const backup={

    version:"10.2",

    created:
      new Date().toISOString(),

    pages:
      await getAll("pages"),

    events:
      await getAll("events"),

    todos:
      await getAll("todos"),

    memories:
      await getAll("memories"),

    settings:
      await getAll("settings")

  };


  const blob=
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url=
    URL.createObjectURL(
      blob
    );


  const a=
    document.createElement(
      "a"
    );


  a.href=url;

  a.download=
    "my-personal-diary-v10.2-backup.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}


/* =========================================================
   RESTORE
========================================================= */

async function restoreDiary(event){

  const file=
    event.target.files[0];


  if(!file)
    return;


  try{

    const text=
      await file.text();


    const data=
      JSON.parse(text);


    if(
      !data.pages &&
      !data.events &&
      !data.todos &&
      !data.memories
    ){

      throw new Error(
        "This does not appear to be a diary backup."
      );

    }


    for(
      const page of data.pages||[]
    ){

      const normalized=
        normalizePage(page);

      if(normalized)
        await put(
          "pages",
          normalized
        );

    }


    for(
      const eventRecord
      of data.events||[]
    ){

      await put(
        "events",
        {
          title:
            eventRecord.title||"",
          date:
            eventRecord.date||todayISO(),
          time:
            eventRecord.time||"",
          notes:
            eventRecord.notes||"",
          created:
            eventRecord.created||
            Date.now()
        }
      );

    }


    for(
      const todo of data.todos||[]
    ){

      await put(
        "todos",
        {
          text:
            todo.text||"",
          date:
            todo.date||todayISO(),
          done:
            !!todo.done,
          carried:
            !!todo.carried,
          created:
            todo.created||
            Date.now()
        }
      );

    }


    for(
      const memory of data.memories||[]
    ){

      const normalized=
        normalizeMemory(
          memory
        );

      if(normalized)
        await put(
          "memories",
          normalized
        );

    }


    if(
      Array.isArray(
        data.settings
      )
    ){

      for(
        const setting
        of data.settings
      ){

        const normalized=
          normalizeSetting(
            setting
          );

        if(normalized)
          await put(
            "settings",
            normalized
          );

      }

    }


    alert(
      "Diary restored successfully."
    );


    location.reload();


  }catch(error){

    alert(
      "Restore failed:\n"+
      error.message
    );

  }finally{

    event.target.value="";

  }

}


/* =========================================================
   EVENTS REMINDER
========================================================= */

let alertedEvents=
  new Set();


async function checkEventAlerts(){

  const events=
    await getAll(
      "events"
    );


  const now=
    new Date();


  const today=
    todayISO();


  const currentTime=
    String(
      now.getHours()
    ).padStart(2,"0")+
    ":"+
    String(
      now.getMinutes()
    ).padStart(2,"0");


  events.forEach(
    event=>{

      if(
        event.date!==today ||
        !event.time
      )
        return;


      const key=
        event.id+
        "-"+
        today;


      if(
        event.time===currentTime &&
        !alertedEvents.has(key)
      ){

        alertedEvents.add(key);


        /*
          Use the existing event modal
          as the alert rather than a browser
          alert that can be blocked.
        */

        openEvents();

        alert(
          "📌 Diary Event\n\n"+
          event.title+
          (
            event.notes
            ? "\n\n"+
              event.notes
            : ""
          )
        );

      }

    }
  );

}


/* =========================================================
   STARTUP
========================================================= */

async function start(){

  try{

    /*
      Open the NEW database first.
      This eliminates the old object-store
      mismatch.
    */

    await openNewDB();


    /*
      Migrate old data.
    */

    await migrateOldDatabase();


    /*
      Settings.
    */

    const settings=
      await getSettings();


    applySettings(
      settings
    );


    /*
      Binder rings.
    */

    const rings=
      document.getElementById(
        "rings"
      );


    rings.innerHTML="";


    for(
      let i=0;
      i<26;
      i++
    ){

      const ring=
        document.createElement(
          "div"
        );

      ring.className="ring";

      rings.appendChild(
        ring
      );

    }


    /*
      Load diary.
    */

    await loadPage();


    /*
      Carry pending tasks forward.
    */

    await carryForwardTodos();


    /*
      Canvas.
    */

    resizeCanvas();


    /*
      Event checking.
    */

    setInterval(
      checkEventAlerts,
      30000
    );


    /*
      Prevent accidental loss when
      leaving the page.
    */

    window.addEventListener(
      "beforeunload",
      function(){

        if(
          !isPastDate(
            currentDate
          )
        ){

          currentPageRecord.content=
            editor.innerHTML;

          currentPageRecord.drawing=
            getDrawingData();

          /*
            Synchronous IDB is impossible,
            but scheduled save already runs
            during normal editing.
          */

        }

      }
    );


  }catch(error){

    console.error(
      "V10.2 startup error:",
      error
    );


    document.body.innerHTML=
      "<div style='"+
      "font-family:Arial;"+
      "padding:25px;"+
      "line-height:1.6;"+
      "'>"+
      "<h2>📖 Diary startup problem</h2>"+
      "<p>The diary database could not be opened.</p>"+
      "<p style='color:#8b0000'>"+
      escapeHTML(
        error.message
      )+
      "</p>"+
      "<p>Reload the page once. Your existing diary data has not been deliberately deleted.</p>"+
      "</div>";

  }

}


/* =========================================================
   START
========================================================= */

start();
