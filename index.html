<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#654321">
<link rel="manifest" href="manifest.json">
<title>My Personal Diary</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 28%),
    linear-gradient(135deg,#d9c09a,#b89568 50%,#d4b98c);
  color:#3b281b;
}

button,input,select,textarea{font:inherit}
button{
  border:1px solid #b99b73;
  border-radius:10px;
  background:#fffdf8;
  color:#4a3220;
  padding:9px 14px;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
}
button:hover{background:#f5ead8}
button:active{transform:translateY(1px)}

[hidden]{display:none!important}

/* TOP BAR */
.topbar{
  margin:16px auto 12px;
  width:96%;
  background:linear-gradient(#5a351e,#3f2515);
  color:#fff8eb;
  border-radius:18px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  box-shadow:0 7px 18px rgba(60,35,15,.25);
}
.brand{
  font-size:24px;
  font-weight:bold;
  margin-right:auto;
  white-space:nowrap;
}
.topbar button{font-size:16px}

/* DATE BAR */
.datebar{
  width:96%;
  margin:0 auto 18px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.datebar input{
  width:205px;
  padding:10px;
  border:1px solid #b99b73;
  border-radius:9px;
  background:#fffdf7;
  color:#493321;
}

/* DIARY */
.diary{
  width:94%;
  max-width:1450px;
  margin:0 auto 40px;
  position:relative;
  padding:0 0 30px 78px;
}

/* natural holes */
.binding{
  position:absolute;
  left:12px;
  top:22px;
  bottom:22px;
  width:58px;
  z-index:5;
  pointer-events:none;
}
.hole{
  position:absolute;
  left:0;
  width:45px;
  height:27px;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 45% 35%,#e8e8e8 0,#999 38%,#444 62%,#ddd 70%,#777 100%);
  box-shadow:
    inset 2px 2px 4px rgba(0,0,0,.65),
    2px 4px 4px rgba(0,0,0,.25);
}
.hole:after{
  content:"";
  position:absolute;
  left:8px;
  top:10px;
  width:30px;
  height:5px;
  border-radius:50%;
  background:rgba(40,30,20,.45);
  filter:blur(1px);
}
.hole:nth-child(1){top:0}
.hole:nth-child(2){top:9%}
.hole:nth-child(3){top:18%}
.hole:nth-child(4){top:27%}
.hole:nth-child(5){top:36%}
.hole:nth-child(6){top:45%}
.hole:nth-child(7){top:54%}
.hole:nth-child(8){top:63%}
.hole:nth-child(9){top:72%}
.hole:nth-child(10){top:81%}
.hole:nth-child(11){top:90%}

.page{
  position:relative;
  min-height:1180px;
  padding:72px 70px 90px 95px;
  overflow:hidden;
  border:1px solid #b99768;
  border-radius:6px 18px 18px 6px;
  box-shadow:
    0 14px 25px rgba(61,38,18,.30),
    inset 0 0 25px rgba(139,95,45,.12);
  background-color:#fff9df;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(108,145,150,.25) 40px,
      transparent 41px
    ),
    radial-gradient(circle at 30% 20%,rgba(130,90,40,.05),transparent 40%);
}

/* different diary designs */
.page.classic{
  background-color:#fff9df;
}
.page.vintage{
  background-color:#f2dfb9;
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 39px,rgba(120,90,50,.22) 40px,transparent 41px),
    radial-gradient(circle at 80% 30%,rgba(90,55,20,.08),transparent 35%);
}
.page.floral{
  background-color:#fff7e7;
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 39px,rgba(126,145,110,.20) 40px,transparent 41px);
}
.page.blue{
  background-color:#edf5f3;
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 39px,rgba(77,119,130,.22) 40px,transparent 41px);
}
.page.dark{
  background-color:#27231e;
  color:#eee3cc;
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 39px,rgba(220,190,130,.15) 40px,transparent 41px);
}

/* page top */
.pagehead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  position:relative;
  z-index:4;
}
.pagehead h1{
  margin:0 0 3px;
  font-size:32px;
}
.pageNo{
  font-size:15px;
  opacity:.75;
}
.quote{
  font-size:14px;
  padding:8px 12px;
  margin-top:4px;
}

/* emoji strip */
.emojiBar{
  position:relative;
  z-index:5;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:9px 12px;
  margin:15px 0 10px;
  border:1px solid #d1b487;
  border-radius:13px;
  background:rgba(255,252,239,.86);
  box-shadow:inset 0 1px 5px rgba(100,60,20,.08);
}
.emojiBar button{
  border:0;
  background:transparent;
  box-shadow:none;
  padding:2px 4px;
  font-size:25px;
  line-height:1;
}

/* writing area */
.editorWrap{
  position:relative;
  min-height:790px;
}
.editor{
  position:relative;
  z-index:2;
  min-height:790px;
  outline:none;
  font-size:20px;
  line-height:40px;
  white-space:normal;
  padding:2px 5px;
}
.editor:empty:before{
  content:"Start writing here...";
  color:rgba(100,70,40,.35);
  pointer-events:none;
}

/* DRAW CANVAS
   It covers the entire writing/page area but is invisible until draw mode. */
#drawCanvas{
  position:absolute;
  z-index:8;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  background:transparent;
  touch-action:none;
}
.draw-active #drawCanvas{
  display:block;
  cursor:crosshair;
}

/* draw controls */
.drawTools{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  background:rgba(60,38,23,.97);
  color:white;
  padding:10px;
  border-radius:14px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:96%;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.drawTools button{
  padding:7px 10px;
  font-size:14px;
}
.drawTools button.active{
  background:#d9b878;
  color:#2d1c10;
  font-weight:bold;
}
.drawTools input[type=color]{
  width:38px;
  height:34px;
  padding:2px;
}

/* New page tab */
.newPage{
  position:absolute;
  right:-1px;
  bottom:25px;
  z-index:10;
  border-radius:12px 0 0 12px;
  background:#ead2a5;
  font-weight:bold;
}

/* footer */
.pageFooter{
  position:absolute;
  left:95px;
  right:70px;
  bottom:25px;
  z-index:4;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.65;
}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(25,15,8,.55);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}
.modalBox{
  width:min(720px,96vw);
  max-height:92vh;
  overflow:auto;
  background:#fffaf0;
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.modalBox h2{
  margin-top:0;
  color:#59381f;
}
.formRow{
  display:flex;
  gap:10px;
  margin:10px 0;
  flex-wrap:wrap;
}
.formRow>*{flex:1}
.modal input,.modal textarea,.modal select{
  width:100%;
  padding:10px;
  border:1px solid #c5aa80;
  border-radius:8px;
  background:white;
}
.modal textarea{min-height:100px}
.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:15px;
}

/* calendar */
.calendarTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.calendarGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.calHead{
  text-align:center;
  font-weight:bold;
  padding:7px 2px;
}
.calDay{
  min-height:70px;
  background:#fff;
  border:1px solid #ddc7a2;
  border-radius:7px;
  padding:5px;
  cursor:pointer;
}
.calDay:hover{background:#f7ecd9}
.calDay.today{border:2px solid #7c4e28}
.calDay.selected{background:#ead5b0}
.calDay .num{font-weight:bold}
.calEvent{
  font-size:11px;
  margin-top:4px;
  background:#e6d2aa;
  border-radius:4px;
  padding:2px;
  overflow:hidden;
  white-space:nowrap;
}

/* events */
.eventItem,.todoItem,.memoryItem{
  padding:9px;
  margin:6px 0;
  border:1px solid #dcc39b;
  border-radius:8px;
  background:#fff;
}
.eventItem strong{display:block}
.todoItem{
  display:flex;
  align-items:center;
  gap:8px;
}
.todoItem.done span{
  text-decoration:line-through;
  opacity:.55;
}
.todoItem span{flex:1}

/* memories */
.memoryGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;
}
.memoryCard img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

/* toast */
#status{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:3000;
  background:#3d291b;
  color:white;
  padding:10px 14px;
  border-radius:9px;
  display:none;
}

/* mobile */
@media(max-width:700px){
  .topbar{width:98%;justify-content:center}
  .brand{width:100%;text-align:center;margin-bottom:4px}
  .topbar button{font-size:14px;padding:7px 9px}
  .diary{width:98%;padding-left:43px}
  .binding{left:3px;width:38px}
  .hole{width:31px;height:21px}
  .page{padding:55px 25px 80px 50px;min-height:1050px}
  .pagehead h1{font-size:24px}
  .editor,.editorWrap{min-height:730px}
  .editor{font-size:18px;line-height:40px}
  .pageFooter{left:50px;right:25px}
  .newPage{font-size:13px;padding:7px 10px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">📖 My Personal Diary</div>
  <button id="calendarBtn">📅 Calendar</button>
  <button id="eventBtn">🗓️ Events</button>
  <button id="memoryBtn">🖼️ Memories</button>
  <button id="todoBtn">☑️ To-do</button>
  <button id="drawBtn">✏️ Draw</button>
  <button id="settingsBtn">⚙️ Settings</button>

  <button id="backupBtn">💾 Backup</button>

<div class="datebar">

<main class="diary" id="diary">

      <button>📌</button><button>💡</button><button>👍</button><button>👏</button>
      <button>😍</button><button>🥰</button><button>😁</button><button>😌</button>

<!-- DRAW TOOLBAR -->

<!-- CALENDAR MODAL -->
<div class="modal" id="calendarModal" hidden>
  <div class="modalBox">
    <div class="calendarTitle">
      <button id="calPrev">‹</button>

<!-- TODO MODAL -->

<script>
"use strict";

/* =========================================================
   DATABASE
========================================================= */

const DB_NAME = "myPersonalDiaryDB";
const DB_VERSION = 8;

let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded=e=>{
      const d=e.target.result;

      if(!d.objectStoreNames.contains("pages")){
        const s=d.createObjectStore("pages",{keyPath:"id"});
        s.createIndex("date","date",{unique:false});
      }

      if(!d.objectStoreNames.contains("events")){
        const s=d.createObjectStore("events",{keyPath:"id",autoIncrement:true});
        s.createIndex("date","date",{unique:false});
      }

      if(!d.objectStoreNames.contains("todos")){
        const s=d.createObjectStore("todos",{keyPath:"id",autoIncrement:true});
        s.createIndex("date","date",{unique:false});
      }

      if(!d.objectStoreNames.contains("attachments")){
        const s=d.createObjectStore("attachments",{keyPath:"id",autoIncrement:true});
        s.createIndex("date","date",{unique:false});
      }

      if(!d.objectStoreNames.contains("settings")){
        d.createObjectStore("settings",{keyPath:"key"});
      }
    };

    request.onsuccess=()=>{
      db=request.result;
      resolve(db);
    };

    request.onerror=()=>reject(request.error);
  });
}

function tx(store,mode="readonly"){
  return db.transaction(store,mode).objectStore(store);
}

function dbGet(store,key){
  return new Promise((resolve,reject)=>{
    const r=tx(store).get(key);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function dbPut(store,value){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").put(value);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function dbDelete(store,key){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").delete(key);
    r.onsuccess=()=>resolve();
    r.onerror=()=>reject(r.error);
  });
}

function dbAll(store){
  return new Promise((resolve,reject)=>{
    const r=tx(store).getAll();
    r.onsuccess=()=>resolve(r.result||[]);
    r.onerror=()=>reject(r.error);
  });
}

function dbAdd(store,value){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").add(value);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

/* =========================================================
   APP STATE
========================================================= */

let currentDate = "";
let currentPage = 1;
let pageRecord = null;

let drawMode = false;
let drawTool = "pen";
let drawing = false;
let startX=0,startY=0;
let lastX=0,lastY=0;

let undoStack=[];
let redoStack=[];

let calendarDate = new Date();

/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

function todayISO(){
  const d=new Date();
  return localISO(d);
}

function localISO(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function displayDate(iso){
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-IN",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });
}

function dateChange(days){
  const d=new Date(currentDate+"T00:00:00");
  d.setDate(d.getDate()+days);
  return localISO(d);
}

function pageID(){
  return `${currentDate}-${currentPage}`;
}

function showStatus(message){
  const s=$("status");
  s.textContent=message;
  s.style.display="block";
  clearTimeout(showStatus.timer);
  showStatus.timer=setTimeout(()=>s.style.display="none",1800);
}

function escapeHTML(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

========================================================= */

async function loadPage(){
  $("pageTitle").textContent=displayDate(currentDate);
  $("datePicker").value=currentDate;

  const rec=await dbGet("pages",pageID());

  pageRecord=rec || {
    id:pageID(),
    date:currentDate,
    page:currentPage,
    content:"",
    drawing:"",
    mood:"",
    quote:getQuote(currentDate)
  };

  $("editor").innerHTML=pageRecord.content||"";
  $("mood").value=pageRecord.mood||"";
  $("pageNo").textContent="Page "+currentPage;

  applyDesign();
  applyFontSize();
  loadDrawing(pageRecord.drawing);

  await carryForwardTodos();

  $("saveStatus").textContent="Saved";
}

let saveTimer=null;

function scheduleSave(){
  $("saveStatus").textContent="Saving...";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(savePage,400);
}

async function savePage(){
  if(!db || !pageRecord)return;

  pageRecord.id=pageID();
  pageRecord.date=currentDate;
  pageRecord.page=currentPage;
  pageRecord.content=$("editor").innerHTML;
  pageRecord.mood=$("mood").value;

  try{
    await dbPut("pages",pageRecord);
    $("saveStatus").textContent="Saved";
  }catch(e){
    console.error(e);
    $("saveStatus").textContent="Save error";
  }
}

const quotes=[

  "Gratitude turns ordinary days into meaningful memories.",

function getQuote(date){

/* =========================================================
   DRAWING
========================================================= */

const canvas=$("drawCanvas");
const ctx=canvas.getContext("2d");

function resizeCanvas(preserve=true){
  const old=preserve && canvas.width>0 ? canvas.toDataURL() : null;
  const r=$("editorWrap").getBoundingClientRect();

  canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));
  canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));
  canvas.style.width=r.width+"px";
  canvas.style.height=r.height+"px";

  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  if(old){
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img,0,0,r.width,r.height);
    };
    img.src=old;
  }
}

function loadDrawing(data){
  resizeCanvas(false);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  undoStack=[];
  redoStack=[];

  if(!data)return;

  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);
  };
  img.src=data;
}

function snapshot(){
  undoStack.push(canvas.toDataURL());
  if(undoStack.length>30)undoStack.shift();
  redoStack=[];
}

function restoreSnapshot(data){
  ctx.clearRect(0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);

  if(!data)return;

  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);
  };
  img.src=data;
}

function pointerPosition(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };
}

function setupBrush(){
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.lineWidth=3;
  ctx.strokeStyle=$("drawColor").value;
  ctx.globalCompositeOperation=
    drawTool==="eraser" ? "destination-out" : "source-over";
}

function beginDraw(e){
  if(!drawMode)return;

  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const p=pointerPosition(e);

  drawing=true;
  startX=lastX=p.x;
  startY=lastY=p.y;

  snapshot();
  setupBrush();

  if(drawTool==="pen" || drawTool==="eraser"){
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x+.01,p.y+.01);
    ctx.stroke();
  }
}

function moveDraw(e){
  if(!drawing)return;

  e.preventDefault();

  const p=pointerPosition(e);

  if(drawTool==="pen" || drawTool==="eraser"){
    setupBrush();
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    lastX=p.x;
    lastY=p.y;
    return;
  }

  /* line and circle use a temporary redraw */
  restoreSnapshot(undoStack[undoStack.length-1]);

  setupBrush();

  if(drawTool==="line"){
    ctx.beginPath();
    ctx.moveTo(startX,startY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
  }

  if(drawTool==="circle"){
    const rx=Math.abs(p.x-startX)/2;
    const ry=Math.abs(p.y-startY)/2;
    const cx=(p.x+startX)/2;
    const cy=(p.y+startY)/2;

    ctx.beginPath();
    ctx.ellipse(cx,cy,Math.max(rx,2),Math.max(ry,2),0,0,Math.PI*2);
    ctx.stroke();
  }
}

function endDraw(e){
  if(!drawing)return;
  drawing=false;

  if(drawTool==="line" || drawTool==="circle"){
    const p=pointerPosition(e);
    restoreSnapshot(undoStack[undoStack.length-1]);
    setupBrush();

    if(drawTool==="line"){
      ctx.beginPath();
      ctx.moveTo(startX,startY);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    }else{
      const rx=Math.abs(p.x-startX)/2;
      const ry=Math.abs(p.y-startY)/2;
      const cx=(p.x+startX)/2;
      const cy=(p.y+startY)/2;
      ctx.beginPath();
      ctx.ellipse(cx,cy,Math.max(rx,2),Math.max(ry,2),0,0,Math.PI*2);
      ctx.stroke();
    }
  }

  ctx.globalCompositeOperation="source-over";
  pageRecord.drawing=canvas.toDataURL("image/png");
  scheduleSave();
}

canvas.addEventListener("pointerdown",beginDraw);
canvas.addEventListener("pointermove",moveDraw);
canvas.addEventListener("pointerup",endDraw);
canvas.addEventListener("pointercancel",endDraw);

function selectDrawTool(tool){
  drawTool=tool;

  ["penTool","lineTool","circleTool","eraserTool"].forEach(id=>{
    $(id).classList.remove("active");
  });

  const map={
    pen:"penTool",
    line:"lineTool",
    circle:"circleTool",
    eraser:"eraserTool"
  };

  $(map[tool]).classList.add("active");
}

$("penTool").onclick=()=>selectDrawTool("pen");
$("lineTool").onclick=()=>selectDrawTool("line");
$("circleTool").onclick=()=>selectDrawTool("circle");
$("eraserTool").onclick=()=>selectDrawTool("eraser");

$("drawColor").onchange=()=>{
  if(drawTool==="eraser")selectDrawTool("pen");
};

$("undoDraw").onclick=()=>{
  if(!undoStack.length)return;

  const current=canvas.toDataURL();
  redoStack.push(current);

  const previous=undoStack.pop();
  restoreSnapshot(previous);

  pageRecord.drawing=canvas.toDataURL("image/png");
  scheduleSave();
};

$("redoDraw").onclick=()=>{
  if(!redoStack.length)return;

  const current=canvas.toDataURL();
  undoStack.push(current);

  const next=redoStack.pop();
  restoreSnapshot(next);

  pageRecord.drawing=canvas.toDataURL("image/png");
  scheduleSave();
};

$("clearDraw").onclick=()=>{
  if(!confirm("Clear all drawings from this page?"))return;

  snapshot();
  ctx.clearRect(0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);
  pageRecord.drawing="";
  scheduleSave();
};

function closeDrawing(){
  drawMode=false;
  $("page").classList.remove("draw-active");
  $("drawTools").hidden=true;
  $("drawBtn").textContent="✏️ Draw";
  ctx.globalCompositeOperation="source-over";
  savePage();
}

$("drawBtn").onclick=()=>{
  if(drawMode){
    closeDrawing();
    return;
  }

  resizeCanvas(true);
  drawMode=true;
  $("page").classList.add("draw-active");
  $("drawTools").hidden=false;
  $("drawBtn").textContent="✕ Close Draw";
  showStatus("Draw directly on your diary page");
};

$("closeDraw").onclick=closeDrawing;

window.addEventListener("resize",()=>{
  if(!drawMode)resizeCanvas(true);
});

$("calendarBtn").onclick=async()=>{
  calendarDate=new Date(currentDate+"T00:00:00");
  await renderCalendar();

};

  $("calendarModal").hidden=true;

  calendarDate.setMonth(calendarDate.getMonth()-1);
  await renderCalendar();
};

$("calNext").onclick=async()=>{
  calendarDate.setMonth(calendarDate.getMonth()+1);
  await renderCalendar();
};

async function renderCalendar(){
  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  $("calendarMonth").textContent=
    calendarDate.toLocaleDateString("en-IN",{month:"long",year:"numeric"});

  const grid=$("calendarGrid");
  grid.innerHTML="";

  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>{
    const h=document.createElement("div");
    h.className="calHead";
    h.textContent=x;
    grid.appendChild(h);
  });

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const events=await dbAll("events");

  for(let i=0;i<first.getDay();i++){
    grid.appendChild(document.createElement("div"));
  }

  for(let day=1;day<=last.getDate();day++){
    const d=new Date(year,month,day);
    const iso=localISO(d);

    const cell=document.createElement("div");
    cell.className="calDay";

    if(iso===todayISO())cell.classList.add("today");
    if(iso===currentDate)cell.classList.add("selected");

    cell.innerHTML=`<div class="num">${day}</div>`;

    events
      .filter(e=>e.date===iso)
      .slice(0,3)
      .forEach(e=>{
        const ev=document.createElement("div");
        ev.className="calEvent";
        ev.textContent=(e.time?e.time+" ":"")+e.title;
        cell.appendChild(ev);
      });

    cell.onclick=async()=>{
      $("calendarModal").hidden=true;
      await goToDate(iso);
    };

    grid.appendChild(cell);
  }
}

$("eventBtn").onclick=async()=>{

$("eventSave").onclick=async()=>{
  const date=$("eventDate").value;
  const title=$("eventTitle").value.trim();

  if(!date){
    alert("Please select the event date.");
    return;
  }

  if(!title){
    alert("Please enter an event title.");
    return;
  }

  await dbAdd("events",{
    date,
    time:$("eventTime").value,
    title,
    notes:$("eventNotes").value.trim(),
    created:Date.now()
  });

  $("eventTitle").value="";
  $("eventNotes").value="";
  $("eventTime").value="";

  await renderEvents();
  showStatus("Event saved");
};

async function renderEvents(){
  const all=await dbAll("events");

  all.sort((a,b)=>{
    const x=(a.date||"")+" "+(a.time||"");
    const y=(b.date||"")+" "+(b.time||"");
    return x.localeCompare(y);
  });

  const box=$("eventList");
  box.innerHTML="";

  if(!all.length){
    box.innerHTML="<p>No events added yet.</p>";
    return;
  }

  all.forEach(e=>{
    const div=document.createElement("div");
    div.className="eventItem";

    div.innerHTML=`
      <strong>${escapeHTML(e.title)}</strong>
      <span>${escapeHTML(e.date)} ${escapeHTML(e.time||"")}</span>
      ${e.notes?`<div>${escapeHTML(e.notes)}</div>`:""}
      <button data-id="${e.id}" style="margin-top:6px">🗑 Delete</button>
    `;

    div.querySelector("button").onclick=async()=>{
      if(confirm("Delete this event?")){
        await dbDelete("events",e.id);
        await renderEvents();
      }
    };

    box.appendChild(div);
  });
}

async function addTodo(){
  const text=$("todoText").value.trim();
  if(!text)return;

  await dbAdd("todos",{
    date:currentDate,
    text,
    done:false,
    created:Date.now()
  });

  $("todoText").value="";
  await renderTodos();
  showStatus("Task added");
}

async function renderTodos(){
  const all=await dbAll("todos");
  const list=all.filter(t=>t.date===currentDate);

  list.sort((a,b)=>a.id-b.id);

  const box=$("todoList");
  box.innerHTML="";

  if(!list.length){
    box.innerHTML="<p>No tasks for this date.</p>";
    return;
  }

  list.forEach(t=>{
    const div=document.createElement("div");
    div.className="todoItem"+(t.done?" done":"");

    div.innerHTML=`
      <input type="checkbox" ${t.done?"checked":""}>
      <span>${escapeHTML(t.text)}</span>
      <button>🗑</button>
    `;

    div.querySelector("input").onchange=async()=>{
      t.done=div.querySelector("input").checked;
      await dbPut("todos",t);
      await renderTodos();
    };

    div.querySelector("button").onclick=async()=>{
      await dbDelete("todos",t.id);
      await renderTodos();
    };

    box.appendChild(div);
  });
}

/* Automatically carry unfinished tasks from previous date */
async function carryForwardTodos(){
  if(!currentDate)return;

  const previous=dateChange(-1);
  const all=await dbAll("todos");

  const pending=all.filter(t=>t.date===previous && !t.done);
  const today=all.filter(t=>t.date===currentDate);

  for(const task of pending){
    const already=today.some(t=>t.text===task.text && !t.done);
    if(!already){
      await dbAdd("todos",{
        date:currentDate,
        text:task.text,
        done:false,
        carriedFrom:previous,
        created:Date.now()
      });
    }
  }
}

$("memoryBtn").onclick=async()=>{

$("memoryCamera").onchange=e=>handleMemoryFile(e.target.files[0]);
$("memoryFile").onchange=e=>handleMemoryFile(e.target.files[0]);

async function handleMemoryFile(file){
  if(!file)return;

  const reader=new FileReader();

  reader.onload=async()=>{
    await dbAdd("attachments",{
      date:currentDate,
      name:file.name,
      type:file.type,
      data:reader.result,
      created:Date.now()
    });

    $("memoryCamera").value="";
    $("memoryFile").value="";

    await renderMemories();
    showStatus("Memory saved");
  };

  reader.readAsDataURL(file);
}

async function renderMemories(){
  const all=await dbAll("attachments");
  const list=all.filter(x=>x.date===currentDate);

  const box=$("memoryGrid");
  box.innerHTML="";

  if(!list.length){
    box.innerHTML="<p>No memories attached to this date.</p>";
    return;
  }

  list.forEach(m=>{
    const card=document.createElement("div");
    card.className="memoryItem";

    if((m.type||"").startsWith("image/")){
      card.innerHTML=`
        <div class="memoryCard">
          <img src="${m.data}" alt="">
          <div>${escapeHTML(m.name)}</div>
          <button>🗑 Delete</button>
        </div>
      `;
    }else{
      card.innerHTML=`
        <div>📄 ${escapeHTML(m.name)}</div>
        <button>🗑 Delete</button>
      `;
    }

    card.querySelector("button").onclick=async()=>{
      if(confirm("Delete this memory?")){
        await dbDelete("attachments",m.id);
        await renderMemories();
      }
    };

    box.appendChild(card);
  });
}

/* =========================================================
   RESTORE
========================================================= */

$("restoreBtn").onclick=()=>{
  $("restoreInput").click();
};

$("restoreInput").onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;

  try{
    const text=await file.text();
    const data=JSON.parse(text);

    if(!confirm("Restore this diary backup? Existing matching pages may be replaced.")){
      e.target.value="";
      return;
    }

    for(const x of (data.pages||[]))await dbPut("pages",x);
    for(const x of (data.events||[])){
      if(x.id!=null)await dbPut("events",x);
    }
    for(const x of (data.todos||[])){
      if(x.id!=null)await dbPut("todos",x);
    }
    for(const x of (data.attachments||[])){
      if(x.id!=null)await dbPut("attachments",x);
    }
    for(const x of (data.settings||[]))await dbPut("settings",x);

    await loadSettings();
    await loadPage();

    showStatus("Diary restored");
  }catch(err){
    console.error(err);
    alert("This backup file could not be restored.");
  }

  e.target.value="";
};

/* =========================================================
   EVENT REMINDER
========================================================= */

async function checkEvents(){
  const now=new Date();
  const iso=localISO(now);
  const hm=
    String(now.getHours()).padStart(2,"0")+":"+
    String(now.getMinutes()).padStart(2,"0");

  const events=await dbAll("events");

  const due=events.filter(e=>
    e.date===iso &&
    e.time===hm
  );

  if(due.length){
    due.forEach(e=>{
      alert("🗓️ Diary Event\n\n"+e.title+
        (e.notes?"\n\n"+e.notes:""));
    });
  }
}

setInterval(checkEvents,60000);

/* =========================================================
   CLOSE MODALS WHEN CLICKING BACKDROP
========================================================= */

document.querySelectorAll(".modal").forEach(modal=>{
  modal.addEventListener("click",e=>{
    if(e.target===modal)modal.hidden=true;
  });
});

/* =========================================================
   START
========================================================= */

async function start(){
  try{
    await openDB();

    currentDate=todayISO();
    currentPage=1;

    await loadSettings();
    await loadPage();

    resizeCanvas(false);

    if("serviceWorker" in navigator){
      try{
        await navigator.serviceWorker.register("./service-worker.js");
      }catch(e){
        console.log("Service worker registration failed",e);
      }
    }

    checkEvents();
  }catch(e){
    console.error(e);
    alert("Diary could not start. Please refresh the page.");
  }
}

window.addEventListener("beforeunload",()=>{
  if(pageRecord){
    pageRecord.content=$("editor").innerHTML;
    pageRecord.mood=$("mood").value;

    /* Best-effort synchronous-ish save is not possible with IndexedDB.
       Normal autosave handles regular closing. */
  }
});

start();
</script>
