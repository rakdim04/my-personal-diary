<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#5b3a29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>My Personal Diary v9</title>

<link rel="manifest" href="./manifest.json">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#d9d1c5;
  color:#342a24;
  font-family:Georgia,"Times New Roman",serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#5b3a29;
  color:#fff;
  min-height:64px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  overflow-x:auto;
}

.brand{
  font-size:21px;
  font-weight:bold;
  white-space:nowrap;
  margin-right:8px;
}

.topbar button{
  flex:0 0 auto;
  border:1px solid #b99a7b;
  background:#6c4933;
  color:#fff;
  border-radius:8px;
  padding:9px 13px;
  font-size:15px;
}

.topbar button:active{
  transform:scale(.97);
}

/* =========================
   WORKSPACE
========================= */

.workspace{
  width:100%;
  padding:12px;
}

.book{
  width:100%;
  max-width:1500px;
  margin:auto;
  position:relative;
  display:flex;
  background:#3e2418;
  border-radius:12px;
  box-shadow:
    0 10px 35px rgba(0,0,0,.30),
    inset 0 0 20px rgba(0,0,0,.35);
  overflow:visible;
}

/* =========================
   SPIRAL / SPINE
========================= */

.spine{
  width:68px;
  flex:0 0 68px;
  position:relative;
  background:
    linear-gradient(
      90deg,
      #2b170f 0%,
      #6e4229 22%,
      #9b6945 48%,
      #55301e 75%,
      #29150e 100%
    );
  border-radius:12px 0 0 12px;
  overflow:hidden;
}

.spine:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 30px,
      rgba(255,255,255,.18) 31px 33px,
      transparent 34px 46px
    );
}

.ring{
  position:absolute;
  left:20px;
  width:42px;
  height:23px;
  border:4px solid #1f1a17;
  border-left-color:#92765d;
  border-radius:50%;
  box-shadow:0 2px 3px rgba(0,0,0,.45);
}

/* =========================
   PAPER
========================= */

.page{
  position:relative;
  flex:1;
  min-width:0;
  min-height:calc(100vh - 88px);
  background-color:#fffdf5;
  background-image:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.9) 0%,
      rgba(255,255,255,0) 70%
    );
  border-radius:0 12px 12px 0;
  box-shadow:inset 0 0 30px rgba(90,60,30,.12);
  overflow:visible;
  padding-bottom:50px;
}

/* designs */

.page.design-classic{
  background-color:#fffdf5;
}

.page.design-vintage{
  background-color:#f7edda;
  background-image:
    radial-gradient(circle at 20% 20%,rgba(150,100,50,.08),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(150,100,50,.06),transparent 30%);
}

.page.design-blue{
  background-color:#f4f9ff;
}

.page.design-green{
  background-color:#f4faf3;
}

.page.design-rose{
  background-color:#fff7f7;
}

.page.design-night{
  background-color:#25272a;
  color:#eee;
}

.page.design-night .toolbar,
.page.design-night .modal-card,
.page.design-night .panel{
  background:#303338;
  color:#eee;
}

.page.design-night .editor{
  color:#f5f5f5;
}

.page.design-night .page-header{
  border-color:#666;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
  position:sticky;
  top:64px;
  z-index:500;
  background:rgba(255,253,245,.96);
  backdrop-filter:blur(5px);
  border-bottom:1px solid #d5c8b4;
  padding:10px 18px 7px;
}

.design-night .page-header{
  background:rgba(37,39,42,.96);
}

.date-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:35px;
}

.date-title{
  font-size:23px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.date-actions{
  display:flex;
  align-items:center;
  gap:5px;
  flex:0 0 auto;
}

.small-btn{
  border:1px solid #bca98e;
  background:#fffaf0;
  color:#3d3027;
  border-radius:6px;
  padding:5px 9px;
}

.mood-display{
  font-size:20px;
  min-width:25px;
  text-align:center;
}

.quote-row{
  height:26px;
  line-height:26px;
  font-style:italic;
  font-size:14px;
  color:#725f4d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding-right:80px;
}

.design-night .quote-row{
  color:#cfcfcf;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  position:sticky;
  top:121px;
  z-index:490;
  margin:7px 16px;
  padding:6px;
  background:rgba(248,242,231,.97);
  border:1px solid #cbbca6;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:5px;
  box-shadow:0 2px 5px rgba(0,0,0,.08);
}

.toolbar button{
  min-width:42px;
  height:38px;
  padding:4px 9px;
  border:1px solid #aa9a85;
  background:#fffaf1;
  border-radius:7px;
  color:#332a24;
}

.toolbar button.active{
  background:#5b3a29;
  color:white;
}

.toolbar-separator{
  width:1px;
  height:28px;
  background:#c9baa4;
  margin:0 4px;
}

.draw-tools{
  display:none;
  align-items:center;
  gap:4px;
}

.draw-tools.open{
  display:flex;
}

/* =========================
   EDITOR
========================= */

.editor-wrap{
  position:relative;
  margin:0 17px 0 18px;
  min-height:calc(100vh - 255px);
}

/*
  The text baseline is aligned to the ruled lines by using
  the same line-height as the repeating background.
*/

.editor{
  position:relative;
  z-index:10;
  min-height:calc(100vh - 255px);
  padding:0 18px 80px 22px;

  outline:none;
  font-size:20px;
  line-height:38px;

  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 37px,
      #b8cfdf 38px,
      transparent 39px
    );

  word-break:break-word;
}

.editor:empty:before{
  content:"Start writing your diary...";
  color:#b7aaa0;
  font-style:italic;
}

/* =========================
   DRAWING CANVAS
========================= */

#drawCanvas{
  position:absolute;
  z-index:30;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  touch-action:none;
}

#drawCanvas.active{
  pointer-events:auto;
  cursor:crosshair;
}

/* =========================
   NEW PAGE
========================= */

.new-page-tab{
  position:absolute;
  right:-2px;
  top:220px;
  z-index:60;
  border:1px solid #b69a7c;
  border-right:none;
  border-radius:8px 0 0 8px;
  background:#6b4932;
  color:#fff;
  padding:12px 9px;
  writing-mode:vertical-rl;
  box-shadow:0 3px 7px rgba(0,0,0,.25);
}

.page-number{
  text-align:center;
  font-size:13px;
  color:#806f60;
  margin:10px;
}

/* =========================
   PANELS / MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(700px,96vw);
  max-height:90vh;
  overflow:auto;
  background:#fffaf0;
  color:#332a24;
  border-radius:12px;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  padding:18px;
}

.modal-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:12px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:15px;
  flex-wrap:wrap;
}

.modal-actions button,
.primary{
  border:1px solid #9b8065;
  background:#65442f;
  color:#fff;
  border-radius:7px;
  padding:9px 14px;
}

.secondary{
  border:1px solid #aaa;
  background:#eee;
  color:#333;
  border-radius:7px;
  padding:9px 14px;
}

.form-row{
  margin-bottom:11px;
}

.form-row label{
  display:block;
  font-weight:bold;
  margin-bottom:4px;
}

.form-row input,
.form-row textarea,
.form-row select{
  width:100%;
  padding:9px;
  border:1px solid #bba991;
  border-radius:7px;
  background:white;
}

.form-row textarea{
  min-height:80px;
  resize:vertical;
}

/* =========================
   CALENDAR
========================= */

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.cal-day-name{
  text-align:center;
  font-weight:bold;
  font-size:13px;
  padding:5px;
}

.cal-cell{
  min-height:70px;
  border:1px solid #d4c5af;
  border-radius:7px;
  padding:5px;
  background:#fffdf7;
  position:relative;
}

.cal-cell.empty{
  background:transparent;
  border:none;
}

.cal-number{
  font-weight:bold;
}

.cal-cell.today{
  outline:2px solid #765238;
}

.cal-cell.has-event{
  background:#f4e7d6;
}

.event-dot{
  width:7px;
  height:7px;
  background:#9b3e32;
  border-radius:50%;
  display:inline-block;
  margin-left:4px;
}

.event-mini{
  margin-top:5px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   EVENT / TODO LISTS
========================= */

.list-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  border-bottom:1px solid #ddd0bd;
  padding:9px 2px;
}

.list-item-content{
  flex:1;
}

.list-item small{
  color:#806f60;
}

.list-item button{
  border:1px solid #b9a58d;
  background:#f6eee3;
  border-radius:5px;
  padding:4px 7px;
}

.done{
  text-decoration:line-through;
  opacity:.55;
}

/* =========================
   MEMORIES
========================= */

.memory-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
}

.memory-card{
  border:1px solid #cdbda7;
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}

.memory-card img{
  display:block;
  width:100%;
  height:140px;
  object-fit:cover;
}

.memory-info{
  padding:7px;
  font-size:12px;
}

/* =========================
   SETTINGS
========================= */

.design-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.design-choice{
  border:2px solid #c5b49c;
  border-radius:8px;
  padding:12px;
  min-height:70px;
  text-align:center;
}

.design-choice.selected{
  border-color:#65442f;
  box-shadow:0 0 0 2px #d8c2a7 inset;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(80px);
  z-index:5000;
  background:#34251d;
  color:white;
  padding:10px 17px;
  border-radius:20px;
  opacity:0;
  transition:.25s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .topbar{
    min-height:55px;
    padding:6px;
  }

  .brand{
    font-size:17px;
  }

  .topbar button{
    font-size:13px;
    padding:8px 10px;
  }

  .workspace{
    padding:5px;
  }

  .spine{
    width:42px;
    flex-basis:42px;
  }

  .ring{
    left:9px;
    width:31px;
    height:20px;
  }

  .page-header{
    top:55px;
    padding:7px 10px 5px;
  }

  .date-title{
    font-size:18px;
  }

  .quote-row{
    font-size:12px;
  }

  .toolbar{
    top:109px;
    margin:5px 7px;
    overflow-x:auto;
  }

  .toolbar button{
    flex:0 0 auto;
    min-width:38px;
  }

  .editor-wrap{
    margin:0 7px;
  }

  .editor{
    font-size:18px;
    line-height:34px;
    padding-left:12px;
    padding-right:10px;
    background-image:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 33px,
        #b8cfdf 34px,
        transparent 35px
      );
  }

  .new-page-tab{
    top:185px;
    padding:10px 7px;
  }

  .design-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

[hidden]{
  display:none !important;
}
</style>
</head>

<body>

<!-- =========================
     TOP NAVIGATION
========================= -->

<div class="topbar">

  <div class="brand">📖 My Diary</div>

  <button id="calendarBtn">📅 Calendar</button>
  <button id="eventsBtn">📌 Events</button>
  <button id="todoBtn">☑ To-Do</button>
  <button id="memoriesBtn">🖼 Memories</button>
  <button id="settingsBtn">⚙ Settings</button>
  <button id="backupBtn">💾 Backup</button>
  <button id="restoreBtn">↩ Restore</button>
  <button id="printBtn">🖨 Print</button>

  <input
    type="file"
    id="restoreInput"
    accept=".json"
    hidden
  >

</div>

<!-- =========================
     BOOK
========================= -->

<div class="workspace">

<div class="book">

  <div class="spine" id="spine"></div>

  <main class="page design-classic" id="page">

    <!-- HEADER -->

    <div class="page-header">

      <div class="date-row">

        <div class="date-title" id="dateTitle">
          Loading...
        </div>

        <div class="date-actions">

          <button
            class="small-btn"
            id="prevDayBtn"
            title="Previous day">
            ‹
          </button>

          <button
            class="small-btn"
            id="todayBtn">
            Today
          </button>

          <button
            class="small-btn"
            id="nextDayBtn"
            title="Next day">
            ›
          </button>

          <span
            class="mood-display"
            id="moodDisplay"
            title="Mood">
          </span>

          <button
            class="small-btn"
            id="moodBtn">
            Mood
          </button>

        </div>

      </div>

      <div class="quote-row" id="quoteRow">
        Loading quote...
      </div>

    </div>

    <!-- FORMATTING TOOLBAR -->

    <div class="toolbar" id="toolbar">

      <button
        type="button"
        data-cmd="bold"
        title="Bold">
        <b>B</b>
      </button>

      <button
        type="button"
        data-cmd="italic"
        title="Italic">
        <i>I</i>
      </button>

      <button
        type="button"
        data-cmd="underline"
        title="Underline">
        <u>U</u>
      </button>

      <button
        type="button"
        data-cmd="insertUnorderedList">
        • List
      </button>

      <button
        type="button"
        data-cmd="insertOrderedList">
        1. List
      </button>

      <button
        type="button"
        data-cmd="justifyLeft">
        ≡
      </button>

      <button
        type="button"
        data-cmd="justifyCenter">
        ≡
      </button>

      <button
        type="button"
        id="clearFormatBtn">
        Clear
      </button>

      <span class="toolbar-separator"></span>

      <button
        type="button"
        id="drawBtn">
        ✎ Draw
      </button>

      <div
        class="draw-tools"
        id="drawTools">

        <button data-draw="pen">
          Pen
        </button>

        <button data-draw="line">
          Line
        </button>

        <button data-draw="circle">
          Circle
        </button>

        <button data-draw="eraser">
          Eraser
        </button>

        <button id="undoDrawBtn">
          ↶
        </button>

        <button id="redoDrawBtn">
          ↷
        </button>

        <button id="clearDrawBtn">
          Clear Drawing
        </button>

        <button id="closeDrawBtn">
          Done
        </button>

      </div>

    </div>

    <!-- EDITOR -->

    <div class="editor-wrap" id="editorWrap">

      <div
        id="editor"
        class="editor"
        contenteditable="true"
        spellcheck="true">
      </div>

      <canvas
        id="drawCanvas">
      </canvas>

    </div>

    <div
      class="page-number"
      id="pageNumber">
      Page 1
    </div>

    <button
      class="new-page-tab"
      id="newPageBtn">
      + New Page
    </button>

  </main>

</div>
</div>

<!-- =========================
     CALENDAR MODAL
========================= -->

<div class="modal" id="calendarModal">

  <div class="modal-card">

    <div class="modal-title">
      📅 Diary Calendar
    </div>

    <div class="calendar-head">

      <button
        class="secondary"
        id="calPrevBtn">
        ‹
      </button>

      <strong id="calendarMonth">
        Month
      </strong>

      <button
        class="secondary"
        id="calNextBtn">
        ›
      </button>

    </div>

    <div
      class="calendar-grid"
      id="calendarGrid">
    </div>

    <div
      id="calendarEvents"
      style="margin-top:15px;">
    </div>

    <div class="modal-actions">

      <button
        class="secondary"
        data-close="calendarModal">
        Close
      </button>

    </div>

  </div>

</div>

<!-- =========================
     EVENTS MODAL
========================= -->

<div class="modal" id="eventsModal">

  <div class="modal-card">

    <div class="modal-title">
      📌 Diary Events
    </div>

    <div class="form-row">

      <label>Event date</label>

      <input
        type="date"
        id="eventDate">

    </div>

    <div class="form-row">

      <label>Time</label>

      <input
        type="time"
        id="eventTime">

    </div>

    <div class="form-row">

      <label>Event title</label>

      <input
        type="text"
        id="eventTitle"
        placeholder="Enter event">

    </div>

    <div class="form-row">

      <label>Notes</label>

      <textarea
        id="eventNotes"
        placeholder="Optional notes">
      </textarea>

    </div>

    <div
      id="eventList">
    </div>

    <div class="modal-actions">

      <button
        class="secondary"
        data-close="eventsModal">
        Close
      </button>

      <button
        class="primary"
        id="saveEventBtn">
        Save Event
      </button>

    </div>

  </div>

</div>

<!-- =========================
     TODO MODAL
========================= -->

<div class="modal" id="todoModal">

  <div class="modal-card">

    <div class="modal-title">
      ☑ To-Do
    </div>

    <div
      id="todoDateLabel"
      style="margin-bottom:10px;">
    </div>

    <div class="form-row">

      <label>New task</label>

      <input
        type="text"
        id="todoInput"
        placeholder="Enter task">

    </div>

    <button
      class="primary"
      id="addTodoBtn">
      Add Task
    </button>

    <div
      id="todoList"
      style="margin-top:15px;">
    </div>

    <div class="modal-actions">

      <button
        class="secondary"
        data-close="todoModal">
        Close
      </button>

    </div>

  </div>

</div>

<!-- =========================
     MEMORIES MODAL
========================= -->

<div class="modal" id="memoriesModal">

  <div class="modal-card">

    <div class="modal-title">
      🖼 Memories
    </div>

    <div class="form-row">

      <label>Add photograph / memory</label>

      <input
        type="file"
        id="memoryInput"
        accept="image/*"
        capture="environment">

    </div>

    <div
      class="memory-grid"
      id="memoryGrid">
    </div>

    <div class="modal-actions">

      <button
        class="secondary"
        data-close="memoriesModal">
        Close
      </button>

    </div>

  </div>

</div>

<!-- =========================
     SETTINGS MODAL
========================= -->

<div class="modal" id="settingsModal">

  <div class="modal-card">

    <div class="modal-title">
      ⚙ Diary Settings
    </div>

    <div class="form-row">

      <label>Page design</label>

      <div class="design-grid">

        <button
          class="design-choice"
          data-design="classic">
          📖<br>Classic
        </button>

        <button
          class="design-choice"
          data-design="vintage">
          🕰<br>Vintage
        </button>

        <button
          class="design-choice"
          data-design="blue">
          💙<br>Blue
        </button>

        <button
          class="design-choice"
          data-design="green">
          🌿<br>Green
        </button>

        <button
          class="design-choice"
          data-design="rose">
          🌸<br>Rose

function todayISO(){
  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function dateObj(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y,m-1,d);
}

function isoFromDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function addDays(iso, amount){
  const d = dateObj(iso);
  d.setDate(d.getDate()+amount);
  return isoFromDate(d);
}

function formatDate(iso){
  const d = dateObj(iso);

  return d.toLocaleDateString(
    undefined,
    {
      weekday:"short",
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}

function isPastDate(iso){
  return iso < todayISO();
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================

function openDB(){

  return new Promise((resolve,reject)=>{

    const request = indexedDB.open(
      DB_NAME,
      DB_VERSION
    );

    request.onupgradeneeded = event => {

      const database = event.target.result;

      if(!database.objectStoreNames.contains("pages")){
        const store =
          database.createObjectStore(
            "pages",
            {keyPath:"id"}
          );

        store.createIndex(
          "date",
          "date",
          {unique:false}
        );
      }

      if(!database.objectStoreNames.contains("events")){
        const store =
          database.createObjectStore(
            "events",
            {
              keyPath:"id",
              autoIncrement:true
            }
          );

        store.createIndex(
          "date",
          "date",
          {unique:false}
        );
      }

      if(!database.objectStoreNames.contains("todos")){
        const store =
          database.createObjectStore(
            "todos",
            {
              keyPath:"id",
              autoIncrement:true
            }
          );

        store.createIndex(
          "date",
          "date",
          {unique:false}
        );
      }

      if(!database.objectStoreNames.contains("attachments")){
        database.createObjectStore(
          "attachments",
          {
            keyPath:"id",
            autoIncrement:true
          }
        );
      }

      if(!database.objectStoreNames.contains("memories")){
        database.createObjectStore(
          "memories",
          {
            keyPath:"id",
            autoIncrement:true
          }
        );
      }

      if(!database.objectStoreNames.contains("settings")){
        database.createObjectStore(
          "settings",
          {keyPath:"key"}
        );
      }
    };

    request.onsuccess = ()=>{
      db = request.result;

      db.onversionchange = ()=>{
        db.close();
      };

      resolve(db);
    };

    request.onerror = ()=>{
      reject(request.error);
    };

  });
}

function tx(storeName, mode="readonly"){

  return db.transaction(
    storeName,
    mode
  ).objectStore(storeName);
}

function getOne(storeName,key){

  return new Promise((resolve,reject)=>{

    const req = tx(storeName).get(key);

    req.onsuccess = ()=>{
      resolve(req.result);
    };

    req.onerror = ()=>{
      reject(req.error);
    };

  });
}

function getAll(storeName){

  return new Promise((resolve,reject)=>{

    const req = tx(storeName).getAll();

    req.onsuccess = ()=>{
      resolve(req.result || []);
    };

    req.onerror = ()=>{
      reject(req.error);
    };

  });
}

function putOne(storeName,obj){

  return new Promise((resolve,reject)=>{

    const req = tx(
      storeName,
      "readwrite"
    ).put(obj);

    req.onsuccess = ()=>{
      resolve(req.result);
    };

    req.onerror = ()=>{
      reject(req.error);
    };

  });
}

function deleteOne(storeName,key){

  return new Promise((resolve,reject)=>{

    const req = tx(
      storeName,
      "readwrite"
    ).delete(key);

    req.onsuccess = ()=>{
      resolve();
    };

    req.onerror = ()=>{
      reject(req.error);
    };

  });
}

  for(let i=0;i<iso.length;i++){

      iso.charCodeAt(i);

    hash |= 0;
  }

  return QUOTES[
    Math.abs(hash) % QUOTES.length
  ];
}

/* =========================================================
   DRAWING
========================================================= */

const canvas =
  document.getElementById(
    "drawCanvas"
  );

const ctx =
  canvas.getContext(
    "2d",
    {willReadFrequently:true}
  );

let drawingActive = false;
let drawingTool = "pen";
let drawingColor = "#222";
let drawingSize = 3;

let drawingDataURL = "";

let drawingHistory = [];
let drawingRedo = [];

let drawingStart = null;
let drawingBaseImage = null;

function resizeCanvas(){

  const wrap =
    document.getElementById(
      "editorWrap"
    );

  const rect =
    wrap.getBoundingClientRect();

  if(rect.width <= 0 || rect.height <= 0){
    return;
  }

  let oldImage = null;

  if(canvas.width > 0 && canvas.height > 0){

    try{
      oldImage =
        document.createElement("canvas");

      oldImage.width =
        canvas.width;

      oldImage.height =
        canvas.height;

      oldImage
        .getContext("2d")
        .drawImage(
          canvas,
          0,
          0
        );
    }catch(e){}
  }

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(
      rect.width * dpr
    );

  canvas.height =
    Math.round(
      rect.height * dpr
    );

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  if(oldImage){

    try{

      ctx.drawImage(
        oldImage,
        0,
        0,
        oldImage.width / dpr,
        oldImage.height / dpr
      );

    }catch(e){}

  }

}

function getPoint(e){

  const rect =
    canvas.getBoundingClientRect();

  return {
    x:e.clientX - rect.left,
    y:e.clientY - rect.top
  };
}

function snapshot(){

  try{

    return ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }catch(e){

    return null;

  }
}

function restoreImageData(image){

  if(!image) return;

  try{
    ctx.putImageData(
      image,
      0,
      0
    );
  }catch(e){}
}

function pushHistory(){

  const snap =
    snapshot();

  if(!snap) return;

  drawingHistory.push(snap);

  if(drawingHistory.length > 25){
    drawingHistory.shift();
  }

  drawingRedo = [];
}

function setDrawTool(tool){

  drawingTool =
    tool;

  document.querySelectorAll(
    "[data-draw]"
  ).forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.draw === tool
    );
  });

  /*
    User requested:
    select tool -> close tool submenu,
    but drawing remains active.
  */

  document.getElementById(
    "drawTools"
  ).classList.remove("open");

  drawingActive = true;

  canvas.classList.add("active");

  toast(
    tool.charAt(0).toUpperCase() +
    tool.slice(1) +
    " selected"
  );
}

document.getElementById(
  "drawBtn"
).addEventListener(
  "click",
  ()=>{

    drawingActive =
      !drawingActive;

    canvas.classList.toggle(
      "active",
      drawingActive
    );

    document.getElementById(
      "drawTools"
    ).classList.toggle(
      "open",
      drawingActive
    );

    if(drawingActive){
      resizeCanvas();
      toast(
        "Choose Pen / Line / Circle / Eraser"
      );
    }else{
      document.getElementById(
        "drawTools"
      ).classList.remove("open");

      document.getElementById(
        "editor"
      ).focus();

      saveDrawing();
    }
  }
);

document.querySelectorAll(
  "[data-draw]"
).forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{
      setDrawTool(
        btn.dataset.draw
      );
    }
  );

});

canvas.addEventListener(
  "pointerdown",
  e=>{

    if(!drawingActive){
      return;
    }

    e.preventDefault();

    canvas.setPointerCapture(
      e.pointerId
    );

    drawingStart =
      getPoint(e);

    drawingBaseImage =
      snapshot();

    if(drawingTool === "pen"){

      pushHistory();

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        drawingColor;

      ctx.lineWidth =
        drawingSize;

      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";

      ctx.beginPath();

      ctx.moveTo(
        drawingStart.x,
        drawingStart.y
      );

    }

    if(drawingTool === "eraser"){

      pushHistory();

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.lineWidth =
        60;

      ctx.lineCap =
        "round";

      ctx.beginPath();

      ctx.moveTo(
        drawingStart.x,
        drawingStart.y
      );

    }

  }
);

canvas.addEventListener(
  "pointermove",
  e=>{

    if(!drawingActive || !drawingStart){
      return;
    }

    e.preventDefault();

    const point =
      getPoint(e);

    if(
      drawingTool === "pen" ||
      drawingTool === "eraser"
    ){

      ctx.lineTo(
        point.x,
        point.y
      );

      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        point.x,
        point.y
      );

      return;
    }

    /*
      Line / Circle:
      restore exact image synchronously
      and draw preview.
    */

    if(drawingBaseImage){
      restoreImageData(
        drawingBaseImage
      );
    }

    ctx.globalCompositeOperation =
      "source-over";

    ctx.strokeStyle =
      drawingColor;

    ctx.lineWidth =
      drawingSize;

    ctx.lineCap =
      "round";

    ctx.beginPath();

    if(drawingTool === "line"){

      ctx.moveTo(
        drawingStart.x,
        drawingStart.y
      );

      ctx.lineTo(
        point.x,
        point.y
      );

      ctx.stroke();
    }

    if(drawingTool === "circle"){

      const dx =
        point.x -
        drawingStart.x;

      const dy =
        point.y -
        drawingStart.y;

      const radius =
        Math.sqrt(
          dx*dx +
          dy*dy
        );

      ctx.arc(
        drawingStart.x,
        drawingStart.y,
        radius,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

  }
);

canvas.addEventListener(
  "pointerup",
  e=>{

    if(!drawingActive || !drawingStart){
      return;
    }

    const point =
      getPoint(e);

    if(
      drawingTool === "line" ||
      drawingTool === "circle"
    ){

      if(drawingBaseImage){
        restoreImageData(
          drawingBaseImage
        );
      }

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        drawingColor;

      ctx.lineWidth =
        drawingSize;

      ctx.lineCap =
        "round";

      ctx.beginPath();

      if(drawingTool === "line"){

        ctx.moveTo(
          drawingStart.x,
          drawingStart.y
        );

        ctx.lineTo(
          point.x,
          point.y
        );

      }else{

        const dx =
          point.x -
          drawingStart.x;

        const dy =
          point.y -
          drawingStart.y;

        const radius =
          Math.sqrt(
            dx*dx +
            dy*dy
          );

        ctx.arc(
          drawingStart.x,
          drawingStart.y,
          radius,
          0,
          Math.PI*2
        );

      }

      ctx.stroke();

      /*
        Save the state before next operation.
      */

      pushHistory();
    }

    drawingStart = null;
    drawingBaseImage = null;

    ctx.globalCompositeOperation =
      "source-over";

    saveDrawing();

  }
);

canvas.addEventListener(
  "pointercancel",
  ()=>{
    drawingStart = null;
    drawingBaseImage = null;
  }
);

async function saveDrawing(){

  try{

    drawingDataURL =
      canvas.toDataURL(
        "image/png"
      );

    if(currentPageRecord){

      currentPageRecord.drawing =
        drawingDataURL;

      await savePage();
    }

  }catch(error){

    console.error(
      "Drawing save error",
      error
    );

  }
}

function loadDrawing(data){

  drawingDataURL =
    data || "";

  resizeCanvas();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(!data){
    return;
  }

  const image =
    new Image();

  image.onload = ()=>{

    const dpr =
      window.devicePixelRatio || 1;

    ctx.drawImage(
      image,
      0,
      0,
      canvas.clientWidth,
      canvas.clientHeight
    );

  };

  image.src =
    data;
}

document.getElementById(
  "undoDrawBtn"
).addEventListener(
  "click",
  ()=>{

    if(!drawingHistory.length){
      toast("Nothing to undo");
      return;
    }

    const current =
      snapshot();

    if(current){
      drawingRedo.push(
        current
      );
    }

    const previous =
      drawingHistory.pop();

    restoreImageData(
      previous
    );

    saveDrawing();

  }
);

document.getElementById(

);

async function renderCalendar(){

  const year =
    calendarCursor.getFullYear();

  const month =
    calendarCursor.getMonth();

  document.getElementById(
    "calendarMonth"
  ).textContent =
    calendarCursor.toLocaleDateString(
      undefined,
      {
        month:"long",
        year:"numeric"
      }
    );

  const grid =
    document.getElementById(
      "calendarGrid"
    );

  grid.innerHTML = "";

  [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ].forEach(name=>{

    const el =
      document.createElement("div");

    el.className =
      "cal-day-name";

    el.textContent =
      name;

    grid.appendChild(el);
  });

  const first =
    new Date(
      year,
      month,
      1
    );

  const last =
    new Date(
      year,
      month+1,
      0
    );

  for(
    let i=0;
    i<first.getDay();
    i++
  ){

    const empty =
      document.createElement("div");

    empty.className =
      "cal-cell empty";

    grid.appendChild(
      empty
    );
  }

  const events =
    await getAll("events");

  const pages =
    await getAll("pages");

  for(
    let day=1;
    day<=last.getDate();
    day++
  ){

    const date =
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const cell =
      document.createElement("div");

    cell.className =
      "cal-cell";

    if(date === todayISO()){
      cell.classList.add("today");
    }

    const dayEvents =
      events.filter(
        e=>e.date === date
      );

    const hasDiary =
      pages.some(
        p=>p.date === date &&
        (
          p.content ||
          p.drawing
        )
      );

    if(dayEvents.length){
      cell.classList.add(
        "has-event"
      );
    }

    cell.innerHTML =
      `<div class="cal-number">
        ${day}
        ${dayEvents.length ? '<span class="event-dot"></span>' : ''}
      </div>`;

    if(hasDiary){
      cell.innerHTML +=
        `<div class="event-mini">📖 Diary</div>`;
    }

    dayEvents
      .slice(0,2)
      .forEach(ev=>{
        cell.innerHTML +=
          `<div class="event-mini">
            📌 ${escapeHTML(ev.title)}
          </div>`;
      });

    cell.addEventListener(
      "click",
      async ()=>{

        await changeDate(
          date
        );

        closeModal(
          "calendarModal"
        );
      }
    );

    grid.appendChild(
      cell
    );
  }

  const monthEvents =
    events.filter(ev=>{

      const d =
        ev.date || "";

      return d.startsWith(
        `${year}-${String(month+1).padStart(2,"0")}`
      );

    }).sort(
      (a,b)=>
        a.date.localeCompare(b.date)
    );

  const list =
    document.getElementById(
      "calendarEvents"
    );

  if(!monthEvents.length){

    list.innerHTML =
      "<p>No diary events this month.</p>";

  }else{

    list.innerHTML =
      "<strong>Events this month</strong>";

    monthEvents.forEach(ev=>{

      const row =
        document.createElement("div");

      row.className =
        "list-item";

      row.innerHTML =
        `<div class="list-item-content">
          <b>${escapeHTML(ev.title)}</b><br>
          <small>
            ${formatDate(ev.date)}
            ${ev.time ? " • "+escapeHTML(ev.time) : ""}
          </small>
          ${ev.notes ? `<br>${escapeHTML(ev.notes)}` : ""}
        </div>`;

      list.appendChild(
        row
      );
    });
  }
}

      document.getElementById(
        "eventTitle"
      ).value.trim();

      document.getElementById(

      event.time = time;

      event.notes = notes;
      event.updatedAt = Date.now();

    await putOne(
      "events",

    );

    editingEventId = null;

    document.getElementById(
      "eventTitle"
    ).value = "";

    document.getElementById(
      "eventNotes"
    ).value = "";

    document.getElementById(
      "eventTime"

    );

async function updateEventReminder(){

  const events =
    await getAll("events");

  const now =
    new Date();

  const today =
    todayISO();

  const currentTime =
    now.toTimeString()
      .slice(0,5);

  const due =
    events.filter(ev=>
      ev.date === today &&
      ev.time === currentTime
    );

  if(!due.length){
    return;
  }

  const alertKey =
    "diary-alert-" +
    today +
    "-" +
    currentTime;

  if(
    sessionStorage.getItem(
      alertKey
    )
  ){
    return;
  }

  sessionStorage.setItem(
    alertKey,
    "1"
  );

  due.forEach(ev=>{

    toast(
      "📌 " + ev.title
    );

    setTimeout(()=>{
      alert(
        "📌 Diary Event\n\n" +
        ev.title +
        (
          ev.notes
            ? "\n\n" + ev.notes
            : ""
        )
      );
    },100);
  });
}

async function carryForwardTodos(){

  if(currentDate === "0000-00-00"){
    return;
  }

  const previousDate =
    addDays(
      currentDate,
      -1
    );

  const all =
    await getAll("todos");

  const pending =
    all.filter(
      t=>
        t.date === previousDate &&
        !t.done
    );

  for(const task of pending){

    const already =
      all.some(
        t=>
          t.date === currentDate &&
          t.carriedFrom ===
            String(task.id)
      );

    if(!already){

      await putOne(
        "todos",
        {
          date:currentDate,
          text:task.text,
          done:false,
          carriedFrom:String(task.id),
          createdAt:Date.now()
        }
      );
    }
  }
}

async function renderTodos(){

  await carryForwardTodos();

  const all =
    await getAll("todos");

  const todos =
    all
      .filter(
        t=>t.date === currentDate
      )
      .sort(
        (a,b)=>
          Number(a.id) -
          Number(b.id)
      );

  const list =
    document.getElementById(
      "todoList"
    );

  list.innerHTML = "";

  const past =
    isPastDate(currentDate);

  document.getElementById(
    "todoInput"
  ).disabled =
    past;

  document.getElementById(
    "addTodoBtn"
  ).disabled =
    past;

  if(past){

    list.innerHTML +=
      `<p>
        <b>Read-only:</b>
        To-Do entries cannot be changed for a past date.
      </p>`;

  }

  if(!todos.length){

    list.innerHTML +=
      "<p>No tasks for this date.</p>";

    return;
  }

  todos.forEach(todo=>{

    const row =
      document.createElement("div");

    row.className =
      "list-item";

    const checkbox =
      document.createElement("input");

    checkbox.type =
      "checkbox";

    checkbox.checked =
      !!todo.done;

    checkbox.disabled =
      past;

    const text =
      document.createElement("div");

    text.className =
      "list-item-content";

    text.textContent =
      todo.text;

    if(todo.done){
      text.classList.add(
        "done"
      );
    }

    const del =
      document.createElement("button");

    del.textContent =
      "Delete";

    del.disabled =
      past;

    checkbox.addEventListener(
      "change",
      async ()=>{

        todo.done =
          checkbox.checked;

        await putOne(
          "todos",
          todo
        );

        await renderTodos();
      }
    );

    del.addEventListener(
      "click",
      async ()=>{

        await deleteOne(
          "todos",
          todo.id
        );

        await renderTodos();
      }
    );

    row.appendChild(
      checkbox
    );

    row.appendChild(
      text
    );

    row.appendChild(
      del
    );

    list.appendChild(
      row
    );
  });
}

async function renderMemories(){

  let memories =
    await getAll(
      "memories"
    );

  /*
    Also look at the old v8 attachments store.
    This allows the new version to recover old
    photographs when possible.
  */

  try{

    const old =
      await getAll(
        "attachments"
      );

    for(const item of old){

      if(
        item &&
        item.data &&
        item.type &&
        item.type.startsWith("image/")
      ){

        const exists =
          memories.some(
            m=>
              m.legacyId ===
              item.id
          );

        if(!exists){

          await putOne(
            "memories",
            {
              date:
                item.date ||
                currentDate,

              name:
                item.name ||
                "Recovered memory",

              type:
                item.type,

              data:
                item.data,

              legacyId:
                item.id,

              createdAt:
                item.createdAt ||
                Date.now()
            }
          );
        }
      }
    }

    memories =
      await getAll(
        "memories"
      );

  }catch(error){

    console.log(
      "No old attachments",
      error
    );
  }

  memories.sort(
    (a,b)=>
      Number(b.createdAt||0) -
      Number(a.createdAt||0)
  );

  const grid =
    document.getElementById(
      "memoryGrid"
    );

  grid.innerHTML = "";

  if(!memories.length){

    grid.innerHTML =
      "<p>No memories added yet.</p>";

    return;
  }

  memories.forEach(memory=>{

    const card =
      document.createElement("div");

    card.className =
      "memory-card";

    const img =
      document.createElement("img");

    img.src =
      memory.data;

    img.alt =
      memory.name || "Diary memory";

    const info =
      document.createElement("div");

    info.className =
      "memory-info";

    info.innerHTML =
      `<b>${escapeHTML(
        memory.name || "Memory"
      )}</b>
      <br>
      ${memory.date
        ? formatDate(memory.date)
        : ""}`;

    const del =
      document.createElement("button");

    del.textContent =
      "Delete";

    del.style.margin =
      "6px";

    del.addEventListener(
      "click",
      async ()=>{

        await deleteOne(
          "memories",
          memory.id
        );

        await renderMemories();

        toast(
          "Memory deleted"
        );
      }
    );

    card.appendChild(
      img
    );

    card.appendChild(
      info
    );

    card.appendChild(
      del
    );

    grid.appendChild(
      card
    );
  });
}

/* =========================================================
   BACKUP
========================================================= */

document.getElementById(
  "backupBtn"
).addEventListener(
  "click",
  async ()=>{

    await savePage();

    const backup = {
      version:9,
      exportedAt:
        new Date().toISOString(),

      settings,

      pages:
        await getAll("pages"),

      events:
        await getAll("events"),

      todos:
        await getAll("todos"),

      memories:
        await getAll("memories")
    };

    const blob =
      new Blob(
        [
          JSON.stringify(
            backup,
            null,
            2
          )
        ],
        {
          type:"application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "my-personal-diary-backup-" +
      todayISO() +
      ".json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      ()=>URL.revokeObjectURL(url),
      1000
    );

    toast(
      "Backup downloaded"
    );
  }
);

/* =========================================================
   RESTORE
========================================================= */

document.getElementById(
  "restoreBtn"
).addEventListener(
  "click",
  ()=>{
    document.getElementById(
      "restoreInput"
    ).click();
  }
);

document.getElementById(
  "restoreInput"
).addEventListener(
  "change",
  async e=>{

    const file =
      e.target.files[0];

    if(!file){
      return;
    }

    try{

      const text =
        await file.text();

      const backup =
        JSON.parse(text);

      if(
        !backup ||
        !Array.isArray(
          backup.pages
        )
      ){

        throw new Error(
          "Invalid diary backup"
        );
      }

      for(
        const item of backup.pages
      ){
        await putOne(
          "pages",
          item
        );
      }

      for(
        const item of (
          backup.events || []
        )
      ){
        await putOne(
          "events",
          item
        );
      }

      for(
        const item of (
          backup.todos || []
        )
      ){
        await putOne(
          "todos",
          item
        );
      }

      for(
        const item of (
          backup.memories || []
        )
      ){
        await putOne(
          "memories",
          item
        );
      }

      if(backup.settings){

        settings = {
          ...settings,
          ...backup.settings
        };

        await saveSettings();
        applySettings();
      }

      await loadPage();

      toast(
        "Diary restored successfully"
      );

    }catch(error){

      console.error(
        "Restore error",
        error
      );

      alert(
        "This backup file could not be restored."
      );

    }

    e.target.value = "";
  }
);

/* =========================================================
   OLD DATA MIGRATION
========================================================= */

async function migrateOldLocalStorage(){

  try{

    const old =
      localStorage.getItem(
        "myPersonalDiaryEntries"
      );

    if(!old){
      return;
    }

    const parsed =
      JSON.parse(old);

    if(!parsed){
      return;
    }

    /*
      Only migrate if there is no page
      already stored for the date.
    */

    for(
      const date of Object.keys(parsed)
    ){

      const existing =
        await getPagesForDate(
          date
        );

      if(existing.length){
        continue;
      }

      const value =
        parsed[date];

      let content = "";
      let mood = "";
      let quote = "";

      if(
        typeof value === "string"
      ){

        content = value;

      }else if(
        value &&
        typeof value === "object"
      ){

        content =
          value.content ||
          value.html ||
          value.text ||
          "";

        mood =
          value.mood ||
          "";

        quote =
          value.quote ||
          "";

      }

      await putOne(
        "pages",
        {
          id:`${date}|1`,
          date,
          page:1,
          content,
          drawing:"",
          mood,
          quote:
            quote ||
            quoteForDate(date),

          updatedAt:Date.now()
        }
      );
    }

    toast(
      "Previous diary entries recovered"
    );

  }catch(error){

    console.log(
      "Old localStorage migration:",
      error
    );
  }
}

/* =========================================================
   MIGRATE OLD ATTACHMENTS
========================================================= */

async function migrateOldAttachments(){

  try{

    const old =
      await getAll(
        "attachments"
      );

    if(!old.length){
      return;
    }

    const memories =
      await getAll(
        "memories"
      );

    for(
      const item of old
    ){

      if(
        !item ||
        !item.data ||
        !item.type
      ){
        continue;
      }

      const already =
        memories.some(
          m=>
            m.legacyId ===
            item.id
        );

      if(already){
        continue;
      }

      await putOne(
        "memories",
        {
          date:
            item.date ||
            currentDate,

          name:
            item.name ||
            "Recovered memory",

          type:
            item.type,

          data:
            item.data,

          legacyId:
            item.id,

          createdAt:
            item.createdAt ||
            Date.now()
        }
      );
    }

  }catch(error){

    console.log(
      "Attachment migration:",
      error
    );
  }
}

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      (e.ctrlKey || e.metaKey) &&
      e.key.toLowerCase() === "s"
    ){

      e.preventDefault();

      savePage();

      toast(
        "Diary saved"
      );
    }

    if(
      e.key === "Escape"
    ){

      document
        .querySelectorAll(".modal.show")
        .forEach(modal=>{
          modal.classList.remove(
            "show"
          );
        });

    }

  }
);

/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){
      savePage();
    }
  }
);

window.addEventListener(
  "pagehide",
  ()=>{
    savePage();
  }
);

/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerServiceWorker(){

  if(
    "serviceWorker" in navigator
  ){

    try{

      await navigator.serviceWorker.register(
        "./service-worker.js"
      );

    }catch(error){

      console.log(
        "Service worker registration:",
        error
      );

    }
  }
}

/* =========================================================
   START APPLICATION
========================================================= */

async function startApp(){

  try{

    await openDB();

    await migrateOldLocalStorage();

    await migrateOldAttachments();

    await loadSettings();

    /*
      Restore today's page.
    */

    await loadPage();

    resizeCanvas();

    await registerServiceWorker();

    toast(
      "Diary ready"
    );

  }catch(error){

    console.error(
      "STARTUP ERROR:",
      error
    );

    alert(
      "Diary could not start correctly.\n\n" +
      "Please reload the page. Your existing data has not been deleted."
    );
  }
}

startApp();
